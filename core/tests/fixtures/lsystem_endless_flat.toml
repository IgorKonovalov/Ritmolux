# GOLDEN FIXTURE - do not tune; editing this invalidates the drift baseline (ADR-0023)
#
# An endless vine on the plane, captured after the harness's fixed number of
# frames under its one analysis frame.
#
#  - A branching vine grammar walked by the stream, so the ring holds
#    segments of several generations and both joined and free ends.
#  - `grow` bound well above the default, so the capture reaches past the
#    ring's `trail` and the oldest segments are fading by `tail`.
#  - Every follow and colour param bound, so neither a change of default nor
#    the scene clock can move this baseline.
system = "lsystem"
name   = "fixture_lsystem_endless_flat"

[generator]
axiom     = "F"
rules     = { F = "F[+F]F[-F]F" }
angle_deg = 25
growth    = "endless"
trail     = 48
follow_window = 8

[params]
grow       = "72"
tail       = "0.5"
follow     = "0.05"
hue        = "0.3"
hue_spread = "0.8"
thickness  = "2.5"
scale      = "3.5"
brightness = "1.0"
