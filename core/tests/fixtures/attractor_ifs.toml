# GOLDEN FIXTURE - do not tune; editing this invalidates the drift baseline (ADR-0023)
#
# The attractor's IFS FAMILY (Plan 0062, ADR-0075), which the per-SystemKind
# roster structurally cannot reach. `attractor.toml` is De Jong: it takes a
# different arm of the step shader, its `a`..`d` coefficients ARE its shape, and
# `morph`/`curl`/`vigor`/`lean`/`bias` are inert on it no matter how badly they
# are broken. This is a figure mid-morph with all four levers off their
# defaults, and it is the only thing in the suite that would notice a
# regression in the SVD decomposition, the morph, the framing fit, or the
# levers.
#
# WHAT EACH VALUE IS HOLDING - none of these is a look choice:
#   family/     fern -> spiral. Two figures that differ in every way a table
#   morph_to    can: the fern's stem is rank 1 and its f4 REFLECTS, the spiral's
#               arm is near the contractivity ceiling. A pair of similar figures
#               would let a broken interpolation look plausible.
#   morph       0.35 -> a genuine intermediate, not an endpoint. `resolve`
#               returns the endpoints EXACTLY (by an early return), so a fixture
#               at 0 or 1 would exercise the lerp, the shortest-arc angle
#               interpolation and the fit's interpolation not at all.
#   density     0.12 -> 6000 particles at the floor tier. Sparse enough at 128px
#               that the figure reads as separable strokes rather than a fog, so
#               a geometry change moves recognisable structure.
#   vigor       1.06 -> inside the headroom at this morph, so the CLAMP does not
#               fire and the lever's actual arithmetic is what is pinned. A
#               value past the ceiling would pin the clamp instead and go on
#               passing if the multiply broke.
#   curl        0.35 rad added to every map's rotation.
#   lean        0.40 rad of translation rotation.
#   bias        0.65 -> weight moved from the body maps to the branch maps. The
#               only lever that touches no geometry, so it is the one a capture
#               is weakest at seeing - see the measured table below.
#   fade/size/  a trail long enough that the strokes read, at a nib that does
#   zoom        not clip the accumulation to flat white.
#   map_tint/   The two per-particle colour channels, at BOTH of their routes
#   map_hue/    each. `*_tint` shifts the palette coordinate; `*_hue` rotates the
#   root_tint/  hue of the colour that ramp returned. All four are IFS-only, and
#   root_hue    they are the only thing in the suite that would notice either
#               channel, the `map` write in the step shader, or the per-step
#               distance-to-the-skeleton the IFS arm writes (ADR-0088).
#               `root_hue` is NEGATIVE so the sign of the rotation is pinned too.
#               The two halves are NOT the same shape: `map_*` is centred on 0.5,
#               `root_*` is anchored at 0, so a `root_*` value has to be larger
#               to buy the same palette travel - the fern/spiral pair tops out
#               around 0.43 of the range at this morph.
#   emergence   45 steps against a default of 8 (Plan 0074 Phase 4). Nothing else
#               in the suite would notice the ramp at all, and at `fade = 0.90`
#               the trail integrates the dimmed just-respawned particles over
#               many frames, which is precisely the interaction ADR-0087's Risks
#               flagged and could not test. 45 rather than the 24 first tried:
#               at 24 the neutralized capture cleared the outlier gate 56 to 48,
#               a margin thin enough that an adapter difference could flip it.
#
# THE GUARD IS DEMONSTRATED, NOT ASSUMED. Each lever was neutralized in turn and
# the capture re-measured against this baseline (tolerances: mean 0.02,
# outlier 48). Re-measured IN FULL at Plan 0074 Phase 5, as it was at Plan 0073
# Phase 5 and for the same reason: the baseline moved twice over this plan (the
# age channel's retirement, then this rebind), so any number taken before that
# was taken against a picture that no longer exists.
#
#   morph     -> 0     mean 0.1590   outlier 254
#   curl      -> 0     mean 0.1009   outlier 254
#   lean      -> 0     mean 0.1047   outlier 254
#   vigor     -> 1     mean 0.0308   outlier 253
#   bias      -> 0     mean 0.0126   outlier 238
#   map_tint  -> 0     mean 0.0209   outlier 214
#   map_hue   -> 0     mean 0.0075   outlier 150
#   root_tint -> 0     mean 0.0263   outlier 199
#   root_hue  -> 0     mean 0.0101   outlier 187
#   emergence -> 8     mean 0.0017   outlier  78
#
# All ten fail. Six fail both gates; `bias`, the two `*_hue` routes and
# `emergence` fail the OUTLIER gate alone. That is the expected shape rather than
# a weakness, and it is worth stating because it is what could be mistaken for a
# weak fixture: `bias` moves only the DENSITY distribution and leaves every
# stroke exactly where it was, the colour channels move no stroke at all, and
# `emergence` changes only how bright the small recently-respawned fraction of
# the population is. All three kinds shift a great many pixels a little and a few
# a great deal, while the frame mean is diluted by a mostly-unlit frame.
# `MAX_OUTLIER` is precisely what exists to catch that, and without it this
# fixture would notice none of the four.
#
# The two `*_tint` channels also confound each other by construction - they ride
# the SAME palette coordinate, so neutralizing one leaves the other still moving
# it. Each is still caught decisively, which is what the table is for.
#
# If you weaken a value here, re-run that check - a fixture that renders a
# pretty figure and notices nothing is worse than no fixture, because it reads
# as coverage.
#
# Constant-driven throughout, so the capture is a pure function of the seeded
# scatter and the fixed step sequence (NFR 6) and reproduces exactly on WARP.
system = "attractor"
name   = "fixture_attractor_ifs"

[particles]
family   = "fern"
morph_to = "spiral"
density  = 0.12

[params]
size      = "0.55"
fade      = "0.90"
zoom      = "1.10"
exposure  = "0.30"
morph     = "0.35"
vigor     = "1.06"
curl      = "0.35"
lean      = "0.40"
bias      = "0.65"
map_tint  = "0.55"
map_hue   = "0.22"
root_tint = "0.90"
root_hue  = "-0.45"
emergence = "45"
