# GOLDEN FIXTURE - do not tune; editing this invalidates the drift baseline (ADR-0023)
#
# A branching tree walked by the space turtle, seen through the shared camera
# from a fixed oblique angle with an open aperture.
#
#  - Each branch pitches off its trunk with `&` and the three are rolled a
#    third of a turn apart with `/`, so the tree stands in depth rather than
#    in one plane.
#  - Every camera param bound, so neither a change of default nor the scene
#    clock can move this baseline.
#  - `focus` near the front and `aperture` open, so the far branches take the
#    widened, blurred stroke.
system = "lsystem"
name   = "fixture_lsystem_space"

[generator]
axiom     = "X"
rules     = { X = "F[&X]////[&X]////[&X]", F = "FF" }
angle_deg = 30
max_depth = 5
turtle    = "space"

[params]
visible_depth = "5"
hue           = "0.35"
hue_spread    = "0.6"
draw_progress = "1"
thickness     = "2.5"
brightness    = "1.0"
yaw           = "0.4"
pitch         = "0.3"
distance      = "3.0"
fov           = "0.9"
focus         = "0.2"
aperture      = "6"
