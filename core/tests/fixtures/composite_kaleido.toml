# COMPOSITE FIXTURE - do not tune; editing this invalidates the drift baseline.
# Plan 0035 Phase 2, the kaleidoscope half - see composite_trails.toml for why
# these two exist outside the per-SystemKind golden roster.
#
# THIS BASELINE PINS A KNOWN DEFECT ON PURPOSE - design-backlog 0010.
#
# The fold is a polar operation on a RECTANGULAR source. Each output pixel keeps
# its radius and takes a folded angle, so a pixel whose radius exceeds the
# source's extent in the folded direction samples outside [0,1] and the
# ClampToEdge sampler smears the border texel radially. At this fixture's capture
# size 5.9% of the output pixels are clamped that way (computed from the shader's
# own arithmetic, not estimated).
#
# BE PRECISE ABOUT WHAT YOU WILL SEE. The hard-edged corner streaks the defect
# was reported as - on `swarm_dense`, at this same order - need high-frequency
# content at the source's border. A centred line figure leaves that border as a
# smooth backdrop gradient, which smears into more smooth gradient, so the
# baseline looks clean to the eye. It is not clean: the clamped pixels are there,
# and `bg_bright` below is what keeps them non-black, so every candidate 0010 fix
# (clamp the radius, change the address mode, radial falloff) changes them and
# MOVES THIS BASELINE. That is the signal - a fix must not pass silently.
#
# There is no fold order that avoids the defect: at order 2 every output angle
# folds into the first quadrant and a corner radius still overruns the
# rectangle's reach along x. Capturing at `order < 2` would skip the stage
# entirely and cover nothing, so this fixture captures the real behaviour rather
# than a clean order that does not exist.
#
# 0010 is NOT a Plan 0033 regression and NOT a Plan 0035 one - it dates from
# Plan 0018 Phase 7, verified against a worktree at 3f3b652~1. Plan 0033 only
# removed the 1.6x upscale that had been blurring it. It is ADR-worthy and out of
# scope for Plan 0035. WHEN IT LANDS, RE-BLESS THIS BASELINE; the move is the fix
# arriving, not a regression.
#
# Order 6 is the order the artifact was reported at, so the baseline pins the
# case a user actually saw.
system = "parametric_curve"
name   = "fixture_composite_kaleido"

[curve]
family = "maurer_rose"

[params]
n             = "5"
d             = "43"
samples       = "301"
scale         = "0.72"
spin          = "0"
hue           = "0.55"
thickness     = "2.0"
brightness    = "0.9"
draw_progress = "1"

# The stage under test. `kaleido_angle` is held at 0 so the wedge boundaries sit
# in a canonical orientation.
kaleido_order = "6"
kaleido_angle = "0"

# A LIT BACKDROP, and it is not decoration - see the 0010 note above. On a black
# backdrop the fold's out-of-range samples clamp to black, so a 0010 fix would
# leave those pixels black too and this baseline would not move. The lit vignette
# is what makes the clamped 5.9% fix-sensitive.
bg_bright     = "0.55"
bg_hue        = "0.62"
bg_vignette   = "0.35"
