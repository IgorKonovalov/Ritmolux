# GOLDEN FIXTURE - do not tune; editing this invalidates the drift baseline (ADR-0023)
#
# **The only baseline in the repo that can see the `warp_mesh` stroke profile**
# (Plan 0114 Phase 9). Converted by `milkconv` from `warp_mesh_stroke.milk`, which
# sits beside it - regenerate with:
#
#   cargo run --release -p milkconv -- core/tests/fixtures/warp_mesh_stroke.milk \
#     --out core/tests/fixtures/warp_mesh_stroke.toml
#
# WHY THE FAT BORDER, WHICH IS THE WHOLE POINT OF THIS FILE. ADR-0124 records that
# no baseline shades a `warp_mesh` stroke, and gives the reason as the fixtures
# setting no wave. That reason is wrong - `wave_a` defaults to 1.0, so every
# `warp_mesh` fixture already strokes a waveform. The real cause is the golden
# suite's 128 px capture: `draw.rs`'s THIN is 0.16 px of half-width there and THICK
# is 0.38 px, both far under the one-pixel floor the profile's edge term is capped
# at, so every value of MILKDROP_SOFTNESS draws the identical frame. Measured: with
# the pin driven 1.0 -> 0.0, `warp_mesh.png`, `warp_mesh_milk.png` and
# `warp_mesh_shader.png` all move by mean 0.0000 / outlier 0.
#
# So a fixture that merely sets a wave adds another blind baseline. `ob_size` is
# the one stroke width on this surface a preset controls: it reaches
# `SegmentInstance::width` as an NDC-y half-width, so 0.12 is 7.7 px at 128 and the
# profile has room to differ. Verified the same way - the same pin change moves
# THIS baseline. `the_warp_mesh_stroke_fixture_shades_a_resolvable_stroke` in
# `golden.rs` holds both halves so the file cannot quietly degrade back.
#
# It sets a wave as well (`wave_a = 1`, `wave_thick = 1`), per the phase's done-when
# - that arm is guarded too, and it is what keeps the fixture representative of the
# surface rather than being only a rectangle.

# Converted from a MilkDrop preset by `milkconv` (Plan 0100 / ADR-0113).
#
# Everything below is machine-generated. The `[milk]` table is compiled
# EEL2 bytecode, executed by the engine's stack VM; the EEL2 it came from
# is reproduced under each section so this file can be read.
#
# Source format: MilkDrop 2
# The converter had nothing to report.

system = "warp_mesh"
name   = "warp_mesh_stroke"

[mesh]
x = 32
y = 24

[palette]
stops = [
  { at = 0.0,  color = "#000000" },
  { at = 0.45, color = "#c4bba7" },
  { at = 0.8,  color = "#fff3da" },
  { at = 1.0,  color = "#ffffff" },
]

[params]
# A converted preset draws its own light - the waveform, its custom
# waves and shapes, the borders - so the scene's own deposit stays off.
brightness     = "1.0"
warp_scale     = "1.0"
warp_speed     = "1.0"

[milk]
