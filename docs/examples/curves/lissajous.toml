# The `lissajous` curve family, for the illustrated guide's picture of it.
# Teaching material, not a shipped preset: every number is a constant except
# the ones that make the figure breathe, so the picture shows the family.
system = "parametric_curve"
name = "Lissajous 3:2"

[curve]
family = "lissajous"

[params]
n          = "3"
d          = "2"
phase      = "0"
samples    = "720"
scale      = "0.78 + clamp(bass * 0.12, 0, 0.1)"
spin       = "0"
thickness  = "2.5"
hue        = "0.5"
hue_spread = "0.45"
