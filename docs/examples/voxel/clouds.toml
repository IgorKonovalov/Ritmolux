# The `voxel` system, for the illustrated guide's picture of it. Teaching
# material, not a shipped preset: the `clouds` rule settling from a seeded ball
# into rounded masses, marched as a glowing volume that absorbs some of the
# light behind it, the camera orbiting slowly. An onset refills a ball of
# cells, the spectrum lights eight radial shells (bass at the centre, treble at
# the faces), and the bass lifts the brightness.
system = "voxel"
name = "Voxel Clouds"

[voxel]
grid        = 64
rules       = ["clouds"]
seed_radius = 1.0
seed_fill   = 0.55
shells      = 8

[palette]
name = "ember"

[params]
step_rate     = "6"
reseed        = "onset"
reseed_radius = "0.3"
shell_gain    = "1.5"
density       = "0.6"
trail         = "0.6"
age_tint      = "0.6"
hue           = "0.1"
hue_spread    = "0.8"
brightness    = "0.6 + clamp(bass * 0.35, 0, 0.3)"
yaw           = "0.6 + time * 0.15"
pitch         = "0.35"
distance      = "4.2"
