# The `voxel` system drawn solid, for the illustrated guide's picture of it.
# Teaching material, not a shipped preset: the `pyroclastic` rule, a restless
# porous foam that never settles, each live cell a lit cube under one key light
# that turns with the camera, the decaying cells a faint glow inside the gaps,
# so the structure can be seen into. The bass brightens the key light and an
# onset refills a ball of cells.
system = "voxel"
name = "Voxel Solid"

[voxel]
grid        = 64
rules       = ["pyroclastic"]
seed_radius = 0.9
seed_fill   = 0.3
present     = "solid"

[palette]
name = "ember"

[params]
step_rate   = "6"
reseed      = "onset"
density     = "0.6"
trail       = "0.2"
age_tint    = "0.5"
hue         = "0.1"
hue_spread  = "0.6"
brightness  = "0.9"
key         = "0.4 + 1.6 * bass"
ambient     = "0.3"
light_yaw   = "-0.6"
light_pitch = "0.6"
yaw         = "0.6 + time * 0.1"
pitch       = "0.35"
distance    = "4.2"
