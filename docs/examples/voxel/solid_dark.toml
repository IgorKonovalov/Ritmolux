# The `voxel` system drawn solid, white on black: the same restless
# `pyroclastic` foam as `solid.toml`, each live cell a white cube under one key
# light that turns with the camera, the decaying cells a faint glow in the gaps.
# Teaching material, not a shipped preset. The bass brightens the key light and
# an onset refills a ball of cells.
system = "voxel"
name = "Voxel Solid Dark"

[voxel]
grid        = 64
rules       = ["pyroclastic"]
seed_radius = 0.9
seed_fill   = 0.3
present     = "solid"

[palette]
stops = [
  { at = 0.0, color = "#e8e8e8" },
  { at = 1.0, color = "#ffffff" },
]

[params]
step_rate   = "6"
reseed      = "onset"
density     = "0.6"
trail       = "0.2"
age_tint    = "0.5"
hue         = "0.1"
hue_spread  = "0.6"
brightness  = "0.9"
key         = "0.4 + 1.6 * bass"
ambient     = "0.3"
light_yaw   = "-0.6"
light_pitch = "0.6"
yaw         = "0.6 + time * 0.1"
pitch       = "0.35"
distance    = "4.2"
