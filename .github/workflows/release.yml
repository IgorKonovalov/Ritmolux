# Distribution artifacts (Plan 0036, ADR-0038).
#
# Deliberately NOT a job in ci.yml. That file is a per-push gate - every job in
# it answers "is this push sound?" and is expected to run every time. A
# release-profile, two-architecture, lto = "fat" build answers a different
# question and takes minutes; a red packaging job there would read as a broken
# gate (ADR-0038 Alternative E).
#
# Trigger: a pushed v* tag, which is what the close ceremony's `cargo release`
# already writes (docs/releasing.md). workflow_dispatch builds the same
# artifacts and publishes nothing, for dry runs - on EVERY ref it can be
# launched against, a v* tag included, because the release job below tests the
# event as well as the ref.
#
# It tests the event because for a while it did not, and this comment claimed
# the property anyway (backlog 0194). `startsWith(github.ref, 'refs/tags/v')`
# alone is satisfied by a dispatch launched on a tag, which is exactly the ref a
# releaser reaches for when rehearsing the thing they are about to ship - so the
# safest-looking rehearsal was the one that published.
#
# NOTE: pushing changes to this file needs the `workflow` OAuth scope on the git
# credential - `gh auth refresh -s workflow` if the push is rejected.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Read-only by default; the release job widens it to contents: write for itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The universal .app. See packaging/macos/bundle.sh - the build, lipo, plist
  # substitution, ad-hoc signing, zipping AND the verification all live there,
  # so a local run on a Mac is held to the same bar as this job.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # rustup on the runner auto-installs the toolchain pinned in
      # rust-toolchain.toml; the second architecture is not part of that pin.
      - uses: Swatinem/rust-cache@v2
      # Both targets explicitly rather than a `targets` key in
      # rust-toolchain.toml: that would cost every clone an extra target
      # download for a CI-only need (NFR section 4). Adding the host target is
      # a no-op, and naming it keeps the job correct if the runner image ever
      # flips architecture.
      - name: Install both Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # Invoked through `bash` rather than as ./packaging/macos/bundle.sh: this
      # repo is developed on Windows with core.filemode=false, where the
      # executable bit is easy to drop on a later edit. The bit IS set in the
      # index, but the job must not be one `git commit -- <path>` away from
      # Permission denied.
      - name: Build, bundle, sign, zip and verify
        run: bash packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: target/dist/*.zip
          if-no-files-found: error

  # The Windows standalone. A thin caller, like the linux job: the build, the
  # size measurement against NFR section 4 (ADR-0231), the staging, the zip AND
  # the verification all live in packaging/windows/stage.ps1, so a developer
  # running it on their own box is held to this job's bar rather than to a
  # looser one.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The Spout video-out (ADR-0125). Staged here and nowhere else: the
      # `spout` feature is off by default, so the CI check job, the macOS arm
      # and every ordinary build never need the SDK, a C++ compiler step or a
      # network. Mirrors the foobar job's own staging step exactly.
      - name: Stage the pinned Spout SDK
        shell: pwsh
        run: ./packaging/spout/fetch-sdk.ps1
      - name: Build, measure, stage, zip and verify
        shell: pwsh
        run: ./packaging/windows/stage.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: target/dist/*.zip
          if-no-files-found: error

  # The Linux standalone (ADR-0131). A thin caller, like the macos job: the
  # build, the staging, the archiving AND the verification all live in
  # packaging/linux/stage.sh, so a developer running it on their own Linux box
  # is held to this job's bar rather than to a looser one.
  #
  # The runner's glibc is the floor the tarball runs on, and the release notes
  # below promise "Ubuntu 24.04 or newer". So the image is named, not
  # `ubuntu-latest`: a label that moves would raise the floor with nothing
  # saying so, and a 24.04 user's download would stop starting.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The same build packages ci.yml's check job installs, minus the Vulkan
      # ICD, which nothing here runs. libpulse-dev is not on the runner image,
      # and without it the build fails rather than degrading.
      - name: Install the Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libpulse-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      # Invoked through `bash` for the reason the macos job gives: this repo is
      # developed on Windows with core.filemode=false, where the executable bit
      # is easy to drop on a later edit.
      - name: Build, stage, archive and verify
        run: bash packaging/linux/stage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: target/dist/*.tar.gz
          if-no-files-found: error

  # The foobar2000 component (Plan 0102, ADR-0115). A thin caller, like the
  # macos job: fetch the SDK, run the recipe, upload - the build, the version
  # stamp, the packaging AND the seven fatal checks all live in
  # packaging/foobar/build-component.ps1, so a developer running it locally is
  # held to this job's bar rather than to a looser one.
  #
  # The SDK is third-party, separately licensed and gitignored, so this job
  # fetches it. That is legal on a reading of the SDK licence, which is
  # BSD-style: it permits redistribution in binary form and puts a notice
  # obligation only on redistributed *source*. We ship the linked DLL, no SDK
  # source, and nothing implying the SDK author endorses this (Plan 0102 Phase
  # 1, answered by the user 2026-08-16).
  #
  # The fetch is pinned to a release and checked against a SHA-256 by
  # packaging/foobar/sdk-pin.ps1, so a URL that changes its bytes fails the
  # release rather than shipping an untested component (ADR-0115, Negative).
  #
  # Needs MSVC with the C++ workload and 7-Zip; both are preinstalled on the
  # windows runner image, which is why this is not its own setup step.
  foobar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Stage the pinned foobar2000 SDK
        shell: pwsh
        run: ./packaging/foobar/fetch-sdk.ps1
      - name: Build, package and verify the component
        shell: pwsh
        run: ./packaging/foobar/build-component.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: foobar2000-component
          path: target/dist/*.zip
          if-no-files-found: error

  # The studio, macOS (Plan 0159, ADR-0178). A thin caller, like the macos job
  # above: the build, the universal lipo of BOTH the player and the Electron
  # shell, the ad-hoc signing, the zipping and the verification all live in
  # packaging/studio/bundle-studio.sh, so a developer running it on a Mac is
  # held to this job's bar rather than to a looser one.
  #
  # It builds the player itself rather than reusing the macos job's artifact:
  # that job uploads a zip, not a binary, and unpacking a signed bundle to reach
  # the executable inside it would make this job depend on the other's layout.
  # The cost is one duplicated `lto = "fat"` build; the saving is that either
  # job can be re-run alone.
  studio-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install both Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # Invoked through `bash` for the reason the macos job gives: this repo is
      # developed on Windows with core.filemode=false, where the executable bit
      # is easy to drop on a later edit.
      - name: Build, bundle, sign, zip and verify
        run: bash packaging/studio/bundle-studio.sh
      - uses: actions/upload-artifact@v4
        with:
          name: studio-macos-universal
          path: target/dist/*.zip
          if-no-files-found: error

  # The studio, Windows (Plan 0159, ADR-0178). The same thin caller on the other
  # platform.
  #
  # It stages the Spout SDK because the player it carries is built
  # `--features spout`, exactly as the standalone zip's is: the studio ships the
  # player a tester would otherwise download, and a player without the feature
  # fails `--stream` with a named error instead of having it.
  studio-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Stage the pinned Spout SDK
        shell: pwsh
        run: ./packaging/spout/fetch-sdk.ps1
      - name: Build, stage, zip and verify
        shell: pwsh
        run: ./packaging/studio/build-studio.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: studio-windows-x64
          path: target/dist/*.zip
          if-no-files-found: error

  # Publish. Gated on ALL SIX builds by `needs:`, so a failure on any platform
  # leaves no Release at all rather than a half-published one - the release job
  # is skipped, not merely red.
  #
  # Gated on the EVENT and the ref, not the ref alone. A tag push publishes; a
  # workflow_dispatch never does, whatever ref it names, so the dry-run path
  # produces run artifacts and nothing else. The ref half alone left "dispatch
  # is a rehearsal" true only for the refs nobody rehearses on (backlog 0194).
  #
  # Runs on ubuntu-latest: it only moves archives around, and `gh` is preinstalled
  # on every runner image, so no pinned third-party release action is needed
  # (NFR section 4 - every dependency is a cost to justify).
  release:
    needs: [macos, windows, linux, foobar, studio-macos, studio-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Five zips - the Windows and macOS standalone, the foobar2000
          # component, and the two studio zips - and one tarball, the Linux
          # standalone. The recipe either produces all six or the tag is
          # incomplete (ADR-0115, Negative), and an exact count PER KIND is what
          # makes a silently-skipped job fail here rather than ship a short
          # release: counting zips alone passes a release that carries nothing
          # for Linux. `nullglob` so a missing kind counts as 0 rather than as
          # its own unexpanded pattern.
          shopt -s nullglob
          zips=(assets/*.zip)
          tarballs=(assets/*.tar.gz)
          if [ "${#zips[@]}" -ne 5 ] || [ "${#tarballs[@]}" -ne 1 ]; then
              echo "expected exactly 5 zips and 1 tarball, found ${#zips[@]} and ${#tarballs[@]}:" >&2
              ls -1 assets/ >&2
              exit 1
          fi
          ls -1 "${zips[@]}" "${tarballs[@]}"

          notes="Builds of the ${TAG} tag: the standalone app for macOS,
          Windows and Linux, the foobar2000 component, and the studio for macOS
          and Windows.

          - **macOS** (universal, arm64 + Intel, requires macOS 13+): unsigned and
            ad-hoc signed only, so macOS quarantines it - right-click the app and
            choose Open, or strip the quarantine attribute. It needs the Screen
            Recording permission to hear system audio, and a relaunch after
            granting it.
          - **Windows** (x64): unsigned, so SmartScreen warns once - More info,
            then Run anyway.
          - **Linux** (x86_64, Ubuntu 24.04 or newer): a .tar.gz - unpack it and
            run ritmolux. It needs PipeWire or PulseAudio: the binary will not
            start without libpulse.so.0, which every Ubuntu desktop carries.
          - **foobar2000 component** (x64 only, foobar2000 v2): unzip, then
            install foo_ritmolux.fb2k-component from File - Preferences - Components.
            It reads what foobar2000 is already decoding, so unlike the
            standalone app there is no audio capture to permit.
          - **Studio** (macOS universal / Windows x64): the editor. It carries
            its own copy of the player inside it, so it is the only download you
            need - take this INSTEAD of the standalone zip above, not beside it.
            Same signing story as the standalone app on each platform.

          Each archive carries a READ-ME-FIRST.txt with the full steps. The
          three standalone archives also carry a reference copy of the presets;
          the component and the studio share the standalone app's preset folder
          if both are installed. This is a prerelease while the app is 0.x."

          # Re-running a workflow on an existing tag must not hard-fail:
          # `gh release create` errors when the release already exists, so
          # create it if absent and clobber the assets otherwise.
          if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG exists; replacing its assets"
              gh release upload "$TAG" "${zips[@]}" "${tarballs[@]}" --clobber
          else
              gh release create "$TAG" "${zips[@]}" "${tarballs[@]}" \
                  --prerelease \
                  --title "$TAG" \
                  --notes "$notes"
          fi
