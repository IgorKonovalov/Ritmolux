# Distribution artifacts (Plan 0036, ADR-0038).
#
# Deliberately NOT a job in ci.yml. That file is a per-push gate - every job in
# it answers "is this push sound?" and is expected to run every time. A
# release-profile, two-architecture, lto = "fat" build answers a different
# question and takes minutes; a red packaging job there would read as a broken
# gate (ADR-0038 Alternative E).
#
# Trigger: a pushed v* tag, which is what the close ceremony's `cargo release`
# already writes (docs/releasing.md). workflow_dispatch builds the same
# artifacts without publishing anything, for dry runs.
#
# NOTE: pushing changes to this file needs the `workflow` OAuth scope on the git
# credential - `gh auth refresh -s workflow` if the push is rejected.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Read-only by default; the release job widens it to contents: write for itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The universal .app. See packaging/macos/bundle.sh - the build, lipo, plist
  # substitution, ad-hoc signing, zipping AND the verification all live there,
  # so a local run on a Mac is held to the same bar as this job.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # rustup on the runner auto-installs the toolchain pinned in
      # rust-toolchain.toml; the second architecture is not part of that pin.
      - uses: Swatinem/rust-cache@v2
      # Both targets explicitly rather than a `targets` key in
      # rust-toolchain.toml: that would cost every clone an extra target
      # download for a CI-only need (NFR section 4). Adding the host target is
      # a no-op, and naming it keeps the job correct if the runner image ever
      # flips architecture.
      - name: Install both Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # Invoked through `bash` rather than as ./packaging/macos/bundle.sh: this
      # repo is developed on Windows with core.filemode=false, where the
      # executable bit is easy to drop on a later edit. The bit IS set in the
      # index, but the job must not be one `git commit -- <path>` away from
      # Permission denied.
      - name: Build, bundle, sign, zip and verify
        run: bash packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: target/dist/*.zip
          if-no-files-found: error

  # The Windows standalone. Staged inline rather than through a packaging
  # script: there is no bundle to assemble, no signing and no fusing - it is a
  # copy of three things and a Compress-Archive.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The Spout video-out (ADR-0125). Staged here and nowhere else: the
      # `spout` feature is off by default, so the CI check job, the macOS arm
      # and every ordinary build never need the SDK, a C++ compiler step or a
      # network. Mirrors the foobar job's own staging step exactly.
      - name: Stage the pinned Spout SDK
        shell: pwsh
        run: ./packaging/spout/fetch-sdk.ps1
      - name: Build, stage, zip and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # --features spout is what makes `ritmolux --stream` exist in the shipped
          # binary; without it the mode fails with a named error saying so.
          cargo build --release -p standalone --features spout
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }

          # Section-anchored, the same shape plugin-foobar/build.ps1 uses
          # (ADR-0025). A naive first-`version =` match would read a member
          # crate's line or a [profile] key.
          $cargoToml = Get-Content -Raw Cargo.toml
          if ($cargoToml -notmatch '\[workspace\.package\][^\[]*?\bversion\s*=\s*"([^"]+)"') {
              throw "could not parse [workspace.package] version from Cargo.toml"
          }
          $version = $Matches[1]
          $name = "ritmolux-v$version-windows-x64"
          $dist = "target/dist"
          $stage = "$dist/$name"
          $zip = "$dist/$name.zip"
          Write-Host "version $version -> $name.zip"

          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force "$stage/presets" | Out-Null
          Copy-Item target/release/ritmolux.exe $stage
          # *.toml only - presets/README.md is the authoring reference, not
          # preset content, and the zip is for a tester rather than an author.
          Copy-Item presets/*.toml "$stage/presets/"
          Copy-Item packaging/windows/READ-ME-FIRST.md "$stage/READ-ME-FIRST.txt"
          # Spout is Simplified BSD and is STATICALLY linked into ritmolux.exe, so
          # clause 2 binds this archive: a binary redistribution must reproduce
          # the notice in the materials shipped with it. No SpoutDX.dll travels
          # (build.rs links SpoutDX_static.lib) - the notice does.
          Copy-Item packaging/spout/spout-license.txt "$stage/spout-license.txt"

          # -Path without a wildcard keeps the staging folder as the archive's
          # single top-level entry, which is the layout Plan 0036 specifies.
          Compress-Archive -Path $stage -DestinationPath $zip -Force

          # Verify from the archive, not from the staging directory: what ships
          # is what Compress-Archive wrote. Mirrors bundle.sh's bar.
          # Needed on Windows PowerShell 5.1, already present on the pwsh 7 the
          # runner uses - so a failure here is not one.
          try { Add-Type -AssemblyName System.IO.Compression.FileSystem -ErrorAction Stop } catch { }
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try { $entries = $archive.Entries | ForEach-Object { $_.FullName } }
          finally { $archive.Dispose() }
          # Compress-Archive writes backslash separators on Windows PowerShell
          # 5.1 and forward slashes on pwsh 7. Normalize rather than depend on
          # which one the runner image ships - a check that passes only on the
          # host we happened to try it on is not a check.
          $entries = $entries | ForEach-Object { $_.Replace('\', '/') }

          foreach ($required in "$name/ritmolux.exe", "$name/READ-ME-FIRST.txt", "$name/spout-license.txt") {
              if ($entries -notcontains $required) {
                  throw "zip is missing $required"
              }
          }
          Write-Host "    ok: zip top level holds ritmolux.exe, READ-ME-FIRST.txt and spout-license.txt"

          $repoCount = (Get-ChildItem presets/*.toml).Count
          $zipCount = ($entries | Where-Object { $_ -like "$name/presets/*.toml" }).Count
          if ($zipCount -ne $repoCount) {
              throw "zip carries $zipCount presets, repo has $repoCount"
          }
          Write-Host "    ok: presets/: $zipCount .toml files, matching the repo"

          $md = $entries | Where-Object { $_ -like "*.md" }
          if ($md) { throw "zip contains a .md file: $($md -join ' ')" }
          Write-Host "    ok: no .md in the zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: target/dist/*.zip
          if-no-files-found: error

  # The foobar2000 component (Plan 0102, ADR-0115). A thin caller, like the
  # macos job: fetch the SDK, run the recipe, upload - the build, the version
  # stamp, the packaging AND the seven fatal checks all live in
  # packaging/foobar/build-component.ps1, so a developer running it locally is
  # held to this job's bar rather than to a looser one.
  #
  # The SDK is third-party, separately licensed and gitignored, so this job
  # fetches it. That is legal on a reading of the SDK licence, which is
  # BSD-style: it permits redistribution in binary form and puts a notice
  # obligation only on redistributed *source*. We ship the linked DLL, no SDK
  # source, and nothing implying the SDK author endorses this (Plan 0102 Phase
  # 1, answered by the user 2026-08-16).
  #
  # The fetch is pinned to a release and checked against a SHA-256 by
  # packaging/foobar/sdk-pin.ps1, so a URL that changes its bytes fails the
  # release rather than shipping an untested component (ADR-0115, Negative).
  #
  # Needs MSVC with the C++ workload and 7-Zip; both are preinstalled on the
  # windows runner image, which is why this is not its own setup step.
  foobar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Stage the pinned foobar2000 SDK
        shell: pwsh
        run: ./packaging/foobar/fetch-sdk.ps1
      - name: Build, package and verify the component
        shell: pwsh
        run: ./packaging/foobar/build-component.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: foobar2000-component
          path: target/dist/*.zip
          if-no-files-found: error

  # Publish. Gated on ALL THREE builds by `needs:`, so a failure on any platform
  # leaves no Release at all rather than a half-published one - the release job
  # is skipped, not merely red. Gated on the ref being a tag, so the
  # workflow_dispatch dry-run path produces run artifacts and publishes nothing.
  #
  # Runs on ubuntu-latest: it only moves zips around, and `gh` is preinstalled
  # on every runner image, so no pinned third-party release action is needed
  # (NFR section 4 - every dependency is a cost to justify).
  release:
    needs: [macos, windows, foobar]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Three since Plan 0102: the two standalone zips and the foobar2000
          # component. The recipe either produces all three or the tag is
          # incomplete (ADR-0115, Negative), and an exact count is what makes a
          # silently-skipped job fail here rather than ship a short release.
          count=$(ls -1 assets/*.zip | wc -l)
          if [ "$count" -ne 3 ]; then
              echo "expected exactly 3 zips, found $count:" >&2
              ls -1 assets/ >&2
              exit 1
          fi
          ls -1 assets/*.zip

          notes="Builds of the ${TAG} tag: the standalone app for macOS and
          Windows, and the foobar2000 component.

          - **macOS** (universal, arm64 + Intel, requires macOS 13+): unsigned and
            ad-hoc signed only, so macOS quarantines it - right-click the app and
            choose Open, or strip the quarantine attribute. It needs the Screen
            Recording permission to hear system audio, and a relaunch after
            granting it.
          - **Windows** (x64): unsigned, so SmartScreen warns once - More info,
            then Run anyway.
          - **foobar2000 component** (x64 only, foobar2000 v2): unzip, then
            install foo_ritmolux.fb2k-component from File - Preferences - Components.
            It reads what foobar2000 is already decoding, so unlike the
            standalone app there is no audio capture to permit.

          Each zip carries a READ-ME-FIRST.txt with the full steps. The two
          standalone zips also carry a reference copy of the presets; the
          component shares the standalone app's preset folder if both are
          installed. This is a prerelease while the app is 0.x."

          # Re-running a workflow on an existing tag must not hard-fail:
          # `gh release create` errors when the release already exists, so
          # create it if absent and clobber the assets otherwise.
          if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG exists; replacing its assets"
              gh release upload "$TAG" assets/*.zip --clobber
          else
              gh release create "$TAG" assets/*.zip \
                  --prerelease \
                  --title "$TAG" \
                  --notes "$notes"
          fi
