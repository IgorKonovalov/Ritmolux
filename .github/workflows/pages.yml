# The documentation site's permanent home (ADR-0154, Plan 0143 Phase 6).
#
# Two jobs, and the split is the point. `build` runs on every push and every
# pull request and is the guard the plan actually asks for: a documentation edit
# that the site cannot render, or a link rewrite that resolves to nothing, fails
# here rather than producing a site that is confidently wrong. `deploy` runs only
# from `main`, so a pull request is checked and never published.
#
# WHY THIS BUILDS AT A DIFFERENT BASE THAN A LAPTOP DOES. GitHub serves a project
# site under the repository's name as spelled - `/Ritmolux/` - while the Phase 4
# demo lives in a hand-made directory inside another repository's `public/` at
# `/ritmolux/`. `site/astro.config.mjs` defaults to the demo path, because that is
# what a local `npm run build` should serve, and `SITE_BASE` below switches it.
# The gate is given the SAME value: a check run at a different base than the build
# reports every internal link as broken, which looks like a catastrophe and is a
# typo.
#
# DIAGRAMS ARE RENDERED HERE, and that is not a contradiction of the line below.
# A mermaid fence is deterministic - the same source gives the same SVG on every
# machine - so it is generated at build time rather than committed (ADR-0171).
# A GPU render is not, which is why the pictures below are.
#
# NOT a render job. The gallery's 82 preset cards are committed PNGs, rendered
# locally on a hardware GPU (ADR-0100) - CI never runs `shot` for the docs, and
# adding that here would be a permanently red build, since a render is not
# byte-reproducible across machines.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and a queued one waits rather than cancelling: a
# half-published site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The project site's subpath. Case matters - see the header.
  SITE_BASE: /Ritmolux/

jobs:
  # The Rust API reference, built from the same commit the site is (ADR-0169).
  # A separate job so it runs BESIDE the site build rather than in front of it:
  # a documentation edit still renders in under a minute, and only the deploy
  # waits on a compile.
  #
  # `ubuntu-latest` is the first choice and CI's own `check` job runs `cargo doc`
  # on Windows and macOS only, so this arm is the one nothing had exercised. The
  # standalone carries a `not(any(windows, macos))` fallback, which is what makes
  # a Linux build plausible; if it turns out not to build here, the fallback is
  # this same job on `windows-latest` handing the artifact across.
  rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--workspace` is load-bearing: `rlx-core-cabi` and `milkconv` sit outside
      # the workspace default members, and the C ABI crate is exactly the one an
      # embedder came to read. `-D warnings` is the same bar CI already holds
      # rustdoc to, so a broken intra-doc link fails here rather than shipping.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: rustdoc
          path: target/doc
          retention-days: 1

  build:
    needs: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      # `npm ci` rather than `npm install`: it installs the committed lockfile
      # exactly and fails if package.json and the lockfile disagree, which is the
      # only reason the lockfile is committed at all.
      - run: npm ci
        working-directory: site
      # The headless browser `rehype-mermaid` renders each diagram fence through
      # (ADR-0171). `--with-deps` installs the shared libraries Chromium needs on
      # a bare runner; the browser itself is cached by the key below, so the
      # download happens on the first run after a playwright bump and not on
      # every build. A missing browser must FAIL rather than render a blank -
      # a broken diagram is a broken build.
      - id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: site
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run build
        working-directory: site
      # The rustdoc lands INSIDE the site's output, before either gate runs, so
      # `check-site-links.mjs` resolves an `/api/` href like any other and a
      # renamed crate breaks the gate rather than the reader.
      - uses: actions/download-artifact@v4
        with:
          name: rustdoc
          path: site/dist/api
      # The gate the source cannot replace. `scripts/check-doc-links.mjs` in the
      # `links` job checks the tree and passes over every defect this one exists
      # to catch, because the rewrite happens at build time and the source was
      # never the thing that broke.
      # `--require-api` turns an absent `dist/api/` into a failure. Without it the
      # gate skips `/api/` hrefs and says so, which is right on a laptop that has
      # not run `cargo doc` and wrong here, where a silently-skipped download
      # would publish a menu entry pointing at nothing.
      - run: node scripts/check-site-links.mjs --require-api
      # The menu half of the same problem. A page added to `PUBLISHED` and not to
      # the sidebar builds, gets indexed, and is reachable only by search - which
      # looks like a working site from every angle except the one that matters.
      - run: node scripts/check-site-routes.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
