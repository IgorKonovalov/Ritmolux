# NFR section 7: build, test, doctests, clippy, fmt on Windows, macOS and Linux
# for every push, plus the single-runner gates - the `spout` feature compile
# (ADR-0181), the doc-link and roster checks, the studio's own suite, cargo-deny
# and the npm audit (supply chain), the rlx-core coverage ratchet (ADR-0033), and
# Miri over rlx-ring's unsafe.
#
# Live audio is out of CI scope. GPU rendering partly is not: on Windows the DX12
# WARP software adapter makes headless rendering deterministic, which the golden
# suite and the tier-4 chain test ride on. macOS has no software Metal fallback
# (ADR-0016), so the GPU suites skip there. Linux resolves Mesa's lavapipe, a
# software Vulkan rasterizer this repo's goldens were never blessed against
# (ADR-0131 Alternative H). Real-vendor GPU and live-loopback checks stay manual
# - see docs/on-device-validation.md.
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # ADR-0033 ratchet: line coverage of rlx-core only, measured on Windows where
  # the DX12 WARP software adapter makes the render paths genuinely executable.
  # Set from a real measurement minus a margin so an unrelated change does not
  # trip on rounding.
  #
  # Raise it at a close ceremony when a plan improves coverage. Never lower it
  # without a one-line note here naming the plan that lowered it and why.
  #
  # 88 -> 91 at Plan 0061 Phase 2, and the reason is a moved denominator rather
  # than better tests: ADR-0072 took `ffi.rs` (493 lines, its conformance suite
  # covering ~57% of them) out of this crate, so the same code scores higher.
  # Measured 94.85% lines LOCALLY after the move, with a ~3-point margin rather
  # than the usual 2 because this box has a hardware GPU and CI has WARP, so
  # hardware-gated tests execute here and skip there.
  #
  # Re-derived from CI itself at Plan 0110 Phase 6, discharging Plan 0061 Phase
  # 9: run 32272926929 (main at 7b9781d, cache-warm) reads 92.31% lines, so the
  # hardware/WARP asymmetry is real and costs 2.54 points - inside the margin
  # reserved for it. 91 therefore stands as a CI-measured floor, not an
  # inherited guess. Raising it to 92 was refused there: 0.31 points is ~62
  # lines, and the denominator moves with any non-test code that lands.
  COVERAGE_FLOOR: "91"
  # The C ABI's own gate (ADR-0072 Negative: without it the ABI's coverage
  # silently stops being watched the moment it leaves `rlx-core`). Measured
  # 56.60% lines. The number is low because most of `core-cabi` is error and
  # null-handle paths plus the catch_unwind wrappers, and it is recorded rather
  # than aspired to - the gate exists to catch a REGRESSION, not to claim the
  # ABI is well covered. Raising it means writing ABI tests, which no phase of
  # Plan 0061 does.
  CABI_COVERAGE_FLOOR: "54"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # What the Linux arm compiles and links against, none of it on the runner
      # image by default: winit's Wayland and X11 backends need the xkbcommon
      # and wayland headers, the standalone's capture backend needs libpulse
      # (ADR-0131), found through pkg-config by its build script, and
      # mesa-vulkan-drivers carries lavapipe, the Vulkan ICD without which wgpu
      # resolves no adapter at all. A new ubuntu job that compiles `standalone`
      # needs the same step: a missing package is a build failure, not a
      # degraded build.
      - name: Install the Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libpulse-dev libxkbcommon-dev libwayland-dev \
            mesa-vulkan-drivers
      # rustup on the runner auto-installs the toolchain pinned in rust-toolchain.toml.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo build
      # nextest for parallelism + per-test isolation; it does not run doctests,
      # so cover those separately.
      #
      # `--workspace` is load-bearing since ADR-0072: `rlx-core-cabi` is
      # deliberately outside `default-members` (so a bare `cargo build` stops
      # emitting a cdylib and a 102 MB staticlib nothing links), which means a
      # bare `cargo nextest run` would silently skip the ABI conformance suite
      # and a bare `cargo clippy` would silently stop linting the ABI. This is
      # the job that proves the C ABI still compiles and behaves.
      #
      # THE NINE GPU-HEAVY SUITES ARE EXCLUDED HERE (ADR-0073). They render the
      # shipped preset library on WARP, and until this change they ran twice per
      # push - uninstrumented in this job and instrumented in `coverage`,
      # concurrently on two identical windows-latest runners, about 1930 CPU-
      # seconds paid a second time a few metres away. THE `coverage` JOB IS NOW
      # THE ONLY PLACE THESE SUITES RUN ON WINDOWS, which means it is
      # load-bearing for correctness and not only for the ratchet: disabling it,
      # skipping it, or letting `cargo-llvm-cov` fail to install takes the golden
      # guard and every GPU behavioural suite with it, and nothing else says so.
      # Treat deleting this comment as deleting a gate.
      #
      # WHICH nine, and the measured reason for those nine, lives in
      # `.githooks/pre-push`'s header; the list itself is the `fast` profile's
      # default-filter in `.config/nextest.toml` (ADR-0156). This job, that hook
      # and the `dev` lane's per-phase gate all cite `-P fast`, so the exclusion
      # has one definition and no consumer can drift from another. Verified by a
      # union check rather than asserted: `-P fast` is a strict SUBSET of the
      # unfiltered `--workspace` set, and every test it defers is in an
      # `rlx-core` binary.
      #
      # SINCE ADR-0157 THE EXCLUSION IS NOT TOTAL, and this job pays for that.
      # The profile unions a 24-preset sample back into `animation`, `reactivity`
      # and `sanity`'s loudness gate - 72 tests this job did not run before, on a
      # runner with no GPU and few cores. It buys per-push coverage of the preset
      # library that ADR-0156 had removed entirely; it costs wall time here, and
      # HOW MUCH IS UNMEASURED ON THIS RUNNER (Plan 0146 measured only the
      # development machine, at +58.5 s on sixteen cores). If this job's wall
      # becomes the critical path ADR-0073 is fighting, that union is the first
      # thing to re-derive by measurement.
      #
      # Applied on EVERY matrix arm, not branched per-OS: macOS already skips
      # every GPU suite (ADR-0016), so the filter removes nothing there, and a
      # per-OS branch is a second thing to keep true. On Linux the fast tier
      # runs on lavapipe: property tests assert there as anywhere, and every
      # comparison against a committed baseline under core/tests/golden/ - a
      # measurement taken on WARP - prints its reading and skips (ADR-0131).
      - run: cargo nextest run --workspace -P fast
      - run: cargo test --workspace --doc
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all --check
      # ADR-0127 keeps rustdoc intra-doc links as its ONE exempted link form, on
      # the stated grounds that rustc checks them. Nothing asked it to: neither
      # this workflow nor .githooks/pre-push ran cargo doc, and 71 warnings had
      # accumulated over 31 files - private targets, renamed and removed items,
      # cfg(test) items and redundant explicit targets. This is what turns that
      # exemption from a claim into a property.
      #
      # The pre-push hook runs THIS step, not a scoped one. It was scoped to
      # `-p rlx-core --no-deps --features text` until Plan 0196 Phase 3, which
      # left four of the five workspace members - `standalone`, `milkconv`,
      # `rlx-core-cabi` and `rlx-ring` - documented here and nowhere else, so a
      # rustdoc error in any of them could not be reached before a push. It fired
      # twice in sixteen days and both repairs landed after a release tag had been
      # written on top of the red (ADR-0217). The widened step measures 7.8 s warm
      # on the development machine after an edit to the deepest crate, against
      # 4.5-5.9 s for the scoped one on an engine edit (Plan 0177 Phase 7); the
      # figures live beside the step in `.githooks/pre-push`.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The one off-by-default feature the shipped Windows binary turns on
  # (ADR-0181). `release.yml`'s `windows` job builds `--features spout`, because
  # that flag is what makes `ritmolux --stream` exist in the artifact a tester
  # downloads - and nothing compiled that code path any earlier. Code behind
  # `#[cfg(feature = "spout")]` is NOT type-checked when the feature is off, so
  # `check` above, the whole `nextest` run and `clippy --all-targets` are blind
  # to it by construction rather than by omission. This job is the only thing
  # that compiles it before a tag is pushed.
  #
  # What it guards is an item moving out from under a gated call site: the most
  # ordinary refactor there is, invisible to every other job, and already the
  # cause of a release that does not exist. `v0.112.0` died here with `cannot
  # find function start_capture in the crate root`, the `release` job was
  # skipped by its `needs:`, and the failure announced itself only as an absent
  # artifact.
  #
  # Its own job rather than a step on `check (windows-latest)`: that job is the
  # gate's longest at 19m41s, and a step there would serialize the SDK fetch
  # into the critical path and name `check` as the subject when this breaks.
  # Concurrent, the wall clock does not move (ADR-0181 Alternative A).
  #
  # `cargo check` in the dev profile, not the release build: it type-checks and
  # does not link, so a link-only or LTO-only break still surfaces first at the
  # tag push. That is the accepted limit, not an oversight (ADR-0181 Alternative
  # C) - a release-profile `lto = "fat"` build is minutes of gate time answering
  # the packaging question ADR-0038 keeps in release.yml.
  #
  # The SDK fetch is a network call, so a third-party outage can red a push.
  # ADR-0181 accepts that and names an `actions/cache` on the pinned hash as the
  # mitigation IF evidence arrives; do not add one speculatively.
  #
  # Windows-only because Spout is a DirectX facility - there is no macOS or
  # Linux arm to add.
  spout:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain action, matching `check` and `coverage`: rustup on the
      # runner auto-installs whatever rust-toolchain.toml pins on the first
      # cargo invocation. A `dtolnay/rust-toolchain@stable` step here was inert
      # - the pin wins inside the directory either way - but it installed a
      # second toolchain and read as if this job ran on stable.
      - uses: Swatinem/rust-cache@v2
      # Mirrors release.yml's `windows` job exactly; standalone/build.rs
      # consumes whatever is staged at standalone/spout-sdk/ and does not care
      # which route it came by.
      - name: Stage the pinned Spout SDK
        shell: pwsh
        run: ./packaging/spout/fetch-sdk.ps1
      - run: cargo check -p standalone --features spout

  # Doc-link gate (Plan 0061 Phase 2c). Every relative markdown link in the repo
  # must resolve - across docs/, README.md and .claude/skills/**.
  #
  # It exists because moving a plan into docs/plans/done/ breaks links in BOTH
  # directions, and nothing checked: 74 broken links across 23 files had
  # accumulated over six consecutive closes by the time Plan 0060 looked. The
  # checker and its pre-push step landed then; this job is what makes it apply to
  # everyone rather than only to clones that opted the hook in.
  #
  # Its own job rather than a second step in `deny`, deliberately: folding it in
  # saves one runner spin-up and makes a red `deny` ambiguous between a
  # supply-chain failure and a broken link. Seconds on the cheapest runner, and
  # nowhere near the Windows critical path ADR-0073 is fighting. GitHub's ubuntu
  # images ship Node, so no setup step - and unlike the hook, this one cannot
  # skip itself for want of a Node.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-doc-links.mjs
      # And the index-row gate (ADR-0116): every row inside a marked roster
      # region stays a pointer, held to 320 bytes. The rows this catches are
      # written by the architect close ceremony, which runs the same check - so
      # this job is the backstop for the case where it did not, exactly as it is
      # for the two checks either side of it. docs/adrs/README.md had reached
      # 188,820 bytes, 16 % of the corpus it indexes, under a convention that
      # had already been written down and had already failed.
      - run: node scripts/check-index-rows.mjs
      # And that gate's own bite check, which is a separate invocation because the
      # step above cannot distinguish the two states it exits 0 on: a tree with no
      # fat row in it, and a row detector that has stopped matching anything.
      # Replacing its row regexes with regexes that match nothing reports `0 rows,
      # 0 over cap` and goes green here, at pre-push and at the close alike
      # (backlog 0104). --self-test asserts the fixture's exact counts, a floor on
      # the repository's, and the `file:line  N bytes (cap C)` reporting path -
      # which no other run of this gate executes, since nothing tracked is over cap.
      - run: node scripts/check-index-rows.mjs --self-test
      # The same job carries the backlog-claim gate (ADR-0108), for the same
      # reason and at the same cost: it re-runs the probes each live entry in
      # docs/design-backlog.md carries beside its claims about this repo. That
      # file is the architect's inbox and its entries are meant to be acted on
      # NOW, which is what makes a stale one dangerous rather than historical -
      # four have been falsified, two of them wrong on the day they were
      # written. Unlike the pre-push hook this cannot skip itself for want of a
      # Node, which is what makes it the backstop rather than the gate.
      - run: node scripts/check-backlog-claims.mjs
      # And another of the same family (ADR-0122): the diffusion filter's cost
      # figures live in docs/diffusion-filter.md and nowhere else. The feature was
      # documented in three files at once, and a correction at Plan 0106's close
      # enumerated two of the three copies and missed the third - so this asserts
      # that duplicates do not EXIST rather than that they agree, which is the
      # only shape that would have caught it.
      - run: node scripts/check-filter-figures.mjs
      # And the comment-hygiene gate (ADR-0127): a relative link in a `.rs` comment, and
      # plan-relative narration. The link half is why this job is the right home
      # rather than the close ceremony alone - check-doc-links.mjs above walks
      # `.md` only, so eleven `.rs` links sat broken on main under a green gate,
      # and they break at exactly the moment a plan moves into docs/plans/done/.
      # It says nothing about how LONG a comment is: length correlates weakly
      # with the defect and is gamed by a blank line, so that judgement stays
      # with the Mode 4 review.
      - run: node scripts/check-comment-hygiene.mjs
      # And the contents-block gate (ADR-0163): every generated contents block still agrees
      # with the headings beneath it. `--check` regenerates and reports drift, so
      # unlike the index-row gate it cannot go green on a detector that stopped
      # matching. What it cannot see is an anchor that is merely plausible -
      # check-doc-links.mjs above validates paths and never validates fragments,
      # so a wrong slug rule ships silently and every row in every block is wrong
      # together. --self-test pins the rule to two anchors this repository
      # already links, and to the shapes the corpus contains.
      - run: node scripts/toc.mjs --check
      - run: node scripts/toc.mjs --self-test
      # And the reader-prose gate (ADR-0168): in the documents a reader meets on the site,
      # every citation of a plan or an ADR sits inside a markdown link rather than
      # bare in a sentence. It is the exact inverse of what the comment-hygiene
      # gate above asks of a `.rs` comment, and the boundary between the two rules
      # is the filename list inside the script - which is also the only place that
      # roster is written down, so a count of it here would be falsified by every
      # document added. The convention alone was tried: CLAUDE.md has asked for
      # bare-number citation throughout, and that is how those documents
      # accumulated 235 of them.
      - run: node scripts/check-reader-prose.mjs
      # And the release-tag gate (ADR-0203): the version main declares has an annotated
      # release tag on origin. The pre-push hook reads the same property offline,
      # but that hook is opt-in per clone and bypassable, and a tag that never
      # left the machine is what stranded every silent release recorded - so this
      # is where it cannot be skipped. The checkout here is shallow with no tags,
      # so the offline reading cannot run; --remote asks origin instead, for the
      # tag and its peeled ^{} line (which exists only for an annotated tag), and
      # polls for up to 60 s so a tag pushed right after main is not a false red.
      # Only on a push to main: no other ref declares the version that ships.
      # --self-test runs everywhere, and proves the offline reading still bites.
      - run: node scripts/check-release-tag.mjs --self-test
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/check-release-tag.mjs --remote
      # And the translation gate (ADR-0185): every `.ru.md` translation opens with a
      # `translated-from: <sha>` stamp naming the commit its source was
      # translated from. A translation is the one second copy here that no
      # machine can check - nothing can tell whether the Russian still says what
      # the English now says - so the gate splits: a missing or malformed stamp
      # is this exit code, and a source that has moved past its stamp is an
      # advisory row that never touches it.
      # The plain run cannot distinguish a clean tree from a detector that
      # stopped matching, since both report `0 stamped translation(s)`, so
      # --self-test is where the assertion lives: the four hard-failure shapes,
      # both stamp widths, and the shallow-clone withholding against a real
      # --depth 1 clone. THIS CHECKOUT IS SHALLOW, which is exactly the trap -
      # `git log -1` returns the tip for every path here, so the advisory half
      # withholds itself and says so rather than reporting every translation as
      # stale. The pre-push hook is where that half is read.
      - run: node scripts/check-translations.mjs
      - run: node scripts/check-translations.mjs --self-test
      # And the system-count gate (ADR-0202): no sentence outside a dated record
      # writes down how many systems the roster has. A count goes stale whether
      # or not it is right today - a true "fourteen systems" is wrong the day the
      # fifteenth lands - so the gate rejects the number rather than comparing it
      # against the live roster, which would fail exactly the sentences it exists
      # to stop on exactly the close that has already missed them twice. It reads
      # `.rs` WHOLE, comments and string literals alike, because the instance
      # that survived two closes was an assertion message. `count-allow: <why>`
      # on the line is the escape, and a marker with no reason is itself a
      # finding.
      - run: node scripts/check-system-counts.mjs
      # And the settings-file gate (ADR-0240): the two applications a Rust test
      # cannot see keep every setting in a file. The standalone's half is carried
      # by types - `SettingsRow::config_path` is an exhaustive match from a menu
      # row to a `config.toml` key - and neither of the other two has anything
      # like it: nothing here compiles `plugin-foobar/` at all. So this reads
      # source text for two properties. No `localStorage`, `sessionStorage` or
      # `indexedDB` under `studio/`, because all three keep a choice where no
      # file can be edited and no other process can read it; and every `cfg_*`
      # declaration under `plugin-foobar/` named in docs/configuration.md,
      # because foobar's store is host-side and a document is the only thing
      # that can tell resume state from an unclaimed setting. It greps rather
      # than parses, so `settings-allow: <why>` on the line is the escape and a
      # marker with no reason is itself a finding.
      - run: node scripts/check-settings-have-files.mjs
      # And the roster's own gate (ADR-0217): every `node scripts/...` invocation
      # above is the projection of scripts/gates.manifest.mjs for this job, in that
      # order, and `.githooks/pre-push`'s are its projection for the hook. How many
      # there are is deliberately not written down here - a count in the one comment
      # whose subject is a roster that drifts is the copy that drifts next, and the
      # gate below is what holds the list rather than a number. The third carrier,
      # the conductor's `defaultGate()`, imports the manifest and so cannot drift
      # at all - it is the one that fell behind twice while the two file-backed
      # ones were kept in step by hand. It asserts invocations and ORDER and never
      # an `if:` condition: the `--remote` step above is guarded and this gate sees
      # only the invocation. --self-test seeds the three drift shapes, one of them
      # a gate in the wrong position, which is what a set comparison calls clean.
      - run: node scripts/check-gate-carriers.mjs
      - run: node scripts/check-gate-carriers.mjs --self-test
      # The conductor's own suite (ADR-0205): the queue and plan readers, the lane
      # state machine against throwaway git repositories, the digest, the operator
      # commands, the two PreToolUse hooks' bite checks and the machine-wide lock.
      # It belongs here for the reason the gates above do - cheap, platform-free,
      # no GPU - and because a fake CLI stands in for claude, it spends nothing and
      # needs no network. A glob, not a directory: `node --test <dir>` is not
      # read as a test-file pattern on every Node release.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test "tools/conductor/test/*.test.mjs"
      # And the diffusion filter's own suite (Plan 0106 Phase 7c). It belongs in
      # this job rather than in the `check` matrix for the same reasons the three
      # gates above do: it is cheap, platform-independent, needs no GPU, no
      # weights and no model, and it cannot skip itself here. Its property -
      # byte identity through the pass-through - is asserted in-process at four
      # geometries against payloads chosen to be hostile to a text-mode handle,
      # so paying for it on three build matrices would buy the word "real" and
      # nothing else.
      #
      # numpy is installed for exactly one group: the frozen colour table that
      # pins tools/sd-filter's YUV conversion to standalone/src/shot/render.rs's
      # (Phase 7b). Those conversions are array functions, so without numpy that
      # group skips - and the Rust half of the same pin, which runs in `check`,
      # would be the only half anything ever ran.
      #
      # The end-to-end group skips here, because this job builds no `shot`. That
      # is deliberate and it is not a hole: it asserts the same byte identity the
      # in-process group already covers, through a subprocess.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy
      - run: python tools/sd-filter/test_sd_filter.py

  # The studio's own gate (Plan 0159, ADR-0178). Typecheck, lint and the Vitest
  # suite for `studio/`, which is TypeScript and touches no cargo target at all.
  #
  # Its own job on ubuntu-latest rather than a step in `check`: the studio's
  # tests need no GPU, no audio device and no Windows, so putting them on the
  # Windows critical path ADR-0073 is fighting would cost the gate minutes for
  # nothing. Nothing shipped depends on `studio/`, so this job failing never
  # means a broken player - but it is the ONLY automated reading of the studio,
  # because the pre-push hook's studio step skips itself on a clone with no
  # studio/node_modules.
  #
  # npm ci rather than npm install: it installs the committed lockfile exactly
  # and fails if package.json and the lockfile disagree, which is the only
  # reason the lockfile is committed at all.
  #
  # Node 24 ships npm 11, which runs a dependency's install script only when
  # `allowScripts` in studio/package.json names it, pinned to its version
  # (ADR-0244). A bump that strands an entry still installs cleanly here; the
  # package's script is simply skipped.
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # Supply-chain gate (deny.toml): advisories, licenses, bans, sources.
  # Platform-independent (reads Cargo.lock + the [graph] targets in deny.toml),
  # so it runs once on the cheapest runner.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  # The npm graphs' supply-chain gate (ADR-0244), the counterpart of `deny`
  # above for studio/ and site/. It fails at `high` in the studio's shipped graph
  # (`--omit=dev`, what the studio zip carries) and at `critical` in every full
  # graph, and npm-audit.allow.json holds its exceptions as a GHSA id and a
  # reason. `npm audit` reads the committed lockfiles, so no install step.
  #
  # Its own job rather than a step in `links`: it needs the registry, and its
  # answer changes without a commit, so a red here says an advisory was
  # published rather than that a push broke something. For the same reason it
  # is on neither the pre-push hook nor scripts/gates.manifest.mjs. A registry
  # outage fails it; the gate never reads a failed request as a pass.
  # --self-test carries the assertions, since the live run has nothing seeded.
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-npm-audit.mjs --self-test
      - run: node scripts/check-npm-audit.mjs

  # Coverage ratchet (Plan 0032 Phase 4, ADR-0033). Gates `rlx-core` only:
  # `standalone/` is a winit event loop plus two platform capture backends that
  # no runner can execute, so a workspace-wide number would mostly measure how
  # much of the app is structurally untestable (ADR-0033 Alternative A).
  #
  # windows-latest ONLY, and not for convenience: WARP makes the GPU tests real
  # there, while on macOS every one of them skips and would report that code as
  # dead. Do not "fix" a slow run by moving this to another runner.
  #
  # Line coverage gates; region coverage is emitted in the report for
  # information only (ADR-0033 Alternative C). Separate job, so it stays off the
  # critical path even though instrumented binaries make the WARP suites slower.
  #
  # This job renders the WHOLE preset library and is the only place that still
  # happens on Windows, which is what ADR-0081's curation gate rests on. Since
  # ADR-0157 it reaches that library through ~264 test processes rather than five
  # roster loops, each paying its own device creation and its own profraw, and
  # that cost is UNMEASURED here (Plan 0146 measured the development machine
  # only). It is the second figure to re-derive if this job's wall moves.
  coverage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The ABI's gate runs FIRST and deliberately so: each `cargo llvm-cov
      # nextest` invocation clears stale profile data, so the LAST measuring run
      # is the one the breakdown step below re-reports. This suite is five tests
      # and ~0.1 s, so it costs nothing to put it here.
      - name: Measure rlx-core-cabi line coverage and enforce its floor
        run: cargo llvm-cov nextest -p rlx-core-cabi --summary-only --fail-under-lines ${{ env.CABI_COVERAGE_FLOOR }}
      - name: Measure rlx-core line coverage and enforce the floor
        run: cargo llvm-cov nextest -p rlx-core --summary-only --fail-under-lines ${{ env.COVERAGE_FLOOR }}
      # Re-report from the profile data already collected (no second test run)
      # so the per-file breakdown lands where a reviewer will actually read it.
      # `-p rlx-core` is load-bearing: without it `report` re-reports every
      # object in the profile data, which includes rlx-ring, and the summary
      # under the floor heading would not be the number the step above gates.
      - name: Per-file breakdown in the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## rlx-core coverage (floor: ${COVERAGE_FLOOR}% lines)"
            echo ""
            echo '```'
            cargo llvm-cov report -p rlx-core --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # UB gate (Plan 0005, unblocking Plan 0002's deferred Phase 5). Miri checks
  # the SPSC ring's `unsafe` - the only pure-Rust unsafe in the tree. It runs
  # against rlx-ring alone: a zero-dependency crate with no wgpu/naga graph, so
  # Miri compiles and interprets it in seconds instead of the whole render
  # stack. Platform-independent unsafe, so once on the cheapest runner.
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --component miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri test -p rlx-ring
