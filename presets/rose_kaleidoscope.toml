# Rose Kaleidoscope - both symmetry engines at once, which nothing in the old
# library did. The GEOMETRY MIRROR (`mirror_*`, Plan 0018) replicates the actual
# chord set under N-fold rotation before it is drawn, building a true geometric
# fractal; the SCREEN-SPACE KALEIDOSCOPE (`kaleido_*`) then folds the finished
# pixels on a different axis and at a different rate. The two symmetries beat
# against each other, and the interference is the look.
#
# Keep them at different orders and different rates - matched orders collapse
# into a single obvious symmetry and the effect disappears.
#
# SEGMENT BUDGET (MAX_SEGMENTS = 20_000) is the real constraint here, since the
# geometry mirror is the multiplier: 700 x 12 = 8400, doubling to 16800 when the
# dihedral reflection latches on the beat. That is close to the cap on purpose -
# raising `samples` past ~800 at this fold count truncates the figure.
system = "parametric_curve"
name   = "Rose Kaleidoscope"

[curve]
family = "maurer_rose"

# The geometry mirror below costs nothing in resolution because it replicates
# real geometry BEFORE rasterisation, while `kaleido_*` folds finished pixels -
# so on the line scenes, prefer `mirror_*` when both would do. Since Plan 0033
# the feedback and kaleidoscope stages follow the RENDER TARGET rather than a
# fixed 1280x720, so `trails` no longer costs this preset its sharpness.

[params]
# SHAPE - a low-order curve, because the mirrors supply the complexity.
n             = "3"
d             = "47"
samples       = "380"
phase         = "sin(time * 0.0175) * 0.34 + clamp(bass * 0.5, 0, 0.136)"
radial_offset = "0.12 + sin(time * 0.011) * 0.14"

# MOTION - the geometry turns one way; the screen fold turns the other.
spin          = "0.12 + sin(time * 0.015) * 0.02"
# BIGGER - 0.46 left the figure sitting small inside its wedge, so the fold was
# replicating mostly empty space. 0.82 fills the wedge before it repeats, which
# is what makes the interference pattern read at all.
scale         = "0.82 + bar * 0.04 + clamp(bass * 0.25, 0, 0.08)"
draw_progress = "1"

# STROKE - thin, because twelve folds overlap heavily near the origin.
thickness  = "0.62 + clamp(bass * 0.38, 0, 0.2)"
brightness = "0.40 + clamp(bass * 0.18, 0, 0.09)"

hue = "0.35 + time * 0.019 + clamp(treb * 0.7, 0, 0.24)"

# SYMMETRY ONE - the geometry mirror, stepping 6 -> 9 with the energy. The
# reflection latches on a HARD ONSET, not on `beat`: this preset stacks two
# symmetry engines, so a reflection toggling twice a second doubles the figure
# under a fold that is already replicating it, and the compounding is most of
# what read as aggressive.
mirror_order   = "select(bass + mid > 0.36, 9, 6)"
mirror_reflect = "onset > 0.62"

# SYMMETRY TWO - the screen fold, at a DIFFERENT order and turning the other
# way. This is the pairing that makes the preset.
kaleido_order = "5"
kaleido_angle = "-time * 0.09"

# VIEW + COMPOSITE
zoom        = "1.08 + bar * 0.06 + clamp(bass * 0.35, 0, 0.15)"
bg_hue      = "0.20 + sin(time * 0.011) * 0.06"
bg_bright   = "0.016 + clamp(mid * 0.09, 0, 0.012)"
bg_vignette = "0.82"

# FEEDBACK - restored (Plan 0033). Moderate - the mirror order climbs to 9 on the loud end.
trails = "0.56 + clamp(bass * 0.20, 0, 0.10)"

[smoothing]
# Everything long. Same principle as `fragment_kaleido.toml`: a fold REPLICATES
# motion as well as luminance, so a twitch in the wedge becomes that twitch N
# times over. This preset folds twice - geometry mirror AND screen fold - so it
# compounds harder than anything else in the set and every constant is longer
# than it would be on an unfolded rose.
phase         = 1.35
radial_offset = 1.50
scale         = 0.95
thickness     = 0.70
hue           = 1.30
mirror_order  = 3.4
zoom          = 0.95
bg_bright     = 1.04
trails       = 0.60
