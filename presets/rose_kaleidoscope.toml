# Rose Kaleidoscope - both symmetry engines at once, which nothing in the old
# library did. The GEOMETRY MIRROR (`mirror_*`, Plan 0018) replicates the actual
# chord set under N-fold rotation before it is drawn, building a true geometric
# fractal; the SCREEN-SPACE KALEIDOSCOPE (`kaleido_*`) then folds the finished
# pixels on a different axis and at a different rate. The two symmetries beat
# against each other, and the interference is the look.
#
# Keep them at different orders and different rates - matched orders collapse
# into a single obvious symmetry and the effect disappears.
#
# SEGMENT BUDGET (MAX_SEGMENTS = 20_000) is the real constraint here, since the
# geometry mirror is the multiplier: 700 x 12 = 8400, doubling to 16800 when the
# dihedral reflection latches on the beat. That is close to the cap on purpose -
# raising `samples` past ~800 at this fold count truncates the figure.
system = "parametric_curve"
name   = "Rose Kaleidoscope"

[curve]
family = "maurer_rose"

# NOTE - no `trails` here. The feedback and kaleidoscope stages both render at a
# fixed 1280x720 and upscale to the surface, which on anything above 720p visibly
# softens line art (it reads as "upsized from something smaller"). The geometry
# mirror below costs nothing in resolution because it replicates real geometry
# before rasterisation - so on the line scenes, prefer `mirror_*` over the
# screen-space fold whenever both would do.

[params]
# SHAPE - a low-order curve, because the mirrors supply the complexity.
n             = "3"
d             = "47"
samples       = "380"
phase         = "sin(time * 0.0175) * 0.34 + clamp(bass * 0.5, 0, 0.136)"
radial_offset = "0.12 + sin(time * 0.011) * 0.14"

# MOTION - the geometry turns one way; the screen fold turns the other.
spin          = "0.17 + sin(time * 0.015) * 0.03"
scale         = "0.46 + bar * 0.05 + clamp(bass * 0.35, 0, 0.1)"
draw_progress = "1"

# STROKE - thin, because twelve folds overlap heavily near the origin.
thickness  = "0.62 + clamp(bass * 0.38, 0, 0.2)"
brightness = "0.40 + clamp(bass * 0.18, 0, 0.09)"

hue = "0.35 + time * 0.019 + clamp(treb * 0.7, 0, 0.24)"

# SYMMETRY ONE - the geometry mirror, stepping 8 -> 12 with the energy.
mirror_order   = "select(bass + mid > 0.36, 9, 6)"
mirror_reflect = "beat"

# SYMMETRY TWO - the screen fold, at a DIFFERENT order and turning the other
# way. This is the pairing that makes the preset.
kaleido_order = "5"
kaleido_angle = "-time * 0.09"

# VIEW + COMPOSITE
zoom        = "1.08 + bar * 0.06 + clamp(bass * 0.35, 0, 0.15)"
bg_hue      = "0.20 + sin(time * 0.011) * 0.06"
bg_bright   = "0.016 + clamp(mid * 0.09, 0, 0.012)"
bg_vignette = "0.82"

[smoothing]
phase         = 1.04
radial_offset = 1.17
scale         = 0.42
thickness     = 0.36
hue           = 1.04
mirror_order  = 2.6
zoom          = 0.47
bg_bright     = 1.04