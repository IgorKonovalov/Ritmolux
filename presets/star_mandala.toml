# Star Mandala - the ornament alone. Four concentric rings of repeated motifs
# and NO interlace: `tiling = "none"`, which is the composition the reference
# image actually is, and the one the Plan 0065 Phase 3 sample sheets were judged
# on. The interlace-plus-rings composition ships separately as `star_weave`.
#
# `star_pattern` used to draw a twelve-fold Hankin interlace and nothing else,
# which design-backlog 0007 reported as "a hollow ring": at a 20-degree contact
# angle the strokes live between radius 0.54 and 0.90, so the inner 60% of the
# disc was empty at every angle the scene could reach. ADR-0079 fills it from the
# other direction - not with a denser interlace but with RINGS OF MOTIFS, the
# vocabulary the reference is made of.
#
# THE RING ROSTER IS STRUCTURAL, not bindable: read once at load and fixed for as
# long as the preset is loaded, exactly like `tiling`. What moves is the three
# ring LEVERS below, which multiply and turn the roster without changing what is
# in it.
system = "star_pattern"
name   = "Star Mandala"

[generator]
tiling = "none"

# FOUR RINGS, read outward. Radii are in the fit-normalized world the figure
# lands in - it spans +/- 0.9, so 0.9 is the rim and everything here is genuinely
# interior. `scale` is close to the copy's diameter, because every motif in the
# closed roster is authored to span about one unit.
#
# THE COUNTS ARE DELIBERATELY NOT ALL TWELVE, and the reason survives the
# interlace leaving: 12 / 18 / 24 share no common factor above 6, so the three
# outer rings beat against each other instead of locking into one coarse
# rotational figure. Under a moving `ring_phase` that beat is what you see.
#
# SEGMENT BUDGET: 36 + 12*4 + 18*24 + 24*24 = 1092 of the floor tier's 20 000.
# Room to spare, which is the point of stating it - a ring costs `count` copies
# of the motif's own segment count, and nothing warns you at the cap (it
# truncates silently).
rings = [
  { motif = "trefoil",  count = 1,  radius = 0.00, scale = 0.46 },
  { motif = "diamond",  count = 12, radius = 0.30, scale = 0.20 },
  { motif = "petal",    count = 18, radius = 0.52, scale = 0.26, phase = 0.09 },
  { motif = "circle",   count = 24, radius = 0.70, scale = 0.13 },
]

[params]
# THE COUNTER-ROTATION. `ring_phase` turns rings 0 and 2 one way and rings 1 and
# 3 the other, which is the single strongest ornamental motion this geometry has
# and costs one sign. It is the GESTURE, not the liveness: a 12-, 18- and
# 24-fold figure turned by any angle lands nearly on top of itself, so a turn
# moves very few pixels however fast it runs (design-backlog 0009, with more
# force here than on the bare rosette). What carries the motion is radial.
ring_phase = "time * 0.085 + clamp(bass * 0.22, 0, 0.18)"

# THE BREATH - the two RADIAL levers, at different rates so the figure never
# repeats itself exactly. `ring_spread` walks the rings out and back about the
# centre; `ring_scale` grows the motifs in place. Between them they change what
# the figure IS at each radius rather than only where it points, which is why
# these are the two a mandala's animation has to sit on.
ring_spread = "1.00 + sin(time * 0.83) * 0.075 + clamp(bass * 0.13, 0, 0.11)"
ring_scale  = "1.00 + sin(time * 0.61) * 0.115 + clamp(mid * 0.20, 0, 0.17)"

# The frame's own slow drift, under the ring motion rather than instead of it.
rotation = "0.09 * time"
scale    = "1.06 + sin(time * 0.22) * 0.045"
zoom     = "1.02 + sin(time * 0.15) * 0.035"

# STROKE. `thickness` is the honest lever on this scene and the only one used
# here: a thicker SOLID stroke reads as a line, where a raised `glow` or a long
# `trails` reads as haze. The first shipped tuning of this preset chased
# `sanity.rs`'s 96x96 coverage floor with glow 1.55 and trails 0.40 and the
# result was rejected in the running app - "all lines are half transparent". See
# design-backlog 0071: on this scene that floor measures the halo and the tail,
# not the figure, and the bare rosette and the 46x-denser mandala score the same
# number at the same tuning. So this file is tuned by eye at a size a person
# looks at, and `glow` is left at the engine's 1.0.
thickness  = "3.10 + clamp(bass * 1.60, 0, 1.30) + beat * 0.45"
brightness = "0.95 + clamp(treb * 0.40, 0, 0.34)"

# COLOUR ALONG THE RADIUS, which is a lever this scene did not have until the
# rings arrived. ADR-0059 gave `star_pattern` a radial colour axis and it was
# IDENTICALLY FLAT on a bare rosette - 2n congruent segments all at the same
# radius, so `hue_spread` was documented as a no-op. Four rings at four radii
# give the axis a real range, and this is the first preset to spend it.
hue        = "0.58 + time * 0.011 + clamp(treb * 0.38, 0, 0.28)"
hue_spread = "0.60 + clamp(mid * 0.22, 0, 0.18)"
saturation = "0.94"

bg_hue      = "0.68 + sin(time * 0.0085) * 0.05"
bg_bright   = "0.016 + clamp(mid * 0.012, 0, 0.010)"
bg_vignette = "0.80"

[smoothing]
ring_phase  = 0.25
ring_spread = 0.35
ring_scale  = 0.40
rotation    = 0.20
scale       = 0.45
zoom        = 0.22
thickness   = { attack = 0.02, release = 0.32 }
hue         = 0.40
hue_spread  = 0.55
bg_bright   = 0.40
