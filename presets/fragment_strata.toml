# Marbled Strata — fragment_field as flowing mineral marbling (cohort 2, Plan 0075).
# Fresh slate (ADR-0089): authored from the marbled-paper/agate reference, not from any
# retiring file. The mechanism is Plan 0064's terraced banding: a hand-set agate palette
# snapped into palette_steps flat bands, with the palette_contour hairline as the
# marbling vein. Drives: bass folds the strata (warp), mid deepens the vein and lifts
# glow a little, treble slides the tonal window, onset is a brief pale seam flash.
# Luminance stays nearly flat; the music spends on structure (warp + vein).
system = "fragment_field"
name = "Marbled Strata"

[palette]
stops = [
  { at = 0.00, color = "#120c26" },  # deep indigo
  { at = 0.22, color = "#274060" },  # slate blue
  { at = 0.45, color = "#7e9c8f" },  # celadon
  { at = 0.62, color = "#e8dcc0" },  # cream vein
  { at = 0.80, color = "#b0563b" },  # terracotta
  { at = 1.00, color = "#2c1420" },  # oxblood
]

[params]
warp = "1.2 + noise(time * 0.045) * 0.6 + clamp(bass * 0.94, 0, 0.8)"
zoom = "1.35 + noise(time * 0.03 + 50) * 0.25"
pan_x = "noise(time * 0.02 + 100) * 0.3 - 0.15"
pan_y = "noise(time * 0.02 + 150) * 0.2 - 0.1"
hue = "time * 0.006"
glow = "0.55 + clamp(mid * 0.41, 0, 0.35)"
flash = "clamp(onset * 0.25, 0, 0.15)"
color_span = "0.9"
color_center = "0.5 + noise(time * 0.025 + 200) * 0.2 + clamp(treb * 0.33, 0, 0.2)"
saturation = "1.05"
palette_steps = "7"
palette_contour = "0.28 + clamp(mid * 0.29, 0, 0.25)"

[smoothing]
warp = 0.35
glow = 0.25
palette_contour = 0.3
color_center = 0.4
flash = 0.08
