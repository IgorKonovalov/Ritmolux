# Mandala Weave - the four-ring ornament drawn INSIDE the twelve-fold Hankin
# interlace. This is the composition design-backlog 0007 actually asked for and
# the one the reference image does not show: the interlace was never the problem,
# the empty middle was, and this is the scene finally drawing both halves at once.
#
# It ships on a judgement that has not been settled yet. The session that
# reviewed the Plan 0065 Phase 2 sample read this cell as the interlace sitting
# ON TOP of the ornament as a separate coarse figure rather than framing it; the
# user kept it anyway, and Plan 0065 Phase 6 is where that gets decided against
# real music. If the reading was right, the fix is here in the preset - the
# interlace's `variant` and the ornament's `ring_spread` are the two levers that
# decide whether the two figures share a scale.
system = "star_pattern"
name   = "Mandala Weave"

[generator]
tiling            = "12"
contact_angle_deg = 26

# The same four rings `star_mandala` ships, unchanged on purpose: this preset is
# the A/B against it, and the only difference that should be visible is the
# interlace.
#
# THE COUNTS ARE DELIBERATELY NOT ALL TWELVE. A ring whose count divides the
# interlace's twelve-fold symmetry locks onto it and the two figures read as one
# coarse shape; 18 and 24 against 12 beat against it instead. The 12-count
# diamond ring is the one that DOES lock, on purpose - it is the seam between the
# centre boss and the beating outer rings.
#
# SEGMENT BUDGET: 24 interlace + 1092 ornament = 1116 of the floor tier's 20 000.
rings = [
  { motif = "trefoil",  count = 1,  radius = 0.00, scale = 0.46 },
  { motif = "diamond",  count = 12, radius = 0.30, scale = 0.20 },
  { motif = "petal",    count = 18, radius = 0.52, scale = 0.26, phase = 0.09 },
  { motif = "circle",   count = 24, radius = 0.70, scale = 0.13 },
]

[params]
# THE INTERLACE MORPHS, which is the one lever the ornament-only presets have no
# use for. Same triangle wave `star_rosette` uses (a bare `mod` would be a
# sawtooth and would snap 2 -> 0 once per cycle), slower here because there is a
# whole interior competing for the eye.
variant = "2 * abs(mod(0.5 + time * 0.012 + clamp(bass * 0.26, 0, 0.22), 2) - 1)"

# The ornament turns under the interlace rather than with it - the interlace is
# fixed in the frame apart from `rotation`, so a counter-rotating interior is
# what stops the two reading as one plate.
ring_phase = "time * 0.070 + clamp(bass * 0.20, 0, 0.16)"

# THE RADIAL PAIR, narrower than `star_mandala`'s: the interlace's rim is a fixed
# ring at radius 0.9 and an ornament that breathes past it reads as two unrelated
# figures rather than one. This is the setting Phase 6 should push on first.
ring_spread = "1.00 + sin(time * 0.77) * 0.055 + clamp(bass * 0.10, 0, 0.085)"
ring_scale  = "1.00 + sin(time * 0.53) * 0.090 + clamp(mid * 0.16, 0, 0.14)"

rotation = "0.075 * time"
scale    = "0.90 + sin(time * 0.20) * 0.040"
zoom     = "1.02 + sin(time * 0.14) * 0.030"

# STROKE, same argument as the other two: `thickness` is the honest lever and
# `glow` stays at the engine's 1.0. Slightly heavier than `star_mandala` because
# the interlace is 24 long chords against the ornament's 1 092 short ones, and a
# hairline interlace disappears under it.
thickness  = "3.30 + clamp(bass * 1.55, 0, 1.25) + beat * 0.45"
brightness = "0.95 + clamp(treb * 0.40, 0, 0.34)"

# The interlace's own segments are all at one radius (a Hankin rosette is 2n
# congruent segments, see the scene docs), so on this preset `hue_spread` puts
# the whole interlace at ONE end of the ramp and spreads the ornament along the
# rest. That is a feature here: it is what separates the two figures by colour
# instead of by brightness.
hue        = "0.86 + time * 0.010 + clamp(treb * 0.36, 0, 0.28)"
hue_spread = "0.66 + clamp(mid * 0.20, 0, 0.16)"
saturation = "0.92"

bg_hue      = "0.58 + sin(time * 0.0080) * 0.05"
bg_bright   = "0.016 + clamp(mid * 0.012, 0, 0.010)"
bg_vignette = "0.80"

[smoothing]
variant     = 1.6
ring_phase  = 0.25
ring_spread = 0.35
ring_scale  = 0.40
rotation    = 0.20
scale       = 0.45
zoom        = 0.22
thickness   = { attack = 0.02, release = 0.32 }
hue         = 0.40
hue_spread  = 0.55
bg_bright   = 0.40
