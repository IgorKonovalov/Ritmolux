# Glowing voxel cubes. Neon cubes, magenta through violet to cyan. Each live
# cell is a solid cube lit by its own colour (ambient 0.75, a weak key), drawn
# bright enough that every face sits over the bloom threshold, so the whole
# structure throws light into the black around it. The bass lifts the key light
# and widens the halo, an onset swells the bloom and refills a ball of cells,
# the decaying cells glow as haze between the cubes, and the spectrum lights the
# radial shells. The camera orbits slowly.
system = "voxel"
name = "Voxel Neon"

[voxel]
grid        = 64
rules       = ["pyroclastic", "coral"]
seed_radius = 0.7
seed_fill   = 0.3
shells      = 8
present     = "solid"

[palette]
stops = [
  { at = 0.0, color = "#ff2bd6" },
  { at = 0.35, color = "#7a3cff" },
  { at = 0.7, color = "#22e4ff" },
  { at = 1.0, color = "#e8fbff" },
]

[params]
step_rate       = "8"
rule            = "mod(bar_index, 2)"
reseed          = "onset"
reseed_radius   = "0.3"
density         = "0.8"
trail           = "0.55"
age_tint        = "0.6"
shell_gain      = "0.8 + clamp(bass * 1.4, 0, 1.2)"
hue             = "0.1 * noise(time * 0.05)"
hue_spread      = "0.6"
ambient         = "0.75"
key             = "0.25 + clamp(bass * 0.7, 0, 0.6)"
ao              = "1"
brightness      = "1.15"
yaw             = "time * 0.12"
pitch           = "0.35 + 0.1 * sin(time * 0.07)"
distance        = "3.4"
bloom_amount    = "0.5 + clamp(onset * 0.75, 0, 0.45)"
bloom_threshold = "0.55"
bloom_radius    = "1.6 + clamp(bass * 1.0, 0, 0.85)"

[smoothing]
key          = 0.15
bloom_amount = { attack = 0.03, release = 0.35 }
bloom_radius = 0.25
shell_gain   = 0.2

[hold]
rule = "bar"
