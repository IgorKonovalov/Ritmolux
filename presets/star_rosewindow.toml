# Rose Window - the interlace successor (Plan 0075, cohort 1). The Hankin
# interlace kept at the scale it is honest at (long straight chords, no motifs)
# and multiplied by the SYMMETRY STAGE instead: kaleido_radial
# repeats the rosette as concentric shrinking rings and one winding of
# kaleido_spiral shears them into a Droste twist - an infinite stained-glass
# window, travelling slowly inward forever.
#
# THE REASON THIS FILE GAVE FOR HAVING NO MOTIFS IS RETIRED (Plan 0104 Phase 5
# sweep). It used to cite the vertex ceiling that retired the mandalas -
# backlog 0073, every motif a parametric outline sampled to straight segments,
# so a circle read as a polygon at ornament scale. Plan 0087 closed that
# 2026-08-27: `circle` and `arc` are single per-pixel arcs, `petal`, `teardrop`
# and `trefoil` are G1 arc chains, and only `diamond` and `chevron` are still
# polylines. Motifs are available to this world now and it declines them on
# taste - a bare interlace multiplied by the symmetry stage is a different
# picture from an ornamented one, and `star_zellij` (Plan 0104 Phase 4) is where
# the composite went instead.
#
# WHAT DRIVES WHAT. variant sweeps the contact angle continuously (the morph
# is engine-quantized to 0.1 degrees, so it rebuilds cleanly); kaleido_zoom is
# the endless travel, one ring every ~14 s plus a push on the bass; the stroke
# presses on the bass and ticks on the beat; treb warms the glass. The stage's
# axis stays frame-centred, so nothing here pans (kaleido folds fight pan).
system = "star_pattern"
name   = "Rose Window"

[generator]
tiling            = "12"
contact_angle_deg = 24

[palette]
stops = [
  { at = 0.0, color = "#4b6cd5" },
  { at = 0.25, color = "#00dbed" },
  { at = 0.45, color = "#e55fa8" },
  { at = 0.65, color = "#ffaf00" },
  { at = 0.85, color = "#ffec38" },
  { at = 1.0, color = "#b8f3bd" },
]

[params]
# The contact angle breathes across most of its legal sweep; bass sharpens it.
variant = "1 + sin(time * 0.09) * 0.8 + clamp(bass * 0.35, 0, 0.3)"

rotation = "0.04 * time"
scale    = "0.95"
zoom     = "1.0"

# The window multiplied: rings at 1.7, one Droste winding, endless travel.
kaleido_radial = "1.7"
kaleido_spiral = "1"
kaleido_zoom   = "time * 0.07 + clamp(bass * 0.35, 0, 0.3)"
kaleido_inner  = "0.1"

thickness  = "3.2 + clamp(bass * 1.3, 0, 1.1) + beat * 0.5"
# THE LEADING IS SOLID. Plan 0114's look gate left this world to the content
# lane rather than naming a number, and the verdict is 0.25 - the library
# default, bound explicitly because it is a judgement about this figure and
# should not move silently if the default moves again. It is the opposite case
# to the Maurer roses, which keep 1.0: those are 720 fine crossing chords where
# a falloff is what stops a crossing reading as a mat. This is a dozen BOLD
# chords at 3.2 - a 12 px stroke at 1080p - and there the old profile spent ten
# of those pixels on a gradient, which is the case the plan was opened over.
# Leading in a window is a drawn band, so it gets one.
#
# The bottom of the range was rejected on a render rather than skipped: at 0.00
# the chords read as flat tape, and the shoulder 0.25 leaves is what keeps them
# reading as glass with light behind it rather than as a sticker.
softness   = "0.25"
# TRIMMED FOR THAT STROKE. This world moved the most of the six - a solid core
# more than doubles the light its figure carries at the same bindings (17.1 to
# 35.2 per-mille linear over the lit set, at the sheet stimulus), because the
# whole gradient became coverage. Nothing clips - checked at a held beat, peak
# 163 either way, the tonemap absorbs it - so this is a level judgement and not
# a ceiling repair, and it is deliberately a TRIM and not a restoration: paying
# all of it back needs about a 60% cut, which drops the peak to 133 and draws a
# window dimmer than the one that was judged. Glow off a quarter and the level
# term off a tenth lands at 29.5, and the rings read as leaded glass again.
glow       = "0.95"
brightness = "0.88 + clamp(mid * 0.41, 0, 0.35)"

# EVERY BEAT LANDS A NEW PANE OF GLASS: the hue latches to a seeded position
# on each beat, the short trail holds the outgoing colour while the rings
# travel, and the window becomes genuinely multi-coloured - cobalt, cyan,
# ruby, flame, gold, jade succeeding each other on the pulse. Treb tips the
# current pane warmer between beats.
hue        = "hash(beat_index) * 0.9 + clamp(treb * 0.17, 0, 0.1)"
saturation = "1.0"

trails = "0.45"

bg_hue      = "0.63"
bg_bright   = "0.012"
bg_vignette = "0.85"

[smoothing]
variant    = 0.4
thickness  = { attack = 0.02, release = 0.32 }
brightness = 0.3
hue        = 0.12
trails     = 0.5
kaleido_zoom = 0.3
