# Target - concentric disc bands in hard black, white and red, punched outward
# on every kick.
# A shape_field disc whose palette is three flat zones with hard edges, so
# every band is exactly one of the three colours and a hard black contour sits
# on each band edge. A narrow color_span keeps the bands wide. They travel
# outward on a slow clock, and the bass drives the disc's scale hard with a
# near-instant attack and a short release: each kick throws the whole target
# outward and lets it fall back. The punch is capped so even a peak keeps
# several bands on screen; a larger one swells the centre into one flat disc,
# which the sanity gate convicts as a blot.
system = "shape_field"
name = "Target"

[palette]
stops = [
  { at = 0.0,   color = "#000000" },
  { at = 0.333, color = "#000000" },
  { at = 0.334, color = "#f2f2f2" },
  { at = 0.666, color = "#f2f2f2" },
  { at = 0.667, color = "#d0101a" },
  { at = 1.0,   color = "#d0101a" },
]

[params]
shape                 = "0"
scale                 = "0.12 + clamp(bass * 0.24, 0, 0.2)"
rotation              = "0"
coord_mode            = "1"
palette_steps         = "12"
palette_contour       = "1"
palette_contour_style = "1"
color_span            = "0.16"
color_center          = "-0.3 * time"

[smoothing]
scale = { attack = 0.01, release = 0.18 }
