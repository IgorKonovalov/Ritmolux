# Star Lantern - light BEHIND glass. The first preset in the set built around
# the bloom stage (Plan 0045) rather than one that merely tolerates it.
#
# WHAT THE RENDERS TAUGHT, and it is the whole design note: bloom's default
# `bloom_threshold = 1.0` selects only light that is genuinely OVER RANGE, so a
# preset with well-behaved luminance gets NOTHING from it. The first draft of
# this file held `brightness` under 1.0 the way the additive-ceiling habit
# says to, switched bloom on, and rendered pixel-for-pixel the same picture as
# with the stage off. That is not a bug - it is the threshold doing exactly
# what it says - but it inverts the old authoring rule, and it is worth stating
# plainly:
#
#   THE CEILING RULE IS NOW A CHOICE OF INSTRUMENT, NOT A LIMIT.
#   Keep the FIELD under 1.0 - that part is unchanged, and it is why the
#   backdrop and the stroke body sit where they sit. But something has to go
#   over 1.0 or bloom has no fuel, and the cheapest fuel is `glow`, which
#   multiplies the renderer's core-to-edge falloff and so drives the stroke's
#   CORE hot while leaving its width alone. Over-range core, in-range field.
#
# So `glow` rests above 2 here, which would have been a mistake before Plan
# 0045 (it used to only widen a skirt around an already-clipped core) and is
# the point of the preset now.
#
# TWELVE-FOLD at a WIDE contact angle. The sweep that chose it is why: at a low
# contact angle the rosette is a spiky sun whose points are thin enough that a
# halo just fattens them, and at 55 degrees it closes into a gear-like ring
# whose interior holds the light. Eight- and six-fold tilings were rendered and
# rejected - they read as a single star polygon, not as glass.
#
# NO SCREEN FOLD, deliberately. `kaleido_*` on a centred rosette mostly folds
# the figure onto its own symmetry, and the fold's disc coverage is under
# review (design-backlog 0037) - a preset leaning on it would need retuning
# when that lands. The geometry mirror is skipped for the reason `star_rosette`
# records: a rotationally symmetric figure mirrored about its own centre lands
# back on itself.
#
# COLOUR was picked from a rendered sweep, not from theory. The line scenes
# ignore `[palette]` and colour through their own cosine ramp, which is NOT a
# hue wheel (design-backlog 0014): measured on this figure, 0.00 is crimson,
# 0.20 violet, 0.32 blue, 0.55 mint, 0.72 chartreuse, 0.88 amber. The window
# below is bounded 0.80..0.94 - golden amber into warm orange - and the
# backdrop sits at the far side of the ramp (`bg_hue = 0.30`, indigo) so the
# light has a cold room to be warm in. Both were chosen off rendered sweeps;
# the green backdrop this started with muddied the amber and a warm one
# swallowed the halo whole.
system = "star_pattern"
name = "Star Lantern"

[generator]
tiling = "12"
contact_angle_deg = 55

[params]
# STRUCTURE CARRIES THE PEAK - three clocks, none of them luminance.
#
# The variant swap is slow (~44 s) and audio-independent. `star_rosette`
# learned this the hard way: a band term large enough to cross a variant
# boundary is not a morph, it is a flicker between two precomputed geometries.
variant = "floor(mod(time * 0.023, 3))"

# A slow turn plus a genuine wander. `noise` is one call where the older files
# sum three detuned sines (Plan 0047); it is smooth over one unit of its
# argument and seeded, so this stays reproducible.
rotation = "0.62 * time + noise(time * 0.07) * 1.4"

# THE MAIN MOTION. A rotationally symmetric ring barely moves under rotation,
# so radial draw order is the motion that actually reads - in silence as much
# as under audio. It rests near-complete and opens the ring on an onset rather
# than sweeping from nothing, so a still frame is never a broken figure.
draw_progress = "clamp(0.93 + sin(time * 0.75) * 0.07 + bar * 0.05 + clamp(onset * 1.2, 0, 0.08), 0, 1)"

# BOUNDED, and the app is what caught it. In a 1280x720 `shot` still this
# read fine, because a still samples one instant; live, the terms sum to a
# 0.35..0.89 swing - two and a half times - and the rosette walked off the
# frame on every bass peak. The halo needs margin around the figure or it
# has nowhere to fall, so the range is now 0.34..0.64.
scale = "0.40 + sin(time * 0.31) * 0.06 + bar * 0.04 + clamp(bass * 3.0, 0, 0.14)"

# LUMINANCE: the FIELD stays in range, the CORE does not.
#
# `brightness` rests ABOVE 1.0, which is the correction a filmstrip forced and
# the most important number in the file. Under `--set bass=1` a lower value
# looked fine; through the real DSP the bands read small (an eighth of what a
# hand-set loud frame claims), so the reactive term contributed almost nothing
# and the core never crossed the bloom threshold - the halo simply was not
# there in motion. The RESTING value has to carry the light; the audio terms
# only modulate it. What keeps this from being a blown frame is that the lit
# area is a thin stroke on a near-black field: the tonemap rolls the core off
# with its hue intact, and the backdrop is still 0.01.
brightness = "1.10 + clamp(mid * 1.6, 0, 0.30)"
# BOUNDED for the same reason as `scale`, and caught the same way - live, in
# the app, with music playing. At the old range this summed past 7 on a
# bass peak and the twelve points merged into a smooth doughnut: the
# rosette stopped being a rosette exactly when the music got interesting.
# 2.6..4.5 keeps the lacing legible at both ends.
thickness  = "2.60 + clamp(bass * 4.0, 0, 1.10) + clamp(treb * 3.0, 0, 0.50) + beat * 0.30"

# `glow` is the fuel. Above 1 it saturates the stroke's core instead of
# widening a skirt, which is exactly the over-range light the bright-pass is
# looking for. Rests hot, goes hotter on an onset.
glow = "2.90 + clamp(onset * 2.1, 0, 0.95) + beat * 0.20"

# Golden amber into warm orange-red, and it OSCILLATES rather than drifts.
#
# Two corrections a render caught. A `+ time * k` drift walks the ramp forever,
# so an "amber" preset is blue four minutes in - fine as a set-wide colour walk
# (`star_rosette` does it) and wrong for a preset whose whole identity is the
# colour of its light. And the first window ran 0.88 -> 0.99, which crosses the
# ramp's wrap at 1.0: `mod` takes it cleanly round to crimson rather than
# jumping, so the loud frame came out red instead of amber. This one is bounded
# 0.80..0.94 and never reaches the wrap.
hue = "0.84 + sin(time * 0.021) * 0.04 + clamp(treb * 0.3, 0, 0.06)"

# --- the bloom stage, which is what this preset is for --------------------
#
# AMOUNT is the accent, RADIUS is the build. They are independent by design -
# a wider radius spreads the same energy further instead of adding more - so
# the bar phase opens the halo across the bar without the frame brightening as
# it goes, and the onset lands as a hit of light rather than a gain change.
bloom_amount    = "0.95 + clamp(onset * 8.0, 0, 2.10) + clamp(mid * 2.0, 0, 0.55)"
# Left at the shipped default on purpose. This is the number that makes the
# preset mean something: at 1.0 only the over-range core blooms, so the halo
# tracks the light and not the figure. Drop it toward 0.5 and the whole
# rosette glows, which is prettier for one frame and mush in motion.
bloom_threshold = "1.0"
bloom_radius    = "2.15 + bar * 1.05 + clamp(treb * 5.0, 0, 0.90) + clamp(bass * 1.6, 0, 0.45)"

# --- the room the lantern hangs in ---------------------------------------
zoom        = "1.02 + bar * 0.04 + clamp(bass * 0.26, 0, 0.10)"
pan_y       = "sin(time * 0.013) * 0.035"
bg_hue      = "0.30 + sin(time * 0.008) * 0.04"
# Nearly black, with a deep vignette. The halo IS the light in this frame; a
# lifted backdrop would compete with it and flatten the whole point.
bg_bright   = "0.010 + clamp(mid * 0.05, 0, 0.008)"
bg_vignette = "0.92"

# Short. A long tail closes the ring into a solid annulus and buries the cores
# the halo is coming from.
trails = "0.42 + clamp(mid * 0.30, 0, 0.14)"

[smoothing]
rotation      = 0.20
scale         = 0.60
hue           = 0.45
thickness     = { attack = 0.02, release = 0.36 }
# Snap up, glide down - the shape of a hit. A symmetric constant would either
# soften the strike or leave the halo switching off abruptly.
glow          = { attack = 0.02, release = 0.42 }
bloom_amount  = { attack = 0.03, release = 0.50 }
# Eased slower than the amount: the radius is the slow build across the bar,
# and a fast radius reads as the halo breathing rather than opening.
bloom_radius  = 0.75
zoom          = 0.20
bg_bright     = 0.40
trails        = 0.55
