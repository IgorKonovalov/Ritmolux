# Red Paper - an eightfold rosette wallpaper in heavy black ink on red paper.
# An octagon rosette carries a boss and a ring of diamonds, and is scaled past
# its cell so the mirrored kaleido_tile grid cuts it at the cell walls and the
# neighbours join. The strokes are white and opaque, and the ink remap turns
# them into black marks on a red ground (paper_hue 0, paper_sat 0.95), with
# ink_gamma 0.25 holding them near black. Nothing rotates. On each beat the grid
# re-cuts to two, three or four cells and holds there until the next hit, the
# bass opens the Hankin angle, and an onset fattens the line.
system = "star_pattern"
name = "Red Paper"

[generator]
tiling = "octagon"
contact_angle_deg = 67.5
rings = [
  { motif = "circle",  count = 1, radius = 0.00, scale = 0.3 },
  { motif = "diamond", count = 8, radius = 0.45, scale = 0.3 },
]

[palette]
stops = [
  { at = 0.0, color = "#ffffff" },
  { at = 1.0, color = "#ffffff" },
]

[params]
variant       = "1 + clamp(bass * 1.2, 0, 1)"
rotation      = "0"
draw_progress = "1"
thickness     = "26 + clamp(onset * 16, 0, 10)"
softness      = "0"
stroke_blend  = "1"
glow          = "1.5"
scale         = "1.6"
kaleido_tile  = "2 + floor(hash(beat_index) * 3)"
ink_amount    = "1"
ink_gamma     = "0.25"
paper_hue     = "0.0"
paper_sat     = "0.95"
paper_bright  = "0.8"

[hold]
kaleido_tile = "beat"
