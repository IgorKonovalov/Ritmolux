# Droste Descent - the second of Plan 0064 Phase 6's reference looks: an endless
# zoom tunnel that travels inward forever with no reset and no crossfade.
#
# WHY IT NEVER LOOPS VISIBLY. The symmetry stage's map is periodic in `log r`,
# so offsetting the radius by exactly one period returns a BIT-IDENTICAL image.
# Phase 4 rescaled `kaleido_zoom` to periods, which means `kaleido_zoom = 1`
# advances exactly one ring at ANY `kaleido_radial`. So a term that increases
# without bound is a seamless tunnel: it passes through the identity every time
# it crosses a whole number, and nothing has to be faded or restarted.
#
# THE TEMPO LOCK, AND WHY IT IS NOT ON `bar_phase`. The plan asks for a tunnel
# "locked to the bar". The honest way to do that today is NOT `bar_phase`: the
# downbeat estimator locks about 3 % of the time on real music (backlog 0042),
# so a tunnel riding it would stall and lurch as the estimate came and went.
# `time * (tempo / 240)` advances exactly one ring per four beats using only the
# tempo scalar, which is stable. It is bar-locked in FEEL without depending on
# the estimator - and if the downbeat ever becomes reliable, this one line is
# where the upgrade goes.
#
# PHASE 6 ASKS: does this read as endless travel, or as a loop you can feel? A
# capture cannot answer it. Watch it for a full minute - the failure mode is
# recognizing the same ring arriving again, which takes longer than any
# filmstrip.
system = "fragment_field"
name = "Droste Descent"

[palette]
# Deep and cool, with one warm stop near the top so the centre of the tunnel
# glows rather than going flat. Quantized to eight bands, so these read as eight
# concentric colour zones travelling outward past the viewer.
stops = [
  { at = 0.00, color = "#01030f" },
  { at = 0.18, color = "#0a2144" },
  { at = 0.40, color = "#12557f" },
  { at = 0.60, color = "#2e9d9b" },
  { at = 0.80, color = "#8fe3c2" },
  { at = 1.00, color = "#ffe6a3" },
]

[palette_b]
name = "aurora"

[params]
# BAND MAP
#   tempo -> the travel rate (structure, and the whole point)
#   bass  -> `warp` + `palette_mix`
#   mid   -> `color_span` + `glow`
#   treb  -> `saturation`
#   onset -> `flash`
#
# Note what bass does NOT do: it does not touch `kaleido_radial`. The ring
# geometry is deliberately FIXED here. Modulating the ratio while travelling
# through it makes the tunnel appear to stretch and compress, which reads as a
# glitch rather than as depth - the opposite of the mandala, where the same term
# is the best reactive lever in the file.

# THE TUNNEL.
kaleido_zoom   = "time * (tempo / 240)"
kaleido_radial = "1.85"
# One turn of shear per revolution - the Droste twist. Integer by construction:
# a fractional winding number draws a visible seam where the map fails to close.
# The engine quantizes it CPU-side, but write an integer here anyway so the
# intent survives anyone adding a `[smoothing]` entry for it later.
kaleido_spiral = "1"
kaleido_order  = "6"
kaleido_angle  = "time * 0.04"
# Higher than the 0.06 default ON PURPOSE. This is the reference tunnel's bright
# central disc: below this radius the repeat freezes, so the hub is a clean
# radially-constant pool instead of a thousand source texels per pixel.
kaleido_inner  = "0.10"
kaleido_edge   = "2"

# COLOUR.
palette_steps   = "8"
palette_contour = "0.30"

# FIELD. Slow and smooth - the travel is the motion, and a busy source competes
# with it.
warp  = "0.42 + sin(time * 0.031) * 0.08 + clamp(bass * 0.212, 0, 0.18)"
zoom  = "1.45"
pan_x = "0"
pan_y = "0"

glow  = "0.42 + clamp(mid * 0.129, 0, 0.11)"
flash = "clamp(onset * 0.20, 0, 0.12)"

hue          = "0.58 + time * 0.009"
# The widest span of the three, and this preset needs it most: the rings are
# concentric copies of ONE source region, so without a wrapping span every ring
# quantizes to the same colour and the tunnel reads as a single-hue relief
# carving. The first draft did exactly that - one teal, banded into lightness
# steps. At 1.85 each ring lands a full colour zone apart, which is what makes
# the travel legible as travel.
color_span   = "1.85"
color_center = "0"
saturation   = "1.20 + clamp(treb * 0.217, 0, 0.13)"
palette_mix  = "clamp(bass * 0.412, 0, 0.35)"

bloom_amount = "0.15"
# Trails OFF. Feedback accumulation smears a travelling image into a comet, and
# this look depends on each ring staying a hard-edged copy of the last.
trails       = "0"

[smoothing]
# `kaleido_zoom` is deliberately ABSENT. It is a monotonically increasing term,
# and low-passing a ramp only delays it - but it would also make the rate lag
# behind a tempo change, which is the one thing that could break the lock.
warp        = 0.40
glow        = 0.30
flash       = { attack = 0.08, release = 0.60 }
color_span  = 0.40
saturation  = 0.35
palette_mix = 0.80
