# Barnsley's fern - the engine's first iterated function system (ADR-0075,
# Plan 0062). The same GPU chaos game the strange attractors run, with a
# different step: four affine maps, one drawn at random per particle per step,
# converging onto a figure rather than onto a filigree.
#
# WHAT IS DIFFERENT ABOUT AUTHORING THIS FAMILY. The `a` `b` `c` `d`
# coefficients that steer De Jong and Clifford are INERT here - an IFS's shape
# lives in its affine table, not in four scalars. What reaches the figure is
# `morph`, `curl`, `vigor`, `lean` and `bias`; see the [particles] section of
# presets/README.md for the full roster and for `vigor`'s silent ceiling.
#
# THIS PRESET DOES NOT MORPH, AND THAT IS A MEASURED DECISION (Plan 0062
# Phase 7). It shipped with `morph_to = "spiral"` and a cross bound to bass, on
# the assumption that a small `morph` would give the plant some life without
# taking it anywhere. Rendering says otherwise: `morph` is a TRAVEL knob, not a
# little-life knob, and its visible rate of change is steepest near zero.
# Measured on fern -> dragon at a neutral frame, the lit width of the figure:
#
#   morph 0.00   0.248        morph 0.10   0.572
#   morph 0.05   0.448        morph 0.15   0.584
#
# By 0.05 the fern is half again as wide and already reads as a curl. The reason
# is in the tables: the dragon's two maps are 0.707 * R(45 deg) and R(135 deg)
# against the fern's near-zero rotations, and a few degrees of per-map rotation
# compounds through the recursion into a large change of figure. A cross that
# stays recognisably a fern would have to live under about 0.03, which is not a
# lever - it is a rounding error.
#
# So the fern's life comes from THE FOUR LEVERS instead, which is exactly what
# they are for: they change the figure without leaving it. `attractor_dissolve`
# is the preset that travels, and there the travel is the whole point.
#
# THE FIGURE IS FRAGILE IN ONE DIRECTION ONLY. It cannot diverge - the family is
# built so a preset cannot reach a non-contractive table (ADR-0075) - but it CAN
# be washed out, because a fern is mostly empty space and the trail field
# accumulates. So `fade` and `size` sit low and FALL as the track hits, the same
# inversion the De Jong preset shipped: peak buys structure, not brightness.
system = "attractor"
name = "Barnsley Fern"

[particles]
family = "fern"

[palette]
stops = [
  { at = 0.00, color = "#1c4f38" },
  { at = 0.30, color = "#40a273" },
  { at = 0.62, color = "#97e093" },
  { at = 0.85, color = "#e5f5ad" },
  { at = 1.00, color = "#fffae3" },
]

[palette_b]
name = "ember"

[params]
# GLOW - the fronds are thin, so the figure is authored under the tonemap knee
# and only the stem and the densest leaflet crossings bloom.
bloom_amount    = "1.2"
bloom_threshold = "0.92"
bloom_radius    = "1.1"


# THE FOUR SHAPE LEVERS - this preset's whole shape surface, and what separates
# them from the coefficient knobs on a strange attractor: none of them can break
# the figure. The family is parameterized so a preset cannot reach a
# non-contractive table, which is why these can be driven hard without the
# reluctance `a`..`d` need on De Jong.
#
# ONE BAND, ONE STRUCTURAL JOB, and that is not fussiness. The first draft put
# bass on `vigor`, `lean`, `zoom` AND `hue_center` at once; each term was
# individually modest and correctly gained, and a loud passage still turned the
# plant into a soft green mass, because structural terms driven by one band
# compound. The four map families cannot produce this failure - their only shape
# knobs are `a`..`d`, bounded coefficients of a map that stays bounded whatever
# they do. An IFS has levers with real structural authority, so the
# additive-ceiling rule this library applies to LUMINANCE applies to STRUCTURE
# here too:
#   bass -> vigor   (the surge, and the loudest lever in the set)
#   mid  -> curl    (the fronds)
#   treb -> bias    (the breath)
#   time -> lean    (the wind; no band touches it)
#
# vigor - by far the loudest of the four, and MEASURED: a 0.11 swing takes the
# lit area of the frame from 0.112 to 0.297 and the lit width from 0.25 to 0.49.
# The framing is fitted at NEUTRAL levers on purpose (ADR-0075), so this
# genuinely swells the plant rather than being re-framed back to nothing.
#
# MOSTLY A TRANSIENT, WHICH IS THE OPPOSITE OF THE OBVIOUS TUNING. The ceiling
# is 0.97 against the fern's own 0.851, so a preset has ~17% of headroom, and
# the tempting move is to spend all of it on a band at the house gain. Rendered
# against a sustained loud passage that is wrong: at a steady 1.09 the leaflets
# fuse and the fern becomes a soft mass filling the frame - the lever has enough
# authority that a SUSTAINED level saturates the figure the way a sustained
# luminance term saturates the accumulation. The 0.97 clamp is not too tight;
# the honest finding is that it is too loose to drive hard from a band scalar.
#
# THE SPLIT IS THE POINT, and the first pass got it wrong in BOTH directions.
# It shipped at cap 0.075 (fused on loud passages), was cut to 0.030 - and
# watched live against real music that was too timid, the plant barely answering
# the bass at all. The cap is now 0.050: at a typical bass of 0.66 the sustained
# value is ~1.048, well clear of the fusing point, and a beat still takes it to
# ~1.095 for as long as a beat lasts. Sustained swell and transient surge want
# different budgets, and this lever needs both.
vigor = "1.00 + clamp(bass * 0.059, 0, 0.050) + beat * 0.045"
# curl - the fronds curl and uncurl.
#
# THE PERIODS ON ALL THREE TIME-DRIVEN LEVERS ARE ~30 s, NOT THE ~200-400 s THE
# REST OF THIS LIBRARY USES, and that is the second lesson of Phase 7. Those
# slow drifts are right for a strange attractor because the ATTRACTOR is already
# churning - the drift only keeps it from repeating. An IFS figure is STILL: a
# fern at fixed levers is a photograph. Everything a viewer sees moving here is
# a lever moving, so the levers have to move at a rate a viewer can see. At the
# inherited 200 s periods this preset measured `anim` 0.018 against a 0.01 gate
# floor - technically alive, visually a still image.
curl  = "sin(time * 0.19) * 0.11 + clamp(mid * 0.10, 0, 0.085)"
# lean - the plant bends. Slow and wide, so it reads as wind rather than as a
# parameter moving.
#
# THE SECOND BASS TERM, AND IT IS SAFE TO STACK WITH `vigor` WHERE THE FIRST
# DRAFT'S WERE NOT. The rule above is about compounding terms that all make the
# figure BIGGER; `lean` rotates the translation vectors, so it bends the plant
# without changing its extent at all. Bass therefore gets two orthogonal
# answers - the plant swells AND sways - which is far more legible than pushing
# one of them harder, and neither can fuse the leaflets. Watched live, this is
# what "moves to the bass" actually reads as: a gust, not a zoom.
lean  = "sin(time * 0.23) * 0.20 + clamp(bass * 0.165, 0, 0.14)"
# bias - the plant BREATHES. Measured (Plan 0062 Phase 7): the silhouette and
# the bounding box do not move at all, and the texture goes from fused-solid at
# -0.2 to open-and-feathery at +0.6 - the leaflets separate and you can see
# through the frond. It is the only lever in the set that changes the figure
# without moving it, which is exactly why it reads as breath rather than motion.
# GAIN CORRECTED AT PHASE 7: this read `treb * 0.30` against a 0.26 cap, which
# needs treb = 0.87 to reach the ceiling. Real-music treb means 0.22 and this
# preset measured a treb reactivity column of 0.009 - the term was very nearly a
# constant. 0.43 puts a typical passage near half the cap (house rule C/0.60).
bias  = "0.10 + sin(time * 0.31) * 0.26 + clamp(treb * 0.43, 0, 0.26)"

# DENSITY - low base, falling on energy. A fern's leaflets are separated by
# roughly a point-width at this scale; raising `size` on a peak fuses them into
# a green blob, which is the one way this figure reads as a mistake.
fade = "0.86 - clamp(bass * 0.075, 0, 0.06) - beat * 0.025"
size = "0.40 - clamp((bass + mid) * 0.070, 0, 0.11) + beat * 0.05"
# A beat shakes the plant and it heals: the reseed kick is re-contracted at
# 0.742 per step, so the disturbance is gone in ~10 steps (0.17 s). That is a
# designed response rather than a tuned one - see ADR-0075.
reseed = "onset > 0.30"

# COLOUR - a narrow green band that warms toward the ember palette as the top
# end opens, so the plant reads as lit rather than as tinted. `palette_mix`
# carried the same dead-gain problem as `bias` and is corrected the same way.
#
# `map_tint` SEPARATES THE PLANT INTO ITS PARTS, and `hue_spread` had to come
# down to let it (Plan 0073 Phase 6). Both write the SAME palette coordinate -
# one per sub-copy of the figure, one per particle at random - so at the old
# 0.16..0.42 spread the parts smeared into each other and `map_tint` read as a
# faint wash at any setting. Rendered against each other, 0.05..0.125 is where
# the stem, the body and the two fronds separate: the branch maps land lighter
# up the green ramp, which is where new growth sits on a real plant. The per-
# particle grain `hue_spread` used to supply is what pays for it, and that is
# the right trade on a figure whose PARTS are its structure.
#
# `root_hue` GIVES THE PLANT DEPTH, AND IT TAKES THE HUE ROUTE BECAUSE THE
# PALETTE COORDINATE IS ALREADY SPENT (Plan 0074 Phase 6). The channel is how
# far a point is from the nearest of the four maps' fixed points - the stem base
# and the frond origins - so it is the one thing on this figure that reads as
# depth INTO the plant rather than as a part of it. Both routes were rendered
# against each other and the result was not close:
#
#   root_tint 0.85 with map_tint cut 0.46 -> 0.22 (the budget split): the plant
#     goes one flat yellow-green mass. The tint route is ANCHORED - it only ever
#     pushes UP the ramp - so it spends the green end of the palette to buy the
#     gradient, and the parts `map_tint` was separating stop separating.
#   root_hue 0.21 with map_tint LEFT AT 0.46: the body cools to jade while the
#     frond origins stay warm, and the map separation is untouched. It costs the
#     palette coordinate nothing, which is the whole point of the second route.
#
# THE DIRECTION IS NOT ARBITRARY. Rotating the other way (-0.20, -0.35) warms
# the far parts, which collides with the ramp's own warm end - the palette
# already goes green -> cream with brightness, so a warm rotation is a second
# vote for a change the ramp is making anyway and it just washes. Cooling is
# orthogonal to the ramp, so it reads as aerial perspective: near is warm and
# lit, far is cool. Above about 0.30 the plant stops being green and starts
# being a slate-blue object, which is a different preset.
#
# NO BAND DRIVES IT, DELIBERATELY. `mid` already moves three colour terms here
# and `treb` two more; a depth cue that flickers with the music reads as the
# figure changing shape rather than as depth. It drifts slowly instead, at a
# period decorrelated from `hue_center`'s so the two do not beat together.
hue_spread  = "0.05 + clamp(mid * 0.09, 0, 0.075)"
map_tint    = "0.46 + clamp(mid * 0.14, 0, 0.12)"
root_hue    = "0.21 + sin(time * 0.047) * 0.05"
hue_center  = "0.30 + sin(time * 0.085) * 0.10 + clamp(mid * 0.165, 0, 0.14)"
saturation  = "1.15 + clamp(treb * 0.50, 0, 0.30)"
palette_mix = "0.10 + sin(time * 0.023) * 0.10 + clamp(treb * 0.37, 0, 0.22)"

# VIEW - a slow breathing push-in and a lazy sway. The fern is upright and
# static in a way a strange attractor is not, so the view is what keeps it from
# reading as a still image between beats.
#
# FRAMING: the base under 1 is the documented recourse, not taste (ADR-0103).
# The engine's fit frames an axis-aligned box and the projection then rotates
# it, so nothing guarantees the frame once the figure turns. This is the one
# shipped figure that satisfies the rotated bound - 0.49 wide-to-tall against
# a bound of 0.54 - and it has almost no room, while this binding peaks at
# 1.08 and `vigor` surges the figure on top of that. Do not raise the base.
zoom  = "0.96 + bar * 0.05 + clamp(bass * 0.082, 0, 0.070)"
pan_x = "sin(time * 0.13) * 0.05"
pan_y = "cos(time * 0.101) * 0.04"
# The in-plane spin reaches the 2-D families too (ADR-0076), and a fern that
# rocks a couple of degrees either side of upright reads as wind. Held well
# under a full turn: this plant is meant to sway, not to tumble.
spin = "sin(time * 0.11) * 0.30"

# COMPOSITE - a dim forest-floor atmosphere under the figure.
bg_hue      = "0.36 + sin(time * 0.019) * 0.04"
bg_bright   = "0.010 + clamp(mid * 0.026, 0, 0.022)"
bg_vignette = "0.85"

[smoothing]
# The morph is eased hard. It is the most structural thing a preset can move,
# and a step in it re-forms the whole figure at once.
# The shape levers, eased in proportion to how structural each one is. `vigor`
# is left the quickest of the four so a beat still lands as a surge.
vigor       = { attack = 0.03, release = 0.28 }
curl        = 0.45
lean        = 0.60
bias        = 0.30
fade        = 0.18
size        = { attack = 0.02, release = 0.24 }
zoom        = 0.14
spin        = 0.30
hue_center  = 0.35
# Eased like the other colour terms: `map_tint` sets how far apart the plant's
# parts sit, and a step in it re-colours three regions at once.
map_tint    = 0.40
# `root_hue` only drifts, so this is belt and braces rather than load-bearing -
# but it is the term that decides how deep the plant looks, and easing it keeps
# a preset switch from arriving mid-rotation with a jade plant.
root_hue    = 0.45
palette_mix = 0.5
bg_bright   = 0.4
