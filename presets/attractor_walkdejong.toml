# A measured walk between two roster entries (ADR-0093), bound to a slow cycle.
#
# Judged at Plan 0079 Phase 6 and kept.
#
# Two figures that already rhyme. The discrete maps are the harder case - four
# of the twenty swept pairs have no walk at all, because a tuple partway between
# two others can collapse to a fixed point - so this pair is one that survived.
#
# `morph` runs a full round trip in about 48 s. That is deliberate: the walk is
# continuous where `tuple` cuts, and the whole point is that it is gradual.
#
# THE RETURN LEG IS WHY THIS PRESET HAS A `reseed` AND THE OTHER THREE WALKS DO
# NOT. De Jong is a discrete map on position alone, so two particles at the same
# point are the same particle forever. The middle of this pair contracts hard
# (measured: healthy at morph 0.07, breaking up by 0.22, down to about a dozen
# distinct points by 0.42), and once the cloud has collapsed, walking the
# coefficients back to a chaotic tuple does NOT bring it back - the survivors
# are bit-identical, so they re-diverge into nothing. Only the reseed's
# per-particle kick re-injects the diversity the contraction destroyed.
#
# The forward-only curation sweep could not see this: `scripts/tuple-paths.mjs`
# ramps `morph` up to a cell's position and holds, so no cell ever renders the
# way back, and it traverses 5x faster than this binding does - less dwell in
# the contracting middle. The three flow-family walks (Thomas, Knot, Rho) were
# re-checked over a 100 s round trip and stay populated throughout; they need
# nothing. This is a De Jong problem, not a walk problem.
system = "attractor"
name = "De Jong Walk"

[particles]
family = "de_jong"
density = 0.4
tuple_from = 1
tuple_to = 3

[palette]
name = "spectrum"

[params]
morph = "clamp(0.5 - 0.5 * cos(time * 0.13) + clamp(bass * 0.10, 0, 0.08), 0, 1)"

# Recovery, not decoration - see the header. The `beat_index` clause is the
# load-bearing half: an onset gate alone would leave quiet material with no way
# back at all, and the collapse this repairs is permanent. Every 16 beats is
# ~8 s at 120 BPM, well inside one 48 s round trip.
reseed = "max(onset > 0.45, min(beat, mod(beat_index, 16) == 0))"

brightness = "1.4"
fade = "0.86 - clamp(bass * 0.04, 0, 0.04)"
size = "0.22 + clamp(treb * 0.08, 0, 0.06) + beat * 0.05"

bloom_amount = "0.30 + beat * 0.25 + clamp(bass * 0.18, 0, 0.14)"
bloom_threshold = "1.4"
bloom_radius = "1.5"

bg_bright = "0.10 + clamp(bass * 0.05, 0, 0.04)"
bg_hue = "0.10"
bg_hue_span = "0.14"
bg_angle = "0"
bg_shade = "1.0"
bg_shade_end = "0.22"
bg_ramp_gamma = "1.7"
bg_vignette = "0.38"

spin = "0.25"
perspective = "0.20"
depth_fade = "0.45 + clamp(mid * 0.15, 0, 0.15)"
saturation = "0.9"
hue_spread = "0.18"
hue_center = "0.35"
zoom = "1.0 + bar * 0.04"

[smoothing]
# NOT on `morph`: the binding is already a slow cosine, and easing an ease only
# lags it. The walk's smoothness is the mechanism's, not a smoothing curve's.
size = { attack = 0.03, release = 0.32 }
bloom_amount = { attack = 0.04, release = 0.40 }
depth_fade = 1.0
