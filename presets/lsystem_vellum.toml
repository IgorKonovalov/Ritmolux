# Vellum - recursive line-art drawn in ink on cream paper (Plan 0075, cohort 1).
# The roadmap's "recursive subdivision line art on paper" reference, authored
# fresh-slate: a Gosper meander (a space-filling curve whose turns read as a
# woven Greek key) rendered through the terminal ink remap, so the figure is a
# DRAWING - sepia ink on warm paper - not a glow.
#
# WHAT DRIVES WHAT. The figure deepens one whole iteration on a loud passage
# (visible_depth steps 3 -> 4 at bass ~0.85, a fraction only a real peak
# reaches), the stroke leans into the bass and ticks on the beat, and the whole
# sheet sways and breathes slowly so silence still reads as a living page. In
# ink mode the palette shapes LUMINANCE only, so the dark-to-light ramp under
# hue_spread shades the strokes by generation depth: construction-pale where
# the curve is old, fully inked at the growing edge.
#
# SEGMENT BUDGET: the Gosper rewrite is 7x per iteration, so max_depth 4 is
# 7^4 = 2401 drawn segments of the floor tier's 20 000 - deep enough to read
# as engraving, an order under the silent-truncation cap.
system = "lsystem"
name   = "Vellum"

[generator]
axiom     = "F"
rules     = { F = "F-G--G+F++FF+G-", G = "+F-GG--G-F++F+G" }
angle_deg = 60
max_depth = 4

[palette]
stops = [
  { at = 0.0, color = "#716556" },
  { at = 0.45, color = "#ad9f8d" },
  { at = 0.75, color = "#d4c7b8" },
  { at = 1.0, color = "#f5efe5" },
]

[params]
# One whole iteration of growth, bought only by a genuine peak.
visible_depth = "3 + floor(clamp(bass * 1.6, 0, 1.35))"

# The page turns almost imperceptibly and the pen never quite rests: the last
# stretch of the curve draws and undraws continuously, so the growing edge is
# always alive even in silence.
rotation      = "0.02 * time + sin(time * 0.21) * 0.085"
zoom          = "1.05 + sin(time * 0.13) * 0.05"
scale         = "1.15"
draw_progress = "0.93 + sin(time * 0.4) * 0.07"

# The pen: a gilder's nib. Not heavier - at 3.0 the meander's strokes touched
# and the figure filled to a solid gold slab (rendered and rejected); the gold
# reads as gold only while the parchment shows between the strokes.
# THE STROKE IS DRAWN, NOT AIRBRUSHED, and on an ink world that is the whole
# difference. Plan 0114's look gate named 0.25 for this file - the library
# default, bound explicitly here because it is a judgement about this figure
# and should not move silently if the default ever does again. In ink mode the
# palette shapes LUMINANCE only, so the stroke's cross-section is literally how
# much of the nib's width lands as ink: the old falloff put full ink on a
# thread and construction-grey either side of it, which reads as an embossed or
# airbrushed line. A solid core with a one-pixel edge reads as a pen.
softness   = "0.25"
# NARROWED FOR THAT STROKE, and thickness is the right lever rather than the
# obvious one. A solid core inks its whole footprint, so the same 2.0 nib drew
# a visibly FATTER line than the one this file was tuned to - measured, the
# inked area went 8.59% of frame to 10.36%. That walks toward the failure the
# comment above records, the meander filling to a solid gold slab, and the
# parchment showing between the strokes is the whole look.
#
# `exposure` is the lever the retune brief expected to need here and it is the
# wrong one, which is worth writing down: exposure sits UPSTREAM of the ink
# remap, so trimming it slides the stroke's edge back down into construction-
# grey - it un-crisps the line instead of narrowing it, and measured it barely
# touched the inked area at all (10.31% for a 16% cut). 1.65 puts the drawn
# line back at 8.49%, which is the width the figure was judged at, now drawn
# solid. `exposure` further down the file is untouched.
thickness  = "1.65 + clamp(bass * 0.78, 0, 0.66) + beat * 0.25"
glow       = "1.1"
brightness = "1.1 + clamp(mid * 0.47, 0, 0.4)"

# The ink lever (presets/README.md): exposure sits UPSTREAM of the remap, so
# it is what pushes a hairline stroke's mid luminance down the ramp into real
# ink instead of construction-grey (at exposure 1.0 this file's first draft
# read pale). Bound to the bass, it is also the page's LEVEL response: the
# whole drawing presses darker with the low end, which a hairline figure on
# paper needs - thickness alone moves too few pixels to read as reactive.
exposure = "2.2 + clamp(bass * 1.06, 0, 0.9)"

# Generation shading through the luminance ramp (see header).
hue        = "0.2 + sin(time * 0.05) * 0.1"
hue_spread = "0.75"
saturation = "0.9"

# The drawing surface, GOLD ON MIDNIGHT: the poles are deliberately swapped -
# near-black indigo parchment, luminous gold ink - which the ink stage's own
# docs say works exactly here, on a line figure whose pixels sit near 0 and 1
# (a continuous field would land mid-ramp and grey out; a stroke on black
# does not). The page still breathes with the low end: bass lifts the
# parchment from near-black toward deep violet, candlelight from below.
# The poles are LINEAR values encoded to sRGB on the way out, so a "dark"
# paper needs a far smaller number than the display value suggests: 0.07
# rendered as a mid violet (measured), 0.015 is the true near-black.
ink_amount   = "1"
paper_hue    = "0.68"
paper_sat    = "0.65"
paper_bright = "0.015 + clamp(bass * 0.024, 0, 0.02)"
ink_hue      = "0.115"
ink_sat      = "0.88"
ink_bright   = "0.98"

[smoothing]
# 0.15, not slower: the scene floors the eased value to pick an iteration, so
# a long ease parks the param below the flip for its whole travel and the
# growth gesture never lands (the eased-through-invalid-values trap). At 0.15
# the flip arrives ~0.1 s after a sustained peak and short transients still
# do not flicker it.
visible_depth = 0.15
thickness     = { attack = 0.03, release = 0.35 }
brightness    = 0.3
rotation      = 0.3
zoom          = 0.25
exposure      = { attack = 0.05, release = 0.4 }
paper_bright  = { attack = 0.04, release = 0.5 }
