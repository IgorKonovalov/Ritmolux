# Etching — Gray-Scott stripes as an engraver's plate, sepia line on cream
# (cohort 3, Plan 0075). Fresh slate (ADR-0089). F 0.0420 / K 0.0600 sits in the
# stripe-loop band no coral occupied; contour and heavy hatch turn the field into
# burin lines. The family's first dark-on-light world.
#
# THE DUOTONE IS PAINTED IN THE PALETTE, NOT THE INK STAGE, AND THAT IS A MEASURED
# DECISION (2026-08-10): under ink_amount = 1 this field printed faint grey, and
# glow 0.65 / 0.5 / 0.15 rendered pixel-identical — two causes compound: RD's
# `glow` is a weak additive halo (col * v * glow * 0.22 in the shader), not a
# level, and the ink remap gives a mid-contrast field no contrast lever of its
# own (filed as engine feedback). A dark-low palette over a cream backdrop
# prints the same structure bold, so the duotone lives here instead.
# Drives: bass presses the plate (regime + rate), mid tilts the stripe spacing,
# treble quivers the hatching, a strong onset bites a fresh figure into the plate.
system = "reaction_diffusion"
name = "Etching"
representative = true

[palette]
# INVERTED TO SCRATCHBOARD (user verdict 2026-08-11): bright line work on black,
# not dark ink on cream — same burin structure, lit like gold-leaf sgraffito.
stops = [
  { at = 0.00, color = "#ffeeb8" },  # bright gold — the cut line glows
  { at = 0.35, color = "#e5be71" },  # amber
  { at = 0.60, color = "#a07d47" },  # dark bronze falloff
  { at = 1.00, color = "#2e2216" },  # black — the plate's mass vanishes into the dark
]

[params]
feed = "0.0420 + noise(time * 0.1) * 0.0022 + clamp(bass * 1.18, 0, 1) * 0.0016"
kill = "0.0600 + noise(time * 0.08 + 30) * 0.0008 + clamp(mid * 1.18, 0, 1) * 0.0006"
flow = "1.6 + clamp(bass * 0.83, 0, 0.7)"
inject = "max((onset > 0.6) * (bar < 0.25), noise(time * 1.6 + 40) > 0.58)"
glow = "0.85"
contour = "12 + (onset > 0.6) * 2"           # deep banding; a hit double-strikes the line work
hatch = "10 + clamp(treb * 3.3, 0, 2)"
zoom = "1.05"
color_span = "2.3"                  # RD's field tops out near 0.4 — span 2+ reaches the cream end
saturation = "1.1 + clamp(mid * 0.29, 0, 0.25)"   # the gold burns; mid heats it further
bg_hue = "0.11"
bg_bright = "0.0"                   # black ground — the line work carries all the light
bg_vignette = "0"

[smoothing]
flow = 0.25
hatch = 0.2
contour = { attack = 0.05, release = 0.45 }
bg_bright = 0.2
