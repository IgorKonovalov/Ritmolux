# Burst - explosive and punctuated: mostly a quiet mid-speed swarm that DETONATES on
# every beat - a huge radial blast plus an onset kick - and the particles swell as
# they fly. Between beats it re-gathers. The most percussive swarm.
#
# Colour (Plan 0020): the shared "ember" palette with a hue_spread that fans the
# particles across red->orange->gold, so a blast reads as a coherent burst of embers
# instead of full-wheel confetti (the old `hue` was a no-op). onset/beat lift
# hue_center toward the hot gold end, so a detonation flares brighter.
system = "swarm"
name = "Burst"

[palette]
name = "ember"

[params]
force      = "1.3 + clamp(bass * 18, 0, 4)"
spin       = "0.4 + clamp(mid * 6, 0, 1.2)"
burst      = "beat * 10 + clamp(onset * 5, 0, 5)"
brightness = "0.65 + clamp((bass + treb) * 5, 0, 1.0)"
size       = "1.6 + beat * 1.3"
hue_spread = "0.5"
hue_center = "0.55 + clamp(onset * 2, 0, 0.18) + beat * 0.08"
saturation = "1.05"
