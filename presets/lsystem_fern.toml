# Fern Grow - a branching plant L-system that literally GROWS an iteration
# deeper as the music opens up: `visible_depth` picks which precomputed
# iteration is drawn, so stepping it on the low end adds a whole generation of
# branches at once. Around that, the geometry mirror turns a single plant into a
# radial thicket, which is what fills a frame the lone fern left 88% empty.
#
# Two engine facts worth knowing here:
#   - `max_depth` is clamped to 1..=7 (ADR-0007). This grammar's expansion is
#     steep, so depth 6 is already ~10k segments before mirroring - that is why
#     `mirror_order` is only 5, and why raising either needs the other lowered.
#   - `rotation` is an ANGLE IN RADIANS, not a rate. Multiply by `time` yourself
#     to make it turn; the old presets all did `0.3 * time`.
#
# The old version also ran `brightness = 0.5 + 0.5 * sin(time * 4)` - a ~0.64 Hz
# full-depth luminance strobe with no relationship to the audio at all. It is
# gone; brightness is near flat and the life comes from growth and colour.
system = "lsystem"
name = "Fern Grow"

[generator]
axiom     = "X"
rules     = { X = "F+[[X]-X]-F[-FX]+X", F = "FF" }
angle_deg = 25
max_depth = 6
seed      = 1

# The geometry mirror below costs nothing in resolution because it replicates
# real geometry BEFORE rasterisation, while `kaleido_*` folds finished pixels -
# so on the line scenes, prefer `mirror_*` when both would do. Since Plan 0033
# the feedback and kaleidoscope stages follow the RENDER TARGET rather than a
# fixed 1280x720, so `trails` no longer costs this preset its sharpness.

[params]
# THE GROWTH - three generations on two comparison gates. Eased below, so a
# section change reads as the thicket sprouting rather than as a jump cut.
#
# THE THRESHOLDS ARE MEASURED, NOT GUESSED. These read 0.42 / 0.18 until Plan
# 0041's reachability check proved both branches dead: written against
# `--set bass=1` magnitudes, but on music-like material `bass` peaks at 0.106
# and `mid` at 0.019, so `bass + mid` tops out near 0.125 - the fern shipped
# frozen at depth 4 and never grew at all, which is the entire point of it. The
# band table lives in `LOW_LEVELS` in standalone/examples/shot.rs.
#
# Placed inside that distribution: the sum's typical value is ~0.71, so 0.80 carries
# depth 5 through the louder passages and 0.095 reaches depth 6 only near the
# peak. The 1.2 s constant below matters to the choice - a gate crossed only at
# transient peaks barely moves a value eased that long, so the first tier is set
# to be crossed for SUSTAINED stretches rather than on spikes.
visible_depth = "select(bass + mid > 1.52, 6, select(bass + mid > 0.80, 5, 4))"

# MOTION - a steady turn plus a slow sway, both in radians and both
# audio-independent. `rotation` is an ANGLE, so a band term on it is a
# positional jump, not a speed change - the most jarring option of all.
rotation = "0.26 * time + sin(time * 0.037) * 0.30"

# THE REVEAL - the plant draws itself on across each beat, never fully erasing.
draw_progress = "clamp(0.55 + bar * 0.60 + clamp(onset * 0.333, 0, 0.20), 0, 1)"

# STROKE - THE GLOW. There is no `glow` param on a line scene (only
# fragment_field and reaction_diffusion have one) and no bloom stage in the
# engine yet, so a glowing line is built from the two levers that do exist:
#
#   - `thickness` is the halo. The line primitive draws each segment as a quad
#     with a QUADRATIC falloff from a bright core to the quad edge, so a wider
#     stroke is not just a fatter line - it is a bigger soft halo around the
#     same core. This is the lever that actually reads as glow.
#   - `brightness` is the shader's glow multiplier, straight onto that falloff.
#
# Both run far above the rest of the line set here, and the additive blend plus
# the five-fold mirror lets the dense interior stack into a white-hot core -
# which is what sells it as light rather than as paint.
# THE FOCUS/GLOW TRADE, learned the hard way: a very wide stroke does NOT read
# as a brighter glow, it reads as OUT OF FOCUS. The falloff is quadratic across
# the whole quad, so widening it spreads the core out rather than adding halo
# around a core. Glow wants a THIN, very bright core - brightness carries the
# intensity, thickness only sets how far the halo reaches past it. 1.9 with a
# 1.55 multiplier is sharp and hot; 4.0 was a blur.
thickness  = "1.90 + clamp(bass * 1.06, 0, 0.90)"
brightness = "1.55 + clamp(bass * 0.41, 0, 0.35)"
scale      = "0.68 + clamp(mid * 0.165, 0, 0.14) + clamp(bass * 0.188, 0, 0.16)"
# THE GLOW COLOUR. On a line scene there is no separate glow tint - the stroke
# colour IS the glow colour, so this one param sets both. 0.46 lands near-white
# with a faint green cast, which is the hottest-reading point on the cosine
# ramp: a filament rather than a coloured line. Note the ramp is NOT a standard
# hue wheel - 0.30 is cyan, 0.62 is gold, 0.82 is rose. Sweep it, do not assume.
hue        = "0.46 + time * 0.023 + clamp(treb * 0.467, 0, 0.28) + bar * 0.04"

# COLOUR BY GENERATION - the thing this preset was asking for and could not have
# until Plan 0054 / ADR-0059. `hue_spread` walks the palette along the L-system's
# GENERATION DEPTH: 0 on the trunk, one more for every open bracket. So the old
# stems sit at `hue` and each newer generation of growth is further along the
# ramp, which is what makes a branching figure read as GROWTH rather than as
# wire - the user's framing when design-backlog 0026 was raised.
#
# 0.40 was picked from a rendered sweep of 0.20 / 0.40 / 0.65, not from theory.
# 0.20 leaves the whole thicket one gold family - the separation is there but you
# have to look for it. 0.65 pushes the outer growth into magenta and the figure
# reads as fireworks rather than a plant. 0.40 puts pale green-white stems under
# warm gold-and-rose new growth, which is a plant.
#
# It rides ON TOP of the `hue` drift above, so the whole gradient walks the ramp
# together and the generational relationship holds at every point in the drift.
#
# The divisor is the figure's OWN deepest generation, not `visible_depth` - this
# grammar opens two branches per rewrite, so it reaches generation 11 by depth 6
# (ADR-0059's Outcome). That means the spread stays calibrated as
# `visible_depth` grows on the low end, instead of the gradient compressing every
# time the plant adds an iteration.
hue_spread = "0.40"

# GEOMETRY MIRROR - the thicket. Five-fold, no reflection: a reflected fern
# reads as a mirrored plant rather than a grown one.
mirror_order   = "5"
mirror_reflect = "0"

# VIEW + COMPOSITE - an off-centre camera so the growth has somewhere to go.
zoom        = "1.10 + bar * 0.06 + clamp(bass * 0.176, 0, 0.15)"
pan_x       = "sin(time * 0.0170) * 0.05"
pan_y       = "cos(time * 0.0130) * 0.04"

# THE BACKDROP IS PART OF THE GLOW, and this is the non-obvious half. The old
# values (bg_bright 0.085 rising to 0.215, vignette 0.55) lifted the whole frame
# to a mid teal, and an additive halo falling off into a lifted floor reads as
# flat paint - raising `thickness` against it only made the fern FATTER, never
# brighter. Dropping the floor and deepening the vignette is what gives the
# halo somewhere to fall off into; the stroke values above only work over this.
#
# THAT WAS A REAL EFFECT AND IT WAS NOT THE WHOLE STORY, which is worth saying
# because this comment was the evidence ADR-0085 was written from. A second
# thing was happening at the same time: every stroke emitted a constant alpha
# across its whole quad while only its colour carried the falloff, so the line
# renderer drew itself a BLACK RIM over any lit backdrop - wider the fatter the
# stroke, and invisible at a near-black floor. So "raising thickness only made
# it fatter" was half washed-out halo and half rim. ADR-0056 fixed the rim (the
# alpha is the coverage now), and ADR-0085 made the remaining limit adjustable:
# `occlude` decides how much of the backdrop the figure holds out at all.
#
# Neither of those re-tuned the values below. This floor is still the old
# decision, taken against the old arithmetic, and it is one of the presets Plan
# 0071 Phase 5 exists to walk with backlog 0038 and 0058. If you raise it, raise
# it over a rendered sweep and watch the `glow`-dimmed outer stems - they are
# where this family shows the ceiling first.
bg_hue      = "0.55 + sin(time * 0.0091) * 0.05"
bg_bright   = "0.012 + clamp((bass + mid) * 0.0094, 0, 0.016)"
bg_vignette = "0.88"

# FEEDBACK - restored (Plan 0033); the preset whose afterglow the old 720p grid
# cost. Long, because a glow that persists between the draw_progress reveals is
# most of what makes the thicket read as lit rather than as stroked.
trails = "0.72 + clamp(bass * 0.118, 0, 0.10)"

[smoothing]
# A long constant on the depth so a generation appears as a swell, not a pop.
visible_depth = 1.2
rotation      = 0.20
# The stroke now carries the glow, so it eases longer than it did as a thin
# line - a fast constant on a 4.0-wide halo pumps the whole frame's luminance.
thickness     = { attack = 0.06, release = 0.55 }
scale         = 0.20
hue           = 0.42
zoom          = 0.20
bg_bright     = 0.40
trails       = 0.50
