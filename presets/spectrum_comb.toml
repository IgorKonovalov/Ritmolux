# Spectrum Comb - the first preset on the `spectrum` system (Plan 0034): the
# engine's 64 log-spaced bands reduced to 26 upright elements, one per contiguous
# slice of the array. This is the readout in its plainest form; it exists to show
# that the frequency axis is really on screen and really moving, and the later
# spectrum presets build looks on top of it.
#
# WHAT IS DIFFERENT ABOUT THIS SYSTEM. Every other preset in the set drives its
# figure with `bass`/`mid`/`treb` - three numbers standing in for the whole
# audible range. Here the figure IS the range: element 0 is the bottom of the
# spectrum and element 25 the top, so a bass note lifts the left of the frame and
# a hi-hat the right, with no expression in between doing the mapping. Nothing in
# [params] mentions a band at all; `base` and `scale` only say how tall the
# elements stand.
system = "spectrum"
name   = "Spectrum Comb"

[spectrum]
# 26 elements: enough that the shape of the music is legible, few enough that
# each one is a stroke rather than a hair. Below ~16 the readout stops being a
# spectrum and starts being a bar chart; above ~40 at this frame width the
# elements merge into a solid block.
elements = 26
layout   = "bars"

# PER-ELEMENT EASING, and the reason it is asymmetric. The bands are the rawest
# signal in the engine - they are what `onset` is computed FROM - so an unsmoothed
# comb strobes on every hop. A fast attack keeps a transient's shape (a kick
# still snaps the low elements up in a frame or two) while a slow release lets
# them fall like a real meter instead of flickering back down. One constant
# cannot express that at any value; this is the same { attack, release } pair the
# [smoothing] table uses.
smoothing = { attack = 0.025, release = 0.22 }

[params]
# THE RESTING COMB, and the preset's main motion. `base` is the length every
# element has before any audio is added, and it is deliberately not zero: at zero
# the readout disappears completely through a silence, which reads as a broken
# preset rather than a quiet one.
#
# It breathes on a ~4 s cycle, and the amplitude is half the resting length
# rather than a token wobble - on THIS figure the comb's own height is the only
# thing that moves without audio. A spectrum readout has no rotation to turn and
# no field to evolve; the elements sit where the frequency axis puts them. So the
# breath has to be real, or the preset reads as frozen in a silence.
base = "0.26 + sin(time * 1.5) * 0.17"

# THE AUDIO TERM, and THE LEVEL CURVE that now shapes it (Plan 0038). The bands
# read small on real music, but they are also spread very unevenly: a linear map
# spends the whole range on the loudest element and leaves every other one a stub
# of nearly the same height. That is what this comb looked like before - one
# spike over a flat shelf - and it is the reason `curve` exists.
#
# THE RETUNE, WITH THE FACTOR, because adopting a curve without one sends the
# readout off the top of the frame. At curve 0.62 a typical quiet level of 0.03
# becomes 0.03^0.62 = 0.114, a 3.8x boost, while a loud element at 0.30 becomes
# 0.474, only 1.6x. `scale` drops 2.6 -> 1.75 to pay for it, a 1.5x cut, and the
# two factors together are the whole point of the change:
#
#   quiet element   3.8x boost / 1.5x cut  =  ~2.5x TALLER than before
#   loud element    1.6x boost / 1.5x cut  =  ~1.05x, i.e. it did not move
#
# The peak stays exactly where it was and the shelf underneath it comes up to
# meet it. That is what a dB-like readout is for, and it is why the retune had to
# be measured rather than guessed - cutting `scale` by the full 3.8x would have
# flattened the peak along with everything else.
#
# What the curve does NOT touch is timing. The easing runs on the curved value -
# the one you see - so the [spectrum] release above means the same duration at
# every curve (ADR-0040). A curve costs a `scale` retune, never a `release` one.
scale = "1.75"
curve = "0.62"

# WIDTH. `span` is the figure's half-width in WORLD units and 1.72 fills a 16:9
# frame very nearly edge to edge. Before this was bindable the comb was stuck at
# 1.0, which is why the stroke below used to be so heavy - it was compensating
# for a readout crammed into 56% of the width. It is not a "fill the frame"
# switch: on an ultrawide 1.72 is still 1.72 and leaves the comb short, which is
# correct for a world quantity and why there is no auto mode (ADR-0037).
span  = "1.72"

# STROKE - heavier again, and for the same reason as before rather than a new
# one. Each of the 26 elements owns a twenty-sixth of the readout's width, and a
# thin stroke in a narrow slot reads as a scatter of dots rather than a comb.
# `span` widened the readout by ~1.7x, which widened every slot by the same
# factor, so the stroke rises with it (12 -> 20) to keep the bars looking like
# bars with a visible gap between them.
thickness  = "20 + clamp(bass * 10.0, 0, 5.0)"
brightness = "0.72 + clamp(mid * 1.4, 0, 0.34)"

# COLOUR - a slow full rotation of the wheel (~40 s), pushed forward a little by
# the top end. The whole comb is one hue in this preset; colouring each element
# by its own position along the axis is a Phase 3 lever, and the point of THIS
# preset is the geometry.
hue = "mod(time * 0.09 + clamp(treb * 1.8, 0, 0.14), 1)"

# CAMERA - the second half of the silent-audio motion, and it does more work than
# its size suggests. The zoom scales world coordinates about the frame centre, so
# an element out at the edge of the comb sweeps sideways by more than an element
# near the middle: the whole readout stretches and gathers rather than just
# growing. At this element spacing that is on the order of a stroke width, which
# is exactly the scale at which a change actually reads.
zoom  = "1.05 + sin(time * 1.1) * 0.09 + clamp(bass * 0.5, 0, 0.10)"
# A slight lift so the comb sits off the bottom edge rather than on it.
pan_y = "0.06 + sin(time * 0.17) * 0.03"

# BACKDROP - dim and cool, so the comb is the only bright thing.
bg_hue      = "0.58 + sin(time * 0.011) * 0.05"
bg_bright   = "0.022 + clamp(mid * 0.09, 0, 0.012)"
bg_vignette = "0.75"

[smoothing]
# The elements themselves are not smoothed here - that is per-element state the
# scene owns, and it arrives with the `[spectrum]` table. What IS smoothed is
# everything an expression drives, so the band terms do not strobe.
thickness = { attack = 0.03, release = 0.30 }
brightness = { attack = 0.04, release = 0.28 }
hue       = 0.45
zoom      = 0.22
bg_bright = 0.40
