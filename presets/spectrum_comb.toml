# Spectrum Comb - the first preset on the `spectrum` system (Plan 0034): the
# engine's 64 log-spaced bands reduced to 26 upright elements, one per contiguous
# slice of the array. This is the readout in its plainest form; it exists to show
# that the frequency axis is really on screen and really moving, and the later
# spectrum presets build looks on top of it.
#
# WHAT IS DIFFERENT ABOUT THIS SYSTEM. Every other preset in the set drives its
# figure with `bass`/`mid`/`treb` - three numbers standing in for the whole
# audible range. Here the figure IS the range: element 0 is the bottom of the
# spectrum and element 25 the top, so a bass note lifts the left of the frame and
# a hi-hat the right, with no expression in between doing the mapping. Nothing in
# [params] mentions a band at all; `base` and `scale` only say how tall the
# elements stand.
system = "spectrum"
name   = "Spectrum Comb"

[spectrum]
# 26 elements: enough that the shape of the music is legible, few enough that
# each one is a stroke rather than a hair. Below ~16 the readout stops being a
# spectrum and starts being a bar chart; above ~40 at this frame width the
# elements merge into a solid block.
elements = 26
layout   = "bars"

# PER-ELEMENT EASING, and the reason it is asymmetric. The bands are the rawest
# signal in the engine - they are what `onset` is computed FROM - so an unsmoothed
# comb strobes on every hop. A fast attack keeps a transient's shape (a kick
# still snaps the low elements up in a frame or two) while a slow release lets
# them fall like a real meter instead of flickering back down. One constant
# cannot express that at any value; this is the same { attack, release } pair the
# [smoothing] table uses.
smoothing = { attack = 0.025, release = 0.22 }

[params]
# THE RESTING COMB, and the preset's main motion. `base` is the length every
# element has before any audio is added, and it is deliberately not zero: at zero
# the readout disappears completely through a silence, which reads as a broken
# preset rather than a quiet one.
#
# It breathes on a ~4 s cycle, and the amplitude is half the resting length
# rather than a token wobble - on THIS figure the comb's own height is the only
# thing that moves without audio. A spectrum readout has no rotation to turn and
# no field to evolve; the elements sit where the frequency axis puts them. So the
# breath has to be real, or the preset reads as frozen in a silence.
# THE MEAN AND THE SWING ARE SEPARATE DECISIONS, and conflating them broke the
# CI animation gate. Cutting `base` for reactivity (a big constant floor is
# added to every element and competes with the thing the comb exists to show)
# also cut the amplitude of the breath, and the breath is this preset's ONLY
# motion in a silence - a spectrum readout has no rotation to turn and no field
# to evolve, and `scale` is multiplied by a zero level. Measured motion fell to
# 0.0067 against a floor of 0.01 and `every_preset_animates_over_time` failed.
#
# So the mean stays low - that is the reactivity fix and it was right - and the
# swing goes back UP past where it started. 0.09 +/- 0.075 has a lower floor
# than the old 0.13 +/- 0.12 while breathing across a wider range.
base = "0.09 + sin(time * 1.5) * 0.075"

# A GENTLE ROCK, and it is the comb's main silent-audio motion now. In a silence
# every element's length is exactly `base` - `scale` is multiplied by a zero
# level - so a spectrum readout has only two things that can move without audio:
# the resting length, and the view. Tilting matters more than it sounds: rotation
# is about the frame CENTRE, and `span` now puts the outer elements 1.7 world
# units out, so a couple of degrees sweeps them through much more than their own
# width while the middle of the comb barely shifts.
rotation = "sin(time * 0.9) * 0.135"

# THE AUDIO TERM, and THE LEVEL CURVE that now shapes it (Plan 0038). The bands
# read small on real music, but they are also spread very unevenly: a linear map
# spends the whole range on the loudest element and leaves every other one a stub
# of nearly the same height. That is what this comb looked like before - one
# spike over a flat shelf - and it is the reason `curve` exists.
#
# CALIBRATED AGAINST MEASURED LEVELS, not against --set magnitudes, because
# guessing them is what got this preset wrong once already. `shot --signal`
# prints what it measured, and for `dynamic:110`:
#
#   bass  min 0.004  mean 0.040  max 0.106
#   mid   min 0.000  mean 0.006  max 0.019
#   treb  min 0.000  mean 0.006  max 0.032
#
# The top of the spectrum runs about SEVEN TIMES quieter than the bottom on real
# material. That spread is the thing this readout exists to show, and it is also
# what makes the scene hard to gain: left linear the top end is invisible, and
# flattened too far every element is the same height and the comb says nothing.
#
# `curve = 0.85` is the compromise, far gentler than the 0.5 the docs use as
# their worked example. At 0.85 a quiet 0.006 becomes 0.0129 - a 2.2x lift, so
# the top end is legible - while a loud 0.106 becomes 0.148, only 1.4x. That
# pulls the two ends from 17.7:1 apart to about 11.5:1. Compressing harder buys
# visibility at the top and pays for it in the very contrast the comb is for.
#
# `base` is the other half of the gain and it was the bigger error. It is a
# constant added to EVERY element, so it is pure "the same at all frequencies":
# at 0.26, against audio terms in the 0.1-0.6 range, the floor was most of what
# you saw and the readout looked flat whatever the curve did. 0.13 is enough that
# a silence still shows a comb rather than nothing, and not a unit more.
#
# `scale` then buys the height back at 10.0, aimed slightly hot on purpose: real
# music through loopback runs louder than any stimulus synthesized here, so the
# honest calibration target is the live app, not this file's arithmetic.
#
# What the curve does NOT touch is timing. The easing runs on the curved value -
# the one you see - so the [spectrum] release above means the same duration at
# every curve (ADR-0040). A curve costs a `scale` retune, never a `release` one.
# RETUNED, because 0.85 was still far too gentle and `base` was still too high.
# Work the arithmetic at the measured means rather than trusting the shape of
# the curve: at 0.85 a treble mean of 0.006 became 0.0129, and against a `base`
# of 0.13 the audio contributed less than the constant floor did. Every element
# outside the bass was a stub sitting on a shelf - which is exactly what "reacts
# too little" looks like on a comb.
#
# At 0.55 the same 0.006 becomes 0.060, a 4.6x lift rather than 2.2x, and the
# bass mean 0.040 becomes 0.170. That pulls the two ends from 6.6:1 apart to
# 2.8:1 - firmer compression than before, and it has to be, because the spread
# is what was burying the top of the readout.
#
# `base` drops 0.13 -> 0.07 for the same reason. It is added to EVERY element,
# so it is pure "the same at all frequencies" and it competes directly with the
# thing the comb exists to show. It is now small enough that a silence still
# shows a comb and not one unit more.
#
# `scale` then falls 10.0 -> 3.8, and it falls because the curve gives so much
# more back: a bass mean now stands 0.65 tall and a peak reaches ~1.1, against a
# treble mean of 0.23. Aimed slightly conservative on purpose - loopback runs
# louder than anything synthesized here, so the honest target is the live app.
#
# Timing is untouched by any of this: the easing runs on the curved value, so
# the [spectrum] release above means the same duration at any curve (ADR-0040).
scale = "3.80"
curve = "0.55"

# WIDTH. `span` is the figure's half-width in WORLD units and 1.72 fills a 16:9
# frame very nearly edge to edge. Before this was bindable the comb was stuck at
# 1.0, which is why the stroke below used to be so heavy - it was compensating
# for a readout crammed into 56% of the width. It is not a "fill the frame"
# switch: on an ultrawide 1.72 is still 1.72 and leaves the comb short, which is
# correct for a world quantity and why there is no auto mode (ADR-0037).
span  = "1.72"

# STROKE - heavier again, and for the same reason as before rather than a new
# one. Each of the 26 elements owns a twenty-sixth of the readout's width, and a
# thin stroke in a narrow slot reads as a scatter of dots rather than a comb.
# `span` widened the readout by ~1.7x, which widened every slot by the same
# factor, so the stroke rises with it - but only to 13, not the 20 that factor
# suggests. Scaling it the full 1.7x was tried and read as blurry and upscaled:
# 0.12 world units of stroke against a 0.132 slot is 91 % fill and mostly soft
# skirt. `glow` below tightens the core instead, which is the cheaper lever.
thickness  = "13 + clamp(bass * 45.0, 0, 3.5)"

# STROKE SHARPNESS. `glow` scales the renderer's core-to-edge falloff, and below
# 1.0 it tightens the stroke toward its core. It matters more here than on the
# other line scenes because a bar is a SHORT, WIDE stroke: the soft skirt runs
# along its whole length, so a fat bar reads as a blurred block rather than a
# bar. Between this and the thinner stroke above, the comb has hard edges again.
glow       = "0.75"
# Gain raised ~30x to match the measured mid mean of 0.006, but the CAP is cut
# 0.34 -> 0.26. Reactivity was the fault, not headroom: on an additive renderer
# a comb whose bars are already tall does not also want a big luminance swing.
brightness = "0.72 + clamp(mid * 40.0, 0, 0.26)"

# COLOUR - a slow full rotation of the wheel (~40 s), pushed forward a little by
# the top end. The whole comb is one hue in this preset; colouring each element
# by its own position along the axis is a Phase 3 lever, and the point of THIS
# preset is the geometry.
hue = "mod(time * 0.09 + clamp(treb * 22.0, 0, 0.14), 1)"

# CAMERA - the second half of the silent-audio motion, and it does more work than
# its size suggests. The zoom scales world coordinates about the frame centre, so
# an element out at the edge of the comb sweeps sideways by more than an element
# near the middle: the whole readout stretches and gathers rather than just
# growing. At this element spacing that is on the order of a stroke width, which
# is exactly the scale at which a change actually reads.
zoom  = "1.05 + sin(time * 1.1) * 0.125 + clamp(bass * 4.0, 0, 0.10)"
# A slight lift so the comb sits off the bottom edge rather than on it.
pan_y = "0.06 + sin(time * 0.17) * 0.03"

# BACKDROP - dim and cool, so the comb is the only bright thing.
bg_hue      = "0.58 + sin(time * 0.011) * 0.05"
bg_bright   = "0.022 + clamp(mid * 2.5, 0, 0.012)"
bg_vignette = "0.75"

[smoothing]
# The elements themselves are not smoothed here - that is per-element state the
# scene owns, and it arrives with the `[spectrum]` table. What IS smoothed is
# everything an expression drives, so the band terms do not strobe.
thickness = { attack = 0.03, release = 0.30 }
brightness = { attack = 0.04, release = 0.28 }
hue       = 0.45
zoom      = 0.22
bg_bright = 0.40
