# Labyrinth - the maze rule (B3/S12345) drawn in white chalk on black, with every change cut in red.
# Dense soup knots into long connected corridors and holds, so the look is the maze CHANGING: a disc
# of fresh soup lands every fourth beat and bites a patch out, and once a phrase the rule loosens so
# the whole maze partly dissolves and re-knits into a new one. Every cell that just died glows red
# and fades through oxblood to black, so the red marks where the maze moved most recently.
#
# The grid is the stroke width. At 192 cells a side the corridors are fine enough that the frame
# reads as one large maze rather than a few wide strips. It is inside the Floor tier's 512 cap.
#
# What drives what:
#   mid        -> step_rate: corridors re-knit faster on a busy passage (14..28 generations/s).
#   beat       -> reseed: every fourth beat a disc lands and bites a patch out.
#   beat_index -> survive: for 6 beats in every 32 the rule loosens to S1234 (see below).
#   bass       -> trail: a heavy passage holds the red wake longer before it sinks.
#
# On the palette: a settled maze is two-tone, because every wall is live and sits at the palette
# ORIGIN - the chalk stop. The red ramp is only ever the wake of a dead cell (age_tint 0.9 walks
# it along the palette as it fades), which is why it appears only where something changed.
system = "cellular"
name = "Labyrinth"

[generator]
seed = 17

[cellular]
family = "life_like"
grid = 192
wrap = true

[params]
# Bit k set means k neighbours: birth 8 is bit 3. survive 62 is bits 1-5 (2 + 4 + 8 + 16 + 32),
# the maze rule, whose corridors connect and then stand still. For 6 beats in every 32 it drops
# to 30, bits 1-4 (mazectric): walls with five neighbours die, the maze thins and shifts, and the
# return to 62 freezes the new layout. That window is how the maze changes slowly.
birth = "8"
survive = "62 - 32 * (mod(beat_index, 32) < 6)"
step_rate = "14 + clamp(mid * 16, 0, 14)"
reseed = "beat * (mod(beat_index, 4) < 1)"
trail = "40 + clamp(bass * 14.1, 0, 20)"
age_tint = "0.9"
palette_steps = "0"
palette_contour = "0"
palette_contour_style = "3"
palette_contour_ink = "0.04"
hue = "0"
brightness = "0.9"
saturation = "1"

[smoothing]
trail = 0.45
step_rate = 0.3
palette_contour = 0.25

[palette]
stops = [
  { at = 0.00, color = "#f4efe6" },   # chalk - the standing walls
  { at = 0.06, color = "#ff2a1f" },   # red - a path just cut
  { at = 0.45, color = "#b3120c" },   # deep red
  { at = 0.80, color = "#3a0604" },   # oxblood
  { at = 1.00, color = "#060303" },   # black
]
