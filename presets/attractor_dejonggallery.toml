# Plan 0079 demo - the De Jong roster, stepping itself every ~3 s.
#
# Thirteen different figures out of one scene, each framed to the same footprint
# by its own measurement. Before the roster the only route to any of these was
# binding `a`..`d` and hoping the result stayed in frame.
system = "attractor"
name = "De Jong Gallery"

[particles]
family = "de_jong"
density = 0.5

[palette]
name = "spectrum"

[params]
tuple = "mod(floor(time * 0.33), 13)"

brightness = "0.22"
fade = "0.90"
size = "0.45 + clamp(treb * 0.15, 0, 0.12)"
reseed = "onset > 0.55"

saturation = "0.9"
hue_spread = "0.25"
hue_center = "0.20"
spin = "0.4"
zoom = "1.0 + clamp(bass * 0.08, 0, 0.07)"

[smoothing]
size = { attack = 0.03, release = 0.30 }
zoom = 0.2
