# Cogwheel - a saw blade. The seven-lobed epicycloid (n = -3.5, d = 7) in
# steel, and the music spins it: the bass throws `spin` up (fast attack, 0.8 s
# release) and a 0.8 trail smears the knots into arcs, so a loud passage is a
# blade at speed with motion-blurred teeth and a quiet one is the gear standing
# still enough to count. Bass also drives `pen` 0.55 -> 1.55, so the scallops
# become cusps become loops on the kick.
#
# Chosen by the owner from three second-look directions (over a counter-turning
# gear train and a beat-ticked escapement).
#
# Horizon (10 simulated min, 96x96, --set bass=0.6,mid=0.45, against a static
# star_pattern control reading delta 0.0000 / monotone 0.00): coverage
# 0.057 -> 0.171 at monotone 0.40, peak/mean 42.8 -> 19.5 (0.55), footprint
# 0.225 -> 0.212 (0.53). The coverage rise is the trail filling the blade's
# sweep, not a pile-up: under half the steps went that way, and the footprint
# is flat.
system = "parametric_curve"
name = "Cogwheel"

[curve]
family = "hypotrochoid"

[palette]
stops = [
  { at = 0.0, color = "#03060c" },
  { at = 0.4, color = "#2a4a6e" },
  { at = 0.75, color = "#9cc8ee" },
  { at = 1.0, color = "#f4faff" },
]

[params]
n          = "-3.5"
d          = "7"
pen        = "0.55 + clamp(bass * 1.15, 0, 1.0)"
samples    = "1200"
scale      = "0.8"
spin       = "0.08 + clamp(bass * 0.94, 0, 0.8)"
thickness  = "2.4"
softness   = "0.3"
glow       = "0.6"
brightness = "0.7"
hue        = "0.72 + clamp(treb * 0.25, 0, 0.15)"
hue_spread = "0.25"
trails     = "0.8"
bloom_amount    = "0.25"
bloom_threshold = "0.8"
bg_bright  = "0.06"
bg_hue     = "0.1"
bg_vignette = "0.85"

[smoothing]
pen = { attack = 0.04, release = 0.35 }
spin = { attack = 0.1, release = 0.8 }
hue = 0.3
