# Perseids — a meteor shower against the night (cohort 4, Plan 0075).
# Fresh slate (ADR-0089). Marks are thrown hard and shallow so each one streaks —
# the trails stage draws the meteor tails — and every member still twinkles at
# its own seeded rate under the shower.
#
# THE BRIEF'S QUIET "sky that twinkles" IS ROUTED, NOT SHIPPED (2026-08-11), on
# two measured walls: per-mark variation beyond the spreads (backlog 0068), and
# the sanity gates themselves — backdrop-suppressed coverage requires the SCENE
# to paint (0.04 absolute, 0.25 emitter floor), and a slow sparse starfield
# measures 0.0066 however lovely it is. Squall's header called this the gate
# constraint on sparse idioms (design-backlog 0009). A sky of slow stars needs
# either that floor to learn about structure, or per-mark variation — until
# then, the night sky performs as a shower.
# Drives: bass drives the shower's density, a beat volleys a handful more, mid
# leans the radiant, treble sharpens the chroma, onset lifts the sky's glow.
system = "emitter"
name = "Perseids"

[palette]
stops = [
  { at = 0.00, color = "#080f2c" },  # deep night
  { at = 0.45, color = "#6a86c8" },  # dim blue
  { at = 0.75, color = "#d8e4ff" },  # white streak
  { at = 1.00, color = "#ffe8b8" },  # the gold one
]

[params]
spawn_rate = "200 + clamp(bass * 212, 0, 180) + beat * (bar < 0.25) * 250"
gravity = "1.3"
launch_speed = "2.6"
launch_angle = "0.55 + noise(time * 0.07) * 0.15 + clamp(mid * 0.24, 0, 0.2)"   # the radiant leans with the mid
spread = "0.5"
lifetime = "2.8"
lifetime_spread = "0.5"
size = "1.7"
size_spread = "0.55"
shape = "0"                        # the elongated glint — a meteor head
spin = "0.3"
twinkle = "0.6"
brightness = "1.1 + clamp(onset * 0.75, 0, 0.45)"
hue = "0.6"
hue_center = "0.65"
hue_spread = "0.3"
saturation = "0.85"
bg_hue = "0.04"
bg_bright = "0.08 + noise(time * 1.3) * 0.03 + clamp(bass * 0.09, 0, 0.08)"
bg_vignette = "0.5"
trails = "0.55"                    # the meteor tails — this is what draws the streaks

[smoothing]
spawn_rate = { attack = 0.05, release = 0.6 }
brightness = { attack = 0.03, release = 0.5 }
launch_angle = 0.7
