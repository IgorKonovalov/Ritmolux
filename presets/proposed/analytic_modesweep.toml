# Mode Sweep - the Chladni plate with its mode numbers NOT held: the bass sweeps
# mode_m continuously across nearly the whole range (2 -> 16) through an eased
# value, so on a crescendo the plate climbs through figure after figure, each
# whole number a distinct pattern, like a tone generator slowly swept up the
# frequencies in a lab film. mode_n is the treble's (1..3), so hats change the
# family the sweep runs through.
#
# What drives it: mode_m = 2 + bass * 14 (capped at 16), smoothed 0.35 s, and
# the modes are quantized to whole numbers CPU-side, so the easing walks
# through every integer on the way rather than blending between them - each
# step is a crisp new figure. mode_n = 1 + treb picks. When the two are equal
# the plate goes blank for that step; that happens only at mode 2..3 with loud
# treble and reads as a breath. Warm white on black, thin lines, no hold.
#
# A slow zoom and pan drift keep it alive in silence (the field is stateless,
# so without a time term it is frozen when the music stops).
#
# Judge: does a crescendo read as the plate CLIMBING (a legible sequence) or
# as a strobe of unrelated figures? An 8-frame --strip on dynamic:110 showed
# seven distinct figures in eight frames, from the n=1 diagonal cross up to a
# dense woven square - so the risk is the strobe, not stillness. Watch it with
# real music; on the dynamic signal the bass mean is ~0.75, so the still sits
# around mode 12.
system = "analytic_field"
name = "Mode Sweep"

[field]
family = "chladni"

[palette]
stops = [
  { at = 0.0,  color = "#050404" },
  { at = 0.55, color = "#3a2410" },
  { at = 0.85, color = "#ffcf8a" },
  { at = 1.0,  color = "#fffaf0" },
]

[params]
mode_n     = "1 + floor(clamp(treb * 3.4, 0, 2.99))"
mode_m     = "2 + clamp(bass * 14, 0, 14)"
line_width = "0.024 + clamp(onset * 0.02, 0, 0.012)"
plate_mix  = "0"
zoom       = "0.9 + 0.06 * sin(time * 0.09)"
pan_x      = "0.1 * sin(time * 0.06)"
brightness = "1.3"
bloom_amount    = "0.3"
bloom_threshold = "0.85"

[smoothing]
mode_m     = 0.35
mode_n     = 0.2
line_width = 0.08
