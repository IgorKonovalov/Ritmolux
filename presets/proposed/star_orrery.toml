# star_orrery - the mandala interior with the interlace switched off.
#
# THE LOOK: rings of beads turning against each other, like the brass rings of an
# orrery seen face on. `tiling = "none"` draws NO Hankin interlace at all - which
# is a load error unless at least one ring is declared, and the five below are the
# whole figure. Cool metal on near-black; no frame around it, so the composition is
# the ring radii and nothing else.
#
# WHAT DRIVES IT: `ring_phase` counter-rotates alternate rings - ring 0 by +phase,
# ring 1 by -phase, down the roster - and that is the gesture the look is named
# for. It is NOT the animation: a 24- and 30-fold ring turned by any angle lands
# almost on top of itself, so the phase moves few pixels however fast it runs.
# `ring_spread` on bass (the rings sliding out and in) and `ring_scale` on mid (the
# beads growing in place) are what actually carry the motion.
#
# WHAT TO LOOK AT WHEN JUDGING: whether the counter-rotation is legible. It should
# be readable as two families of rings going opposite ways, not as a general
# shimmer. Second: the outermost ring - the instance budget truncates SILENTLY in
# roster order, so if the scallop boundary is missing, the figure has run out of
# arcs rather than been authored without one.

system = "star_pattern"
name = "Orrery"

[generator]
tiling = "none"
seed = 53
rings = [
  { motif = "circle",   count = 1,  radius = 0.00, scale = 0.20 },
  { motif = "teardrop", count = 8,  radius = 0.26, scale = 0.19, phase = 0.20 },
  { motif = "chevron",  count = 16, radius = 0.45, scale = 0.14 },
  { motif = "circle",   count = 30, radius = 0.62, scale = 0.075 },
  { motif = "arc",      count = 20, radius = 0.76, scale = 0.16, phase = 0.08 },
  # count = lobes, radius = the circle they bulge from, scale = the bulge DEPTH.
  { motif = "scallop",  count = 48, radius = 0.86, scale = 0.035 },
]

[palette]
stops = [
  { at = 0.00, color = "#06090f" },
  { at = 0.28, color = "#1d3a52" },
  { at = 0.52, color = "#4e7f96" },
  { at = 0.74, color = "#a8c6c0" },
  { at = 0.90, color = "#e3d3a4" },
  { at = 1.00, color = "#fff2cf" },
]

[smoothing]
ring_spread = 0.35
ring_scale = 0.28
thickness = { attack = 0.03, release = 0.45 }

[params]
# The gesture. Alternate rings, opposite ways, one slow turn every ~40 s.
ring_phase = "mod(time * 0.025, 1)"
# The motion. These two change what the figure IS at each radius.
ring_spread = "0.82 + clamp(bass * 0.282, 0, 0.24)"
ring_scale = "0.80 + clamp(mid * 0.60, 0, 0.51)"

rotation = "mod(time * -0.006, 1)"
scale = "0.86"
zoom = "1.0"

thickness = "2.3 + clamp(treb * 2.5, 0, 1.5)"
softness = "0.26"
stroke_blend = "0.30"
draw_progress = "1"

hue = "0.42"
hue_spread = "0.5"
saturation = "0.9"
brightness = "1.35"
glow = "1.05"

bg_hue = "0.05"
bg_bright = "0.10"
bg_vignette = "0.78"
occlude = "0.3"

bloom_amount = "0.28"
bloom_threshold = "1.15"
bloom_radius = "1.4"
exposure = "1.0"
