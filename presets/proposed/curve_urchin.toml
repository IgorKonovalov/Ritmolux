# Urchin — a superformula that bristles on the bass.
#
# The look: a sea urchin in deep water. The outer figure is a superformula
# whose `sharpness` (Gielis' n1) is the reactive lever: at rest it sits high
# and the figure is a soft rounded star; bass drops it toward 0.3, where
# every lobe pulls out into a long spine. A second superformula sits UNDER it
# at half size with a different symmetry and a fat `lobe`, as the body the
# spines grow from.
#
# What drives it:
#   - `sharpness` on bass (inverted: loud = spiky). This is the event.
#   - `sym` is held on the bar and re-rolled among 7, 9 and 11 spines; eased,
#     so it walks through the whole numbers between rather than snapping.
#   - `d` (the skew between the lobe exponents) wanders on noise, so the
#     spines lean and are never quite symmetric about their tips.
#   - the inner body's `lobe` breathes on the mids.
#
# Judge: loud should read as MORE (spines) not as a tangle. If the spines
# at peak are so long they turn into a flat starburst, `sharpness` is going
# too low. The inner body should read as a second object, not as noise.
system = "parametric_curve"
name = "Urchin"

[curve]
family = "superformula"

[palette]
stops = [
  { at = 0.0, color = "#050318" },
  { at = 0.35, color = "#3a1a6e" },
  { at = 0.7, color = "#d0508a" },
  { at = 1.0, color = "#ffd3b0" },
]

[params]
sym        = "7 + 2 * floor(hash(bar_index + 3) * 3)"
sharpness  = "1.6 - clamp(bass * 1.8, 0, 1.4)"
lobe       = "0.7"
d          = "0.8 + noise(time * 0.15) * 0.5"
samples    = "1440"
scale      = "0.95"
spin       = "0.04"
thickness  = "2.6"
softness   = "0.3"
glow       = "0.6"
brightness = "0.8"
hue        = "0.55"
hue_spread = "0.4"
bloom_amount    = "0.3"
bloom_threshold = "0.7"
bg_bright  = "0.18"
bg_hue     = "0.1"
bg_vignette = "0.85"

[hold]
sym = "bar"

[smoothing]
sym = 0.6
sharpness = { attack = 0.05, release = 0.45 }

[layer]
system = "parametric_curve"
join = "under"

[layer.curve]
family = "superformula"

[layer.params]
sym        = "5"
sharpness  = "1.2"
lobe       = "3 + clamp(mid * 3.5, 0, 3)"
d          = "1"
samples    = "720"
scale      = "0.36"
spin       = "-0.03"
thickness  = "3.2"
softness   = "0.4"
glow       = "0.8"
brightness = "0.9"
hue        = "0.62"
hue_spread = "0.2"

[layer.smoothing]
lobe = 0.3
