# fragment_auroraveil - a slow polar curtain, built palette-first.
#
# THE LOOK: vertical sheets of green-into-violet light hanging over a cold indigo
# sky, folding slowly. Nothing here is a shape - the whole picture is the custom
# gradient below read through a domain-warped field, so the palette IS the design.
#
# WHAT DRIVES IT: almost nothing fast. `warp` wanders on two decorrelated noise
# rates so the curtain folds without a period; `bass` adds a small fold on top.
# `color_center` drifts the window along the gradient over ~40 s, which is what
# carries the green edge into violet and back. `glow` takes a shallow `mid` term
# only - the light level is held nearly flat on purpose (additive ceiling).
#
# WHAT TO LOOK AT WHEN JUDGING: whether the sheets read as depth rather than as
# stripes - the fold should give some sheets a lit edge and leave others flat.
# Second: whether it still looks composed at rest. This is an ambient preset; if
# it only works loud it has failed.

system = "fragment_field"
name = "Aurora Veil"

[palette]
stops = [
  { at = 0.00, color = "#050a1e" },
  { at = 0.28, color = "#0a2a44" },
  { at = 0.52, color = "#128a6a" },
  { at = 0.70, color = "#4fd39a" },
  { at = 0.86, color = "#6a5fb8" },
  { at = 1.00, color = "#2a1a4a" },
]

[generator]
seed = 7

[smoothing]
warp = 0.5
glow = 0.35
color_center = 0.8

[params]
# The fold: a slow wander, plus a shallow bass term. Cap 0.35 over the 0.55 base,
# so a peak sits near 0.9 and the field never flattens (warp = 0 is plain bands).
warp = "0.55 + noise(time * 0.07) * 0.35 + clamp(bass * 0.41, 0, 0.35)"
field_speed = "0.22"
fold_speed = "0.15 + noise(time * 0.11 + 50) * 0.12"

# Where the curtain sits on the gradient, and how much of it one frame shows.
hue = "0.0"
color_span = "0.86 + noise(time * 0.05 + 120) * 0.22"
color_center = "0.12 + sin(time * 0.16) * 0.26"
saturation = "1.0"

# Light: held flat. 0.95 base, mid tops out at 0.3 more.
glow = "0.95 + clamp(mid * 0.35, 0, 0.30)"
flash = "0"
zoom = "2.9"

# A cold sky behind the sheets so the dark end is not pure black.
bg_hue = "0.06"
bg_bright = "0.16"
bg_hue_span = "0.14"
bg_angle = "0.25"
bg_shade = "0.35"
bg_shade_end = "1.0"
bg_vignette = "0.45"
occlude = "0.72"

bloom_amount = "0.32"
bloom_threshold = "1.1"
bloom_radius = "1.6"
exposure = "1.05"
