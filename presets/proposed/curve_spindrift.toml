# curve_spindrift - a Maurer figure that changes what it IS on the hit.
#
# THE LOOK: a hard, kinetic line piece. A single rose web spins fast enough to
# read as a machine part, and its petal number `n` steps to a new value on every
# strong onset - so the figure is not modulated by the beat, it is REPLACED by it.
#
# WHAT DRIVES IT: `n` is `4 + floor(hash(floor(time * 2)) * 9)`, which re-rolls
# twice a second to an unrelated integer between 4 and 12; `d`, the angular step
# that turns a rose into a Maurer web, takes a slow noise wander so the same `n`
# never draws quite the same web twice. `draw_progress` snaps to full on a hit and
# glides back down, so the line is visibly still arriving between hits. Nothing
# reactive touches brightness.
#
# WHAT TO LOOK AT WHEN JUDGING: whether the re-rolls read as musical or as a
# glitch. Two per second is deliberate - slower and it stops being kinetic, faster
# and it strobes. Second: whether the web stays legible at speed, or smears into a
# disc (if it does, thickness or glow is too high).

system = "parametric_curve"
name = "Spindrift"

[curve]
family = "maurer_rose"

[generator]
seed = 23

[smoothing]
n = 0.10
d = 0.6
draw_progress = { attack = 0.02, release = 0.55 }
thickness = { attack = 0.02, release = 0.4 }

[params]
# A new figure twice a second - hash scatters, so 4 -> 11 -> 6, not a ramp.
n = "4 + floor(hash(floor(time * 2)) * 9)"
d = "68 + noise(time * 0.09) * 26"
phase = "mod(time * 0.06, 1)"
samples = "397"
radial_offset = "0.24 + clamp(bass * 0.16, 0, 0.14)"

# The line arriving. Snaps up on a hit, glides back over half a second.
draw_progress = "0.55 + clamp(onset * 0.75, 0, 0.45)"

spin = "0.55 + clamp(mid * 0.35, 0, 0.30)"
scale = "0.78"
zoom = "1.0"

mirror_order = "2"
mirror_reflect = "1"

thickness = "1.3 + clamp(treb * 1.5, 0, 0.9)"
softness = "0.15"
# Near-opaque paint: a Maurer web has thousands of crossings, and additive ones
# sum into a flat disc. This is what keeps it a LINE drawing at full density.
stroke_blend = "0.88"

hue = "0.62 + noise(time * 0.04 + 30) * 0.30"
hue_spread = "0.45"
saturation = "1.0"
brightness = "0.95"
glow = "0.22"

bg_hue = "0.9"
bg_bright = "0.06"
bg_vignette = "0.8"
occlude = "0.5"

bloom_amount = "0.34"
bloom_threshold = "1.1"
bloom_radius = "1.2"
exposure = "1.0"
