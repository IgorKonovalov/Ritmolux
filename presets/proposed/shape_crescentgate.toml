# shape_crescentgate - an authored silhouette, travelling to a disc and back.
#
# THE LOOK: a crescent drawn as a distance field, banded into offset contours, that
# swells into a full disc and empties back to a crescent. The figure is NOT from
# the mark roster - it is inline SVG path data in the `[path]` table below, twelve
# commands with round coordinates, which is the readable end of that feature.
#
# `coord_mode` is 0 here on purpose, unlike the batch's other shape_field preset:
# the contours are OFFSET curves of the outline, so a crescent's cusps blunt as the
# bands move away from it. In coord_mode 1 they would be scaled copies and the
# cusps would stay sharp all the way in. Judging the two side by side is most of
# what this preset is here for.
#
# WHAT DRIVES IT: `morph` is bound to a slow cosine plus bass, so the phase of the
# moon is the music. `palette_steps` adds and removes whole contour rings on the
# mids and `rotation` drifts. `stroke` is pinned at 0 - the FILL - because the
# contours are the picture: above 0 only the outline is drawn at that half-width,
# and the banding then has a hairline to live in rather than a figure.
#
# WHAT TO LOOK AT WHEN JUDGING: the middle of the morph. The ends are both shapes
# somebody drew; the intermediate is a shape nobody authored, and it is where a bad
# pair shows. Second: whether the crescent's cusps survive the banding at all.

system = "shape_field"
name = "Crescent Gate"

[path]
# Crescent: outer arc out to the right, inner arc cutting back. SVG y is DOWN.
d = "M 0,-1 C 0.85,-0.72 0.85,0.72 0,1 C 0.46,0.52 0.46,-0.52 0,-1 Z"
# ...travelling to a full disc of the same extent.
morph_to = "M 0,-1 C 0.55,-1 1,-0.55 1,0 C 1,0.55 0.55,1 0,1 C -0.55,1 -1,0.55 -1,0 C -1,-0.55 -0.55,-1 0,-1 Z"
samples = 48

[palette]
stops = [
  { at = 0.00, color = "#03060f" },
  { at = 0.22, color = "#12203f" },
  { at = 0.46, color = "#2c5a7a" },
  { at = 0.68, color = "#6ba8a8" },
  { at = 0.86, color = "#d6d2a0" },
  { at = 1.00, color = "#fff6d8" },
]

[generator]
seed = 43

[smoothing]
rotation = 1.2
palette_steps = 0.35

[params]
coord_mode = "0"
# The phase of the moon. ~34 s round trip, plus a bass term that hurries the swell.
morph = "clamp(0.5 - 0.42 * cos(time * 0.185) + clamp(bass * 0.14, 0, 0.12), 0, 1)"

scale = "0.40"
rotation = "0.06 + sin(time * 0.045) * 0.05"
pan_x = "0.0"
gamma = "0.85"

# 0 is the fill, and the fill is where the contours are - see the header.
stroke = "0"

palette_steps = "9 + clamp(mid * 4.7, 0, 4)"
palette_contour = "0.30"
color_span = "0.80"
color_center = "0.04"
saturation = "0.95"

bg_hue = "0.06"
bg_bright = "0.16"
bg_hue_span = "0.10"
bg_angle = "0.6"
bg_vignette = "0.62"
occlude = "0.85"

bloom_amount = "0.12"
bloom_threshold = "1.4"
exposure = "1.0"
