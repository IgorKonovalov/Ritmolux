# Engraving - the Chladni plate printed: indigo ink on warm paper through the
# engine's ink pass, the mid-range modes (mode_n 3..6, mode_m 7..10) drawn as
# a plate from a nineteenth-century acoustics text. plate_mix puts a faint
# wash of the standing wave under the lines, so the paper carries a tone that
# follows the vibration, like an aquatint ground under an etched line.
#
# What drives it: mids pick mode_n and bass picks mode_m, re-taken on the bar,
# so the plate changes page slowly - this is the calm one. The line weight
# swells with the bass (0.035..0.06) and the wash deepens with the mids.
#
# Judge: is the ink BLACK enough to read as print, or pencil grey (a known gap
# for thin line scenes - these lines are deliberately wide to dodge it)? And is
# the paper clean at the edges, or grey-cast? A grey paper loses the print.
system = "analytic_field"
name = "Engraving"

[field]
family = "chladni"

[palette]
name = "mono"

[params]
mode_n     = "3 + floor(clamp(mid, 0, 0.99) * 4)"
mode_m     = "7 + floor(clamp(bass, 0, 0.99) * 4)"
line_width = "0.035 + clamp(bass * 0.03, 0, 0.025)"
plate_mix  = "0.03 + 0.06 * noise(time * 0.2) + clamp(mid * 0.12, 0, 0.1)"
pan_y      = "0.06 * sin(time * 0.045)"
brightness = "1.6"
ink_amount   = "1"
paper_hue    = "0.10"
paper_sat    = "0.16"
paper_bright = "0.95"
ink_hue      = "0.66"
ink_sat      = "0.7"
ink_bright   = "0.05"
ink_gamma    = "0.5"

[hold]
mode_n = "bar"
mode_m = "bar"

[smoothing]
line_width = 0.2
plate_mix  = 0.4
