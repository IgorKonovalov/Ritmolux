# emitter_confettidrop - four-point sparks fired from below on the hit.
#
# THE LOOK: a hard, celebratory scene. A wide fan of small sharp stars is thrown
# up from just under the frame, arcs over, spins, and falls back out of shot. At
# rest it is a thin drizzle; on a hit it is a burst.
#
# WHAT DRIVES IT: `spawn_rate` is the whole mechanism - onset takes it from a
# trickle (55/s) to a torrent (~900/s), which is a POPULATION change rather than a
# brightness change, so a peak reads as more confetti and not as a white wash.
# `launch_speed` takes a smaller bass term so the burst also goes higher. Spin,
# twinkle and lifetime_spread keep the individual objects from moving in lockstep.
#
# WHAT TO LOOK AT WHEN JUDGING: whether a hit reads as a THROW. The population
# has to arrive with the beat and then arc - if the frame just gets denser evenly,
# the launch speed term is too small. Second: at rest, whether the thin drizzle is
# still worth looking at, or whether the preset is only alive at peak.

system = "emitter"
name = "Confetti Drop"

[palette]
stops = [
  { at = 0.00, color = "#ff2d55" },
  { at = 0.22, color = "#ff8a3d" },
  { at = 0.44, color = "#ffe066" },
  { at = 0.62, color = "#4ade80" },
  { at = 0.80, color = "#38bdf8" },
  { at = 1.00, color = "#c084fc" },
]

[generator]
seed = 5

[smoothing]
spawn_rate = { attack = 0.015, release = 0.45 }
launch_speed = { attack = 0.02, release = 0.35 }
size = { attack = 0.02, release = 0.4 }
hue_center = { attack = 0.03, release = 0.6 }

[params]
# The population. onset mean 0.153, peak 1.0: gain 1420 with cap 850 reaches the
# ceiling at onset 0.60, so a typical hit is well up the range and a hard one caps.
spawn_rate = "55 + clamp(onset * 1420, 0, 850)"
launch_speed = "2.20 + clamp(bass * 0.82, 0, 0.70)"
launch_angle = "sin(time * 0.23) * 0.10"
spread = "0.62"
gravity = "1.6"
source_y = "-1.15"
source_width = "1.9"

lifetime = "2.6"
lifetime_spread = "0.55"
spawn_fade = "0.18"
prewarm = "1"

# Sharp four-point sparks with concave edges, tumbling as they fly.
shape = "3"
points = "4"
star_valley = "0.20"
star_curve = "0.45"
star_jitter = "0.25"
size = "1.6 + clamp(bass * 0.94, 0, 0.80)"
size_spread = "0.7"
spin = "1.6"
twinkle = "0.55"

brightness = "1.5"
hue = "0"
hue_spread = "1.0"
# The confetti travels around the palette on the hit as well as arriving - two
# cues for one signal, which is what keeps a sparse mark field from reading flat.
hue_center = "0.34 + clamp(onset * 0.55, 0, 0.33)"
saturation = "1.0"

# bg_hue is a PALETTE coordinate, not a colour wheel position - 0.82 is the blue
# stop, held at 0.05 brightness so the ground is near-black rather than green.
bg_hue = "0.82"
bg_bright = "0.035"
bg_vignette = "0.6"
occlude = "0.8"

bloom_amount = "0.45"
bloom_threshold = "1.0"
bloom_radius = "1.3"
exposure = "1.0"
