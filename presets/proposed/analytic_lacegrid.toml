# Lace Grid - the Chladni plate at the TOP of its mode range (mode_n 12..13,
# mode_m 14..16), where the nodal set stops reading as a figure and starts
# reading as a textile: a fine white lace over midnight, the plate zoomed out
# so it repeats as a wallpaper.
#
# What drives it: the modes are re-taken on the beat from bass and treble, so
# the weave changes stitch on the hit. The treble thins and thickens the thread
# (line_width 0.004..0.016 in plate units - a hairline at 640x360), and bloom
# finds the crossings, where two lines overlap and the light doubles.
# A slow drift of pan_x/pan_y keeps the cloth sliding when the music is quiet.
#
# Judge: is the lace ordered (a repeating stitch you can follow) or moire noise?
# At 640x360 the high modes are close to the pixel pitch, so judge this one at
# 1280x720 too - aliasing at thumbnail size is a real risk of the top range.
system = "analytic_field"
name = "Lace Grid"

[field]
family = "chladni"

[palette]
stops = [
  { at = 0.0,  color = "#03040c" },
  { at = 0.40, color = "#101a3a" },
  { at = 0.75, color = "#8fa6d8" },
  { at = 1.0,  color = "#f4f7ff" },
]

[params]
mode_n     = "12 + floor(clamp(treb * 1.7, 0, 1.99))"
mode_m     = "14 + floor(clamp(bass, 0, 0.99) * 3)"
line_width = "0.004 + clamp(treb * 0.02, 0, 0.012)"
plate_mix  = "0.10"
zoom       = "0.62"
pan_x      = "0.35 * sin(time * 0.05)"
pan_y      = "0.25 * sin(time * 0.037 + 1.3)"
brightness = "1.25"
bloom_amount    = "0.45"
bloom_threshold = "0.9"
bloom_radius    = "0.6"

[hold]
mode_n = "beat"
mode_m = "beat"

[smoothing]
line_width = 0.08
