# spectrum_horizonline - the spectrum as a landscape, not as a meter.
#
# THE LOOK: forty band elements joined into one continuous polyline, sitting low
# in the frame like a mountain horizon, mirrored once so the range is answered by
# its own reflection below. Reading left to right is reading low to high
# frequency - it is still an honest readout - but the figure it makes is scenery.
#
# WHAT DRIVES IT: only the band array. `curve` is set below 1, which lifts the
# quiet detail so the high end has visible relief instead of lying flat; the
# per-element `smoothing` pair (fast attack, slow release) is what makes the ridge
# fall like snow settling rather than strobing on every analysis hop. `base`
# raises the whole horizon on bass, so a loud passage lifts the land rather than
# spiking one peak.
#
# VERIFY THIS ONE WITH --signal, NEVER WITH --set: `--set` cannot drive the 64-band
# array, so every element reads zero and the preset renders as two straight lines.
# That is the stimulus, not the preset.
#
# WHAT TO LOOK AT WHEN JUDGING: the ridge line. It should have relief across its
# whole width - if the right-hand half is flat, raise `curve` toward 0.5 or drop
# `span`. Second: the sky. The background's ramp plus its one horizon band is
# doing as much of the composition as the readout is, and if the band sits on top
# of the ridge instead of behind it the two are fighting.

system = "spectrum"
name = "Horizon Line"

[spectrum]
elements = 40
layout = "polyline"
smoothing = { attack = 0.03, release = 0.42 }

[palette]
stops = [
  { at = 0.00, color = "#0d0620" },
  { at = 0.24, color = "#3b1a5e" },
  { at = 0.48, color = "#8c2f6a" },
  { at = 0.70, color = "#e0654f" },
  { at = 0.86, color = "#f7a95c" },
  { at = 1.00, color = "#ffe6b0" },
]

[generator]
seed = 41

[smoothing]
base = 0.25
rotation = 1.0

[params]
# The land rising, rather than one peak spiking.
base = "0.12 + clamp(bass * 0.294, 0, 0.25)"
scale = "0.72"
# Below 1 lifts the quiet detail - the high end gets relief instead of lying flat.
curve = "0.55"
span = "0.94"
baseline = "-0.78"
rotation = "sin(time * 0.04) * 0.004"

# Per-element colour: position along the range, warmed by that element's own band.
# bin() sits an order of magnitude under the band scalars, hence the large gain.
hue = "0.06 + index * 0.68 + clamp(bin(index) * 2.2, 0, 0.18)"
hue_spread = "0"
thickness = "4.2 + clamp(bin(index) * 30, 0, 4.5)"

# No mirror. The line-scene mirror repeats geometry AROUND THE CENTRE - order 2 is
# a 180-degree repeat, which makes a Rorschach and not a reflection in water. A
# landscape wants one copy.
mirror_order = "1"

brightness = "0.9"
glow = "0.75"
softness = "0.30"
stroke_blend = "0.45"
saturation = "1.0"

bg_hue = "0.14"
bg_bright = "0.17"
bg_hue_span = "0.16"
bg_angle = "0.25"
bg_shade = "0.30"
bg_shade_end = "1.0"
bg_vignette = "0.5"
bg_band_amount = "0.22"
bg_band_angle = "0.0"
bg_band_pos = "0.33"
bg_band_width = "0.045"
bg_band_hue = "0.72"
occlude = "0.4"

bloom_amount = "0.34"
bloom_threshold = "1.1"
bloom_radius = "1.5"
exposure = "1.0"
