# Phosphor — a Lissajous figure on an XY oscilloscope.
#
# The look: one thin green trace on a dark tube, the 3:4 figure turning in
# depth the way a scope's does when its two oscillators are a hair out of
# tune. That turning is `phase` sweeping the offset between the axes; nothing
# rotates the figure in the plane (`spin = 0`), so every change of shape is
# the family's own.
#
# What drives it:
#   - `phase` is a slow `time` sweep with a small mid-driven offset on top.
#     The offset NUDGES the figure on a busy passage; it cannot make it turn
#     faster, because the grammar has no accumulator to integrate a rate
#     (see ROSTER.md, engine gaps).
#   - `n` (the x frequency) is held on the bar and SNAPS between 3:4 and 5:4.
#     It is deliberately not eased: a Lissajous closes only at whole `n`, and
#     an exponential ease never lands exactly on one, so an eased `n` leaves a
#     visible gap where the trace fails to meet its own start - for the whole
#     bar, not only mid-change.
#   - bass widens the figure a little; `trails` is the phosphor persistence.
#
# Judge: does the phase sweep read as a figure turning in 3D, and is the trace
# one unbroken loop at every moment? The
# phosphor smear should be a short tail behind the moving trace, not a fog.
#
# Horizon, 2026-09-11: 5 simulated minutes at 96x96, --set bass=0.6,mid=0.45,
# against a static control (flat on all three). Coverage 0.154 -> 0.220 at
# monotone 0.50, footprint 0.153 -> 0.158 (0.56): the figure re-tunes, so
# coverage wanders with it; no one-way accumulation.
system = "parametric_curve"
name = "Phosphor"

[curve]
family = "lissajous"

[palette]
stops = [
  { at = 0.0, color = "#02140a" },
  { at = 0.55, color = "#1fd36a" },
  { at = 1.0, color = "#d8ffe6" },
]

[params]
n          = "select(hash(bar_index) > 0.5, 5, 3)"
d          = "4"
phase      = "mod(time * 0.035 + mid * 0.02, 1)"
samples    = "1400"
scale      = "0.78 + clamp(bass * 0.07, 0, 0.06)"
spin       = "0"
thickness  = "1.6"
softness   = "0.35"
glow       = "0.9"
brightness = "0.85"
hue        = "0.62"
hue_spread = "0.18"
trails     = "0.72"
bloom_amount    = "0.35"
bloom_threshold = "0.6"
bg_bright  = "0.12"
bg_hue     = "0.05"
bg_vignette = "0.7"

[hold]
n = "bar"

[smoothing]
scale = 0.2
