# Multibrot - a multi-power JULIA crown: z -> z^power + c for a WHOLE power
# from 3 to 7, re-rolled once a bar. Power p has p-fold symmetry, so each bar
# the crown re-forms with a different number of arms, and because it is the
# Julia map every power opens into lit filaments rather than sitting as the
# solid black body the Mandelbrot map drew.
#
# What drives it: `power` is held on the bar and picked by
# `floor(hash(bar_index * 7.31) * 4.99)`. `c` orbits the origin slowly on
# `time`, and its radius is sized from THE SAME hash (0.53 + 0.085 per power
# step), because the radius at which a Julia set holds together grows with the
# power - one radius for every power left the high powers as dust and the low
# ones as blobs. Keep the two hash expressions identical: the grammar cannot
# read a held value back, so the pairing is by construction only. The bass
# pushes the radius outward (thinner, more filament); the mids breathe the zoom.
#
# Known flaw: now and then the orbit crosses into the region where the set
# fills in, and a frame reads as a solid blob before `c` moves on.
#
# Chosen by the owner from three second-look directions (over a trail of echo
# crowns and a stepped enamel palette on the Mandelbrot map).
#
# Judge: does the per-bar re-form read as the SAME object gaining an arm, and
# how often does the blob frame land?
system = "analytic_field"
name = "Multibrot"

[field]
family = "escape_time"
map    = "julia"

[palette]
stops = [
  { at = 0.0,  color = "#04060e" },
  { at = 0.10, color = "#070f1e" },
  { at = 0.25, color = "#133a5c" },
  { at = 0.45, color = "#3fb0a8" },
  { at = 0.62, color = "#f2e6b8" },
  { at = 0.80, color = "#c8506a" },
  { at = 1.0,  color = "#04060e" },
]

[params]
power         = "3 + floor(hash(bar_index * 7.31) * 4.99)"
c_re          = "(0.53 + floor(hash(bar_index * 7.31) * 4.99) * 0.085 + clamp(bass * 0.12, 0, 0.1)) * cos(time * 0.11)"
c_im          = "(0.53 + floor(hash(bar_index * 7.31) * 4.99) * 0.085 + clamp(bass * 0.12, 0, 0.1)) * sin(time * 0.11)"
iterations    = "48"
escape_radius = "24"
interior      = "0.15"
zoom          = "0.74 + 0.06 * noise(time * 0.15) + clamp(mid * 0.08, 0, 0.07)"
color_span    = "1.6"
color_center  = "0.05 * sin(time * 0.2)"
brightness    = "1.4"

[hold]
power = "bar"

[smoothing]
c_re = 0.3
c_im = 0.3
interior = 0.12
zoom     = 0.3
