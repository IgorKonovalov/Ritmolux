# Red Lattice - an edge-to-edge sixfold wallpaper, hard red line on black.
# One hexagon rosette carries four rings of ornament (a boss, petals,
# teardrops, a scalloped border) and is scaled to about three times its cell,
# so the mirrored kaleido_tile grid cuts it at every cell wall and the
# neighbours weld into one lattice. Opaque crisp strokes (softness 0,
# stroke_blend 1), sized for the tiling, which shrinks the source by the cell
# count. Nothing rotates. The bass swells every motif, the mids push the rings
# apart, the line thickens on a hit, and the cell count drifts slowly between
# three and three and a half, so the wall's edge cell is always arriving.
system = "star_pattern"
name = "Red Lattice"

[generator]
tiling = "hexagon"
contact_angle_deg = 60
rings = [
  { motif = "circle",   count = 1,  radius = 0.00, scale = 0.15 },
  { motif = "petal",    count = 6,  radius = 0.28, scale = 0.24 },
  { motif = "teardrop", count = 12, radius = 0.55, scale = 0.14 },
  { motif = "scallop",  count = 18, radius = 0.80, scale = 0.06 },
]

[palette]
stops = [
  { at = 0.0, color = "#c0101a" },
  { at = 1.0, color = "#ff2a1f" },
]

[params]
variant       = "1"
rotation      = "0"
draw_progress = "1"
ring_scale    = "0.9 + clamp(bass * 0.29, 0, 0.25)"
ring_spread   = "0.95 + clamp(mid * 0.12, 0, 0.1) + 0.05 * noise(time * 0.3 + 50)"
thickness     = "24 + clamp(onset * 13, 0, 8)"
softness      = "0"
stroke_blend  = "1"
glow          = "1.0"
brightness    = "1.0"
scale         = "3.2"
hue           = "0.5"
hue_spread    = "1"
kaleido_tile  = "3 + 0.5 * noise(time * 0.05)"

[smoothing]
ring_scale  = { attack = 0.03, release = 0.35 }
ring_spread = 0.2
thickness   = { attack = 0.02, release = 0.25 }
