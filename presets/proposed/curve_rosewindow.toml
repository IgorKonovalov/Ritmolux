# Rose Window — a dense spirograph read as stained glass.
#
# The look: a hypotrochoid with a small rolling circle (radius ratio 26/5 =
# 5.2, walked 26 cusps so it closes over five turns) and the pen well inside
# it, which traces a ring of overlapping loops - the tracery of a Gothic rose
# window. The colour is STEPPED along the trace (`palette_steps` with a
# contour line at each band edge), so each pass of the pen is one flat pane
# of glass rather than a gradient, and the strokes are opaque paint
# (`stroke_blend`) so crossings do not brighten into white knots.
#
# What drives it:
#   - `pen` is the structural lever, on the mids: at rest ~0.45, a narrow
#     band of tracery; a busy passage pushes it toward 0.9 and the loops
#     swell inward until the rose nearly closes over its own centre.
#   - `hue` walks slowly on `time`, rotating which pane is which colour.
#   - bass thickens the leading (stroke width), a little.
#
# Judge: the panes should read as flat colour with dark leading between them,
# not as a rainbow smear. If the steps blur, bloom is fighting the edges.
system = "parametric_curve"
name = "Rose Window"

[curve]
family = "hypotrochoid"

[palette]
stops = [
  { at = 0.0, color = "#1d2c8c" },
  { at = 0.2, color = "#b01c2e" },
  { at = 0.4, color = "#e0a21a" },
  { at = 0.6, color = "#1c7a4a" },
  { at = 0.8, color = "#5a2386" },
  { at = 1.0, color = "#1d2c8c" },
]

[params]
n          = "5.2"
d          = "26"
pen        = "0.45 + clamp(mid * 0.5, 0, 0.42)"
phase      = "0"
samples    = "2048"
scale      = "0.9"
spin       = "0.012"
thickness  = "3.2 + clamp(bass * 1.4, 0, 1.2)"
softness   = "0.12"
glow       = "0.4"
brightness = "1.6"
stroke_blend = "1"
hue        = "mod(time * 0.01, 1)"
hue_spread = "1"
palette_steps   = "10"
palette_contour = "0.6"
bg_bright  = "0.05"
bg_vignette = "0.9"

[smoothing]
pen = { attack = 0.08, release = 0.5 }
thickness = 0.2
