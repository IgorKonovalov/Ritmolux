# warp_plasmalamp - luminous cells drifting inward, edged by solarize.
#
# THE LOOK: a lava lamp seen from directly above. Five soft blobs are stamped into
# the feedback field around a ring, twisted into a spiral, and pulled slowly toward
# the centre by a per-vertex zoom below 1. Everything is soft - the deposit is a
# low-frequency figure and the mesh resample blurs it further - so the structure
# does NOT come from the geometry. It comes from `solarize`, which folds the field
# back on itself above its midpoint and turns a smooth gradient into a hard contour
# around every cell. That is the mechanism this preset is about.
#
# WHAT DRIVES IT: `solarize` itself rides the mids, so the edges harden as the
# music comes up and the cells melt back into a wash when it drops - the single
# most legible reactive gesture available in a field this soft. `warp` (the
# travelling ripple) takes bass, which deforms the cells rather than moving them.
# `deposit` is nearly flat: this field ACCUMULATES, so a reactive deposit term
# compounds frame over frame and saturates inside a passage.
#
# WHAT TO LOOK AT WHEN JUDGING: the edges. At rest the cells should be soft-edged
# blobs; loud, they should have a definite rim. If they are always rimmed, the
# solarize base is too high. Second: whether the inward drift is readable over ten
# seconds, or whether the picture just churns in place.

system = "warp_mesh"
name = "Plasma Lamp"

[palette]
stops = [
  { at = 0.00, color = "#07021a" },
  { at = 0.22, color = "#2b1170" },
  { at = 0.46, color = "#7a1f8c" },
  { at = 0.66, color = "#d4405e" },
  { at = 0.84, color = "#f79b46" },
  { at = 1.00, color = "#ffe9b8" },
]

[generator]
seed = 21

[smoothing]
solarize = 0.35
warp = 0.5
zoom = 0.6

[params]
# The drift inward. Below 1 the resample pulls the field toward the centre.
zoom = "0.972 - clamp(bass * 0.0106, 0, 0.009)"
rot = "0.055 + sin(time * 0.06) * 0.02"
cx = "0.5"
cy = "0.5"
dx = "0"
dy = "0"
sx = "1.0"
sy = "1.0"
wrap = "0"

# The ripple deforms the cells; it does not move them.
warp = "0.24 + clamp(bass * 0.235, 0, 0.20)"
warp_scale = "2.8"
warp_speed = "0.85"

# The cells. Flat on purpose - see the header.
deposit = "1.15"
deposit_x = "0.5"
deposit_y = "0.5"
deposit_radius = "0.28"
deposit_width = "0.055"
deposit_arms = "5"
deposit_twist = "0.85"
deposit_spin = "0.18"

decay = "0.93"
gamma = "1.0"
darken_center = "0.15"

# THE MECHANISM: the edge is a fold, not a stroke. 0.30 at rest is a soft rim;
# a mid peak takes it to 0.78 and every cell acquires a hard contour.
solarize = "0.30 + clamp(mid * 0.565, 0, 0.48)"
brighten = "0.15"
invert = "0"

echo_alpha = "0.18"
echo_zoom = "1.6"
echo_orient = "1"

hue = "0"
color_span = "0.85"
color_center = "0.05"
saturation = "0.88"
brightness = "0.9"

bg_bright = "0"
occlude = "1.0"

bloom_amount = "0.22"
bloom_threshold = "1.25"
bloom_radius = "1.5"
exposure = "0.95"
