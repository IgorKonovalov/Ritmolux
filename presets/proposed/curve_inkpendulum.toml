# Ink Pendulum - the machine drawing live. An ink-on-paper plate that shows the
# PEN: `draw_progress` rides the bar phase, so each bar the harmonograph is
# drawn from its first swing inward to the knot, then a fresh sheet. Every bar
# the machine is re-set to a new ratio (2:3, 3:4, 1:2, 3:5, each detuned a
# hair so the loops drift) and a new starting phase - a different drawing per
# bar. Bass still opens the swing (inverted decay).
#
# draw_progress floors at 0.12 so a bar-phase-0 frame (all of silence, every
# --report probe) still shows the first swing.
#
# The `n` and `d` selects index the same `hash(bar_index)` thresholds, so each
# ratio stays paired only while the two chains keep the same order. The line
# reads pencil-grey rather than ink-black - the ink pass cannot darken a thin
# stroke (ROSTER.md, curve-families gap 5).
#
# Chosen by the owner from three second-look directions (over a heavy
# multiply-ink knot and two coloured pens on black lacquer).
system = "parametric_curve"
name = "Ink Pendulum"

[curve]
family = "harmonograph"

[params]
n          = "select(hash(bar_index) < 0.25, 2, select(hash(bar_index) < 0.5, 3, select(hash(bar_index) < 0.75, 1, 3)))"
d          = "select(hash(bar_index) < 0.25, 3.012, select(hash(bar_index) < 0.5, 4.01, select(hash(bar_index) < 0.75, 2.006, 5.01)))"
phase      = "hash(bar_index + 7)"
decay      = "0.20 - clamp((bass + mid) * 0.09, 0, 0.13)"
draw_progress = "0.12 + 0.88 * smoothstep(0.0, 0.9, bar_phase)"
samples    = "2048"
scale      = "0.95"
spin       = "0"
thickness  = "2.4"
softness   = "0.1"
glow       = "0.25"
brightness = "2"
saturation = "0"
ink_amount   = "1"
paper_hue    = "0.1"
paper_sat    = "0.12"
paper_bright = "0.95"
ink_hue      = "0.0"
ink_sat      = "0.55"
ink_bright   = "0.15"
ink_gamma    = "0.2"

[smoothing]
decay = { attack = 0.15, release = 0.9 }
