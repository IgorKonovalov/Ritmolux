# Rose Bloom - the signature rose of the set: a warm six-petal Maurer curve
# drawn at three times the old chord count and replicated six-fold by the
# GEOMETRY MIRROR, so what used to be a single flower is now a dense woven
# rosette that stays invariant under a 60-degree turn.
#
# SEGMENT BUDGET (ADR-0007, MAX_SEGMENTS = 20_000). The mirror multiplies the
# sampled chord set BEFORE the cap, and a dihedral reflection doubles it again:
#   1100 samples x 6 folds = 6600, x2 when `mirror_reflect` latches on = 13200.
# That leaves real headroom. Overflow is surfaced rather than silent, but the
# figure is truncated when it happens, so keep the product under the cap when
# editing `samples` or `mirror_order`.
#
# The line scenes colour through their own cosine `hue` and IGNORE `[palette]`
# entirely - that is why there is no palette table in any of the rose presets.
system = "parametric_curve"
name   = "Rose Bloom"

[curve]
family = "maurer_rose"

# NOTE - no `trails` here. The feedback and kaleidoscope stages both render at a
# fixed 1280x720 and upscale to the surface, which on anything above 720p visibly
# softens line art (it reads as "upsized from something smaller"). The geometry
# mirror below costs nothing in resolution because it replicates real geometry
# before rasterisation - so on the line scenes, prefer `mirror_*` over the
# screen-space fold whenever both would do.

[params]
# SHAPE - the classic 6/71 rose, with the Plan 0028 shape params giving it a
# slow living morph the old version did not have.
n             = "6"
d             = "71"
samples       = "300"
phase         = "sin(time * 0.024) * 0.30 + clamp(bass * 0.5, 0, 0.136)"
radial_offset = "sin(time * 0.0137) * 0.09"

# MOTION - a STEADY turn (audio-independent rate), a per-bar breath, and a
# bass swell on the scale.
spin          = "0.28 + sin(time * 0.023) * 0.04"
scale         = "0.78 + bar * 0.06 + clamp(bass * 0.45, 0, 0.124)"
draw_progress = "1"

# STROKE - thickness carries the bass; brightness stays near flat, because
# these strokes draw additively and a mirrored figure overlaps itself six times
# at the centre. Pushing brightness here just makes a white star at the origin.
thickness  = "0.75 + clamp(bass * 0.55, 0, 0.28) + beat * 0.093"
brightness = "0.50 + clamp(bass * 0.24, 0, 0.12)"

# COLOUR - the cosine palette, drifting slowly and swept by treble.
hue = "0.55 + time * 0.021 + clamp(treb * 0.8, 0, 0.28) + bar * 0.04"

# GEOMETRY MIRROR - the fold count steps up on loud sections; the dihedral
# reflection latches on the beat for a momentarily denser bloom.
mirror_order   = "6"
mirror_reflect = "onset > 0.50"

# VIEW + COMPOSITE - a warm vignetted backdrop behind the sparse figure, and a
# short feedback so the turn leaves a faint spiral wake.
zoom        = "1.04 + bar * 0.07 + clamp(bass * 0.4, 0, 0.16)"
pan_x       = "sin(time * 0.019) * 0.05"
pan_y       = "cos(time * 0.027) * 0.04"
bg_hue      = "0.05 + sin(time * 0.013) * 0.05"
bg_bright   = "0.02 + clamp(mid * 0.10, 0, 0.014)"
bg_vignette = "0.80"

[smoothing]
phase         = 0.91
radial_offset = 1.04
scale         = 0.36
thickness     = 0.31
hue           = 1.04
mirror_order  = 2.34
zoom          = 0.42
bg_bright     = 1.04