# Echo Plate - the Chladni plate as a source for the feedback trail. The plate
# holds a LOW-mode figure (mode_n 1..3, mode_m 4..7) and changes it on the
# bar; the previous figures do not vanish but tunnel outward and turn, so the
# music leaves a nested stack of the patterns it played.
#
# What drives it: bass picks mode_m, mids pick mode_n, both re-taken on the
# bar. trails 0.955 with fb_zoom > 1 and a slow fb_rotate pushes each old
# figure out past the frame edge; the onset nudges fb_zoom, eased over 0.8 s,
# so a busy passage throws the echoes a little faster without a jolt.
#
# The trail is a per-frame max-decay, so at 0.955 an echo lives well under a
# second: in a still the echoes read as zoom STREAKS off the current figure
# rather than as a nested stack. The stack shows in the frames right after the
# figure changes. The first cut at trails 0.86 / fb_zoom 1.04 read as a dim
# ribbed plate with no echo at all; the second, re-taking the figure on every
# beat under fb_zoom 1.07, read as too chaotic to the owner - hence the bar
# hold and the halved zoom and rotation.
#
# Judge: can you still pick out the CURRENT figure from its echoes, or is the
# whole thing a lit fog? The present figure should be the brightest layer.
#
# Horizon (5 simulated min, 96x96, --set bass=0.6,mid=0.45, against a static
# star_pattern control reading delta 0.0000 / monotone 0.00 throughout):
# coverage 0.948 -> 0.975 (monotone 0.50), peak/mean 1.19 -> 1.34 (0.50),
# footprint 0.098 -> 0.003 (0.56). Re-run on the calmer bar-held cut; the
# same shape as the first: settles in the first interval and then breathes,
# nothing piles up. Coverage sits near 0.95 at 96 px because the
# streaks fill a thumbnail - read that as the smear, not as a wash.
system = "analytic_field"
name = "Echo Plate"

[field]
family = "chladni"

[palette]
stops = [
  { at = 0.0,  color = "#020308" },
  { at = 0.45, color = "#0b3a3a" },
  { at = 0.80, color = "#3fd3b0" },
  { at = 1.0,  color = "#e8fff2" },
]

[params]
mode_n     = "1 + floor(clamp(mid, 0, 0.99) * 3)"
mode_m     = "4 + floor(clamp(bass, 0, 0.99) * 4)"
line_width = "0.03"
plate_mix  = "0"
brightness = "1.0"
hue        = "0.02 * sin(time * 0.2)"
trails     = "0.955"
fb_zoom    = "1.04 + clamp(onset * 0.025, 0, 0.015)"
fb_rotate  = "0.02"
bloom_amount    = "0.3"
bloom_threshold = "0.7"

[hold]
mode_n = "bar"
mode_m = "bar"

[smoothing]
fb_zoom = 0.8
