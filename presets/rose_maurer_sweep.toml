# Rose Maurer Sweep - petal count held constant, but the WEB restructures
# continuously. `d`, the angular step between chords, is the "fantastic shapes"
# lever: tiny changes to it completely re-lattice the figure, so driving it is
# the single most transformative thing a rose preset can do.
#
# Here `d` moves on four time-scales at once, which is the whole design:
#   - a slow sine over ~100 s, so the lattice family drifts across a track
#   - a mid-band term, so busy passages restructure faster
#   - a narrow ~2 kHz term, so the lattice answers to where the melody and the
#     vocal sit rather than to the whole 250 Hz - 4 kHz mid average
#   - a per-beat kick, eased just enough to read as a surge rather than a jitter
#
# WHY THE NARROW TERM EARNS ITS PLACE. `mid` is a mean over most of the audible
# range, so it barely moves between a sparse verse and a dense chorus - the
# average is dominated by whatever is always there. A single log band at ~2 kHz
# is nearly silent under a pad and loud under a lead line, so it separates
# passages the wideband scalar reads as identical. It is kept to roughly half
# the mid term's weight because `d` re-lattices the ENTIRE web.
#
# `n` also steps between three petal counts on comparison gates, so the preset
# has three distinct structural personalities layered under the `d` sweep -
# something the single-`d` original could not do.
system = "parametric_curve"
name   = "Rose Maurer Sweep"

[curve]
family = "maurer_rose"

# The geometry mirror below costs nothing in resolution because it replicates
# real geometry BEFORE rasterisation, while `kaleido_*` folds finished pixels -
# so on the line scenes, prefer `mirror_*` when both would do. Since Plan 0033
# the feedback and kaleidoscope stages follow the RENDER TARGET rather than a
# fixed 1280x720, so `trails` no longer costs this preset its sharpness.

[params]
# THE LEVER - three time-scales on the angular step, all of them SLOWED HARD.
# The drift sine went 0.041 -> 0.0068, roughly a 150 s cycle against the old
# ~25 s, so the lattice family now drifts across a whole track rather than
# re-forming every few bars. The mid term and the beat kick are both cut to a
# third: `d` re-lattices the entire web, so a large fast term on it is the most
# restless thing this preset can do, and it was doing all three at once.
d = "71 + sin(time * 0.0068) * 13 + clamp(mid * 1.8, 0, 1.25) + clamp(bin(0.65) * 1.6, 0, 0.60) + beat * 0.70"

# Three petal personalities on the energy. Eased hard below, so the change
# reads as the figure re-forming rather than as a cut.
n = "select(bass + mid > 0.55, 8, select(bass + mid > 0.28, 6, 4))"

samples       = "1500"
phase         = "sin(time * 0.0042) * 0.36 + clamp(bass * 0.30, 0, 0.075)"
radial_offset = "sin(time * 0.0034) * 0.13"

spin          = "0.09 + sin(time * 0.013) * 0.02"
scale         = "0.80 + bar * 0.05 + clamp(bass * 0.30, 0, 0.08)"
draw_progress = "1"

# STROKE - thin: 1500 chords through a low fold is already a dense lattice.
thickness  = "0.85 + clamp(treb * 0.9, 0, 0.47)"
brightness = "0.58 + clamp(mid * 0.35, 0, 0.16)"
hue        = "0.02 + time * 0.019 + clamp(treb * 0.6, 0, 0.24)"

# GEOMETRY MIRROR - low, because `samples` is already carrying the density.
# 1500 x 2 = 3000 segments, well under MAX_SEGMENTS.
mirror_order   = "2"
mirror_reflect = "0"

# VIEW - the camera work is deliberately gentle here. The bass term and the bar
# breath are both roughly halved and the constant below is long: this is the
# preset whose subject is the WEB restructuring, so a pumping camera competes
# with the thing you are meant to be watching.
zoom        = "1.04 + bar * 0.025 + clamp(bass * 0.14, 0, 0.06)"
pan_x       = "sin(time * 0.009) * 0.04"
bg_hue      = "0.00 + sin(time * 0.009) * 0.05"
bg_bright   = "0.016 + clamp(mid * 0.09, 0, 0.012)"
bg_vignette = "0.84"

# FEEDBACK - restored (Plan 0033). Short: 1500 chords already fill, so a long tail only smears.
trails = "0.50 + clamp(mid * 0.18, 0, 0.09)"

[smoothing]
# `d` now gets a LONG constant, not a short one. The old 0.3 s existed to let
# the beat-kick surge; with the kick cut to 0.70 there is nothing to surge, and
# a long constant is what turns the remaining drift into something continuous.
# `n` is longer still, so a petal-count change is a slow re-forming.
d             = 1.60
n             = 5.20
phase         = 2.00
radial_offset = 2.20
scale         = 0.62
thickness     = 0.50
hue           = 1.09
zoom          = 1.00
bg_bright     = 1.04
trails        = 0.55
