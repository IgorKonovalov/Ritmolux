# Warp Drive - the fastest, densest fragment field in the set: a deep domain
# warp churning at high spatial frequency, folded through the screen-space
# kaleidoscope on the loud sections.
#
# THE GLOW CEILING governs this whole family. The old fragment presets ran
# `glow = 0.55 + clamp(treb * 8, 0, 1.1)` and `flash = clamp(onset * 5, 0, 1.3)`
# - at a loud frame that is glow 1.65 and a full-strength strobe on top, which
# blows the field to flat pastel and erases every filament the warp just drew.
# Here `glow` stays near 0.8 and `flash` is capped low; peak energy goes into
# `warp` and `zoom` instead. Note that `zoom` is INVERTED on this scene (Plan
# 0018): a HIGHER zoom shows MORE of the field, so raising it on bass is what
# makes a drop read as finer, busier cells rather than a brighter blur.
system = "fragment_field"
name = "Warp Drive"

[palette]
name = "spectrum"

[palette_b]
stops = [
  { at = 0.00, color = "#04001a" },
  { at = 0.22, color = "#2b0f8f" },
  { at = 0.48, color = "#00b7c7" },
  { at = 0.72, color = "#c6ff4a" },
  { at = 0.88, color = "#ff3d8b" },
  { at = 1.00, color = "#fff0ff" },
]

[params]
# STRUCTURE - the warp is the star, and it is what rises with energy.
warp  = "1.05 + sin(time * 0.071) * 0.18 + clamp(treb * 1.83, 0, 1.10) + beat * 0.22"
zoom  = "1.85 + sin(time * 0.113) * 0.14 + clamp(bass * 0.765, 0, 0.65) + clamp(onset * 0.367, 0, 0.22)"
pan_x = "sin(time * 0.037) * 0.30 + time * 0.010"
pan_y = "cos(time * 0.029) * 0.24"

# LUMINANCE - held near flat, deliberately. See the ceiling note above.
glow  = "0.78 + clamp(mid * 0.188, 0, 0.16)"
flash = "clamp(onset * 0.5, 0, 0.30)"

# COLOUR - the widest window in the set (this is the deliberate full-spread
# preset), racing on time, crossfading into a harder neon gradient on treble.
hue          = "0.70 + time * 0.043 + clamp(mid * 0.26, 0, 0.22)"
color_span   = "0.92 + clamp(treb * 0.5, 0, 0.30)"
color_center = "sin(time * 0.053) * 0.16 + clamp(bass * 0.141, 0, 0.12)"
saturation   = "1.10 + clamp(treb * 0.417, 0, 0.25)"
palette_mix  = "clamp(treb * 1.08, 0, 0.65)"

# COMPOSITE - a fold that steps through three orders with the energy, turning
# on the clock. No `bg_*`: the fragment field draws fullscreen-opaque, so the
# backdrop pass is a no-op behind it.
#
# THE THRESHOLDS ARE MEASURED, NOT GUESSED. These read 0.55 / 0.30 until Plan
# 0041's reachability check proved both branches dead: those numbers were
# written against `--set bass=1` magnitudes, but on music-like material `bass`
# peaks at 0.106 and `treb` at 0.032, so `bass + treb` tops out near 0.138 and
# the fold NEVER FIRED outside a synthetic full-scale still. The band table
# lives in `LOW_LEVELS` in standalone/examples/shot.rs; re-measure with
# `shot --signal dynamic:110`, which prints it on every run.
#
# Placed inside that distribution rather than scaled down proportionally: the
# sum's typical value is ~0.64 on the v2 scale, so 0.80 sits just above it (six-fold on the louder
# passages) and 0.10 near the top (twelve only on real peaks). Proportional
# rescaling would have put both BELOW the mean and left the fold on constantly,
# which is the same bug wearing the opposite sign.
kaleido_order = "select(bass + treb > 1.45, 12, select(bass + treb > 0.80, 6, 1))"
kaleido_angle = "time * 0.17"
trails        = "clamp(onset * 0.567, 0, 0.34)"

[smoothing]
warp          = { attack = 0.02, release = 0.22 }
zoom          = { attack = 0.02, release = 0.30 }
glow          = 0.20
color_span    = 0.30
color_center  = 0.35
palette_mix   = 0.55
kaleido_order = 0.7
trails        = { attack = 0.03, release = 0.55 }
