# Facet - a cold four-point sparkle, cut into three flat planes, in a tight halo.
# The first `shape_field` world on the `star` arm (ADR-0105 / Plan 0091), authored
# after that plan's Phase 6 judged all five star silhouettes good.
#
# THE MECHANISM: this scene hands the palette a DISTANCE, so a band of the
# coordinate is a band of constant distance. Here the first three bands are the
# figure - core, edge, rim - and everything past them is one long graded ground.
#
# -- FOUR NUMBERS THAT ARE NOT TASTE ---------------------------------------------
#
# 1. THE EDGE IS THE OUTLINE. `color_center + color_span` = 0.00149 + 0.05210 =
#    0.05359 = 3/56, so band 3's boundary lands exactly on d = 1, the figure's
#    true outline. Put it anywhere else and you draw an OFFSET of the shape: at
#    1.35x every tip comes back blunt, because an outward offset rounds a convex
#    corner. That is how the first probe sheet for this arm failed.
#
#    THE SUM IS THE INVARIANT, NOT EITHER NUMBER. Both halves moved at Plan 0098
#    Phase 1 (note 3) and the sum did not, which is what kept the outline on the
#    outline through that change.
#
# 2. `palette_steps` IS WHY THIS LOOKS CLEAN. The palette LUT is 256 texels, and
#    a sharp star's inradius (0.20 here) forces `color_span` down near 0.052 - so
#    the figure's whole interior would otherwise be drawn through about 13 texels
#    with a 1-texel edge, which renders as a soft, dirty, upscaled figure
#    (design-backlog 0099). Banding snaps the coordinate to a band CENTRE before
#    the LUT read, so nothing anywhere is interpolated.
#
# 3. THE TWO COLOUR NUMBERS WERE RE-TUNED AT PLAN 0098 PHASE 1, AND THAT IS WHY
#    THEY LOOK ARBITRARY. That phase closed design-backlog 0097: a curved star
#    used to normalize its true distance by the STRAIGHT edge plane's
#    perpendicular, which is always shorter than the figure's real deepest-point
#    distance - so `d` came out negative at the centre and every exterior reading
#    was stretched. For this configuration the reference moved 0.16253 -> 0.20000,
#    a factor of 1.2306, and `d - 1` scales as its reciprocal.
#
#    The repair is a pure re-scaling of the same mapping: `color_span` multiplied
#    by that factor (0.04234 -> 0.05210) and `color_center` taking whatever the
#    sum in note 1 leaves (0.01125 -> 0.00149). Both the outline and the frame
#    corner then land exactly where they did before the engine changed - the
#    corner reads band 19.7 at the resting scale either way. Left untuned it read
#    16.6, i.e. the graded ground never reached its dark end.
#
#    THE OLD `color_center` WAS A DODGE, AND ITS SIZE IS THE PROOF. It existed to
#    hold the coordinate positive over the centre, where the old reference drove
#    `d` negative. The centre's actual coordinate under the shipped numbers was
#    0.00149 - which is exactly the `color_center` the re-scaling above derives.
#    The dodge and the honest value are the same number, because the centre now
#    reads a true `d = 0`.
#
#    `gamma` IS NO LONGER UNSAFE, and the old warning here is retired. `pow` of a
#    negative base is a NaN, and the base is not negative any more. It stays at
#    1.0 because that is the look, not because binding it would break the figure -
#    and note that any exponent keeps band 3 on the outline, since `1^gamma` is 1.
#    What it WOULD reshape is the ground's ramp, which note 4 fits by hand.
#
# 4. THE GROUND IS GRADED, AND THE GATE IS THE REASON. A `shape_field` preset
#    covers every pixel, so a flat dark ground puts ~96 % of the frame in one
#    luminance band and `sanity` fails it as a shape with no interior - measured,
#    on the first draft of this file. The 53 ground bands ramp from a near halo
#    down to black across the 31 bands the frame actually reaches at this scale.
#    The ramp is fitted to that range on purpose: past band 34 nothing is ever
#    drawn, so spending gradient there would waste it.
#
# 5. THE FIGURE IS LARGE AND ONE CONTOUR RING TRACES IT - BOTH ARE THE `animation`
#    GATE RATHER THAN TASTE, AND THE RING IS THE PART THAT ACTUALLY WORKED.
#    What moves pixels here is the STAR's own hard edge, not the ground: the
#    ground's neighbouring tones are close, so sliding them changes little. At a
#    small scale this preset measured `anim` 0.002-0.006 against a 0.01 floor
#    while visibly drifting, and terracing the ground into 8 high-contrast tiers
#    made it WORSE (fewer moving edges beat more contrast), and doubling the
#    figure only reached 0.006. What cleared the floor was a single HIGH-CONTRAST
#    contour ring in the near halo: 0.006 -> 0.021, because `anim` on this scene
#    is driven by contrast across a moving boundary, not by how far anything
#    travels. ADR-0091's sparse-figure rescue does not help - `occlude` lights
#    every pixel, so the lit footprint IS the whole frame and the footprint
#    statistic equals the whole-frame one.
#
#    THE COST IS REAL AND IS RECORDED: this world is less sparse than the
#    direction it was chosen from. Four rings put it at `anim` 0.029 and turned
#    it into a ring field; one ring is the least that clears the floor.
#
# WHAT DRIVES WHAT
#   scale       a slow breath plus the low end - the sparkle opens and closes
#   rotation    a slow turn, a kick on each onset, a re-roll on each detection
#   star_curve  the mids bow and straighten the arms
#   gamma       the top end tightens the graded ground
#   pan_x/pan_y a slow drift across the frame
#   saturation  the top end, gently
#
# 2026-08-27: THIS WORLD DID NOT REACT TO MUSIC AND NOW IT DOES, and note 5's
# old claim - that the drift is the only safe motion lever here - was true when
# it was written and is not any more. It measured bass 0.115 / mid 0.000 /
# treb 0.009 / onset 0.000 with `anim` 0.019; it now measures 0.110 / 0.021 /
# 0.043 / 0.122 with `anim` 0.038. Plan 0098 is what changed: Phase 4b gave the
# scene a `rotation` that moves the SAMPLE POINT rather than the mapping, and
# Phase 1 made `gamma` bindable on a curved star. Both were unavailable to the
# author of this file.

