# Lion - a maned mask drawn as a banded emblem.
# scratch, Plan 0092 Phase 6. NOT in the shipped library.
#
# 54 SVG commands as one closed contour, authored in POLAR and mirrored so the
# mane is symmetric to the pixel. Three things carry the reading, and all three
# were found by rendering rather than by drawing:
#
#  - TUFT LENGTHS VARY. A constant radius reads as a cog or a sun; the mane is
#    short at the crown, longest at the cheek line, and shortens again under the
#    jaw. The first draft swept a near-constant radius and was unmistakably a
#    gearwheel.
#  - THE EAR IS THREE POINTS - rise, wide top, fall - with a deep valley either
#    side. Made as a single long tuft it reads as a horn.
#  - THE MUZZLE PUSHES OUT THROUGH THE BOTTOM OF THE MANE, with a notch either
#    side. This is the one-contour trick for a lion mark: with no eyes and no
#    nose available, the muzzle breaking the outline is what stops the figure
#    reading as a spiky disc. A PROFILE lion was built and tested against this
#    one and is WORSE here - its identity lives in fine features (brow, nose
#    bridge, chin) and the bands swallow every one of them.
#
# COORDINATES ARE AUTHORED Y-UP, NOT SVG'S Y-DOWN. Open engine defect - the
# engine reads the contour in clip space and nothing reconciles it with SVG. When
# that is fixed this `d` needs re-flipping.
#
# THE INTERIOR IS TWO BANDS. At three the inward offsets erode the tufts and the
# mane is gone - the same failure the koi hit with its fins. Broad features
# survive erosion, thin ones do not, and a mane is thinner than it looks.
#
# SCALE 0.40 FROM THE REPORT, not by eye: at 0.50 the mask fills the frame
# (cover 0.980) with no room for the ring family and bass reactivity 0.111; at
# 0.34 it measures 0.199 but the mask is small enough to lose its ears. 0.40
# keeps the reading and measures 0.167.
#
# Alignment, as in the other authored looks: a band edge sits at every multiple of
# 1 / palette_steps and the outline sits at center + span. 14/16 + 2/16 = 16/16,
# so the outline lands on an edge at every phase of the travel. Therefore
# `color_center` may move only in WHOLE BAND STEPS, `color_span` may not be bound
# at all, and `gamma` is safe because 1^g = 1 and it cannot move the edge.
#
# BLOCKED FROM THE SHIPPED SET, AND THE BLOCKER IS THE Y-FLIP. `d` is authored
# Y-UP to compensate for the engine reading an SVG contour in clip space, so this
# file is a workaround for an unfixed defect. Shipping it would bake that
# workaround into the library and it would silently invert the day the parser is
# corrected - the exact failure the close ceremony's curation sweep exists to
# catch. IT LEAVES `pending/` when the parser negates y and this `d` is re-flipped.
#
# LOOK GATE: smoke test passed in the running app, 2026-09-09 (user), on the
# Plan 0092 lane build.
name   = "Path Lion"
system = "shape_field"

[path]
d       = "M 0,0.702 C 0.034,0.702 0.078,0.771 0.102,0.75 C 0.127,0.73 0.118,0.579 0.148,0.579 C 0.179,0.579 0.266,0.762 0.286,0.749 C 0.307,0.736 0.235,0.5 0.272,0.502 C 0.308,0.503 0.444,0.709 0.505,0.756 C 0.565,0.803 0.61,0.799 0.635,0.786 C 0.66,0.774 0.683,0.742 0.656,0.679 C 0.629,0.617 0.448,0.434 0.475,0.413 C 0.501,0.391 0.787,0.566 0.815,0.552 C 0.842,0.539 0.608,0.361 0.641,0.333 C 0.674,0.305 0.998,0.411 1.013,0.387 C 1.028,0.363 0.715,0.227 0.731,0.189 C 0.746,0.15 1.098,0.185 1.106,0.158 C 1.114,0.13 0.785,0.065 0.78,0.024 C 0.774,-0.016 1.082,-0.057 1.076,-0.085 C 1.07,-0.113 0.765,-0.107 0.743,-0.142 C 0.722,-0.177 0.962,-0.269 0.946,-0.293 C 0.929,-0.317 0.676,-0.258 0.647,-0.284 C 0.618,-0.31 0.79,-0.431 0.772,-0.451 C 0.753,-0.471 0.569,-0.388 0.536,-0.405 C 0.503,-0.422 0.6,-0.543 0.573,-0.553 C 0.546,-0.563 0.423,-0.483 0.376,-0.466 C 0.329,-0.449 0.303,-0.418 0.29,-0.452 C 0.277,-0.486 0.318,-0.614 0.3,-0.668 C 0.282,-0.721 0.233,-0.751 0.183,-0.775 C 0.133,-0.798 0.061,-0.81 0,-0.81 C -0.061,-0.81 -0.133,-0.798 -0.183,-0.775 C -0.233,-0.751 -0.282,-0.721 -0.3,-0.668 C -0.318,-0.614 -0.277,-0.486 -0.29,-0.452 C -0.303,-0.418 -0.329,-0.449 -0.376,-0.466 C -0.423,-0.483 -0.546,-0.563 -0.573,-0.553 C -0.6,-0.543 -0.503,-0.422 -0.536,-0.405 C -0.569,-0.388 -0.753,-0.471 -0.772,-0.451 C -0.79,-0.431 -0.618,-0.31 -0.647,-0.284 C -0.676,-0.258 -0.929,-0.317 -0.946,-0.293 C -0.962,-0.269 -0.722,-0.177 -0.743,-0.142 C -0.765,-0.107 -1.07,-0.113 -1.076,-0.085 C -1.082,-0.057 -0.774,-0.016 -0.78,0.024 C -0.785,0.065 -1.114,0.13 -1.106,0.158 C -1.098,0.185 -0.746,0.15 -0.731,0.189 C -0.715,0.227 -1.028,0.363 -1.013,0.387 C -0.998,0.411 -0.674,0.305 -0.641,0.333 C -0.608,0.361 -0.842,0.539 -0.815,0.552 C -0.787,0.566 -0.501,0.391 -0.475,0.413 C -0.448,0.434 -0.629,0.617 -0.656,0.679 C -0.683,0.742 -0.66,0.774 -0.635,0.786 C -0.61,0.799 -0.565,0.803 -0.505,0.756 C -0.444,0.709 -0.308,0.503 -0.272,0.502 C -0.235,0.5 -0.307,0.736 -0.286,0.749 C -0.266,0.762 -