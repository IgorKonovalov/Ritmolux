# Maple - an authored silhouette drawn as a banded emblem.
# scratch, Plan 0092 Phase 6. NOT in the shipped library.
#
# The figure is 54 SVG commands / 314 coordinates as one closed contour: five
# sharp tips, four deep reflex sinuses, a tooth on every lobe edge, a hairline
# stem. The first content anywhere that uses [path].
#
# COORDINATES ARE AUTHORED Y-UP, NOT SVG'S Y-DOWN. The engine reads the contour
# in clip space, which is Y-up, and nothing reconciles that with SVG's Y-down -
# so a path pasted from a design tool arrives MIRRORED and this file
# pre-compensates. That is an open engine defect, not a style: when it is fixed,
# `d` has to be re-flipped and this comment deleted.
#
# THE RULE THE WHOLE FILE IS BUILT ON - a band edge sits at every multiple of
# 1 / palette_steps, and the figure's outline sits at `color_center + color_span`.
# Put the second exactly on the first and the silhouette reads CRISP; miss it and
# the leaf dissolves into the ring family (measured across four spans - at 5 and 8
# interior bands the leaf is gone). Here steps = 16, center = 14/16, span = 3/16,
# so the outline lands on a band edge at every phase of the travel. Every number
# is a multiple of 1/16 for that reason. They are arithmetic, not taste.
#
# WHAT MAY AND MAY NOT BE BOUND, which follows from that rule:
#  - `color_center` MAY be bound only in WHOLE BAND STEPS - `beat_index / 16`.
#    A continuous drift walks the outline off its band edge and blunts the leaf
#    every frame between steps. Stepping keeps the alignment exact at all times,
#    and the rings marching outward one band per hit is the preset's main event.
#    `beat_index` counts onset DETECTIONS, not musical beats (ADR-0109) - which is
#    the sanctioned use, because a change on activity is exactly the point.
#  - `color_span` MUST NOT be bound at all. It moves the outline off the edge and
#    there is no increment that keeps it there while still reading as a change.
#  - `gamma` IS safe, and it is the only interior lever that is. At the outline
#    d = 1, and 1^g = 1 for any g, so gamma provably cannot move the silhouette's
#    edge - it only redistributes the bands inside it. Driven DOWNWARD on bass
#    (1.0 -> 0.80) the bands spread away from the rim and the leaf opens. Driving
#    it UPWARD was tried and crowds the interior contours into moire at the rim:
#    loud read busier and muddier than quiet, the inverted-preset failure.
#
# The palette runs the autumn ramp TWICE across the LUT (period 0.5). One cycle
# was tried first and is wrong here: the travel sweeps the figure through the
# whole ramp, so with a single cycle there are phases where leaf and ground sit
# in the same region and the emblem goes muddy. At period 0.5 a 3/16 window
# straddles a real dark/light change at every phase. Both ends are the same
# oxblood so the wrap is seamless.
#
# The outline is drawn as a 64-point polyline and is visibly FACETED. That is the
# measured ceiling, not a tuning choice: at this figure's complexity the arc-chain
# fit is discarded for exceeding MAX_ARC_PIECES, and `samples` caps at 64.
#
# BLOCKED FROM THE SHIPPED SET, AND THE BLOCKER IS THE Y-FLIP. `d` is authored
# Y-UP to compensate for the engine reading an SVG contour in clip space, so this
# file is a workaround for an unfixed defect. Shipping it would bake that
# workaround into the library and it would silently invert the day the parser is
# corrected - the exact failure the close ceremony's curation sweep exists to
# catch. IT LEAVES `pending/` when the parser negates y and this `d` is re-flipped.
#
# LOOK GATE: smoke test passed in the running app, 2026-09-09 (user), on the
# Plan 0092 lane build.
name   = "Path Maple"
system = "shape_field"

[path]
d       = "M 0,-1 C 0,-1 0.017,-0.78 0.022,-0.7 C 0.027,-0.62 0.005,-0.553 0.028,-0.52 C 0.051,-0.487 0.115,-0.487 0.16,-0.5 C 0.205,-0.513 0.25,-0.607 0.3,-0.6 C 0.35,-0.593 0.403,-0.473 0.46,-0.46 C 0.517,-0.447 0.58,-0.533 0.64,-0.52 C 0.7,-0.507 0.82,-0.38 0.82,-0.38 C 0.82,-0.38 0.653,-0.297 0.64,-0.26 C 0.627,-0.223 0.757,-0.183 0.74,-0.16 C 0.723,-0.137 0.6,-0.117 0.54,-0.12 C 0.48,-0.123 0.387,-0.197 0.38,-0.18 C 0.373,-0.163 0.447,-0.053 0.5,-0.02 C 0.553,0.013 0.637,0.003 0.7,0.02 C 0.763,0.037 0.83,0.053 0.88,0.08 C 0.93,0.107 1,0.18 1,0.18 C 1,0.18 0.86,0.22 0.8,0.22 C 0.74,0.22 0.697,0.177 0.64,0.18 C 0.583,0.183 0.517,0.243 0.46,0.24 C 0.403,0.237 0.313,0.143 0.3,0.16 C 0.287,0.177 0.387,0.3 0.38,0.34 C 0.373,0.38 0.27,0.363 0.26,0.4 C 0.25,0.437 0.333,0.523 0.32,0.56 C 0.307,0.597 0.193,0.58 0.18,0.62 C 0.167,0.66 0.253,0.76 0.24,0.8 C 0.227,0.84 0.14,0.827 0.1,0.86 C 0.06,0.893 0,1 0,1 C 0,1 -0.06,0.893 -0.1,0.86 C -0.14,0.827 -0.227,0.84 -0.24,0.8 C -0.253,0.76 -0.167,0.66 -0.18,0.62 C -0.193,0.58 -0.307,0.597 -0.32,0.56 C -0.333,0.523 -0.25,0.437 -0.26,0.4 C -0.27,0.363 -0.373,0.38 -0.38,0.34 C -0.387,0.3 -0.287,0.177 -0.3,0.16 C -0.313,0.143 -0.403,0.237 -0.46,0.24 C -0.517,0.243 -0.583,0.183 -0.64,0.18 C -0.697,0.177 -0.74,0.22 -0.8,0.22 C -0.86,0.22 -1,0.18 -1,0.18 C -1,0.18 -0.93,0.107 -0.88,0.08 C -0.83,0.053 -0.763,0.037 -0.7,0.02 C -0.637,0.003 -0.553,0.013 -0.5,-0.02 C -0.447,-0.053 -0.373,-0.163 -0.38,-0.18 C -0.387,-0.197 -0.48,-0.123 -0.54,-0.12 C -0.6,-0.117 -0.723,-0.137 -0.74,-0.16 C -0.757,-0.183 -0.627,-0.223 -0.64,-0.26 C -0.653,-0.297 -0.82,-0.38 -0.82,-0.38 C -0.82,-0.38 -0.7,-0.507 -0.64,-0.52 C -0.58,-0.533 -0.517,-0.447 -0.46,-0.46 C -0.403,-0.473 -0.35,-0.593 -0.3,-0.6 C -0.25,-0.607 -0.205,-0.513 -0.16,-0.5 C -0.115,-0.487 -0.051,-0.487 -0.028,-0.52 C -0.005,-0.553 -0.027,-0.62 -0.022,-0.7 C -0.017,-0.78 0,-1 0,-1 Z"
samples = 64

[params]
scale           = "0.52 + clamp(bass * 0.0471, 0, 0.04)"
palette_steps   = "16"
color_span      = "0.1875"
color_center    = "mod(0.875 + beat_index / 16, 1)"
gamma           = "1.0 - clamp(bass * 0.2353, 0, 0.20)"
palette_contour = "0.60 + clamp(treb * 0.4167, 0, 0.25)"
coord_mode      = "0"

[smoothing]
scale           = 0.18
gamma           = 0.30
palette_contour = 0.12

[palette]
stops = [
  { at = 0.00, color = "#3a1410" },
  { at = 0.11, color = "#8c2f14" },
  { at = 0.22, color = "#c46a1e" },
  { at = 0.34, color = "#e0a03c" },
  { at = 0.42, color = "#f2d79a" },
  { at = 0.50, color = "#3a1410" },
  { at = 0.61, color = "#8c2f14" },
  { at = 0.72, color = "#c46a1e" },
  { at = 0.84, color = "#e0a03c" },
  { at = 0.92, color = "#f2d79a" },
  { at = 1.00, color = "#3a1410" },
]
