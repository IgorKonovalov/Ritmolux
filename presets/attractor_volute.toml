# Volute - Barnsley's spiral drawn as gilded scrollwork: one dominant arm map
# unwinding through its own substructure, amber-gold on a near-black indigo
# vault. The register is ornament - a breaking wave of nested scrolls - and
# nothing else in the library draws it: the figure worlds are emblems, clouds
# and drawings; this one is filigree.
#
# THE FIGURE IS FRAGILE UNDER curl, MEASURED AT THE PROBE: +0.25 rad breaks
# the arm into disconnected rosettes and the wave is gone. So the wind stays
# gentle (+/-0.10 ceiling) and the reactivity budget goes to WEIGHT instead:
# `bias` shifts sampling density from the arm to the two satellite copies -
# geometry untouched, only where the ink lands - so treble makes the small
# scrolls glitter while the arm holds the composition. That is the
# peak-buys-structure rule in this family's own vocabulary.
#
# vigor's ceiling is SILENT and this figure sits nearly against it (the arm
# map contracts at ~0.93-0.96), so vigor only works downward here: loud thins
# the scroll toward wire rather than fattening it into wash.
#
# NO ROTATION (standing verdict): a scroll has an "up", so `spin` is a slow
# shallow rock, never a revolution.
system = "attractor"
name = "Volute"

[particles]
family = "spiral"

# One ramp: indigo night, ember, amber, cream. root_hue bands it outward from
# the arm's fixed points, so the scroll cores sit warmer than their tips.
[palette]
stops = [
  { at = 0.00, color = "#0a0618" },
  { at = 0.30, color = "#8a2f08" },
  { at = 0.60, color = "#e8951f" },
  { at = 0.85, color = "#ffd67a" },
  { at = 1.00, color = "#fff8e2" },
]

[params]
# GLOW - the scroll cores are the only thing meant to cross the knee.
bloom_amount    = "1.4"
bloom_threshold = "0.9"
bloom_radius    = "1.3"

# THE WIND - gentle by measurement (see header). A slow wander keeps the
# scroll alive in silence; bass leans into the wind on the loud sections.
# Rate ~0.2, not the family's ~0.03: an IFS figure is still, so the wander IS
# the silent animation (this file read 0.0056 against the 0.01 floor at the
# inherited rate; frames 24 v 48 in silence).
curl = "sin(time * 0.23) * 0.10 + clamp(bass * 0.082, 0, 0.070)"
# THE WEIGHT - the real instrument. Treble pours density into the satellite
# scrolls; the beat taps it too, so each kick glints across the substructure.
# The bias swing is the main silent motion (+/-0.30, the dissolve's measured
# gate-clearing amplitude): weight pours between the arm and the satellites
# and the substructure visibly re-inks, with the geometry held.
bias = "0.05 + sin(time * 0.27) * 0.30 + clamp(treb * 0.42, 0, 0.25) + beat * 0.10"
# Downward-only, per the silent ceiling: loud draws the scroll finer.
# The breath rests at 0.97 and swings +/-0.07, deliberately mostly BELOW 1:
# the arm sits near the silent ceiling, so the up side would clamp flat, and
# it is the down-swing - the scroll tightening toward wire and relaxing -
# that the eye (and the silence gate) actually sees. This is the file's main
# structural motion alongside the bias pour.
vigor = "0.96 + sin(time * 0.25) * 0.09 - clamp(bass * 0.059, 0, 0.050) + beat * 0.025"
# Sway - the translations rotate a touch, the wave leans with the mids.
lean  = "sin(time * 0.21) * 0.16 + clamp(mid * 0.071, 0, 0.060)"

# COLOUR - gold that deepens with the mix rather than whitening. The arm and
# its satellites split a little along the ramp so the small scrolls read
# slightly paler than the arm; root_hue bands warmth outward from the cores.
map_tint   = "0.26 + clamp(onset * 0.20, 0, 0.12)"
hue_spread = "0.10 + clamp(treb * 0.067, 0, 0.04)"
# The breathing rate matters to the animation gate as much as to the eye: the
# scroll is thin and its trail long, so the gold's slow warm-cool breath is a
# real share of the motion the silence gate can see.
hue_center = "0.46 + sin(time * 0.16) * 0.07 + clamp(bass * 0.118, 0, 0.10)"
saturation = "1.25 + clamp(mid * 0.29, 0, 0.25)"
root_hue   = "0.07 + clamp(mid * 0.106, 0, 0.090)"

# DENSITY - the scroll is thin lines over empty night, so it takes a longer
# accumulation and a broader nib than the emblem figures before it reads as
# gilding rather than dust. Bass sharpens; the beat lays one wet stroke.
# 0.895, down from a first-draft 0.915: the long accumulation low-passed the
# levers into blur and the silence gate read 0.006 against its 0.01 floor.
# ~9 frames still gilds; the breath now registers.
fade   = "0.895 - clamp(bass * 0.047, 0, 0.040) - beat * 0.015"
size   = "0.58 - clamp((bass + treb) * 0.083, 0, 0.120) + beat * 0.070"
reseed = "onset > 0.50"

# VIEW - the wave fills a wide frame; a slow shallow rock, gentle breathing.
spin  = "sin(time * 0.30) * 0.25"
zoom  = "0.96 + bar * 0.04 + clamp(bass * 0.071, 0, 0.060)"
pan_x = "0.0"
pan_y = "sin(time * 0.26) * 0.05"

# COMPOSITE - deep indigo vault, strong vignette; the gilding is the light.
bg_hue      = "0.62 + sin(time * 0.011) * 0.04"
bg_bright   = "0.009 + clamp(mid * 0.024, 0, 0.020)"
bg_vignette = "0.86"

[smoothing]
curl       = 0.50
bias       = { attack = 0.04, release = 0.35 }
vigor      = { attack = 0.03, release = 0.30 }
lean       = 0.55
map_tint   = 0.30
hue_center = 0.40
hue_spread = 0.45
root_hue   = 0.50
fade       = 0.20
size       = { attack = 0.02, release = 0.26 }
zoom       = 0.16
bg_bright  = 0.40
