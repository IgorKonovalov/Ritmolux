# Rose Overflow - the deliberate blowout: a dense web whose `scale` is pumped
# far past the frame on the low end, so a loud hit sends the rose off every edge
# and leaves the bright central void the Maurer reference figures are known for.
# The renderer clips, which is the intended effect, not an accident.
#
# `radial_offset` (Plan 0028) is what makes this version work where the original
# only had `scale`: pushing the radius off-origin opens the figure into an
# annulus, so the "void" is a real structural hole in the curve rather than just
# the middle of a figure that got too big. The two levers pump together.
#
# SEGMENT BUDGET: 3200 chords with NO geometry mirror. This is the one preset in
# the set that spends its whole budget on chord count, which is why the mirror
# is off - 3200 x 2 folds would still fit, but the overflow reads better as one
# continuous web than as a replicated one.
system = "parametric_curve"
name   = "Rose Overflow"

[curve]
family = "maurer_rose"

# The geometry mirror below costs nothing in resolution because it replicates
# real geometry BEFORE rasterisation, while `kaleido_*` folds finished pixels -
# so on the line scenes, prefer `mirror_*` when both would do. Since Plan 0033
# the feedback and kaleidoscope stages follow the RENDER TARGET rather than a
# fixed 1280x720, so `trails` no longer costs this preset its sharpness.

[params]
# SHAPE - the petal count steps with the low end, so the lattice re-forms as it
# blows up. Eased below so it morphs through the intermediate webs.
#
# `n` steps 2 -> 5 across the low end, and this was the WORST-calibrated
# expression in the family: `bass * 7` against a raw bass mean of 0.040
# gives 0.28, so `floor(2 + ...)` returned 2 essentially always and the petal
# count - the preset's headline mechanism - never stepped at all. At x60 the
# mean lands mid-ladder and a peak reaches the top of it.
n             = "floor(2 + clamp(bass * 4.38, 0, 3.72))"
d             = "97"
samples       = "3200"
phase         = "sin(time * 0.0175) * 0.30 + clamp(mid * 0.26, 0, 0.22)"

# THE BLOWOUT - the two levers that pump together, and this preset is where the
# family's peak energy is SUPPOSED to go: it spends loud passages on sheer
# geometric size rather than on luminance, which is why it can be driven this
# hard without clipping. It already measured the most reactive rose in the set;
# the gains here just make it reach its own caps on real audio.
radial_offset = "0.10 + clamp(bass * 0.624, 0, 0.53) + beat * 0.074"
scale         = "1.35 + clamp(bass * 1.75, 0, 1.49)"

spin          = "0.06 + sin(time * 0.011) * 0.02"
draw_progress = "1"

# STROKE - very thin. Thousands of chords at any real weight is a solid blob,
# and at peak this figure is denser still. Caps stay tight for that reason.
thickness  = "0.62 + clamp(treb * 0.533, 0, 0.32)"
brightness = "0.52 + clamp(bass * 0.141, 0, 0.12)"
hue        = "mod(0.60 + time * 0.024 + clamp(mid * 0.282, 0, 0.24), 1)"

mirror_order   = "1"
mirror_reflect = "0"

# VIEW + COMPOSITE - the camera pulls back slightly as the figure blows up, so
# some structure survives at peak instead of everything leaving frame at once.
# The pull-back matters more now that `scale` actually reaches its cap: with the
# gain fixed, a peak really does blow the figure past the frame, and this is
# what keeps some structure on screen when it does.
zoom        = "1.00 - clamp(bass * 0.212, 0, 0.18) + bar * 0.05"
pan_x       = "sin(time * 0.017) * 0.05"
bg_hue      = "0.28 + sin(time * 0.009) * 0.05"
bg_bright   = "0.016 + clamp(mid * 0.0141, 0, 0.012)"
bg_vignette = "0.84"

# FEEDBACK - restored (Plan 0033). The slowest spin in the set, so a long tail stays legible.
trails = "0.62 + clamp(treb * 0.167, 0, 0.10)"

[smoothing]
# The blowout surges out and eases back like a real pump.
scale         = 0.30
radial_offset = { attack = 0.06, release = 0.70 }
# `n` keeps the longest constant here and it is the one place in the family
# where a long one is still right: it gates a DISCRETE petal count, so a short
# constant would flicker between two figures whenever the low end sits near a
# step. Long enough to commit, short enough to be a response.
n             = 0.80
phase         = 0.45
thickness     = 0.32
hue           = 0.55
zoom          = 0.30
bg_bright     = 0.60
trails       = 0.55
