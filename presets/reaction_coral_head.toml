# Coral Head - the SOLITON regime: fat rounded lobes with interior holes,
# drifting like the massive folded surface of a brain-coral head. The lowest
# feed rate of the four RD presets, which is what gives it big soft masses where
# Coral gets dividing spots and Coral Bloom gets thin reaching fronds.
#
# See `reaction_coral.toml` for the reactivity note that governs this family.
# This one is the slowest and most massive of the four, so it leans hardest on
# the view transform for its motion - the field itself barely hurries, and a
# camera that travels across it is what keeps the preset alive through a long
# passage.
system = "reaction_diffusion"
name = "Coral Head"

[palette]
stops = [
  { at = 0.00, color = "#0a1a14" },
  { at = 0.18, color = "#14524a" },
  { at = 0.40, color = "#d6591a" },
  { at = 0.70, color = "#ff9836" },
  { at = 1.00, color = "#ffe6b0" },
]

[palette_b]
name = "aurora"

[params]
# CHEMISTRY - solitons. The lowest feed in the family; the lobes stay massive
# rather than dissolving into spots.
# THE WORM REGIME - F 0.0580 / k 0.0630, the high-feed end of Gray-Scott space
# and a long way from where this preset used to sit (0.0222 / 0.0512, which is
# the same dense-maze neighbourhood the other three occupied). Worms grow as
# elongated open strands that curl and branch WITHOUT closing into a labyrinth,
# so the field keeps wide dark channels between them. That is a different
# silhouette from Coral's isolated spots rather than a different tint of the
# same texture, which is the whole point of spreading the four apart.
# Modulation centred and bounded to stay inside the pattern-forming band - see
# the long note in `reaction_coral.toml`, where getting this wrong froze the
# field completely. F 0.0580 was also too far up: it measured as a near-
# duplicate of Coral rather than as worms, because that far out the field barely
# organises at all. 0.0380 / 0.0610 is the worms-and-loops regime proper.
feed   = "0.0340 + sin(time * 0.033) * 0.0016 + clamp(bass * 1.18, 0, 1) * 0.0020"
kill   = "0.0575 + cos(time * 0.024) * 0.0008 + (sin(bar * pi) - 0.5) * 0.0010 + clamp(mid * 1.18, 0, 1) * 0.0008"
flow   = "1.00 + clamp(treb * 1.67, 0, 1) * 0.22"
inject = "beat"

# THE FAST LEVERS - broad contours and a loose hatch keep the lobes soft.
# Thinned so the channels between the worms stay open - the same reasoning as on
# Coral, where dense iso-lines were filling back in the gaps the chemistry had
# just made.
contour = "3.4 + sin(time * 0.47) * 1.7 + clamp(treb * 4.33, 0, 2.6) + beat * 1.4"
hatch   = "3.4 + sin(time * 0.26) * 0.9 + clamp(mid * 2.12, 0, 1.8)"
glow    = "0.85 + clamp((bass + mid) * 0.147, 0, 0.25)"

# VIEW - UNPINNED (Plan 0033), and this is the lever the family used to lack.
# The Gray-Scott field is finite but TOROIDAL, and the present sampler now
# WRAPS, so `pan_*` is a seamless infinite scroll rather than a walk off the
# edge. `zoom` is usable in both directions too: below 1.0 magnifies (the
# Catmull-Rom reconstruction landed in the same plan, so it no longer reads as
# angular pixel blobs), above 1.0 tiles. Keep zoom under ~1.3 - past that the
# repeat becomes legible as wallpaper rather than as more field.
zoom  = "0.70 + sin(time * 0.013) * 0.06 + clamp(bass * 0.165, 0, 0.14)"
pan_x = "sin(time * 0.009) * 0.07"
pan_y = "time * 0.009 + cos(time * 0.007) * 0.05"

# COLOUR - warm lobes over green-teal valleys, drifting toward aurora greens.
color_span   = "2.00 + clamp(mid * 0.41, 0, 0.35)"
color_center = "sin(time * 0.0170) * 0.06"
saturation   = "1.05 + clamp(treb * 0.333, 0, 0.20)"
palette_mix  = "0.30 + sin(time * 0.0063) * 0.28"

# COMPOSITE - a long feedback so the drifting mass smears, plus the backdrop
# showing through the interior holes.
trails      = "0.50 + clamp(mid * 0.141, 0, 0.12)"
# bg_hue is a coordinate in THIS preset's gradient now (ADR-0086), and 0.56 landed
# in the bright orange at at=0.40..0.70 - the same warm value the coral itself
# draws in, so the frame went to khaki mud. 0.12 sits in the deep sea-green
# between at=0.00 and at=0.18: a cool dark ground under warm coral, which is the
# relationship the old shared cosine gave by accident and this gradient can give
# on purpose.
bg_hue      = "0.12 + sin(time * 0.0083) * 0.04"
bg_bright   = "0.024 + clamp(mid * 0.0176, 0, 0.015)"
bg_vignette = "0.70"

[smoothing]
contour     = { attack = 0.03, release = 0.38 }
hatch       = 0.28
glow        = 0.32
zoom        = 0.25
color_span  = 0.45
palette_mix = 1.2
trails      = 0.50
bg_bright   = 0.45
