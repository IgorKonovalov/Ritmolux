# Coral Head - a Gray-Scott reaction-diffusion field in a high-fill regime: fat,
# rounded lobes with interior holes, like the massive folded surface of a brain-coral
# head.
#
# Colour (Plan 0020): a custom warm gradient - deep green-teal crevice -> orange lobe
# -> pale-gold crown - so the massive lobes read warm over green-cyan valleys (the
# field level is the gradient coordinate: crevice low, lobe crown high). Versus Coral's
# cool teal thin maze; the old preset described this and had gone cyan under spectrum.
#
#   - bass swells the fill via feed, mid trims it via kill, both staying inside the
#     filled band so the lobes stay massive rather than dissolving to spots;
#   - treble gently coarsens via flow; each beat stamps fresh growth.
# Broad iso-contours (4) and a loose hatch keep the lobes soft and filled.
#
# Variables available to expressions: bass mid treb onset beat bar time.
system = "reaction_diffusion"
name = "Coral Head"

[palette]
stops = [
  { at = 0.0,  color = "#0a1a14" },
  { at = 0.18, color = "#14524a" },
  { at = 0.4,  color = "#d6591a" },
  { at = 0.7,  color = "#ff9836" },
  { at = 1.0,  color = "#ffe6b0" },
]

[params]
feed         = "0.022 + clamp(bass * 4, 0, 1) * 0.006"
kill         = "0.051 + clamp(mid * 4, 0, 1) * 0.002"
flow         = "1.0 + clamp(treb * 4, 0, 1) * 0.25"
inject       = "beat"
contour      = "4"
hatch        = "6"
glow         = "0.9 + clamp((bass + mid) * 3, 0, 1) * 0.5"
color_span   = "2.0"
color_center = "sin(time * 0.02) * 0.02"
