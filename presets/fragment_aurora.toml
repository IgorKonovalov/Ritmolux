# Aurora - polar-light curtains: the slowest, most atmospheric fragment preset,
# built to evolve on `time` so it stays beautiful through a long ambient passage
# with almost no audio to work with. Four incommensurate sines drive the warp,
# the sample window and the colour centre, so the curtains fold and unfold on
# periods of ~50 to ~200 seconds and never repeat.
#
# This is also the preset that most needs the family's glow ceiling (see
# `fragment_warp.toml`): an aurora is a LOW-luminance phenomenon with a lot of
# internal structure, and the old version pushed `glow` to 0.95+ on the bands,
# which flattened the curtains into a pastel smear.
#
# AIR-AGAINST-LOW-MID ON THE COLOUR (Plan 0034). A real aurora's colour is set by
# what is being excited, not by how loud it is - so the colour centre rides the
# CONTRAST between two narrow probes: `bin(0.84)` (~6.6 kHz air) minus
# `bin(0.31)` (~242 Hz low-mid). It is signed, so the clamp is signed too. A dark,
# bass-heavy passage pulls the curtain green; an open, cymbal-lit one pushes it
# toward the lilac end; a crescendo that lifts both ends together leaves it put,
# which is exactly what the `treb` term above cannot do on its own.
#
# READ THIS BEFORE MOVING EITHER POSITION - two traps, and both bit here.
#
# 1. `bin()` is a NARROW PROBE, not a region average. It interpolates between two
#    adjacent bands, so one call sees about 2 of the 64, and the difference is not
#    academic: measured against a 6.5 kHz tone, `bin(0.84)` reads 0.094 while
#    `bin(0.82)` and `bin(0.88)` both read exactly ZERO. Averaging a few calls
#    spot-samples a region rather than integrating it. That is why this is framed
#    as two probes and not as a spectrum-wide tilt - a tilt is what `treb - bass`
#    already gives you, those scalars being true means over their ranges. Use
#    `bin()` for selectivity, the band scalars for regions.
#
# 2. THE AXIS IS NOW GENUINELY LOGARITHMIC END TO END, and this note used to say
#    the opposite. Until Plan 0048 every band was floored at one FFT bin (23.4 Hz
#    at 48 kHz), which bound the axis linear up to ~750 Hz and made a log-curve
#    fit up to 2.9x wrong down there. ADR-0049's second, longer analysis window
#    feeds the bands below the ~246 Hz crossover, so the edges follow
#    `35 * 514.3^x` everywhere and the fit is now exact:
#
#        bin(0.20) ~ 122 Hz   bin(0.31) ~ 242 Hz   bin(0.52) ~ 899 Hz
#        bin(0.24) ~ 157 Hz   bin(0.39) ~ 399 Hz   bin(0.84) ~ 6.6 kHz
#
#    THE POSITIONS IN THIS FILE MOVED BECAUSE OF THAT. The low probe of the
#    contrast was `bin(0.14)`, which read ~246 Hz on the old half-linear axis and
#    reads ~84 Hz on this one - a kick probe, not a low-mid, which would have made
#    the curtain lurch green on every bass hit. It is `bin(0.31)` now, back at the
#    246 Hz this preset was designed around. Above the crossover nothing moved:
#    `bin(0.84)` was ~6.5 kHz before and is ~6.6 kHz now.
system = "fragment_field"
name = "Aurora"

[palette]
name = "aurora"

[palette_b]
stops = [
  { at = 0.00, color = "#00110d" },
  { at = 0.30, color = "#0b4a3a" },
  { at = 0.55, color = "#2fd39a" },
  { at = 0.78, color = "#7fd8ff" },
  { at = 1.00, color = "#e9d6ff" },
]

[params]
# STRUCTURE - slow folding curtains. Bass deepens the fold; nothing snaps. The
# second, narrower term reads ~157 Hz alone - the bass body rather than the sub -
# so it creases the curtain further on a bassline note than the wideband term
# does on its own. It was `bin(0.08)`, which read ~153 Hz on the old half-linear
# axis and would read ~58 Hz on this one; `bin(0.24)` keeps it on the frequency
# it was tuned for, so what this term listens to has not changed.
warp  = "0.52 + sin(time * 0.0430) * 0.14 + cos(time * 0.0197) * 0.09 + clamp(bass * 1.12, 0, 0.95) + clamp(bin(0.24) * 1, 0, 0.30)"
zoom  = "2.20 + sin(time * 0.0231) * 0.24 + bar * 0.12 + clamp(bass * 1.06, 0, 0.90)"
pan_x = "sin(time * 0.0137) * 0.34 + time * 0.004"
pan_y = "cos(time * 0.0101) * 0.20"

# LUMINANCE - low and nearly flat. Aurorae are dim; the structure carries it.
glow  = "0.56 + clamp((bass + mid) * 0.2, 0, 0.34)"
flash = "clamp(onset * 0.333, 0, 0.20)"

# COLOUR - the whole gradient across the frame at once, its centre swaying
# slowly, crossfading into a colder green-to-lilac variant over minutes.
color_span   = "0.80 + sin(time * 0.0173) * 0.12 + clamp(mid * 0.53, 0, 0.45)"
color_center = "0.04 + sin(time * 0.0290) * 0.12 + clamp(treb * 0.5, 0, 0.30) + clamp((bin(0.84) - bin(0.31)) * 1.2, -0.18, 0.18)"
saturation   = "0.95 + clamp(mid * 0.59, 0, 0.50)"
palette_mix  = "0.5 + sin(time * 0.0077) * 0.45"

# COMPOSITE - a long, soft feedback so the curtains leave their own afterglow.
trails = "0.55 + clamp(mid * 0.188, 0, 0.16)"

[smoothing]
warp         = 0.45
zoom         = 0.40
glow         = 0.45
color_span   = 0.60
color_center = 0.60
palette_mix  = 1.2
trails       = 0.60
saturation   = 0.40
