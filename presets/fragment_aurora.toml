# Aurora - polar-light curtains that now sweep the FULL aurora palette: deep green
# through bright green and teal into violet, instead of parking in the green third.
# color_span opened to 0.85 (was 0.40) so the whole gradient shows across the field
# at once; color_center makes a slow sway and treble nudges the window up toward
# violet for a cool high-end accent. bass swells the fold; a slow sin keeps it
# alive when quiet.
#
# Variables available to expressions: bass mid treb onset beat bar time.
system = "fragment_field"
name = "Aurora"

[palette]
name = "aurora"

[params]
warp         = "0.42 + sin(time * 0.11) * 0.1 + clamp(bass * 9, 0, 0.7)"
zoom         = "0.85 + sin(time * 0.05) * 0.06 + bar * 0.1"
glow         = "0.5 + clamp((bass + mid) * 7, 0, 0.95)"
flash        = "clamp(onset * 2.5, 0, 0.8)"
color_center = "0.04 + sin(time * 0.08) * 0.05 + clamp(treb * 3, 0, 0.08)"
color_span   = "0.85"
saturation   = "1.0"
