# Glacier - cold, vast and cohesive: deep blue through cyan to near-white, held
# in a NARROW colour window so only that band shows. Low warp keeps the field in
# broad sheets rather than churn, and a gentle six-fold screen fold turns those
# sheets into crystal facets.
#
# `color_span` is the cohesion lever here (Plan 0020) - low span is what makes
# this read as one designed cold palette instead of a rainbow, and it is why
# this preset no longer needs a crushed `zoom` to hide the wheel. That freed the
# zoom to open the field back up: the old version sat at 0.62, which on this
# INVERTED-zoom scene showed almost no field at all and rendered as a flat blue
# gradient. Structure and cohesion are now controlled by separate knobs, which
# is the whole point of the palette surface.
system = "fragment_field"
name = "Glacier"

[palette]
name = "ice"

[palette_b]
stops = [
  { at = 0.00, color = "#01060f" },
  { at = 0.32, color = "#0a2f5e" },
  { at = 0.60, color = "#2f86b8" },
  { at = 0.82, color = "#9fd8ea" },
  { at = 1.00, color = "#f4fdff" },
]

[params]
# STRUCTURE - broad slow sheets, opened up so the facets have something to fold.
#
# GAINS CALIBRATED AGAINST MEASURED LEVELS, TWICE. The first pass fixed gains
# that were decoration: `bass * 1.2` capped at 0.48 moved 0.048 on a 0.46 base
# against a raw bass mean of 0.040, and this was one of the two deadest presets
# in the library. ADR-0049 then made `bass` a fraction of its own recent peak,
# which multiplied every level by ~16x and pinned those same gains to their caps
# from just above silence - dead again, in the mirror direction.
# The multipliers below are derived, not guessed: a cap is reached at 0.85 of
# full scale (0.60 for treb/onset, whose distributions sit lower), so a typical
# passage delivers about half the cap and a peak reaches it.
warp  = "0.46 + sin(time * 0.0210) * 0.11 + clamp(bass * 0.61, 0, 0.52) + clamp(onset * 0.267, 0, 0.16)"
zoom  = "2.80 + sin(time * 0.0143) * 0.24 + bar * 0.14 + clamp(bass * 0.52, 0, 0.44)"
pan_x = "sin(time * 0.0091) * 0.24"
pan_y = "cos(time * 0.0127) * 0.18 + time * 0.003"

# LUMINANCE - the dimmest in the set. Glaciers are not bright; they are pale.
# Gained like everything else, but the CAPS are barely raised: reactivity was
# the problem, and luminance is the one place where fixing it by opening the cap
# would clip the pale end of the palette to flat white.
glow  = "0.52 + clamp(mid * 0.235, 0, 0.20)"
flash = "clamp(onset * 0.3, 0, 0.18)"

# COLOUR - the tightest window in the fragment family. Do not widen it without
# also reconsidering the palette; the cohesion IS the preset.
color_center = "0.10 + sin(time * 0.0230) * 0.05 + clamp(treb * 0.267, 0, 0.16)"
color_span   = "0.34 + clamp(mid * 0.306, 0, 0.26)"
saturation   = "0.94 + clamp(treb * 0.467, 0, 0.28)"
palette_mix  = "0.35 + sin(time * 0.0071) * 0.30"

# COMPOSITE - a low fold for facets, stepping up on loud material, and a long
# feedback that reads as ice depth.
#
# THE GATE WAS THE REAL BUG, and it has now been wrong in both directions.
# `bass + mid > 0.42` was written against `--set bass=1,mid=1` magnitudes where
# the sum is 2; on raw audio the sum meant 0.046, so it never fired and this
# preset sat at three folds for the entire life of the program. 0.035 fixed
# that - and then ADR-0049 normalized the bands, the sum's typical value became
# ~0.71, and 0.035 was never FALSE. Same dead gate, other branch.
# 0.56 sits just under the typical sum, so a normal passage folds and a quiet
# one relaxes back - the intent this line has carried since the beginning.
kaleido_order = "select(bass + mid > 0.56, 6, 3)"
# EDGE: tile (1), chosen in motion. A border-filling field, so the old crop was
# exactly the rejected behaviour. The mirrored continuation gives the corners real
# crystal structure; squash read softer and cloudier.
kaleido_edge  = "1"
kaleido_angle = "time * 0.031"
trails        = "0.62 + clamp(mid * 0.188, 0, 0.16)"

[smoothing]
# Shortened across the board. The gains above are what make this preset move;
# these are what let the movement ARRIVE. At 0.50-0.55 s a swell took most of a
# bar to land, which on top of gains a tenth this size is why it read as frozen.
warp          = 0.30
zoom          = 0.34
glow          = 0.34
color_center  = 0.38
color_span    = 0.34
palette_mix   = 1.3
# Still long, and deliberately the longest here: this one gates a DISCRETE jump
# between three and six folds, and the sum it reads hovers near the threshold
# for whole passages. Short would flicker between two figures.
kaleido_order = 1.1
trails        = 0.45
