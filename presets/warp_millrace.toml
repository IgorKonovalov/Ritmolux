# Millrace - a differential rotation with no zoom to speak of: the throat turns
# fast, the rim turns backward, and the field between them is sheared into a
# spiral (Plan 0104 Phase 4b). Authored fresh-slate (ADR-0089).
#
# THIS IS THE MOTION `fb_rotate` CANNOT MAKE. A single affine turns the whole
# frame rigidly - every pixel through the same angle - so it can spin a picture
# but it can never wind one up. `rot` bound per vertex against `rad` gives each
# radius its own angular rate, and a rate that CHANGES with radius is precisely
# the definition of shear: neighbouring rings slide past each other and any mark
# laid across them is drawn out into a spiral. `swirl` in the `[feedback]` warp
# family does something similar to a whole frame; this does it to a field that
# is also being fed, which is what makes the spiral continuous rather than a
# one-off distortion.
#
# THE SIGN CHANGE IS THE POINT. At `rad` 0 the rate is +1.05 rad/s and at the
# rim it is -0.25 - so there is a stationary circle partway out where the two
# senses cancel, and the winding runs in opposite directions either side of it.
# One-signed, this would be a pinwheel; signed, it is a millrace.
#
# NO TUNNEL: `zoom` sits just under 1, so the field creeps inward rather than
# outward - the opposite of `warp_wellhead`, which was authored in the same
# sitting as this world's deliberate other end. With `wrap` off, what reaches
# the middle simply goes; nothing comes back from beyond the frame, which is the
# transparent-border policy the trails stage already takes.
#
# HORIZON VERDICT, ten simulated minutes at 96x96, bass 0.6 / mid 0.45:
#
#   coverage   0.2950 -> 0.7157   delta +0.4207   monotone 0.45
#   peak/mean  7.1852 -> 3.5009   delta -3.6843   monotone 0.45
#   footprint  0.2693 -> 0.1888   delta -0.0805   monotone 0.42
#
# The delta is the fill: a `warp_mesh` field starts empty, so the 0 s row is the
# picture before it exists (see `warp_wellhead`'s header, which records the
# family-wide reading). Every monotone sits near 0.45, so all three statistics
# wander rather than travelling, and the rows hold their band after the fill.
#
# WHAT DRIVES WHAT. Mid feeds the race, bass slows the inward creep (a loud
# passage holds the water up), treble bends the arms' spin and onset brightens
# the deposit. The `[per_vertex]` audio term is small and rides `bass` because
# `[smoothing]` CANNOT ease a per-vertex binding - the smoother holds one scalar
# and a series has no single value - so anything bound in that table arrives
# unsmoothed.
system = "warp_mesh"
name   = "Millrace"
representative = true

[mesh]
x = 48
y = 36

[per_vertex]
# THE SHEAR (see header). Linear in `rad` rather than smoothstepped, because
# here the sign change is the feature and a smooth ramp would soften exactly the
# place it happens.
rot = "1.05 - rad * 1.3"
# Just under 1: a slow inward creep, opened slightly by the low end.
zoom = "0.965 + clamp(bass * 0.029, 0, 0.025)"

[palette]
stops = [
  { at = 0.00, color = "#1a0b26" },  # peat
  { at = 0.30, color = "#5c2a52" },  # heather
  { at = 0.58, color = "#a8484f" },  # rust
  { at = 0.82, color = "#e0a45a" },  # amber
  { at = 1.00, color = "#fff0d0" },  # foam
]

[params]
wrap = "0"

decay = "0.18 + clamp(bass * 0.071, 0, 0.06)"

# A wide ring with three arms - fewer than Wellhead's six, because a shear field
# stretches every arm into a long spiral and six of them close the frame up.
deposit        = "2.1 + clamp(mid * 1.29, 0, 1.1) + clamp(onset * 0.83, 0, 0.5)"
deposit_radius = "0.44"
deposit_width  = "0.06"
deposit_arms   = "3"
deposit_twist  = "1.4"
deposit_spin   = "-0.35 - clamp(treb * 0.5, 0, 0.3)"

darken_center = "0.1"

hue           = "0.06"
color_span    = "0.85"
color_center  = "time * 0.0045"
saturation    = "1.0"
# Three flat wedges to match the three arms - the one crisp edge this system
# can draw, since everything it deposits is a gaussian.
palette_steps = "3"
brightness    = "0.62 + clamp(mid * 0.141, 0, 0.12)"

exposure     = "0.8 + clamp(bass * 0.235, 0, 0.2)"
bloom_amount = "0.28 + clamp(onset * 0.67, 0, 0.4)"
bloom_threshold = "0.9"
bloom_radius = "1.3"

[smoothing]
# Scalars only. A line naming `rot` or `zoom` would be ignored with a warning,
# because both are bound per vertex above.
decay        = 0.4
deposit      = { attack = 0.04, release = 0.5 }
deposit_spin = 0.5
brightness   = 0.3
exposure     = { attack = 0.05, release = 0.4 }
bloom_amount = { attack = 0.03, release = 0.4 }
