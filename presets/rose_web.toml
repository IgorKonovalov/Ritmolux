# Rose Web - the densest line figure in the set and the most literal answer to
# "more lines": 1600 chords on an n=2/d=39 Maurer curve, four-fold mirrored, at
# the thinnest stroke the renderer draws cleanly. It reads as a woven steel
# lattice rather than a flower, and the whole point is the moire that appears
# where the chords cross.
#
# SEGMENT BUDGET (MAX_SEGMENTS = 20_000): 1600 x 4 = 6400, doubling to 12800
# when the dihedral reflection latches. Raising `samples` and `mirror_order`
# together is how you overflow the cap - the drop is surfaced, not silent, but
# the figure is truncated, so change one at a time.
system = "parametric_curve"
name   = "Rose Web"

[curve]
family = "maurer_rose"

# The geometry mirror below costs nothing in resolution because it replicates
# real geometry BEFORE rasterisation, while `kaleido_*` folds finished pixels -
# so on the line scenes, prefer `mirror_*` when both would do. Since Plan 0033
# the feedback and kaleidoscope stages follow the RENDER TARGET rather than a
# fixed 1280x720, so `trails` no longer costs this preset its sharpness.

[params]
# SHAPE - a low petal count with a high chord count is what makes a lattice
# instead of a bloom. The radial offset opens it off-origin into an annulus on
# a slow cycle, which is where the best moire lives.
n             = "2"
d             = "39"
samples       = "1600"
#
# `radial_offset` IS THIS PRESET'S MECHANISM, and that is what now distinguishes
# it inside the family. At n = 2 the rose is a pair of lobes rather than a
# many-petalled disc, and pushing it off origin opens those lobes into a wide
# sparse annulus - so the audio changes the TOPOLOGY of the figure here, not
# just its petal shape. The other survivors morph mostly through `phase`. This
# is the open, airy one, and the only member of the five that is not a disc.
#
# Gains against measured levels (v2: bass typically ~0.42, mid ~0.41): the old
# `bass * 0.4` capped at 0.087 moved the radius by 0.016 on a real mix, which is
# invisible against a sine term of 0.20 sitting beside it.
phase         = "sin(time * 0.052) * 0.46 + clamp(mid * 0.353, 0, 0.30)"
# Treble reshapes the web rather than lighting it (Plan 0045 review: this
# preset read treb 0.000 - every binding rode `mid`). `radial_offset` is the
# rose's own geometry, so the top end changes what the figure IS.
radial_offset = "0.18 + sin(time * 0.0093) * 0.20 + clamp(bass * 0.47, 0, 0.40) + clamp(treb * 0.367, 0, 0.22)"

# NO SPIN - `spin` is angular velocity, so anything nonzero is a permanent turn.
#
# This preset leaned on it harder than the others (the lattice shimmered as the
# crossings swept past), so the shimmer has to come from somewhere else, and it
# does: `phase` advances the petals THROUGH the figure rather than rotating the
# finished figure, which moves the crossings against each other instead of
# moving all of them together. That is the better source of moire anyway - a
# rigid rotation slides the whole interference pattern past the eye unchanged,
# while a phase advance reshapes it. The rate is raised to take over.
spin          = "0"
scale         = "0.76 + bar * 0.05 + clamp(mid * 0.282, 0, 0.24)"
draw_progress = "1"

# STROKE - the thinnest in the set. A thick stroke at this chord count fills
# solid and destroys the moire that is the entire preset.
thickness  = "0.95 + clamp(mid * 0.53, 0, 0.45) + clamp(treb * 0.5, 0, 0.30)"
brightness = "0.70 + clamp(mid * 0.188, 0, 0.16)"

# COLOUR - cool steel blues, sweeping slowly.
hue = "mod(0.05 + time * 0.022 + clamp(mid * 0.306, 0, 0.26) + sin(time * 0.041) * 0.05, 1)"

# GEOMETRY MIRROR - modest, because the chord count is already carrying the
# density. Reflection on a hard onset rather than every beat.
#
# The note this comment used to carry was wrong, and worth correcting rather
# than deleting: `onset > 0.40` was not "reachable but rare", it was DEAD, and
# so was the 0.18 that replaced it. `onset` WAS raw spectral flux, peaking at
# 0.016 on music-like material, so this web never once reflected, and 0.007 was
# what "genuine hits" cost on that scale. ADR-0049 has since made `onset` the
# normalized 0..1 envelope the original 0.40 assumed it already was - so the
# threshold is back up at 0.44, and this time the variable underneath it means
# what the number reads. A bare comparison is not a `select` condition, so
# `--report` reachability still cannot see this shape; it is checked by hand
# against the level table in docs/presets.md.
mirror_order   = "select(mid > 0.58, 6, 4)"
mirror_reflect = "onset > 0.44"

# VIEW + COMPOSITE - pushed in slightly so the lattice runs off the frame edge,
# over a cold backdrop, with a long feedback that thickens the weave.
zoom        = "1.10 + bar * 0.05 + clamp(bass * 0.188, 0, 0.16)"
pan_x       = "sin(time * 0.017) * 0.06"
pan_y       = "cos(time * 0.0113) * 0.05"
bg_hue      = "0.30 + sin(time * 0.009) * 0.05"
bg_bright   = "0.018 + clamp(mid * 0.0141, 0, 0.012)"
bg_vignette = "0.84"

# FEEDBACK - restored (Plan 0033) but the SHORTEST in the set. 6400 segments at the highest brightness here: a longer tail fills the weave solid and erases the moire that is the whole preset.
trails = "0.30 + clamp(mid * 0.094, 0, 0.08)"

[smoothing]
# Constants cut by roughly two thirds, same as the rest of the family. Gains and
# easing were BOTH wrong on these presets, and fixing only one leaves the other
# in charge: a big term behind a 1.3 s constant still arrives a bar late.
phase         = 0.42
radial_offset = 0.48
scale         = 0.38
thickness     = 0.32
spin          = 0.40
mirror_order  = 1.4
hue           = 0.60
zoom          = 0.40
bg_bright     = 0.60
trails       = 0.55
