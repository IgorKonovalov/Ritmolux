# Drift - ambient and weightless: a nearly frozen field with large, soft, sparse
# particles, so the swarm hangs as a slow nebula instead of streaming anywhere.
# The quietest, most spacious preset in the set, and the one that best rewards a
# long ambient passage - it evolves almost entirely on `time`, so it keeps
# changing when the audio gives it nothing.
#
# THIS FILE CARRIES THE FAMILY'S SHARED NOTES. The swarm set was cut from five
# presets to three in Plan 0043 (Flow and Burst retired), and the two mechanisms
# every swarm author needs were documented in the files that went. They are here
# now, along with the flocking geometry this file always owned.
#
# THE FORCE CEILING. An older version of this set ran `force = 1.1 + clamp(bass
# * 16, 0, 3)`, which at a loud frame is ~4 against a scene default of 1.4 -
# hard enough that every particle is flung to the frame edge and the middle of
# the picture goes black. Loud is supposed to look like MORE, and it looked like
# nothing. Every swarm preset holds `force` inside roughly 0.7 - 2.4 and spends
# peak energy on churn, size, colour and the composite instead. Drift sits at the
# very bottom of that range: even a loud frame barely moves the steering, because
# the point of it is that nothing is in a hurry.
#
# THE GRAIN/EXPOSURE SPLIT, which is what actually separates these three. Band
# assignment is nearly invisible in a still; sprite size, exposure length and -
# since Plan 0043 - FIELD FREQUENCY are what the eye separates:
#
#   Dense   size 0.62   trails 0.76   spin 0.130   field_freq ~5.2   tight ribbons
#   Drift   size 2.55   trails 0.86   spin 0.040   field_freq ~1.9   broad nebula
#   Storm   size 1.20   trails 0.50   spin 0.155   field_freq ~3.0   torn churn
system = "swarm"
name = "Drift"
representative = true

[palette]
name = "aurora"

[palette_b]
stops = [
  { at = 0.00, color = "#381c63" },
  { at = 0.35, color = "#935fb8" },
  { at = 0.65, color = "#e28ccd" },
  { at = 1.00, color = "#ffeed1" },
]

[params]
# MOTION - three incommensurate sines so the cloud never settles into a loop,
# and DRIFT'S DRIVER IS MID.
#
# That last part is what now separates this preset from Flow and Storm. All
# three used to ride `bass` with a token `mid` term, which is most of the reason
# they read as the same preset three times over. Mid carries the sustained body
# of a mix - pads, chords, vocal weight - so it swells across bars instead of
# punching on beats, which is exactly the slow nebula this preset is for. Storm
# takes the transients, Flow takes the top end, Drift takes the middle.
#
# The gains are against MEASURED levels (v2, normalized: mid typically ~0.41,
# max 0.019), which is why the multipliers look enormous next to what was here.
# They are not hot - they are simply the size a mid term has to be to reach its
# own cap. The old `mid * 0.7` capped at 0.15 moved `spin` by about 0.004 on a
# real mix, which is the numeric form of "does not react to music".
#
# `spin` IS NOT VORTICITY - it is the flow field's RATE OF CHANGE. The scene
# accumulates `field_phase += spin * dt` and samples the field at that phase, so
# `spin` says how fast the streamlines themselves are rewritten, and this is the
# single parameter that decides whether the swarm reads as a flock or as noise.
#
# THE SIN AMPLITUDE WENT 0.010 -> 0.060 (Plan 0122), and that is a REPAIR, not a
# new idea. Until that plan the scene computed `field_t = time * spin`, which
# multiplied this wobble by elapsed time: the term contributed `t * 0.010 *
# sin(0.019t)`, whose derivative carries a `0.00019 * t` piece, so by t = 300 s
# the field's rate swung +/-0.057 against a nominal 0.040 and the field
# periodically ran BACKWARDS at up to 1.4x the forward rate - with the swing
# growing without bound as a set ran. That rewind is a real part of what this
# file's opening line means by "it evolves almost entirely on `time`". Once
# `spin` integrates honestly, a 0.010 wobble is a +/-0.5-unit ripple on a steady
# advance and the field stops reversing at all, which measured as the cloud
# settling: over ten simulated minutes at a constant mid, coverage fell 0.60 ->
# 0.52 with peak/mean above 18 on four rows of ten - the piling-onto-attractors
# signature `swarm_shatter.toml` records from Plan 0075's three live failures.
# At 0.060 the rate itself swings through zero, so the field genuinely advances
# and rewinds, bounded and independent of elapsed time: same run reads coverage
# 0.60 -> 0.81 and peak/mean 5.29 -> 3.26. Image-domain proxies at 96x96 from
# one stimulus, not a gate (ADR-0099); the verdict was the app, 2026-08-27.
#
# At the old values (0.07 up to 0.35) the field was being redrawn faster than a
# particle could traverse it. Every frame each particle was steered somewhere
# new by a field that had already moved on, so ten thousand of them averaged out
# into a uniform shimmer - which is exactly what "looks lame" was seeing. It was
# not too few particles or too little reactivity; it was that no two of them
# were ever going the same way.
#
# Held near-frozen instead. With the field almost static, particles fall onto
# its streamlines and STAY on them, so neighbours travel together, funnel
# through the same channels and peel off at the same places. That is flocking,
# and it emerges from the field rather than from any per-particle rule. Drift
# gets the lowest value of the five - a high, lazy flock whose formation holds
# for many seconds at a time.
#
# AND `force` IS THE OTHER HALF, discovered by bracketing it rather than by
# reasoning. Freezing the field alone does not give a flock - it gives a
# COLLAPSE. At force 1.95 the steering completely overrides each particle's
# retained momentum (the scene keeps 86 % of velocity per frame), so within a
# couple of seconds every one of the ten thousand had committed to the field's
# attracting curve and the rest of the frame was empty. One bright ribbon is not
# a flock either.
#
# The flock lives in the balance: weak enough steering that particles keep their
# own momentum and CROSS streamlines, strong enough that they still tend along
# them. Measured at 0.85 / 1.15 / 1.45 with everything else fixed, 1.15-1.20 is
# where the field stays populated while showing density waves, gathering crests
# and thinning wakes - birds moving together without being a single line.
# DRIFT NOW OWNS THE COARSEST GRAIN AND THE SLOWEST FIELD. See the family split
# documented in `swarm_dense.toml`: the three calm swarms used to sit within
# 20 % of each other on every lever, so they read as one preset regardless of
# which band drove them. Drift takes the large-sprite, near-frozen end.
force = "1.20 + sin(time * 0.037) * 0.16 + cos(time * 0.023) * 0.10 + clamp(mid * 0.47, 0, 0.40)"
spin  = "0.040 + sin(time * 0.019) * 0.060 + clamp(mid * 0.041, 0, 0.035)"

# STRUCTURE - `field_freq` is new in Plan 0043 and it is the lever this preset
# had been missing. `spin` says how fast the streamlines are rewritten and Drift
# holds it near zero on purpose; `field_freq` says how LARGE they are, which is a
# shape the preset can move without giving up its stillness.
#
# Drift takes the coarse end of the family: around 1.9, breathing between roughly
# 1.5 and 2.4. At that scale a handful of currents span the whole frame, so
# neighbouring particles share one for a long time and the nebula gathers into
# slow arcs rather than resolving into separate streams. Below ~1.2 the structure
# grows larger than the frame and the picture flattens into an undifferentiated
# mass - measured, and the reason the low bound here is not lower.
#
# Mid drives it, like everything else on this preset: a sustained passage TIGHTENS
# the field, so the nebula draws itself into visible channels as the pads swell
# and relaxes back into a wash when they fall away. That is a structural response
# to music, which this family could not express before.
field_freq = "1.90 + sin(time * 0.029) * 0.42 + cos(time * 0.017) * 0.16 + clamp(mid * 0.65, 0, 0.55)"
# Deliberately the weakest burst of the three: a transient here should ripple
# through the cloud, not detonate inside it.
burst = "clamp(beat * 0.5 + clamp(onset * 0.83, 0, 0.5), 0, 1.1)"

# APPEARANCE - `size` goes back UP to 2.20, and the reasoning that had pulled it
# down to ~1.05 needs correcting rather than deleting, because it was half
# right. The old note said a big sprite fogs the frame and hides the streamline
# structure. That was measured at spin 0.085; at 0.040 the field is slow enough
# that the blobs travel TOGETHER, so the coherence survives the sprite size and
# what you get is large soft grain with visible flow in it rather than fog. The
# fog was the fast field, not the sprite.
#
# The trade the old note describes is real but it is a TRADE, not a rule: fine
# sprites resolve individuals, coarse sprites resolve mass. Dense takes the
# first (0.58), Drift takes the second - that separation is the whole point,
# and collapsing both to ~1.05 is how the family lost its identities.
#
# The depth cue is free and worth knowing about: the scene multiplies each
# particle's brightness by its own SPEED (`0.25 + speed * 0.7`). On a coherent
# field, particles in the fast channels are markedly brighter than ones idling
# in slack water, so the flock separates into bright leading streams and dim
# trailing bodies without any depth parameter existing. A coarse sprite softens
# that gradient rather than erasing it - it reads as depth in a cloud instead of
# as individual leaders, which suits this preset.
#
# BOTH WENT UP FOR PLAN 0043, and neither is a taste change - they are paying for
# two engine changes that each removed light from the frame. The domain now
# extends a quarter past the visible frame so the wrap seam is off-screen, which
# puts about a quarter of the ten thousand particles outside the picture at any
# moment; and each particle is now faded by its depth, which costs the far half
# of the swarm roughly half its brightness. A file carried over unchanged reads
# dimmer and sparser than it did, and the fix is here rather than in the engine.
brightness = "0.96 + clamp(mid * 0.235, 0, 0.20)"
size       = "2.55 + sin(time * 0.031) * 0.26 + clamp(mid * 0.41, 0, 0.35) + sin(bar * pi) * 0.16"

# COLOUR - the slowest hue journey in the set: a full slow wander through the
# aurora band, crossfading into a violet-to-amber gradient over minutes.
hue_spread  = "0.34 + sin(time * 0.017) * 0.10 + clamp(treb * 0.333, 0, 0.20)"
hue_center  = "0.62 + sin(time * 0.0130) * 0.16 + clamp(mid * 0.165, 0, 0.14)"
saturation  = "0.94 + clamp(treb * 0.4, 0, 0.24)"
palette_mix = "0.5 + sin(time * 0.0091) * 0.45"

# VIEW - a very slow wander, and since Plan 0043 it is a REAL parallax rather
# than a figure of speech. Each particle now carries a depth that scales how much
# of the pan it takes, so a near one crosses the frame about 1.9x faster than a
# far one and this slow drift separates the cloud into sliding layers instead of
# translating it as a sheet. On the slowest preset in the set that is the single
# most valuable thing depth bought: there is finally something happening in a
# still ten seconds apart other than the particles having moved.
#
# THE `zoom` WALL MOVED, IT DID NOT VANISH, and the arithmetic is worth having in
# front of you before reaching for it. The old note here said zoom below 1.0
# exposes the particle domain as a hard rectangle inset from the frame; that
# rectangle is now a quarter-frame further out, so the camera has room. What
# comes back first is not the rectangle but the WRAP SEAM, and pan brings it back
# sooner than zoom alone does, because the near depth layer takes 1.25x of both:
#
#   seam clears while   1.25 * (1 + (zoom - 1) * 1.25) - |pan| * 1.25  >  1
#
# At this file's pan of 0.16 that bottoms out around zoom 0.99, which is why the
# base sits at 1.04 with a 0.05 swing rather than being pulled back further.
# Trading pan for zoom is the move if a future edit wants genuine empty space -
# at pan 0.10 the same expression clears down to about 0.94.
zoom  = "1.04 + sin(time * 0.021) * 0.05 + bar * 0.04 + clamp(bass * 0.141, 0, 0.12)"
pan_x = "sin(time * 0.0170) * 0.16"
pan_y = "cos(time * 0.0113) * 0.11"

# COMPOSITE - a long, soft exposure over a deep violet field. The nebula is
# mostly made of its own afterimage.
# Lengthened. Persistence is what draws each bird's flight PATH rather than its
# position, and on a coherent field those paths are parallel - which is most of
# what makes a flock legible as a flock in a still frame.
trails      = "0.86 + clamp(mid * 0.0706, 0, 0.06)"
bg_hue      = "0.17 + sin(time * 0.0083) * 0.06"
bg_bright   = "0.012 + clamp(mid * 0.0118, 0, 0.010)"
bg_vignette = "0.68"

[smoothing]
# Still the longest constants of the three swarms - Drift is the slow one and
# that is its identity - but pulled in by roughly a third. At 0.8-1.2 s, on top
# of gains that moved the params by fractions of a percent, this preset had no
# mechanism left that could respond to anything. Slow is a character; frozen is
# a bug, and it measured as the latter.
force       = 0.55
# `spin` gets the longest constant in the file now. It is the formation's
# coherence, and a formation that reorganises on a band term is not a formation.
spin        = 1.30
brightness  = 0.38
size        = 0.34
trails      = 0.55
zoom        = 0.38
hue_center  = 0.65
hue_spread  = 0.65
palette_mix = 1.2
bg_bright   = 0.5
# The longest constant in the file after `spin`, and for the same reason: field
# SCALE is formation geometry, and a nebula that re-scales itself on a band term
# is not a nebula. This is the slow breath, not a response.
field_freq  = 1.60
