# Rose Trails - light-painting: a briskly spinning rose routed through the
# engine feedback stage, so each rotated position leaves a fading trace and the
# flower smears into a continuous glowing spiral. The figure you see is almost
# entirely AFTERIMAGE - only a thin leading edge is the current frame.
#
# The old version ran `trails = 0.82 + bass` at `brightness = 1.0`, which
# saturated the feedback buffer to a solid white ball within a second (its
# measured frame coverage was 0.026 - a dot). The two numbers are coupled: a
# max-decay feedback at 0.85 holds roughly seven times the energy of a single
# frame, so the source has to be DIM for the accumulation to land at a sensible
# exposure. Brightness here is 0.42 and the trail sits near 0.80.
system = "parametric_curve"
name   = "Rose Trails"

[curve]
family = "maurer_rose"

[params]
# SHAPE - deliberately simple. The spiral is made by the motion, not the curve,
# and a busy figure smears into mush.
n             = "3"
d             = "80"
samples       = "260"
#
# THE BRUSH PATH takes the peak energy on this preset. The figure is a moving
# stroke rather than a static shape, so morphing `phase` and `radial_offset`
# changes the path the brush travels and the whole painted ribbon reorganises -
# a far larger visual change per unit of drive than anything luminance could buy
# here, and this is a preset where luminance is genuinely dangerous (see the
# stroke note below).
phase         = "sin(time * 0.028) * 0.38 + clamp(bass * 0.52, 0, 0.44)"
radial_offset = "0.20 + sin(time * 0.015) * 0.22 + clamp(mid * 0.306, 0, 0.26)"

# MOTION - the fastest spin in the set, and a STEADY one. This IS the
# light-painting brush, and a brush whose speed jerks with the music paints a
# lurching stroke rather than a spiral.
spin          = "1.25 + sin(time * 0.029) * 0.08"
# BIGGER - the ribbon now sweeps most of the frame rather than a third of it.
scale         = "0.80 + bar * 0.10 + clamp(bass * 0.33, 0, 0.28)"
draw_progress = "1"

# STROKE - MORE GLOW, bought mostly with thickness rather than brightness,
# because the coupling note above still governs. `thickness` is the halo: the
# line quad has a quadratic falloff from a bright core, so widening it adds glow
# around the stroke. `brightness` moves only a little (0.42 -> 0.50) - it is the
# term that saturated the buffer to a white ball in the old version. Push
# thickness first if you want more; brightness is the dangerous one.
#
# HELD DELIBERATELY MODEST, and here is why the usual verification does not
# apply: this preset cannot be judged from a `--set` still at all. The spin is
# 1.25 and the feedback is max-decay, so a held excitation accumulates a full
# rotation's sweep into a saturated blob NO MATTER what these values are - a
# five-way sweep from 1.10 to 2.30 rendered indistinguishably, including the
# untouched original. Only the running app, with real material, separates them.
# So this sits mid-range rather than at the top of what a still would allow.
#
# The gains below are corrected to measured levels, but the CAPS are held where
# they were - that restraint is the point of the paragraph above and it survives
# the recalibration unchanged. What the old expressions did was reach a fraction
# of these caps on real audio; what they do now is reach them. Nothing is being
# opened up.
thickness  = "1.70 + clamp(bass * 0.65, 0, 0.55)"
brightness = "0.50 + clamp(bass * 0.13, 0, 0.11)"
hue        = "mod(0.48 + time * 0.038 + clamp(treb * 0.467, 0, 0.28), 1)"

mirror_order   = "3"
mirror_reflect = "beat"

# VIEW - the pan is what turns a spiral into a ribbon travelling across frame.
zoom  = "1.05 + bar * 0.09 + clamp(bass * 0.26, 0, 0.22)"
pan_x = "sin(time * 0.037) * 0.16"
pan_y = "cos(time * 0.029) * 0.12"

# COMPOSITE - the subject. Long, and lengthening with the low end.
trails      = "0.78 + clamp(bass * 0.153, 0, 0.13)"
bg_hue      = "0.50 + sin(time * 0.011) * 0.06"
bg_bright   = "0.012 + clamp(mid * 0.0118, 0, 0.01)"
bg_vignette = "0.86"

[smoothing]
# `spin` keeps a long constant on purpose - it is the brush speed, and the
# header explains why that must not jerk. The SHAPE params are what come down,
# because those are what the music is now allowed to move.
spin          = 0.65
phase         = 0.42
radial_offset = 0.50
scale         = 0.36
thickness     = 0.36
hue           = 1.04
zoom          = 0.42
trails        = 1.3
bg_bright     = 1.04