# Reef - the LABYRINTH regime: dense interlocking channels like the folded
# ridges of brain coral. Warm-cored, so the field level paints cool crevices and
# hot walls at once, and folded through the screen-space kaleidoscope on loud
# sections into something closer to a rose window than a reef.
#
# See `reaction_coral.toml` for the reactivity note that governs this family -
# the chemistry is slow, so the beat lives in `contour`/`hatch`, the view
# transform and the composite. Fine iso-contours and a tight hatch are what give
# these ridges their inner spine, and they respond immediately.
system = "reaction_diffusion"
name = "Reef"

[palette]
stops = [
  { at = 0.00, color = "#041a1e" },
  { at = 0.40, color = "#0c6f6a" },
  { at = 0.66, color = "#e2631c" },
  { at = 0.85, color = "#ff9d3c" },
  { at = 1.00, color = "#ffe0a0" },
]

[palette_b]
name = "ice"

[params]
# CHEMISTRY - labyrinth. Distinctly lower feed than Coral's mitosis, which is
# what keeps the two from reading as the same field.
feed   = "0.0250 + sin(time * 0.033) * 0.0026 + clamp(bass * 1.6, 0, 1) * 0.0055"
kill   = "0.0550 + cos(time * 0.024) * 0.0010 + clamp(mid * 1.6, 0, 1) * 0.0028"
flow   = "1.00 + clamp(treb * 1.0, 0, 1) * 0.24"
inject = "beat"

# THE FAST LEVERS - fine contours give the ridges their spine.
contour = "9.0 + clamp(treb * 6.0, 0, 5.0) + beat * 2.0"
hatch   = "3.5 + clamp(mid * 2.5, 0, 2.0)"
glow    = "0.80 + clamp((bass + mid) * 0.45, 0, 0.26)"

# VIEW - PINNED NEAR NATIVE, and this is a hard constraint, not a taste call.
# The Gray-Scott field is a fixed 256x256 grid, already upscaled ~7x at 1080p.
# `zoom` is INVERTED here (higher shows more of the field) and it is unusable in
# BOTH directions: above 1.0 it samples outside the simulated field and renders
# vertical bars and rectangular blocks; below 1.0 it magnifies the 256px grid
# until the pattern reads as angular pixel blobs instead of organic growth. Any
# real pan at zoom 1.0 walks off the field for the same reason. So this family
# sits at ~0.99 with a whisper of drift, and takes its motion from the chemistry,
# the contour/hatch rendering and the colour instead.
zoom  = "0.99"
pan_x = "sin(time * 0.0130) * 0.008"
pan_y = "cos(time * 0.0091) * 0.006"

# COLOUR - the warm-cored gradient, cooling toward `ice` on the top end.
color_span   = "2.20 + clamp(mid * 0.8, 0, 0.40)"
color_center = "sin(time * 0.0210) * 0.05"
saturation   = "1.05 + clamp(bass * 0.7, 0, 0.20)"
palette_mix  = "clamp(treb * 1.3, 0, 0.42)"

# COMPOSITE - the rose window. Two orders on an energy gate, turning slowly.
kaleido_order = "select(bass + mid > 0.40, 8, 1)"
kaleido_angle = "time * 0.043"
bg_hue        = "0.06 + sin(time * 0.0091) * 0.05"
bg_bright     = "0.020 + clamp(mid * 0.10, 0, 0.013)"
bg_vignette   = "0.76"

[smoothing]
contour       = 0.18
hatch         = 0.25
glow          = 0.30
zoom          = 0.20
color_span    = 0.45
palette_mix   = 0.90
kaleido_order = 1.4
bg_bright     = 0.40
