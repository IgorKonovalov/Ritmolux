# Reef - the LABYRINTH regime: dense interlocking channels like the folded
# ridges of brain coral. Warm-cored, so the field level paints cool crevices and
# hot walls at once, and folded through the screen-space kaleidoscope on loud
# sections into something closer to a rose window than a reef.
#
# See `reaction_coral.toml` for the reactivity note that governs this family -
# the chemistry is slow, so the beat lives in `contour`/`hatch`, the view
# transform and the composite. Fine iso-contours and a tight hatch are what give
# these ridges their inner spine, and they respond immediately.
system = "reaction_diffusion"
name = "Reef"

[palette]
stops = [
  { at = 0.00, color = "#041a1e" },
  { at = 0.40, color = "#0c6f6a" },
  { at = 0.66, color = "#e2631c" },
  { at = 0.85, color = "#ff9d3c" },
  { at = 1.00, color = "#ffe0a0" },
]

[palette_b]
name = "ice"

[params]
# CHEMISTRY - labyrinth. Distinctly lower feed than Coral's mitosis, which is
# what keeps the two from reading as the same field.
# THE MAZE REGIME, kept deliberately - F 0.0290 / k 0.0570. Reef is the one
# preset of the four that WANTS the dense connected labyrinth, because it is not
# being shown as a texture: the fold below turns it into a figure, and a fold
# needs something continuous in its source wedge to build a rosette out of.
# Isolated spots (Coral) or open strands (Coral Head) fold into a scatter.
#
# So the family covers both readings of the brief: three presets answer "more
# dynamics and empty space" through their chemistry, and this one answers
# "or figures?" through the composite.
feed   = "0.0290 + sin(time * 0.033) * 0.0022 + clamp(bass * 1.18, 0, 1) * 0.0026"
kill   = "0.0560 + cos(time * 0.024) * 0.0008 + (sin(bar * pi) - 0.5) * 0.0010 + clamp(mid * 1.18, 0, 1) * 0.0008"
flow   = "1.00 + clamp(treb * 1.67, 0, 1) * 0.24"
inject = "beat"

# THE FAST LEVERS - fine contours give the ridges their spine.
# Contour stays HIGH here where the other three came down, and the difference is
# deliberate: the fold multiplies whatever detail its source wedge holds, so a
# rich wedge is what becomes an ornate rosette. This is the one RD preset where
# dense iso-lines are the point rather than the thing filling in the gaps.
contour = "9.0 + sin(time * 0.43) * 2.4 + clamp(treb * 6.67, 0, 4.0) + beat * 2.0"
hatch   = "3.5 + clamp(mid * 2.35, 0, 2.0)"
# Cap trimmed 0.26 -> 0.20. The fold replicates LUMINANCE as well as structure,
# so a term that is harmless unfolded is worth up to twelve times as much here.
glow    = "0.80 + clamp((bass + mid) * 0.118, 0, 0.20)"

# VIEW - deliberately NOT scrolled, even though Plan 0033 freed `pan_*` over the
# now-wrapping toroidal field. This preset folds through `kaleido_*`, whose fold
# axis is SCREEN-CENTRED: translating the source slides the rosette off centre
# and costs the composition its symmetry. So the view breathes on `zoom` only
# and the pan stays a small oscillation, never a drift.
zoom  = "1.14 + sin(time * 0.019) * 0.09 + clamp(bass * 0.188, 0, 0.16)"
pan_x = "sin(time * 0.012) * 0.030"
pan_y = "cos(time * 0.0085) * 0.024"

# COLOUR - the warm-cored gradient, cooling toward `ice` on the top end.
color_span   = "2.20 + clamp(mid * 0.47, 0, 0.40)"
color_center = "sin(time * 0.0210) * 0.05"
saturation   = "1.05 + clamp(bass * 0.235, 0, 0.20)"
palette_mix  = "clamp(treb * 0.7, 0, 0.42)"

# COMPOSITE - the rose window. Two orders on an energy gate, turning slowly.
# THE FOLD, and it is now ALWAYS ON - this is what makes Reef the figure of the
# family rather than another wall of texture.
#
# It was previously `select(bass + mid > 0.40, 8, 1)`, and order 1 means no fold
# at all. On the v2 scale `bass + mid` is typically ~0.71 and spans 0..2, so that
# comparison never returned 1: the fold this preset is built around had never
# once engaged, and Reef rendered as unfolded RD texture for its entire life.
# That is most of why the family looked identical - the one preset meant to look
# different was silently running the same way as the others.
#
# Rebuilt as a ladder with no unfolded rung. Six folds at rest so the figure is
# always a figure, climbing to twelve on real energy, with thresholds set from
# the measurement rather than from `--set` magnitudes.
kaleido_order = "select(bass + mid > 1.36, 12, select(bass + mid > 0.77, 8, 6))"
# ANGLE PINNED AT 0 - no rotation. A turning fold sweeps the wedge seams around
# the frame, and on this scene that does two unwanted things at once: it spins
# a field that is already busy, and it drags the seam through the CORNERS,
# where the fold samples past the frame edge and clamps. A fixed angle keeps
# each seam in one place, which is both calmer and the cheaper of the two
# artifact mitigations available to a preset.
kaleido_angle = "0"
bg_hue        = "0.06 + sin(time * 0.0091) * 0.05"
bg_bright     = "0.020 + clamp(mid * 0.0153, 0, 0.013)"
bg_vignette   = "0.76"

[smoothing]
contour       = { attack = 0.03, release = 0.38 }
hatch         = 0.25
glow          = 0.30
zoom          = 0.20
color_span    = 0.45
palette_mix   = 0.90
kaleido_order = 1.2
bg_bright     = 0.40
