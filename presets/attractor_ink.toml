# Ink on Paper - a De Jong attractor drawn as black lines on a warm white page,
# the look that motivated the final-stage tone remap (ADR-0028, Plan 0027).
#
# The scenes draw additively, so this is NOT a colour choice: `ink_amount = 1`
# turns on the last composite stage, which repaints the finished frame between
# `paper_*` (where the frame was dark) and `ink_*` (where it was bright). The
# glowing point cloud becomes wet ink; the black void becomes the page. This
# version keeps the original's careful blot discipline and adds the motion it
# was missing - the old one held its coefficients nearly still, so the drawing
# barely evolved across a track.
#
# The whole preset is a balancing act around ONE trap: the remap keys on
# luminance, so anything that pushes the accumulated field past white turns the
# drawing into a solid blot. `fade` is the sensitive knob - it sets how many
# frames of points pile up (roughly 1/(1-fade)), so 0.88 draws lines and 0.96
# floods the page. `size` and `saturation` are held down for the same reason: a
# fat, fully-saturated point blots where a fine one hatches.
#
# Deliberately NO `bg_*` and NO `kaleido_*` here. A lit backdrop raises the
# frame's floor luminance, which the remap reads as ink and greys the whole
# page; the kaleidoscope re-samples the attractor's accumulation, and a softer
# source blots where a crisp one hatches. Since Plan 0033 that stage follows the
# render target rather than a fixed 1280x720, so the cost is far smaller than it
# was - but the two caps still differ (2560x1440 for the attractor's own grid,
# 1920x1080 for the post stages), so the fold still costs this preset some bite.
system = "attractor"
name = "Ink on Paper"

[particles]
family = "de_jong"

[params]
# SHAPE - four incommensurate slow sines (periods ~200/260/330/410 s) so the
# drawing is redrawn continuously and never repeats, with a small clamped band
# term on top. Chaotic maps cut rather than morph if you shove them.
a = "1.641 + sin(time * 0.0314) * 0.075 + clamp(bass * 0.094, 0, 0.080)"
b = "1.902 + cos(time * 0.0241) * 0.065 + clamp(mid * 0.082, 0, 0.070)"
c = "0.316 + sin(time * 0.0190) * 0.085 + clamp(treb * 0.092, 0, 0.055)"
d = "1.525 + cos(time * 0.0153) * 0.070 - clamp(bass * 0.053, 0, 0.045)"

# THE NIB. Fine on purpose - the trail grid is surface-sized (Plan 0027 Phase
# 2), so a point that looked right on the old soft 640x360 field blots here.
# Note the sign: the nib gets FINER as the mix gets louder, so a drop sharpens
# the hatching. The beat adds the only positive term - a single wet stroke.
size = "0.60 - clamp((bass + mid) * 0.094, 0, 0.16) + beat * 0.14"

# TRAIL LENGTH - the ink has to accumulate before it reads as a drawn line, but
# this is the knob that blots. Ceiling 0.89, and it falls under bass.
fade = "0.885 - clamp(bass * 0.047, 0, 0.040)"

# A hard transient DISTURBS the cloud - it bulges through the standing trails
# and settles back as the fade catches up. Gated above the typical level so
# quiet passages keep one continuous drawing rather than being nudged nonstop.
# MEASURED. Read 0.45 and never fired - `onset` was then raw spectral flux
# peaking at 0.016, not a 0..1 envelope. Then 0.56, which was chosen while a
# reseed still RE-SCATTERED the whole cloud (a wipe worth being reluctant
# about); Plan 0057 Phase 3 / ADR-0066 made it a bounded in-place jitter, so
# the reluctance now only costs accents. Onset means measured 0.033
# (click:120) / 0.153 (dynamic:110) / 0.391 (chord), ~0.20 real music, all
# against a 1.000 peak - so 0.32 is crossed by transients and not by the body
# of a passage. Rank preserved within the family.
reseed = "onset > 0.32"

# Nearly neutral. The remap discards hue anyway, and a desaturated source keeps
# the luminance ramp - and so the ink density - honest across the frame.
saturation = "0.35"
hue_spread = "0.05"
hue_center = "0.5"

# VIEW - a slow drift and a per-bar breath, so the composition reframes over a
# track rather than sitting dead centre for the whole show.
zoom  = "1.12 + bar * 0.07 + clamp(bass * 0.212, 0, 0.18)"
pan_x = "sin(time * 0.0230) * 0.07"
pan_y = "cos(time * 0.0170) * 0.055"

# THE REMAP - full, and held at the pole. A partial amount lets the near-black
# source frame bleed through and greys the paper, which reads as a dirty page
# rather than a faint drawing. Sparseness at low energy comes from the drawing.
# The page is a warm off-white rather than pure #fff, and the ink a very dark
# blue-black rather than pure #000 - both read as real ink on real stock.
ink_amount   = "1"
paper_hue    = "0.11"
paper_sat    = "0.055"
paper_bright = "0.985"
ink_hue      = "0.62"
ink_sat      = "0.35"
ink_bright   = "0.055"

[smoothing]
# The nib should swell, not flicker - a bare `beat` term on `size` would snap.
size = { attack = 0.02, release = 0.26 }
fade = 0.25
zoom = 0.18
# THE SHAPE EASING, RE-DERIVED 2026-08-03. These read 0.8, which is why the
# drawing did not visibly answer a drum hit: measured against the library,
# this preset's transient columns were rise 19+ / fall 30+ where Fern Grow -
# named by the user as reacting correctly - reads 6+ / 9+, the slowest pair in
# the whole set. A hit's band energy lasts ~100 ms and an 0.8 s ease delivers
# about 12% of the step in that window, so a term worth 4% of the coefficient
# arrives as 0.5% and reads as nothing.
#
# 0.45 rather than something fast: the constraint in the header is real - a
# chaotic map CUTS rather than morphs if a coefficient is moved abruptly - so
# this buys response without letting the figure jump. The magnitudes above are
# deliberately NOT raised in the same pass; speed and travel are separate
# levers and moving both at once means neither can be judged.
a    = 0.45
b    = 0.45
c    = 0.45
d    = 0.45
