# Ink on Paper - a Thomas attractor drawn as black lines on a warm white page,
# turning in depth and gliding from one figure of the Thomas roster to the next,
# the look that motivated the final-stage tone remap (ADR-0028, Plan 0027).
#
# The scenes draw additively, so this is NOT a colour choice: `ink_amount = 1`
# turns on the last composite stage, which repaints the finished frame between
# `paper_*` (where the frame was dark) and `ink_*` (where it was bright). The
# glowing point cloud becomes wet ink; the black void becomes the page.
#
# THE MUSIC MOVES THE FIGURE, IT NEVER BREAKS IT. Judged at the Plan 0232
# sitting: in silence the walk reads as a solid 3D drawing, and every term that
# DISTURBED the cloud - an onset reseed, a bass zoom pump, a beat on the nib, a
# bass-shortened trail - turned it into noise the moment music started. So the
# bands only drive rates and depth: bass speeds the turn, mid pushes the far
# strands back into the page. Both are eased. Do not add a `reseed` back.
#
# The whole preset is a balancing act around ONE trap: the remap keys on
# luminance, so anything that pushes the accumulated field past white turns the
# drawing into a solid blot. `fade` is the sensitive knob - it sets how many
# frames of points pile up (roughly 1/(1-fade)), so 0.88 draws lines and 0.96
# floods the page. `size` and `saturation` are held down for the same reason: a
# fat, fully-saturated point blots where a fine one hatches.
#
# Deliberately NO `bg_*` and NO `kaleido_*` here. A lit backdrop raises the
# frame's floor luminance, which the remap reads as ink and greys the whole
# page; the kaleidoscope re-samples the attractor's accumulation, and a softer
# source blots where a crisp one hatches.
#
# HORIZON VERDICT, 2026-08-15 (Plan 0085 Phase 2, `shot --horizon 10`),
# MEASURED ON THE DE JONG FIGURE THIS PRESET DREW BEFORE THE PLAN 0232 SITTING,
# and not re-measured on the Thomas walk: THE DRAWING DRIES OUT. Coverage fell
# 0.199 -> 0.006 between minute one and minute two and kept falling to 0.002 by
# minute ten, while concentration (peak/mean) climbed 23.8 -> 1161. Rendered
# either side of it, the silhouette was UNCHANGED and the density gone: a dense
# hatched figure at 10 s, scattered specks at 150 s. So it was not the
# coefficients collapsing the attractor - the shape survived - it was the
# deposit failing to keep the page inked. Reproduced at 96x96 and 256x256, and
# under silence as well as a held loud stimulus. Nothing about this is a gate;
# see docs/capturing.md on reading a horizon.
system = "attractor"
name = "Ink on Paper"

[particles]
family = "thomas"

[params]
# THE WALK. `tuple` picks a whole Thomas figure from the 13-entry roster and
# `morph` travels from it to the next, so `floor` and the fractional part of the
# same 10 s clock step the roster and glide between entries: one figure every
# 10 s, never a cut. Thomas Gallery steps the same roster hard every 3 s; this
# is its slow, continuous twin.
tuple = "mod(floor(time * 0.1), 13)"
morph = "time * 0.1 - floor(time * 0.1)"

# DEPTH. The turn and the perspective are what make it read as a solid object
# rather than a flat hatch. Bass speeds the turn; mid dims the far strands
# further, which on a two-pole remap is the only depth cue there is.
spin = "0.6 + clamp(bass * 0.5, 0, 0.4)"
# THE CAMERA, mapped from the retired `perspective = 0.2` at `zoom = 1.12`
# (ADR-0260): `distance = 1 / 0.2` on the roster's unit depth, and the `fov` whose
# tangent is `0.2 / (0.572 * 1.12)`, which carries the crop the zoom was. Level.
# Two of the thirteen entries are shallower than unit depth and read a little
# flatter than they did; re-curation is owed.
distance = "5.0"
fov = "0.6055"
pitch = "0"
depth_fade = "0.4 + clamp(mid * 0.4, 0, 0.3)"

# THE NIB. Fine and constant - the trail grid is surface-sized (Plan 0027 Phase
# 2), so a fat point blots, and a nib that answered the beat read as noise.
size = "0.45"

# TRAIL LENGTH - the ink has to accumulate before it reads as a drawn line, but
# this is the knob that blots. Held constant for the same reason as the nib.
fade = "0.885"

# Off. A reseed throws the cloud back onto fresh start positions, and on a
# walking figure that is a visible collapse on every hit (see the header).
reseed = "0"

# Nearly neutral. The remap discards hue anyway, and a desaturated source keeps
# the luminance ramp - and so the ink density - honest across the frame.
saturation = "0.35"
hue_spread = "0.05"
hue_center = "0.5"

# VIEW - a slow drift so the composition reframes over a track rather than
# sitting dead centre, and a fixed crop (the `fov` above): a zoom on the music was
# the pump the sitting removed. The camera divides `pan_x` by the aspect, so its
# swing is the old 0.07 times 16/9 - the same drift on a 16:9 screen.
pan_x = "sin(time * 0.0230) * 0.1244"
pan_y = "cos(time * 0.0170) * 0.055"

# THE REMAP - full, and held at the pole. A partial amount lets the near-black
# source frame bleed through and greys the paper, which reads as a dirty page
# rather than a faint drawing. The page is a warm off-white rather than pure
# #fff, and the ink a very dark blue-black rather than pure #000 - both read as
# real ink on real stock. `ink_gamma` below 1 inks the mid-tones heavier, so a
# sparse strand bites rather than greying out (ADR-0092, whose rider says a
# sparse figure's bite lives below 1).
ink_amount   = "1"
paper_hue    = "0.11"
paper_sat    = "0.055"
paper_bright = "0.985"
ink_hue      = "0.62"
ink_sat      = "0.35"
ink_bright   = "0.055"
ink_gamma    = "0.6"

[smoothing]
# The turn and the depth ease so a loud passage leans on the figure rather
# than jolting it.
spin = 0.6
depth_fade = 0.5
