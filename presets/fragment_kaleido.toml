# Kaleido Field - the screen-space kaleidoscope taken as far as it goes: a
# domain-warped field folded into a high-order rosette whose ORDER ITSELF is
# audio-driven, so the symmetry of the picture changes with the music instead of
# sitting at one fold count for the whole track.
#
# The order steps 6 -> 10 -> 16 -> 24 across three comparison gates (grammar v2,
# Plan 0019). Each step is a visibly different figure, and because the whole
# ladder is eased through `[smoothing]` the change reads as the rosette growing
# petals rather than as a hard cut. The fold angle turns continuously on `time`
# with a per-bar nudge, so it is always rotating under the step changes.
#
# See `fragment_warp.toml` for the glow ceiling. It matters doubly here: the
# fold REPLICATES whatever luminance the wedge holds, so a blown-out source
# becomes a blown-out rosette with no visible structure at all.
system = "fragment_field"
name = "Kaleido Field"

[palette]
stops = [
  { at = 0.00, color = "#050014" },
  { at = 0.20, color = "#1d0f6b" },
  { at = 0.42, color = "#0d7fa8" },
  { at = 0.62, color = "#3fd7a0" },
  { at = 0.82, color = "#ffd257" },
  { at = 1.00, color = "#ff6ad5" },
]

[palette_b]
name = "ember"

[params]
# HOW THIS PRESET READS VOLUME AT EACH FREQUENCY - the whole map in one place,
# because a folded field makes it hard to tell by eye which band did what.
#
#   bass  -> `warp` (how turbulent the wedge is) + `trails` + `palette_mix`
#   mid   -> `glow` + `color_span` (how much colour each wedge carries)
#   treb  -> `zoom` (field scale, so detail fineness) + `saturation` + `hue`
#   sum   -> `kaleido_order`, the fold COUNT (the ladder further down)
#   onset -> `flash`
#
# So low end = churn and smear, mids = colour body and lift, highs = fine
# detail and vividness, and total loudness = how many wedges the rosette has.
#
# ALL THE GAINS BELOW WERE RECALIBRATED TWICE. Against the old raw levels the
# original multipliers delivered 1-10 % of their own caps - every
# `clamp(..., 0, 0.40)` was decoration and `treb * 0.9` moved `zoom` by 0.005.
# The fix for that was gains ~16-96x larger, which ADR-0049 then made wrong the
# other way: normalized bands reach those caps from just above silence and hold
# there, so the map above was a set of constants.
#
# The rule is unchanged and now actually holds: a band's TYPICAL level reaches
# about half its cap and a peak reaches the cap. On the v2 scale that means the
# cap is placed at 0.85 of full scale (0.60 for treb and onset, whose real
# distributions sit lower), which is what every multiplier below is derived
# from - cap / anchor, with the caps exactly as they were.
warp  = "0.85 + sin(time * 0.059) * 0.16 + clamp(bass * 0.82, 0, 0.70) + beat * 0.18"
zoom  = "1.55 + sin(time * 0.037) * 0.12 + clamp(treb * 0.67, 0, 0.40)"
pan_x = "sin(time * 0.023) * 0.26"
pan_y = "cos(time * 0.031) * 0.22"

# LUMINANCE - flat. The fold multiplies whatever it is given.
# Gained like the rest, but this is the ONE cap that does not open up. The fold
# replicates luminance as well as structure, so a mid term worth 0.15 unfolded
# is worth up to twenty-four times that across the rosette. Mids get their
# volume reading through `color_span` below instead, which costs no light.
glow  = "0.72 + clamp(mid * 0.176, 0, 0.15)"
flash = "clamp(onset * 0.433, 0, 0.26)"

# COLOUR - a wide, saturated window so each wedge carries several hues.
hue          = "0.50 + time * 0.021 + clamp(treb * 0.233, 0, 0.14)"
color_span   = "0.80 + clamp(mid * 0.26, 0, 0.22)"
color_center = "sin(time * 0.047) * 0.18"
saturation   = "1.15 + clamp(treb * 0.367, 0, 0.22)"
palette_mix  = "clamp(bass * 0.59, 0, 0.50)"

# COMPOSITE - the ladder. Three nested comparisons pick the fold count; the
# angle turns underneath it continuously.
#
# THE LADDER WAS UNREACHABLE, which is why this preset read as not responding to
# music at all. Every rung was written against `--set`-style magnitudes where
# each band is 1 and the sum is 3, while raw audio put the sum near 0.052: at
# 0.90, 0.55 and even 0.25, not one comparison could ever return 1, and the
# rosette sat at six folds permanently.
#
# The 0.045 / 0.075 / 0.115 rebuild fixed that on the raw scale and ADR-0049
# then broke it again - a normalized sum spans 0..3 with a typical near 1.5, so
# all three rungs were permanently true and the rosette pinned at 24 folds. The
# rungs below hold the same POSITION IN THE RANGE the rebuild gave them: a
# normal passage lives at 10-16 folds, 1.43 and 2.20 are reached on real peaks,
# and quiet material drops to 6. The figure climbs the ladder either way.
kaleido_order = "select(bass + mid + treb > 2.20, 24, select(bass + mid + treb > 1.43, 16, select(bass + mid + treb > 0.86, 10, 6)))"
kaleido_angle = "time * 0.13"
trails        = "0.34 + clamp(bass * 0.26, 0, 0.22)"

[smoothing]
# Smoothed hard, everywhere. This preset folds the frame, and the fold
# REPLICATES motion as well as luminance: a twitch in the wedge becomes the same
# twitch times `kaleido_order`, so anything that reads as lively on an unfolded
# field reads as jarring here. Every constant below is longer than it would be
# on the same param in `fragment_warp`, and that is deliberate.
#
# The order ladder gets the longest constant in the file - this is what turns a
# discrete jump between fold counts into a rosette that grows petals. It is also
# the anti-chatter lever: the three gates read a sum of all three bands, which
# hovers near a boundary for whole passages, and a short constant would let the
# fold count flicker between two figures. Long enough that a boundary crossing
# has to be sustained before the picture commits to it.
#
# 2.1 -> 1.3. It stays the longest constant in the file for the reason above,
# but 2.1 s was tuned when the ladder could not fire at all, so nothing was ever
# waiting on it. Now that the rungs are reachable, two full seconds of lag meant
# a passage could come and go before the fold count agreed to move.
kaleido_order = 1.3

# `warp` is CONTINUOUS structure here, not a percussive accent - so it stays
# symmetric and long. An { attack, release } pair belongs on things that should
# hit; giving it a fast attack made the per-beat term snap, which through the
# fold is exactly the jarring the preset must not have.
warp          = 0.40

# `flash` was the one unsmoothed param in the file - an instant onset strobe,
# multiplied by up to 24 wedges. Now it eases in and decays out.
flash         = { attack = 0.09, release = 0.70 }

# The rest come down roughly a third. Every constant in this file was set long
# on the reasoning that the fold replicates motion - which is true, and they are
# still the longest of the fragment family. But they were also compensating for
# a ladder that never moved: with the only structural change unreachable, slow
# colour was all the preset had, and slowing it further cost nothing visible.
zoom          = 0.32
glow          = 0.32
color_span    = 0.38
color_center  = 0.42
palette_mix   = 0.75
trails        = 0.38
