# Kaleido Field - the screen-space kaleidoscope taken as far as it goes: a
# domain-warped field folded into a high-order rosette whose ORDER ITSELF is
# audio-driven, so the symmetry of the picture changes with the music instead of
# sitting at one fold count for the whole track.
#
# The order steps 6 -> 10 -> 16 -> 24 across three comparison gates (grammar v2,
# Plan 0019). Each step is a visibly different figure, and because the whole
# ladder is eased through `[smoothing]` the change reads as the rosette growing
# petals rather than as a hard cut. The fold angle turns continuously on `time`
# with a per-bar nudge, so it is always rotating under the step changes.
#
# See `fragment_warp.toml` for the glow ceiling. It matters doubly here: the
# fold REPLICATES whatever luminance the wedge holds, so a blown-out source
# becomes a blown-out rosette with no visible structure at all.
system = "fragment_field"
name = "Kaleido Field"

[palette]
stops = [
  { at = 0.00, color = "#050014" },
  { at = 0.20, color = "#1d0f6b" },
  { at = 0.42, color = "#0d7fa8" },
  { at = 0.62, color = "#3fd7a0" },
  { at = 0.82, color = "#ffd257" },
  { at = 1.00, color = "#ff6ad5" },
]

[palette_b]
name = "ember"

[params]
# STRUCTURE - a rich wedge for the fold to work on.
warp  = "0.85 + sin(time * 0.059) * 0.16 + clamp(bass * 1.5, 0, 0.70) + beat * 0.18"
zoom  = "1.55 + sin(time * 0.037) * 0.12 + clamp(treb * 0.9, 0, 0.40)"
pan_x = "sin(time * 0.023) * 0.26"
pan_y = "cos(time * 0.031) * 0.22"

# LUMINANCE - flat. The fold multiplies whatever it is given.
glow  = "0.72 + clamp(mid * 0.5, 0, 0.15)"
flash = "clamp(onset * 0.8, 0, 0.26)"

# COLOUR - a wide, saturated window so each wedge carries several hues.
hue          = "0.50 + time * 0.021 + clamp(treb * 0.6, 0, 0.14)"
color_span   = "0.80 + clamp(mid * 0.7, 0, 0.22)"
color_center = "sin(time * 0.047) * 0.18"
saturation   = "1.15 + clamp(treb * 0.8, 0, 0.22)"
palette_mix  = "clamp(bass * 1.3, 0, 0.50)"

# COMPOSITE - the ladder. Three nested comparisons pick the fold count; the
# angle turns underneath it continuously.
kaleido_order = "select(bass + mid + treb > 0.90, 24, select(bass + mid + treb > 0.55, 16, select(bass + mid + treb > 0.25, 10, 6)))"
kaleido_angle = "time * 0.13"
trails        = "0.34 + clamp(bass * 0.5, 0, 0.22)"

[smoothing]
# Smoothed hard, everywhere. This preset folds the frame, and the fold
# REPLICATES motion as well as luminance: a twitch in the wedge becomes the same
# twitch times `kaleido_order`, so anything that reads as lively on an unfolded
# field reads as jarring here. Every constant below is longer than it would be
# on the same param in `fragment_warp`, and that is deliberate.
#
# The order ladder gets the longest constant in the file - this is what turns a
# discrete jump between fold counts into a rosette that grows petals. It is also
# the anti-chatter lever: the three gates read a sum of all three bands, which
# hovers near a boundary for whole passages, and a short constant would let the
# fold count flicker between two figures. Long enough that a boundary crossing
# has to be sustained before the picture commits to it.
kaleido_order = 2.1

# `warp` is CONTINUOUS structure here, not a percussive accent - so it stays
# symmetric and long. An { attack, release } pair belongs on things that should
# hit; giving it a fast attack made the per-beat term snap, which through the
# fold is exactly the jarring the preset must not have.
warp          = 0.62

# `flash` was the one unsmoothed param in the file - an instant onset strobe,
# multiplied by up to 24 wedges. Now it eases in and decays out.
flash         = { attack = 0.09, release = 0.70 }

zoom          = 0.45
glow          = 0.42
color_span    = 0.55
color_center  = 0.62
palette_mix   = 0.95
trails        = 0.48
