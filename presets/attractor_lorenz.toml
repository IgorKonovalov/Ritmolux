# Lorenz - the classic butterfly, drawn as a PLOTTED TRACE rather than a cloud,
# and still the set's TWO-PERSONALITY preset. `select(tempo > 124, ..., ...)`
# gives one file a slow, wide, long-exposure reading for downtempo material and
# a tight, short-trace, hard-turning one above ~124 BPM. Everything gated that
# way is written so the UNWARMED case is the calm one - `tempo` is 0 until the
# tracker locks, so a cold start reads as the slow personality and eases into
# the fast one rather than snapping.
#
# THIS PRESET WAS RE-AUTHORED AT PLAN 0059 PHASE 4, AND IT IS CLOSER TO A FIRST
# AUTHORING THAN TO A RE-TUNE. Everything below the shape section was set
# against a figure that did not exist: until Phase 1 the scene rendered x-y,
# where the butterfly is edge-on and reads as a hard X, and until Phase 1b the
# trail re-read its own history mirrored, so what was on screen was
# `figure ∪ mirror(figure)` - twice the geometry at half the meaning. The
# coefficients, the palette and the tempo split are the parts that survived.
#
# THE LOOK IS `density` + `fade`, AND THAT PAIR IS THE WHOLE POINT (ADR-0069).
# At the full 50 000 particles this scene draws 50 000 independent samples of
# the invariant measure: raising `fade` just piles them into a smooth fog, and
# no level setting makes a fog into a figure. At 0.002 - 100 particles at the floor
# tier, 300 at rich - each one is a trajectory you can follow, the segment
# joins its steps end to end, and ~13 frames of trail resolve the two lobes
# into the banded spirals the textbook plot shows. RENDERED, not reasoned: the
# ladder 1.0 / 0.05 / 0.012 / 0.005 / 0.002 goes fog, fog, fuzz, curves,
# curves, and only the bottom two read as a trace.
#
# Colour: a night-blue -> teal -> solar-white gradient, crossfading to `ember`
# on the fast personality, so the butterfly literally heats up with the tempo.
system = "attractor"
name = "Lorenz"

[particles]
family = "lorenz"
# See the header. This is the structural half of the look, not a performance
# dial - and it is NOT a level control: the engine divides each particle's
# deposit by how many are drawn (ADR-0065), so total light is invariant. What
# changes is WHERE that light lands - the same energy on 1/500th of the pixels,
# which is why `brightness` below is what it is.
density = 0.002

[palette]
stops = [
  { at = 0.00, color = "#00060f" },
  { at = 0.25, color = "#062b4a" },
  { at = 0.55, color = "#12a3a8" },
  { at = 0.80, color = "#8fe6c2" },
  { at = 1.00, color = "#fbffe8" },
]

[palette_b]
name = "ember"

[params]
# BRIGHTNESS - the scene's own level, and it is not a taste knob here, it is
# arithmetic. `density = 0.002` multiplies each particle's deposit by 500
# (ADR-0065's invariance), and `fade ~ 0.93` accumulates ~14 frames of it, so
# the trace would sit some three orders of magnitude over the tonemap knee.
# Left at 1.0 the whole figure lands on the shoulder's asymptote and renders as
# one flat teal mass with the spirals gone - MEASURED: a level ladder from 1.0
# down to 0.0002 only starts resolving curves below ~0.004, and 0.03 with the
# fine nib below is where the cores stay lit and the background stays black.
#
# THIS USED TO BE `exposure`, AND MOVING IT IS THE POINT OF PLAN 0066. The
# number is unchanged because the swap is level-neutral - the deposit is scaled
# where it is made instead of at the tonemap, and the whole chain between is
# linear - but two costs went away with it:
#   - `exposure` is ENGINE-WIDE and crossfades across a preset dissolve, so the
#     ~1 s blend into this preset used to pass through a badly exposed frame.
#     `brightness` is scene-local and blends as pixels, so the dissolve is now
#     a dissolve. The old advice to buy level from `size` and `fade` first, and
#     only the remainder from the stop, is retired: buy it here.
#   - `bloom_threshold` is now compared AFTER exposure (ADR-0080), so it
#     discriminates on this preset for the first time. See below.
brightness      = "0.03"
bloom_amount    = "0.35"
# MEASURED, and it is tuned now rather than capped. The bright-pass compares
# exposed luminance, so this number is in the same units the figure is finally
# seen in: the trace's peak lands near 1.0-1.5 and its bulk well below 0.5, so
# the threshold picks the densest crossings out of the sparse outer trace
# instead of taking the whole figure or none of it. Coverage across the sweep -
# 3.0 / 1.5 / 0.8 / 0.5 / 0.4 / 0.3 / 0.2 reads 0.164 / 0.165 / 0.177 / 0.207 /
# 0.224 / 0.245 / 0.269 - is the discrimination that did not exist before: at
# the old ceiling of 8 every value in that list rendered the same picture.
bloom_threshold = "0.4"
bloom_radius    = "1.3"
# SHAPE - canonical Lorenz; `d` is unused by this family. Unchanged by the
# re-author: Phase 4 re-gains and re-aims, it does not re-design.
a = "10.0 + sin(time * 0.0290) * 0.55 + clamp(mid * 1, 0, 0.85)"
b = "28.0 + cos(time * 0.0217) * 1.30 + clamp(bass * 3.06, 0, 2.60)"
c = "2.667 + sin(time * 0.0173) * 0.075 - clamp(treb * 0.1, 0, 0.060)"

# TRACE LENGTH AND NIB. `fade` is how many frames of the trajectory stay on
# screen (~1/(1-fade)), so on this preset it is literally how long the drawn
# curve is: ~10 frames on the fast personality, ~15 on the slow one. Bass
# SHORTENS it - peak buys structure, not brightness - and so does the beat.
#
# THE TEMPO SPLIT IS DELIBERATELY NOT ON `size` ANY MORE. `fade` and `size`
# both multiply the deposited light, so gating both on tempo made the two
# personalities differ in LEVEL as much as in character; the split now lives in
# the trace length, the framing and the colour, and the nib is one value.
fade   = "select(tempo > 124, 0.905, 0.932) - clamp(bass * 0.035, 0, 0.030) - beat * 0.010"
size   = "0.105 - clamp(bass * 0.029, 0, 0.025) + beat * 0.020"
# MEASURED. Read 0.48 and never fired - `onset` was then raw spectral flux peaking at
# 0.016, not a 0..1 envelope. Then 0.62, chosen while a reseed still REPLACED
# the cloud with a uniform box - the largest seed box in the set, so the
# reluctance was most justified here. ADR-0066 (Plan 0057 Phase 3) made it a
# bounded in-place jitter, so that justification is gone. Onset means measured
# 0.033 (click:120) / 0.153 (dynamic:110) / 0.391 (chord), ~0.20 real music,
# all against a 1.000 peak. Rank preserved within the family.
#
# ON A SPARSE TRACE A RESEED IS A MUCH LOUDER EVENT than it was on the cloud:
# 100 trajectories jitter at once and every one of them is individually
# visible, where in a 50 000-point fog the same kick moved nothing you could
# point at. The threshold is unchanged (Plan 0059 does not move the reseed
# gates) but it is now the preset's most conspicuous accent, not its subtlest.
reseed = "onset > 0.36"

# COLOUR - the fast personality heats toward `ember` and widens; the slow one
# stays a cool, cohesive single family.
# The centre sits LOW in the gradient on purpose. The trace overlaps itself in
# the lobe cores, so those climb the ramp on their own - keeping the base down
# in the night-blue is what leaves anywhere for them to climb to.
hue_spread  = "select(tempo > 124, 0.30, 0.14) + clamp(treb * 0.233, 0, 0.14)"
hue_center  = "0.20 + sin(time * 0.031) * 0.07 + clamp(bass * 0.188, 0, 0.16)"
saturation  = "1.15 + clamp(mid * 0.376, 0, 0.32)"
palette_mix = "select(tempo > 124, 0.55, 0.05) + clamp(bass * 0.176, 0, 0.15)"

# VIEW - the fast personality pushes in and pumps per beat; the slow one sits
# back and breathes on the bar.
# THE FRAMING IS A CAP, NOT A TASTE, AND `perspective` MOVED THE CAP HARD.
# The pre-0063 numbers (base 1.32/1.40, peaking 1.78) were correct for an
# ORTHOGRAPHIC figure and are wrong for this one - not because perspective makes
# the figure bigger, which is the small half of the effect, but because it makes
# the figure SWING. See the depth block below for the measurement; the short
# version is that the near side is magnified, so as the butterfly turns its
# screen centroid orbits, and the frame has to hold the figure at every phase of
# that orbit rather than at its widest pose.
#
# MEASURED at the loud frame across five spin phases, 800 px square. At the old
# base with perspective live the figure ran off an edge at EVERY phase. At 1.16
# the lit span runs 440..718 px depending on phase - and that 1.6x range is the
# ORBIT plus the butterfly turning edge-on, not the figure changing size, which
# is the whole reason a single zoom number cannot fix it.
#
# At the synthetic maximum (bass and bar both pinned at 1, which no music
# sustains) the outermost trail ring still reaches the frame edge at the face-on
# phase. That is what this preset did before Plan 0063 as well - the header above
# says it fills the frame edge to edge - and the lobes themselves stay inside at
# every phase. The base is fitted so the FIGURE is framed, not so the last faint
# ring of trail is.
# THE OFF-CENTRE PAN WENT WITH THE DOUBLED FIGURE TOO. `pan_x` sat at -0.16 and
# `pan_y` swung a clean +/-0.06: against a figure that was its own mirror, both
# were free, because whatever left one side arrived on the other. Against one
# butterfly, -0.16 parks it against the left edge with a third of the frame
# empty, and a positive `pan_y` lifts the wingtips off the top. Centred in x,
# biased slightly down in y so the widest row - the wing tips, which the
# particle buffer puts at high `z` and so near the TOP - keeps its margin.
# The base is down 0.33 from the pre-0063 value for the reason above.
zoom  = "select(tempo > 124, 1.24, 1.16) + bar * 0.06 + clamp(bass * 0.082, 0, 0.07)"
pan_x = "sin(time * 0.039) * 0.08"
pan_y = "-0.05 + cos(time * 0.028) * 0.05"

# DEPTH (Plan 0063 / ADR-0076) - the butterfly stops being a silhouette.
#
# `perspective` IS THE CUE AND THE OTHER TWO ARE REINFORCEMENT. Rendered side by
# side at this density: with the haze and the tint on but perspective at 0, the
# figure is exactly as flat as it ever was - both wings the same size, the whole
# thing a symmetric bowtie, and the haze reading as an uneven exposure rather
# than as distance. Turn perspective on alone and the near wing opens while the
# far one compresses, and it reads as a solid at an angle immediately. Nothing
# else in this block substitutes for it.
#
# THE RANGE IS 0.20..0.28 AND THE 0.80 CLAMP IS NOT WHAT BOUNDS IT. Two things
# were measured here and the second is the one that set this number.
#
# The clamp is not where the projection breaks. It is a true perspective divide,
# so straight lines stay straight; at 0.8 the butterfly reads as a strong wide
# angle, not as a fisheye. Optically there is plenty of room.
#
# WHAT BOUNDS IT IS THE CENTROID ORBIT. The near side is magnified, so the
# figure's screen centre shifts toward whichever side is currently near - and as
# the spin turns, that shift ORBITS. Measured peak-to-peak over four phases on
# the bare figure:
#
#     perspective   centre swing      widest span
#     0.00          0.04 NDC          522 px
#     0.15          0.11 NDC          525 px
#     0.25          0.20 NDC          529 px
#     0.40          0.37 NDC          542 px
#     0.60          0.55 NDC          555 px
#
# The swing is about 0.9 x perspective in NDC and the size growth over the same
# sweep is 6%. So the documented "perspective fights zoom, recover the framing
# with a zoom edit" is the SMALL half of the story and the advice does not work
# for the large half: a zoom cannot recover a translation that varies with the
# spin phase, it can only shrink the figure until the swing fits. Past ~0.3 the
# butterfly visibly slides around the frame instead of turning in place, which
# is a worse artifact than the flatness it was bought to fix.
perspective = "0.20 + clamp(bass * 0.094, 0, 0.08)"
# THE HAZE IS THE OCCLUSION THIS SCENE DOES NOT DO. Nothing hides anything here -
# two strands crossing simply sum - so the far wing is held down until it stops
# competing with the near one. Rides `mid` so the body of the mix opens the
# depth rather than the transients.
depth_fade  = "0.55 + clamp(mid * 0.176, 0, 0.15)"
# SMALL, AND NOT FOR THE REASON THE PARAMETER NAME SUGGESTS. This preset's ramp
# runs night-blue -> teal -> mint -> solar-white, which is a LIGHTNESS ramp, so
# shifting the palette coordinate with depth does not read as a hue cue here -
# it reads as a second contrast lever pointing the same way as the fade. Proved
# by rendering the identical figure against a constant-lightness hue-travel ramp,
# where the same 0.4 puts a clear cool cyan on the far wing and warm gold on the
# near one. Kept small and deliberately aligned with the fade: far material sinks
# into the night-blue, near material climbs toward the mint.
#
# IT ALSO CANNOT GO MUCH HIGHER HERE. The offset is +/- depth_hue/2 on a
# coordinate the LUT sampler REPEATS, and `hue_center` above sits as low as 0.13,
# so a large value would send the far end negative, wrap it back to the top of
# the ramp, and land the far material on the same bright mint as the near.
depth_hue   = "0.12"
# SPIN IS BOUNDED BY THE TRAIL, NOT BY TASTE. `fade` here holds ~10-15 frames,
# and a frame of trail drawn while the figure turns is a frame of ROTATIONAL
# SMEAR - so past a point the accumulation stops being a trace and becomes a set
# of concentric arcs, which destroys exactly the volume `perspective` just
# bought. Rendered at this fade the ladder 1 / 2 / 3 / 5 / 8 goes crisp, crisp,
# softening, smeared, scribble. The peak here is 1.8.
#
# Bound wide it reads as TUMBLING rather than as being driven: a 1..6 range on
# `bass` through real audio swings the figure through most of a revolution
# between transients and the depth reading never settles. The integration means
# it accelerates rather than snapping - that part is free - but the range has to
# stay narrow enough that the eye keeps hold of the figure.
spin        = "1.0 + clamp(bass * 0.94, 0, 0.80)"

# COMPOSITE - a cold backdrop that warms with the mix, and a four-fold screen
# fold that only engages on the fast personality WITH real energy behind it.
bg_hue        = "0.30 + clamp(bass * 0.118, 0, 0.10)"
# THESE NUMBERS ARE 0.03x THEIR PREVIOUS SELVES AND THE BACKDROP IS UNCHANGED.
# The background pre-pass is upstream of the tonemap, so it was scaled by the
# `exposure = 0.03` this preset used to carry; `brightness` is scene-local and
# does not reach it. Left alone, moving the level would have raised the backdrop
# 33x - from ~1/255 (black, as authored) to a visible grey wash that would have
# put a floor under the figure the whole look is composed against.
bg_bright     = "0.0003 + clamp(mid * 0.000705, 0, 0.0006)"
bg_vignette   = "0.88"
# THE BAND HALF WAS DEAD BEHIND THE TEMPO HALF. `bass + treb > 0.38` cannot be
# reached - the sum tops out near 0.138 - so this fold would not have engaged
# even at 130 BPM. `--report` flags the whole `min(...)` as one gate and blames
# the `tempo` half, which is legitimately one-sided under a single-BPM probe,
# so the dead half hid behind the excusable one. 0.10 is the same near-peak
# placement used by Warp Drive's top tier.
kaleido_order = "select(min(tempo > 124, bass + treb > 1.20), 4, 1)"
# EDGE: falloff (0), chosen in motion. The folded figure is small and centred over
# an empty border, so a fill treatment has nothing real to carry outward - it
# mirrors black. The fade keeps the jewel reading as a jewel.
kaleido_edge  = "0"
kaleido_angle = "time * 0.11"

[smoothing]
# The tempo-gated params are the important ones to ease: a BPM estimate that
# wobbles across the threshold would otherwise hard-cut the whole look.
a             = 0.8
b             = 0.8
c             = 0.8
fade          = 0.9
# WAS A FLAT 0.9 s, WHICH SWALLOWED THE BEAT TERM WHOLE. That value existed to
# ease the tempo gate this param no longer carries; with the gate gone the nib
# can use the family's asymmetric pair - a fast swell on the hit, a slow
# release - which is what the `+ beat * 0.020` above was always for.
size          = { attack = 0.03, release = 0.30 }
hue_spread    = 1.2
palette_mix   = 1.5
zoom          = 1.0
# The depth levers all ease. `perspective` and `spin` are the two that must:
# an unsmoothed perspective pumps the figure's size on every bass frame (it
# scales the projection, so it moves the framing), and an unsmoothed spin steps
# the angular RATE, which the integrator turns into a visible kink in the turn.
# `depth_fade` is slower still - it is an exposure on half the figure, and the
# eye reads a fast change in it as flicker rather than as distance.
perspective   = 0.7
depth_fade    = 1.1
spin          = 0.8
kaleido_order = 1.5
hue_center    = 0.40
bg_bright     = 0.4
