# Lorenz - the classic butterfly, rebuilt as the set's TWO-PERSONALITY preset.
# This is the first shipped preset to use grammar v2's `tempo` variable and the
# comparison operators (Plan 0019): `select(tempo > 124, ..., ...)` gives one
# file a slow, wide, drifting reading for downtempo material and a tight,
# fast-turning, hard-cut reading above ~124 BPM. Everything gated that way is
# written so the UNWARMED case is the calm one - `tempo` is 0 until the tracker
# locks, so a cold start reads as the slow personality and eases into the fast
# one rather than snapping.
#
# Shape: sigma/rho/beta drift slowly around the canonical 10 / 28 / 2.667. Rho
# is the lever that matters - it sets how violently the two lobes trade - so it
# gets the biggest (still small) band term.
# Colour: a night-blue -> teal -> solar-white gradient, crossfading to `ember`
# on the fast personality, so the butterfly literally heats up with the tempo.
system = "attractor"
name = "Lorenz"

[particles]
family = "lorenz"

[palette]
stops = [
  { at = 0.00, color = "#00060f" },
  { at = 0.25, color = "#062b4a" },
  { at = 0.55, color = "#12a3a8" },
  { at = 0.80, color = "#8fe6c2" },
  { at = 1.00, color = "#fbffe8" },
]

[palette_b]
name = "ember"

[params]
# GLOW - the figure is authored to sit UNDER the tonemap knee, so only the
# densest filaments cross 1.0 and bloom picks out exactly those. Authoring
# at the ceiling instead is what made this preset a flat mass at `rich`,
# where 3x the particles deposit into the same texels (design-backlog 0047).
bloom_amount    = "1.2"
bloom_threshold = "0.95"
bloom_radius    = "1.3"
# SHAPE - canonical Lorenz; `d` is unused by this family.
a = "10.0 + sin(time * 0.0290) * 0.55 + clamp(mid * 1, 0, 0.85)"
b = "28.0 + cos(time * 0.0217) * 1.30 + clamp(bass * 3.06, 0, 2.60)"
c = "2.667 + sin(time * 0.0173) * 0.075 - clamp(treb * 0.1, 0, 0.060)"

# DENSITY - the family rule, plus a tempo split: the fast personality runs a
# shorter exposure and a finer point, so quick material reads as a hard strobe
# of structure instead of a smear.
# Lorenz concentrates its density into the lobe cores far harder than the 2D
# maps do, so the nib runs much finer here than elsewhere in the family and the
# exposure runs longer - that is what resolves the filaments instead of a blob.
# Lorenz runs a MUCH shorter exposure than the 2D maps in this family. Its
# particles collapse onto a thin sheet, so ~17 accumulated frames (fade 0.94)
# saturate the lobe cores to flat white no matter how fine the nib is; ~4
# frames is what keeps the sheet reading as filaments.
fade   = "select(tempo > 124, 0.55, 0.62) - clamp(bass * 0.053, 0, 0.045) - beat * 0.015"
size   = "select(tempo > 124, 0.24, 0.30) - clamp(bass * 0.08, 0, 0.07) + beat * 0.04"
# MEASURED. Read 0.48 and never fired - `onset` was then raw spectral flux peaking at
# 0.016, not a 0..1 envelope. Then 0.62, chosen while a reseed still REPLACED
# the cloud with a uniform box - the largest seed box in the set, so the
# reluctance was most justified here. ADR-0066 (Plan 0057 Phase 3) made it a
# bounded in-place jitter, so that justification is gone. Onset means measured
# 0.033 (click:120) / 0.153 (dynamic:110) / 0.391 (chord), ~0.20 real music,
# all against a 1.000 peak. Rank preserved within the family.
#
# NOTE the exposure below is NOT re-raised with the rest of the family. Plan
# 0057 Phase 4 found this scene renders the wrong plane (the shared 3-D view
# basis is x-y; the Lorenz butterfly is x-z) and routed the fix to an ADR, so
# judging this preset's density now would be judging a figure that is about to
# change shape. Re-author after the basis lands.
reseed = "onset > 0.36"

# COLOUR - the fast personality heats toward `ember` and widens; the slow one
# stays a cool, cohesive single family.
# The centre sits LOW in the gradient on purpose. Lorenz's sheet overlaps
# additively, so the dense cores climb to white on their own - keeping the base
# down in the night-blue is what leaves anywhere for them to climb to.
hue_spread  = "select(tempo > 124, 0.30, 0.14) + clamp(treb * 0.233, 0, 0.14)"
hue_center  = "0.20 + sin(time * 0.031) * 0.07 + clamp(bass * 0.188, 0, 0.16)"
saturation  = "1.15 + clamp(mid * 0.376, 0, 0.32)"
palette_mix = "select(tempo > 124, 0.55, 0.05) + clamp(bass * 0.176, 0, 0.15)"

# VIEW - the fast personality pushes in hard and pumps per beat; the slow one
# sits back and breathes on the bar.
# The zoom runs far higher than elsewhere in the family, and that is the real
# density control: Lorenz collapses onto a thin sheet, so spreading it across
# more pixels is what resolves filaments where a smaller nib just makes a
# dimmer blob.
zoom  = "select(tempo > 124, 1.85, 1.55) + bar * 0.16 + clamp(bass * 0.4, 0, 0.34)"
pan_x = "-0.16 + sin(time * 0.039) * 0.08"
pan_y = "cos(time * 0.028) * 0.06"

# COMPOSITE - a cold backdrop that warms with the mix, and a two-fold screen
# fold that only engages on the fast personality WITH real energy behind it.
bg_hue        = "0.30 + clamp(bass * 0.118, 0, 0.10)"
bg_bright     = "0.010 + clamp(mid * 0.0235, 0, 0.020)"
bg_vignette   = "0.88"
# THE BAND HALF WAS DEAD BEHIND THE TEMPO HALF. `bass + treb > 0.38` cannot be
# reached - the sum tops out near 0.138 - so this fold would not have engaged
# even at 130 BPM. `--report` flags the whole `min(...)` as one gate and blames
# the `tempo` half, which is legitimately one-sided under a single-BPM probe,
# so the dead half hid behind the excusable one. 0.10 is the same near-peak
# placement used by Warp Drive's top tier.
kaleido_order = "select(min(tempo > 124, bass + treb > 1.20), 4, 1)"
kaleido_angle = "time * 0.11"

[smoothing]
# The tempo-gated params are the important ones to ease: a BPM estimate that
# wobbles across the threshold would otherwise hard-cut the whole look.
a             = 0.8
b             = 0.8
c             = 0.8
fade          = 0.9
size          = 0.9
hue_spread    = 1.2
palette_mix   = 1.5
zoom          = 1.0
kaleido_order = 1.5
hue_center    = 0.40
bg_bright     = 0.4
