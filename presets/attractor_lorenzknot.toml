# attractor_lorenzknot - the rho-100 torus knot, turned in three dimensions.
#
# THE LOOK: not a butterfly. Lorenz entry 1 is the rho ~ 100 TORUS KNOT - a
# closed braided tube rather than the two-lobed figure the family is known for -
# and this preset exists to show it as a solid. The camera's perspective shrinks
# a particle with depth, `depth_fade` dims it, and `depth_hue` shifts its colour,
# so the far side of the tube sits behind the near side instead of through it.
# `spin` turns the whole thing slowly about its vertical axis.
#
# WHAT DRIVES IT: `spin` rate on mid and the camera's `distance` on bass, both
# eased - the music changes how SOLID the figure looks and how fast it turns, and
# nothing else. Deliberately no `reseed`: this entry's orbit is marginally stable, so a
# kick sends the cloud on an excursion about 2.2x the figure's own extent that
# takes several seconds to fall back. That is a wonderful event and completely
# wrong for a preset whose subject is the figure's shape.
#
# WHAT TO LOOK AT WHEN JUDGING: whether the braid READS as a braid - whether you
# can see one strand pass behind another. That is the whole preset; if the depth
# cues are not doing it, `distance` and `depth_fade` are the two knobs. Second:
# the emergence. The cloud takes about 8 s to settle out of its starting fill, so
# judge this one late, never on the first frame after a switch.

system = "attractor"
name = "Lorenz Knot"

[particles]
family = "lorenz"
# Sparse on purpose, like every shipped 3-D flow (0.006-0.02). At 1.0 the full
# particle count is integrated every frame and the running app fell to ~20 fps;
# the deposit is normalized by count (ADR-0065), so thinning it costs no total
# light - but each surviving particle then carries more of it, and at the old
# size/brightness/bloom the strand swelled into a soft halo. Hence the smaller
# `size`, `brightness` 0.34 -> 0.18 and `bloom_amount` 0.26 -> 0.10 below.
# Measured headless at 1280x720 Rich: 360 frames in 3.1 s against 13.6 s.
density = 0.02

[palette]
stops = [
  { at = 0.00, color = "#050418" },
  { at = 0.26, color = "#1d2c72" },
  { at = 0.52, color = "#2f8fb8" },
  { at = 0.74, color = "#7fe0d0" },
  { at = 0.90, color = "#c9a8f0" },
  { at = 1.00, color = "#f2e8ff" },
]

[generator]
seed = 29

[smoothing]
spin = 0.8
distance = 0.5
fov = 0.5
depth_fade = 0.6
size = 0.3

[params]
# Roster entry 1: the torus knot. Pinned - this preset is about ONE figure.
tuple = "1"

spin = "0.10 + clamp(mid * 0.28, 0, 0.24)"
# THE CAMERA, mapped from the retired `perspective = 0.42 + clamp(bass * 0.33, 0,
# 0.28)` at `zoom = 1.05` (ADR-0260): `distance = 1 / perspective` on this
# entry's unit depth, and the `fov` that keeps the knot the size it was,
# `2 * atan(perspective / (0.584 * 1.05))`, written as a quadratic in the bass
# term (within 0.001 rad) since expressions have no `atan`. Bass brings the
# camera in and widens the lens together, so the figure keeps its size and only
# its depth deepens. Level, as it always was; re-curation is owed.
distance = "1 / (0.42 + clamp(bass * 0.33, 0, 0.28))"
fov = "1.2009 + clamp(bass * 0.33, 0, 0.28) * 2.1949 - pow(clamp(bass * 0.33, 0, 0.28), 2) * 1.4396"
pitch = "0"
depth_fade = "0.38 + clamp(mid * 0.24, 0, 0.20)"
depth_hue = "0.30"

size = "0.36 + clamp(treb * 0.25, 0, 0.15)"
brightness = "0.18"
fade = "0.88"

hue = "0"
hue_spread = "0.62"
hue_center = "0.45"
saturation = "1.0"

emergence = "8"

bg_hue = "0.03"
bg_bright = "0.08"
bg_vignette = "0.72"
occlude = "0.5"

bloom_amount = "0.10"
bloom_threshold = "1.2"
bloom_radius = "1.7"
exposure = "1.0"
