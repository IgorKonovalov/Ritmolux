# Coral Bloom - the CHAOTIC-BRANCHING regime rendered DARK: a glowing blue
# labyrinth growing across a near-black substrate. Fingered fronds that reach,
# split at their tips and never settle.
#
# See `reaction_coral.toml` for the reactivity note that governs this family:
# the chemistry evolves over seconds, so the beat is carried by `contour`,
# `hatch`, the view transform and the composite, all of which respond in a
# frame.
#
# THIS PRESET USED TO BE THE FAMILY'S INK VARIANT - a warm sepia duotone on
# white paper - and the notes below are what it cost to turn it dark, because
# almost none of it worked the way it looks like it should. The ink technique
# itself is not lost from the library: `attractor_ink` still carries it.
#
# 1. INVERTING THE DUOTONE DOES NOT MAKE A DARK PICTURE. The obvious move is to
#    swap the poles - dark paper, bright ink - and the ink shader says why it
#    fails: the remap is `mix(paper, ink, d)` where `d` is simply the source
#    luminance. It INTERPOLATES. A source that is mostly mid-luminance, which a
#    developed Gray-Scott field is, lands halfway between the poles no matter
#    how far apart they are set. Measured, `paper_bright = 0.055` against
#    `ink_bright = 0.94` still rendered a flat slate-grey wash. The inversion
#    only works on an already high-contrast source - a line scene, not a field.
#    So there is no ink pass here at all; a dark look is the ordinary additive
#    render with a dark palette, and `ink_amount` defaults to 0 so the stage is
#    skipped entirely rather than running as an expensive no-op.
#
# 2. `color_center` IS CYCLIC. Pushing it negative to "slide the field into the
#    dark end of the ramp" wraps around into the TOP of the palette and makes
#    the picture brighter. It stays near zero here; contrast is set by the ramp
#    and by `glow`, exactly as in `reaction_coral.toml`, which is the darkest
#    preset in the family and does not touch this param.
#
# 3. THE REAL CAUSE WAS THE CHEMISTRY, not the colour. At the old F 0.0260 /
#    k 0.0510 this regime FILLS the domain as it develops - fronds spread until
#    they meet and no substrate is left. On a white print that is fine, since
#    the ink pass draws structure as dark lines and a full frame still reads. On
#    a dark render there is nothing left to be dark, so the frame becomes the
#    mid-palette colour whatever the palette or the exposure say. Three rounds
#    of colour tuning could not fix it; thinning the feed by 0.0025 did.
system = "reaction_diffusion"
name = "Coral Bloom"

# SHAPED LIKE `reaction_coral.toml`'S RAMP, deliberately. Two attempts at a
# bottom-heavy curve - black until 0.82, all the colour crowded into the last
# fifth - went too far the other way and left the fronds as invisible outlines.
# Coral is the darkest preset in the family AND still legible, and its ramp is
# not bottom-heavy at all: it reaches mid colour by 0.50. The darkness there
# comes from `glow` and from how little of the field is ever near the top.
# Copying that shape and changing only the hue family finally worked.
[palette]
stops = [
  { at = 0.00, color = "#01060f" },
  { at = 0.50, color = "#0d3f7a" },
  { at = 0.82, color = "#3f8fd6" },
  { at = 1.00, color = "#dfeeff" },
]

[palette_b]
name = "ice"

[params]
# CHEMISTRY - chaotic branching, and THINNED from the regime this preset used to
# run. It keeps the property the other three do not have: no steady state. Most
# of Gray-Scott space develops for twenty seconds, arrives at an attractor and
# stops, which is the "very similar once fully developed" problem. Down here the
# field never converges - fronts keep nucleating, colliding and annihilating
# indefinitely - so this is the family's answer to "more dynamics" in the
# strongest sense: its motion is intrinsic rather than driven.
#
# The feed drops 0.0260 -> 0.0235 and the kill rises 0.0510 -> 0.0540 so the
# fronds stop closing over the whole domain (see note 3 in the header). Still
# clearly distinct from Coral's 0.0220 / 0.0570 spots and Reef's 0.0290 / 0.0560
# maze. This is also the most delicate regime of the four: the multipliers on
# feed/kill are SMALL on purpose, because pushed too far it does not get
# livelier, it goes uniform and the frame empties.
feed   = "0.0235 + sin(time * 0.035) * 0.0012 + clamp(bass * 1.18, 0, 1) * 0.0016"
# Centred and bounded, as everywhere in this family now - swinging both ways
# about the base rather than only upward, and under ~0.0020 total excursion.
kill   = "0.0540 + cos(time * 0.026) * 0.0006 + (sin(bar * pi) - 0.5) * 0.0008 + clamp(mid * 1.18, 0, 1) * 0.0007"
flow   = "1.00 + clamp(treb * 1.67, 0, 1) * 0.30"
inject = "beat"

# THE FAST LEVERS - where the beat actually reads, since the chemistry takes
# seconds to propagate. These came DOWN sharply from the ink version, which had
# to flood the field with light to get enough of its white page inked. Against a
# dark substrate the opposite holds: every extra iso-line is another bright mark,
# so restraint is what keeps the fronds reading as separate glowing strands
# rather than as glare.
contour = "3.0 + sin(time * 0.51) * 1.6 + clamp(treb * 5, 0, 3.0) + beat * 1.4"
hatch   = "2.6 + sin(time * 0.29) * 0.8 + clamp(mid * 1.65, 0, 1.4)"
glow    = "0.62 + clamp((bass + mid) * 0.235, 0, 0.40)"

# VIEW - UNPINNED (Plan 0033), and this is the lever the family used to lack.
# The Gray-Scott field is finite but TOROIDAL, and the present sampler now
# WRAPS, so `pan_*` is a seamless infinite scroll rather than a walk off the
# edge. `zoom` is usable in both directions too: below 1.0 magnifies (the
# Catmull-Rom reconstruction landed in the same plan, so it no longer reads as
# angular pixel blobs), above 1.0 tiles. Keep zoom under ~1.3 - past that the
# repeat becomes legible as wallpaper rather than as more field.
zoom  = "0.74 + sin(time * 0.017) * 0.07 + clamp(bass * 0.165, 0, 0.14)"
pan_x = "time * -0.011 + sin(time * 0.010) * 0.05"
pan_y = "cos(time * 0.008) * 0.045"

# COLOUR - saturation is UP where the ink version held it down. That preset
# suppressed it because a saturated source muddies the tonal ramp a duotone
# remap reads; with no remap downstream, saturation in the source survives
# straight into the fronds instead of being crushed, and a desaturated field
# would simply print grey ones.
color_span   = "0.88 + clamp(mid * 0.212, 0, 0.18)"
color_center = "sin(time * 0.44) * 0.07"
saturation   = "0.95 + clamp(treb * 0.367, 0, 0.22)"
palette_mix  = "clamp(bass * 0.53, 0, 0.45)"

# BACKDROP - carrying here where the ink version had none. Against a white page
# a background pass is invisible; against a dark one it is the only thing giving
# the frame depth behind the fronds.
bg_hue      = "0.60 + sin(time * 0.009) * 0.04"
bg_bright   = "0.016 + clamp(mid * 0.0118, 0, 0.010)"
bg_vignette = "0.70"

# FEEDBACK - the ink version ran none, since a print does not smear. On a dark
# field a short tail reads as the fronds having grown INTO where they are, which
# suits a chemistry whose whole point is that it never settles.
trails = "0.44 + clamp(mid * 0.141, 0, 0.12)"

[smoothing]
contour     = { attack = 0.02, release = 0.34 }
hatch       = 0.25
glow        = 0.30
zoom        = 0.18
color_span  = 0.40
color_center = 0.45
saturation  = 0.30
palette_mix = 0.90
bg_bright   = 0.40
trails      = 0.50
