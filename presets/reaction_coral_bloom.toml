# Coral Bloom - the CHAOTIC-BRANCHING regime: fingered fronds that reach, split
# at their tips and never settle. The most restless of the four RD fields, and
# the one pushed furthest up the feed axis - which is what separates it from
# Coral's mitosis spots, the near-duplicate pairing the report used to flag.
#
# See `reaction_coral.toml` for the reactivity note that governs this family:
# the chemistry evolves over seconds, so the beat is carried by `contour`,
# `hatch`, the view transform and the composite, all of which respond in a
# frame. This preset also runs the family's only INK variant - a warm duotone
# that turns the fronds into a botanical print on aged paper.
system = "reaction_diffusion"
name = "Coral Bloom"

[palette]
stops = [
  { at = 0.00, color = "#06121c" },
  { at = 0.42, color = "#134b5e" },
  { at = 0.68, color = "#f0631a" },
  { at = 0.86, color = "#ff8a2b" },
  { at = 1.00, color = "#ffd98a" },
]

[palette_b]
name = "ember"

[params]
# CHEMISTRY - chaotic branching, high on the feed axis.
feed   = "0.0340 + sin(time * 0.035) * 0.0026 + clamp(bass * 1.6, 0, 1) * 0.0058"
kill   = "0.0570 + cos(time * 0.026) * 0.0011 + clamp(mid * 1.6, 0, 1) * 0.0030"
flow   = "1.00 + clamp(treb * 1.1, 0, 1) * 0.30"
inject = "beat"

# THE FAST LEVERS - mid contours and a loose hatch keep the fronds legible.
contour = "4.5 + sin(time * 0.51) * 2.0 + clamp(treb * 20.0, 0, 7.0) + beat * 2.2"
hatch   = "6.0 + clamp(mid * 3.0, 0, 2.6)"
glow    = "1.20 + clamp((bass + mid) * 2.4, 0, 0.85)"

# VIEW - PINNED NEAR NATIVE, and this is a hard constraint, not a taste call.
# The Gray-Scott field is a fixed 256x256 grid, already upscaled ~7x at 1080p.
# `zoom` is INVERTED here (higher shows more of the field) and it is unusable in
# BOTH directions: above 1.0 it samples outside the simulated field and renders
# vertical bars and rectangular blocks; below 1.0 it magnifies the 256px grid
# until the pattern reads as angular pixel blobs instead of organic growth. Any
# real pan at zoom 1.0 walks off the field for the same reason. So this family
# sits at ~0.99 with a whisper of drift, and takes its motion from the chemistry,
# the contour/hatch rendering and the colour instead.
zoom  = "0.99"
pan_x = "sin(time * 0.0130) * 0.008"
pan_y = "cos(time * 0.0091) * 0.006"

# COLOUR - held desaturated, because the ink remap below keys on luminance and
# a saturated source only muddies the tonal ramp it reads.
color_span   = "2.20 + clamp(mid * 0.7, 0, 0.35)"
color_center = "sin(time * 0.44) * 0.10"
saturation   = "0.42 + clamp(treb * 0.4, 0, 0.12)"
palette_mix  = "clamp(bass * 1.2, 0, 0.40)"

# THE PRINT - a warm duotone: sepia ink on aged paper. Rests at the pole, never
# between (a partial `ink_amount` blends toward the near-black source and greys
# the page - see the note in `attractor_thomas.toml`).
ink_amount   = "1"
paper_hue    = "0.09 + clamp(bass * 4.0, 0, 0.14)"
paper_sat    = "0.12 + clamp(mid * 3.2, 0, 0.30)"
paper_bright = "0.965 - clamp(bass * 0.7, 0, 0.10)"
ink_hue      = "0.055 + clamp(treb * 2.2, 0, 0.16)"
ink_sat      = "0.66 + clamp(mid * 1.4, 0, 0.24)"
ink_bright   = "0.095"

[smoothing]
ink_hue     = 0.35
paper_hue   = 0.40
paper_sat   = 0.40
paper_bright= 0.35
ink_sat     = 0.35
contour     = 0.16
hatch       = 0.25
glow        = 0.30
zoom        = 0.18
color_span  = 0.40
saturation  = 0.30
palette_mix = 0.90
