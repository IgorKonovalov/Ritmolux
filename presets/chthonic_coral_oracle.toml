# Chthonic Coral Oracle - a living Gray-Scott reef that thinks in symmetry.
#
# One stateful reaction-diffusion field driven so its Pearson REGIME slowly
# drifts with the low end (bass swells feed and suppresses kill, so the coral
# fills and grows), every beat stamps a fresh sprout of V into the field, the
# whole frame smears into fading ghost-trails, and that smear is folded into a
# slowly-breathing kaleidoscopic mandala. An organic reef-mind blooming in
# dihedral symmetry.
#
# THIS FILE SPENT SIX WEEKS OUTSIDE THE REPO. It was authored on 2026-07-23,
# raised the entry that became ADR-0026 and Plan 0025 - so the levers it asked
# for shipped while the look that asked for them did not - and came home through
# the route ADR-0081 opened. Plan 0067 Phase 3.
#
# WHAT HAD TO BE REPAIRED, and it is not what the plan predicted. Every gain
# here was calibrated against the PRE-ADR-0049 band scale, where bands were raw
# magnitudes with means around 0.04. On today's normalized scale, where a band
# is a fraction of its own recent peak and means run 0.42 / 0.41 / 0.22 / 0.20,
# four of the eight reactive terms sat pinned at a clamp bound essentially
# always - `flow` and `contour` at their ceilings, `hatch` at its floor,
# `trails` at its ceiling. They READ as reactive and were constants. Every gain
# below is re-derived from its own cap by the house rule: cap / 0.85 for bass
# and mid, cap / 0.60 for treb and onset, so a typical passage reaches about
# half the cap and a peak reaches it.
#
# WHAT DID NOT NEED REPAIRING: `bar`. Plan 0067 records that it stopped being a
# variable at ADR-0050; it did not - it is slot 5 of `VAR_NAMES` and is the 0..1
# beat phase. The line was left as authored.
#
# What drives what:
#   bass  -> regime drift (feed up / kill down = more coral mass) + trail length
#            + kaleido wedge count   [all heavily eased -> drifts, never jitters]
#   mid   -> diffusion scale (flow) + iso-contour density
#   treb  -> palette shimmer + tighter hatch ticks
#   onset -> glow blooms on transients
#   beat  -> stamps new coral growth (rising edge); strong onsets also sprout
#   time  -> slow hue cycle + slow mandala rotation
#   bar   -> per-beat rotational wobble of the fold

system = "reaction_diffusion"
name = "Chthonic Coral Oracle"

[params]
# REGIME - rests on the classic coral-labyrinth point (feed 0.0545 / kill 0.062)
# where growth stays sparse with dark gaps. bass nudges toward more mass, but
# kill is held HIGH so the gaps never fill in: a flat fill is the death of
# contrast in this scene. Small gains plus heavy easing means the reef morphs
# shape over seconds rather than pulsing.
# THE HOUSE GAIN RULE DOES NOT APPLY TO THESE TWO, and finding that out cost a
# render. Everywhere else in this project a clamped band term should reach its
# cap on a peak - that is what makes the cap meaningful. Here the cap is a
# DEATH STATE: feed high and kill low is the filled regime, where the gaps close
# and the picture becomes a flat wash with no contour left to draw. Derived by
# the rule (feed cap 0.059, kill floor 0.0595) the reef reached exactly that on
# a sustained loud passage and rendered as flat mustard.
#
# So these two are deliberately gentle, and the caps are pulled in to 0.0575 and
# 0.0610 - inside the labyrinth regime at BOTH ends. The reactive span is small
# on purpose: this is a slow drift between two living states, not a sweep to the
# edge of the parameter space. The original author's tiny gains had the right
# instinct even though they were calibrated on the old scale.
feed = "clamp(0.0545 + bass * 0.0035, 0.052, 0.0575)"
kill = "clamp(0.062 - bass * 0.0012, 0.0610, 0.063)"

# SPATIAL SCALE - mid energy coarsens the pattern into bigger, looser
# structures. Was `mid * 6` against a 1.1 span, which reached the ceiling at
# mid = 0.18 and stayed there.
flow = "clamp(0.7 + mid * 1.294, 0.5, 1.8)"

# GROWTH INJECTION - each beat's rising edge sprouts new coral. Left UN-eased on
# purpose so the edge stays crisp for the scene's edge detector.
#
# The onset multiplier came down from 3 to 1.5. At 3 a normalized onset cleared
# the 0.5 stamp threshold at 0.167 - below the typical level of 0.20 - so the
# field was being stamped almost continuously and the beat had nothing left to
# say. At 1.5 it takes an onset of 0.33 to sprout, which is a transient rather
# than a pulse.
inject = "clamp(beat + onset * 1.5, 0, 1)"

# PRESENT LOOK - living iridescent contours.
hue     = "time * 0.03 + treb * 0.6"
contour = "clamp(3 + mid * 7.06, 3, 9)"
hatch   = "clamp(6 - treb * 6.67, 2, 8)"
glow    = "clamp(0.8 + onset * 1.667, 0.6, 1.8)"

# GHOST-TRAILS - the smear grows with the low end, kept modest so motion leaves
# fading light without accumulating into a flat wash.
trails = "clamp(0.22 + bass * 0.329, 0.12, 0.5)"

# THE FOLD, AND THE SECOND REPAIR THE PLAN DID NAME. This was
# `clamp(6 + bass * 8, 3, 14)` eased at tau = 2.0 - a continuous term feeding a
# parameter whose math wants integers, so two seconds of every transition were
# spent at fold counts that are not fold counts.
#
# A ladder instead, which is what `fragment_kaleido.toml` does for the same
# reason: the value is only ever one of three integers, and the long easing
# turns the step between them into the rosette growing petals rather than a cut.
# Rungs placed so a quiet passage sits at 6, a normal one at 8, and only a real
# peak reaches 12.
kaleido_order = "select(bass > 0.72, 12, select(bass > 0.45, 8, 6))"
kaleido_angle = "time * 0.06 + bar * 0.5"

# EASING (ADR-0019) - the regime and structural knobs drift over seconds so the
# reef morphs organically instead of snapping frame to frame. inject, glow, hue
# and kaleido_angle are left instant on purpose: crisp beats, exact rotation.
[smoothing]
feed          = 3.0
kill          = 3.0
flow          = 1.2
contour       = 0.6
trails        = 1.0
kaleido_order = 1.6
