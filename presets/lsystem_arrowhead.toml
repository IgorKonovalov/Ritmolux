# Arrowhead - a Sierpinski arrowhead L-system (both F and G draw) that fills a
# fractal triangle: the hard, geometric foil to the organic fern. Where the fern
# grows outward, this one subdivides INWARD, so stepping `visible_depth` makes
# the same silhouette resolve into finer and finer self-similar detail.
#
# That is the reason this preset pairs so well with the screen-space
# kaleidoscope rather than the geometry mirror: the arrowhead is already a
# closed, edge-to-edge fractal, so replicating its geometry just crowds it,
# while folding the finished PIXELS builds a larger tiling out of it. The two
# symmetry tools are not interchangeable - and this preset now runs both at
# once itself, the geometry mirror for the arms and the screen fold for the
# tiling. See the `kaleido_order` note below.
#
# The old version's `brightness = 0.5 + 0.5 * sin(time * 4)` strobe is gone.
system = "lsystem"
name = "Arrowhead"

[generator]
axiom     = "F"
rules     = { F = "G-F-G", G = "F+G+F" }
angle_deg = 60
max_depth = 7
seed      = 1

# The geometry mirror below costs nothing in resolution because it replicates
# real geometry BEFORE rasterisation, while `kaleido_*` folds finished pixels -
# so on the line scenes, prefer `mirror_*` when both would do. Since Plan 0033
# the feedback and kaleidoscope stages follow the RENDER TARGET rather than a
# fixed 1280x720, so `trails` no longer costs this preset its sharpness.

[params]
# THE SUBDIVISION - four levels on three comparison gates. Each step roughly
# triples the segment count, so this is the widest structural range in the set.
#
# AND IT NEVER LEFT THE BOTTOM RUNG. Measured with `shot --signal dynamic:110`,
# mid and treb now mean 0.41 and 0.22, so `mid + treb` is typically ~0.63 and reaches
# 0.051. Against thresholds of 0.50, 0.28 and 0.10 not one gate could return 1:
# this preset drew depth 4 - the coarsest, sparsest version of the figure - for
# its entire existence. "Boring" was not a matter of taste; the widest
# structural range in the set was wired shut.
#
# Rebuilt against the measurement: 0.008 sits just under the mean so quiet
# material still resolves past the coarse form, 0.018 is normal, and 0.030 is a
# genuine peak. The fractal now actually subdivides, which is the one thing this
# preset is for.
visible_depth = "select(mid + treb > 1.18, 7, select(mid + treb > 0.71, 6, select(mid + treb > 0.31, 5, 4)))"

# NO ROTATION. This used to turn at 0.88 rad/s continuously, and the argument
# for it was that a large near-symmetric figure needs a brisk turn or it reads
# as frozen. That argument is now void, because the figure is no longer static
# underneath: the depth ladder and the mirror ladder were both unreachable when
# that rate was chosen, so rotation genuinely was the only thing moving. With
# both ladders live, the arrowhead subdivides and gains arms on its own, and the
# per-beat reveal below sweeps across it - all without the whole frame spinning.
#
# Held at exactly 0 rather than at a slow sway: the axis-aligned fold below only
# reads as a top-to-bottom, left-to-right tiling if the source it folds is
# itself square to the frame. Any residual turn puts the tiling on a diagonal.
rotation = "0"

# The reveal carries the motion that rotation used to - and as of Plan 0045 it
# carries it IN SILENCE TOO, which is the point of the `sin(time)` term.
#
# The whole reveal used to be audio-only: `0.45 + bar * 0.70`. With no music
# that is a CONSTANT 0.45, and it was not alone - at silence `visible_depth`
# sits on its bottom rung, `mirror_order` on its, and `zoom`, `thickness`,
# `brightness`, `glow` and `trails` are all constant too. The entire preset was
# animated by two thin terms, `scale`'s breath and the `hue` drift, and it
# measured 0.0103 against the 0.01 animation floor - the closest to frozen in
# the library. ADR-0055 (the backdrop leaving the post chain, so a fading trail
# now lets the backdrop back in) cost it 0.0008 and it went under.
#
# Sweeping the reveal on time is the right fix rather than the convenient one:
# it is what this preset already says its motion is, it changes WHICH SEGMENTS
# EXIST rather than merely tinting them, and it adds no rotation - so the fold
# stays axis-aligned and the tiling stays square to the frame. Both pinned
# intents below survive untouched.
#
# 0.72 +/- 0.28 puts the trough at 0.44 - level with the 0.45 this used to rest
# at, so its sparsest moment is the figure as it always looked - and the crest
# at 1.00, with a mean of 0.72 well above the old resting value. The audio terms
# still take it to a full 1.0 on a beat, so PEAK coverage is exactly what it
# was: nothing is added to the additive ceiling (`cover` measures 0.915 already),
# the resting state is simply no longer still.
draw_progress = "clamp(0.72 + sin(time * 0.72) * 0.28 + bar * 0.30 + clamp(onset * 0.2, 0, 0.12), 0, 1)"

# STROKE FALLOFF (Plan 0038). `glow` scales the line renderer's core-to-edge
# term - it is the shader's per-segment falloff, NOT a bloom stage and NOT the
# same quantity as `glow` on fragment_field or reaction_diffusion, where the name
# is shared and the meaning is not.
#
# This preset is the reason it was worth binding. At depth 7 the arrowhead curve
# is the densest figure in the set - it measured the highest coverage of any
# preset here, with nearly the whole frame lit - and at the default 1.0 the fine
# curls fuse into a warm wash where the self-similarity stops reading. Pulling
# the falloff down separates them again and lets the backdrop through, which is
# what makes it legible as a fractal rather than as texture.
#
# 0.55 rather than lower on purpose: the docs note there is more usable range
# below 1.0 than above it, and by 0.30 this figure has gone cool and lacy and no
# longer looks like itself. There is no audio term - the strokes already carry
# `brightness`, and stacking a second luminance driver on an additive renderer is
# how a peak clips to white.
# Bound rather than constant now, and it moves the OPPOSITE way to the density.
# The argument above still holds - a dense figure at high falloff fuses into a
# wash - but the density is no longer fixed: with the depth ladder reachable,
# this preset is sparse at depth 4 and very dense at depth 7. So the falloff
# rides `bass` upward to give the sparse figure some body, and the cap is small
# enough that it cannot fatten a depth-7 frame into a blur.
glow = "0.55 + clamp(bass * 0.306, 0, 0.26)"

# Stroke weight breathes on its own slow cycle, a third rate again against
# `scale` and `zoom`. On a figure that is nothing but line, weight is the one
# thing that changes every lit pixel at once, and this preset needed a term that
# does: it is a sparse drawing on a large static backdrop, so ~85% of the frame
# cannot contribute motion at all. Kept small - the mid term above still owns
# the audio response, and this only has to keep the strokes alive between beats.
thickness  = "1.35 + sin(time * 0.53) * 0.22 + clamp(mid * 1, 0, 0.85)"
brightness = "0.72 + clamp(mid * 0.188, 0, 0.16)"
# Breath deepened 0.07 -> 0.10. The second of the two terms that were carrying
# this preset alone; now one of four time-scales rather than half the budget.
scale      = "0.82 + sin(time * 0.95) * 0.10 + bar * 0.05 + clamp(bass * 0.165, 0, 0.14)"

# COLOUR, and this is the "more colours" ask - within what the system allows.
# `hue` is an offset into the line scenes' own cosine ramp and it is whole-figure:
# `lsystem` has no `hue_spread`, and `[palette]` is inert on the line scenes, so
# there is NO way from a preset to give one branch a different colour from
# another. Per-segment colour on an L-system is an engine gap, not an authoring
# choice - it is written up for architect rather than worked around here.
#
# What is available is the whole figure travelling further and faster through the
# ramp, so it is no longer the fixed orange it sat at. The drift rate doubles
# (a full wheel in ~22 s rather than ~43 s), the treble term is gained to the
# measured mean so it actually contributes, and a per-beat half-sine nudges the
# colour on the pulse. `mod(…, 1)` keeps the wrap clean - the ramp is cyclic, so
# without it the value climbs forever and the smoothing below has to chase it.
# Drift raised again, 0.045 -> 0.075 (a full wheel in ~13 s rather than ~22 s).
# The same argument as the doubling above - the figure travelling further and
# faster through the ramp - and it is the one term that keeps moving when the
# geometry is between breaths.
hue        = "mod(0.62 + time * 0.075 + clamp(treb * 0.467, 0, 0.28) + sin(bar * pi) * 0.05, 1)"

# GEOMETRY MIRROR - the source of the "several lines". Rotational copies of the
# whole fractal, interleaving into a radial web, and MID drives the fold count
# so the number of arms is itself a band reading. Full resolution.
#
# Same unreachable-gate bug as the depth ladder, and worse: mid alone means
# 0.006 and peaks at 0.019, so `mid > 0.22` and `mid > 0.08` BOTH never fired
# and the mirror was frozen at four copies. Recalibrated, and the top rung
# raised 8 -> 10 now that it can actually be reached.
mirror_order   = "select(mid > 0.63, 10, select(mid > 0.26, 7, 4))"
mirror_reflect = "0"

# THE SCREEN FOLD, newly bound - and there was already a `kaleido_order` entry
# sitting in the [smoothing] table below for a param this file never bound, so
# the intent was here and the binding was simply missing. The header argues that
# the arrowhead pairs better with the screen-space kaleidoscope than with more
# geometry, because it is already a closed edge-to-edge fractal: replicating its
# geometry crowds it, while folding the finished PIXELS builds a larger tiling
# out of it. Both are now running, which is what turns a single fractal triangle
# into a field.
#
# Held low on purpose. The mirror above is already up to ten copies, and the
# fold multiplies whatever luminance it is handed - a high order over a dense
# depth-7 figure is how this becomes a white wash.
# AXIS-ALIGNED, AND FIXED. `kaleido_order = 4` with the angle pinned at 0 folds
# the frame about the vertical and horizontal axes, so the tiling runs top to
# bottom and left to right rather than as a rotating radial rosette. Both parts
# are required: the order sets how many wedges, the ANGLE is what decides
# whether their seams line up with the frame or sweep round it. A turning angle
# is what made this read as a spinning mandala.
#
# The order is a constant now for the same reason - stepping it 2 -> 3 -> 4 with
# the audio would keep changing the tiling's axis count, and only 4 gives the
# square top/bottom, left/right symmetry asked for. The audio drives the figure
# INSIDE the tiling (depth, arms, reveal) rather than the tiling itself.
kaleido_order = "4"
kaleido_angle = "0"


# A slow counter-breath against `scale`, at roughly half its rate and in its own
# phase, so the tiling pushes and pulls through the fold rather than the whole
# figure simply pulsing in step. Was audio-only, and therefore another constant
# at silence.
zoom        = "1.05 + sin(time * 0.41) * 0.05 + bar * 0.05 + clamp(bass * 0.165, 0, 0.14)"
pan_y       = "-0.04 + cos(time * 0.0130) * 0.05"
bg_hue      = "0.44 + sin(time * 0.0110) * 0.06"
# Cap cut 0.13 -> 0.06 as well as gained. This is a full-frame wash sitting
# under a figure that now reaches depth 7 across ten mirror copies and a screen
# fold; the backdrop is the one luminance term with nothing to gain from a big
# swing, and it is the cheapest thing to take headroom from.
bg_bright   = "0.070 + clamp((bass + mid) * 0.0353, 0, 0.06)"
bg_vignette = "0.52"

# FEEDBACK - restored (Plan 0033), held short: rotation is 0.88 rad/s, the fastest sweep of the two L-systems.
trails = "0.52 + clamp(mid * 0.141, 0, 0.12)"

[smoothing]
visible_depth = 1.1
rotation      = 0.18
thickness     = 0.15
scale         = 0.06
hue           = 0.42
zoom          = 0.18
bg_bright     = 0.40
trails       = 0.55
