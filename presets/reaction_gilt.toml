# Gilt - a mandala made the way this engine can actually make one: a Gray-Scott
# field pushed into its filament regime, contoured hard, and folded at high order
# onto black.
#
# WHY THIS SCENE AND NOT `star_pattern`. The obvious route to a mandala is placed
# geometry - rings of repeated motifs - and this project built exactly that
# (Plan 0065). It was rejected on sight and the reason is structural rather than
# tuning: every motif is a parametric outline SAMPLED TO STRAIGHT SEGMENTS, so at
# any size worth looking at you see the vertices, the joints bead where two quads
# overlap, and a circle reads as a polygon. A mandala is made of drawn curves and
# a polyline is not one.
#
# The `contour` term here is an ANALYTIC iso-contour of the reaction field,
# evaluated per pixel in the shader. There is no geometry in this picture at all,
# so there is no vertex to see at any resolution or zoom - which is the whole
# argument for doing it this way.
#
# THE SYMMETRY COMES FROM THE FOLD, not from placement. `kaleido_order` mirrors
# the finished frame into 10-18 wedges, so the ornament's rotational symmetry is
# a composite-stage property and rides the music directly. `kaleido_edge = 0`
# (falloff) is the other half of the look: it fades outside the fold's inscribed
# disc, which makes this an OBJECT on black rather than a wallpaper. Contrast
# `fragment_kaleido` (squash, a border-filling field) and `reaction_reliquary`
# (tile, set into a wall) - three presets, three treatments, which is the
# per-preset choice ADR-0061 exists for.
#
# THE RADIAL RAYS at the rim are not trails and not a defect - trails at 0.0
# renders identically. Near the disc edge one wedge spans a wide arc, so the
# source field is stretched radially; it reads as a sunburst frame around the
# ornament and it is kept deliberately.
system = "reaction_diffusion"
name = "Gilt"

# ONE METAL, dark to light. Deliberately narrow: the geometric mandalas this
# replaces ran five unrelated hues across the radius and read as a colour wheel
# rather than as an ornament. A mandala wants one material and a lot of value
# range, which is what these five stops are.
[palette]
stops = [
  { at = 0.00, color = "#000000" },
  { at = 0.30, color = "#2a1400" },
  { at = 0.62, color = "#b8791f" },
  { at = 0.85, color = "#ffc94a" },
  { at = 1.00, color = "#fff2c4" },
]

[params]
# THE REGIME. feed/kill hold the field in its filament band - the one that grows
# branching worms rather than spots or a maze - and the low end nudges what the
# chemistry GROWS rather than how bright it is.
feed   = "0.0298 + clamp(bass * 1.18, 0, 1) * 0.0022 + sin(time * 0.029) * 0.0016"
kill   = "0.0575 + clamp(mid * 1.18, 0, 1) * 0.0008 + cos(time * 0.021) * 0.0007"
flow   = "0.94 + clamp(treb * 1.67, 0, 1) * 0.22"

# `inject` carries a real BASELINE, not just the accent. A Gray-Scott field grows
# from what is injected into it, and a preset whose only injection is on onsets
# starts from nothing and stays there through any quiet opening.
inject = "0.30 + clamp(onset * 0.75, 0, 0.40) + beat * 0.14"

# THE ENGRAVING. Contour density high, hatch low: contours are the curves and
# hatch is the tone between them, and this look wants line rather than shading.
contour = "9.5 + sin(time * 0.31) * 1.6 + clamp(treb * 5, 0, 2.6) + beat * 1.4"
hatch   = "1.1 + clamp(mid * 1.2, 0, 0.7)"

# LUMINANCE stays nearly flat. The fold REPLICATES light as well as structure, so
# a mid term worth 0.15 unfolded is worth up to eighteen times that across the
# rosette. Loudness reads here through fold count and contour density, both of
# which are structure and cost no light.
glow    = "0.70 + clamp((bass + mid) * 0.12, 0, 0.18)"

hue          = "0.09 + time * 0.009"
color_span   = "0.30 + clamp(mid * 0.12, 0, 0.10)"
color_center = "0.30 + sin(time * 0.019) * 0.06"
saturation   = "1.05 + clamp(treb * 0.20, 0, 0.12)"

# Higher `zoom` on this family shows MORE field, so it sets how fine the ornament
# is rather than how large the figure is.
zoom  = "1.30 + sin(time * 0.015) * 0.09 + clamp(bass * 0.19, 0, 0.16)"
pan_x = "sin(time * 0.0110) * 0.06"
pan_y = "cos(time * 0.0093) * 0.05"

# THE FOLD. Ten wedges at rest, eighteen at a peak - and the quiet figure is not
# a lesser version of the loud one but a different, more legible ornament with
# larger cells. Loud adds folds and fineness together, which is the direction a
# preset is supposed to move in.
kaleido_order = "select(bass + mid > 1.30, 18, select(bass + mid > 0.80, 14, 10))"
kaleido_edge  = "0"
kaleido_angle = "time * 0.048"
trails        = "0.26 + clamp(onset * 0.28, 0, 0.16)"

[smoothing]
# The fold replicates motion as well as luminance, so everything that could
# twitch is eased longer than it would be on an unfolded field. `kaleido_order`
# gets the longest constant in the file: it turns a discrete jump between fold
# counts into a rosette growing petals, and it is the anti-chatter lever for a
# gate whose input hovers near a boundary for whole passages.
feed          = 0.90
kill          = 0.90
flow          = 0.40
inject        = 0.30
contour       = 0.35
hatch         = 0.35
glow          = 0.25
hue           = 0.40
color_center  = 0.45
zoom          = 0.30
kaleido_order = 1.3
trails        = 0.40
