# Nightbloom - the Maurer world that succeeds the rose family (Plan 0075,
# cohort 1). One flower, midnight-violet into coral and gold, that MORPHS ITS
# SHAPE on the music instead of only its brightness: phase reshapes the petals
# continuously, radial_offset opens the bloom off-origin on the bass, and every
# fourth beat the Maurer step angle re-cuts to a new chord pattern - a latched
# structural change, softened by the trail, so the flower is never the same
# figure two phrases running.
#
# WHAT DRIVES WHAT. phase = slow morph + bass lean (petals twist toward the
# low end); radial_offset = breath + bass opening; d = hash-latched per 4
# beats across {27,29,31,33,35} - five genuinely different chord figures;
# treb tips the stroke; beat ticks it. spin stays a small CONSTANT: on this
# scene rotation = spin * time, so an audio-driven spin multiplies absolute
# time and jerks - the morph carries the motion instead.
system = "parametric_curve"
name   = "Nightbloom"

[curve]
family = "maurer_rose"

[palette]
stops = [
  { at = 0.0, color = "#3a0ca3" },
  { at = 0.28, color = "#b5179e" },
  { at = 0.52, color = "#f72585" },
  { at = 0.75, color = "#ff9e00" },
  { at = 1.0, color = "#39e5c8" },
]

[params]
n = "7"
# The re-cut: a new Maurer step angle every four beats, from the seeded hash.
# The three angles are chosen COPRIME TO 360 on purpose - a step angle sharing
# a factor with 360 closes the path after 360/gcd steps (d = 27 closes in 40
# chords and renders as a string-art star, measured on this file's own first
# draft), while 29 / 37 / 43 each walk the full 360-chord web before closing.
d = "select(hash(floor(beat_index / 4)) < 0.33, 29, select(hash(floor(beat_index / 4)) < 0.66, 37, 43))"

# The shape morph - the family's own levers, not brightness.
phase         = "time * 0.11 + clamp(bass * 0.82, 0, 0.7)"
radial_offset = "0.06 + sin(time * 0.23) * 0.05 + clamp(bass * 0.29, 0, 0.25)"

samples = "720"
spin    = "0.06"
scale   = "0.62"
zoom    = "1.06"

# A fine filament - the lace is 360 crossing chords, so the stroke must be
# thin or the web reads as a mat.
# Held DOWN on purpose: 720 crossing chords sum additively, and the bold
# palette only shows if the crossings stay under the ceiling - at brightness
# 0.92 the lace rendered white-pink with every stop washed out (measured).
thickness  = "1.5 + clamp(treb * 0.83, 0, 0.5) + beat * 0.25"
glow       = "0.85"
brightness = "0.32 + clamp(mid * 0.24, 0, 0.2)"

# Colour travels the whole ramp along the drawn path, and palette_steps cuts
# the travel into hard bands - the lace reads as distinct coloured threads
# (violet, magenta, flame, teal) instead of one blended tint.
hue           = "0.5 + time * 0.008"
hue_spread    = "1.0"
saturation    = "1.0"
palette_steps = "6"

# The petal afterimage: enough tail to soften each re-cut into a bloom.
trails = "0.34 + clamp(bass * 0.12, 0, 0.1)"

bg_hue      = "0.72 + sin(time * 0.007) * 0.04"
bg_bright   = "0.016 + clamp(bass * 0.012, 0, 0.01)"
bg_vignette = "0.8"

[smoothing]
phase         = 0.25
radial_offset = 0.35
thickness     = { attack = 0.02, release = 0.3 }
brightness    = 0.3
trails        = 0.5
hue_spread    = 0.45
bg_bright     = 0.4
