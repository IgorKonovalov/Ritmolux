# Leviathan - the De Jong attractor as a living creature rather than a dust
# cloud. The four shape coefficients are the instrument: moving a, b, c, d
# continuously rebuilds the entire attractor, so the form itself breathes,
# folds and turns inside out with the music. Short exposure and a fine nib keep
# it filamentary instead of a blob, and the fold turns the creature into a
# cathedral of itself on the loud sections.
system = "attractor"
name = "Leviathan"

[particles]
family = "de_jong"

[palette]
stops = [
  { at = 0.00, color = "#00040f" },
  { at = 0.22, color = "#0b2f6b" },
  { at = 0.46, color = "#00c2b2" },
  { at = 0.70, color = "#9dff6a" },
  { at = 0.88, color = "#ffd166" },
  { at = 1.00, color = "#fff4e6" },
]

[palette_b]
name = "ember"

[params]
# GLOW - the figure is authored to sit UNDER the tonemap knee, so only the
# densest filaments cross 1.0 and bloom picks out exactly those. Authoring
# at the ceiling instead is what made this preset a flat mass at `rich`,
# where 3x the particles deposit into the same texels (design-backlog 0047).
bloom_amount    = "1.4"
bloom_threshold = "0.9"
bloom_radius    = "1.4"
# THE COEFFICIENTS ARE THE INSTRUMENT. Each is a slow independent wander with a
# band term on top, so the attractor is always mid-transformation and never
# settles into the one shape a static preset shows.
a = "-2.10 + sin(time * 0.0170) * 0.38 + clamp(bass * 0.4, 0, 0.34)"
b = "-2.34 + cos(time * 0.0130) * 0.34 + clamp(mid * 0.353, 0, 0.30)"
c = "1.28 + sin(time * 0.0091) * 0.42 + clamp(treb * 0.433, 0, 0.26)"
d = "1.96 + cos(time * 0.0110) * 0.36 + clamp(bass * 0.282, 0, 0.24)"

# EXPOSURE - short, so the sheet stays filamentary. A long fade saturates the
# dense cores to flat white and erases the structure the coefficients just built.
# RE-RAISED HALFWAY, 2026-08-03 (Plan 0057 Phase 6), NOT reverted. These read
# 0.855 / 0.52 (and `trails` 0.46) until `00d99d0` cut them to 0.52 / 0.26 /
# 0.18 so the preset would survive the `rich` tier, where 3x the particles
# deposited 3x the light into the same texels. ADR-0065 (Phase 2) normalized
# the deposit by particle count, so the compensation is owed back - but the
# same commit added the bloom stage above, sized to the LOWERED figure.
# RENDERED, not reasoned: at 75% of the way back the centre star whites out;
# at 50% the cyan holds across the whole rosette. Verified at both tiers.
fade   = "0.69 - clamp(bass * 0.088, 0, 0.075) - beat * 0.020"
size   = "0.39 - clamp((bass + treb) * 0.080, 0, 0.118) + beat * 0.09"
# Re-derived for a disturbance. 0.69 was set while a reseed still REPLACED the
# cloud with a uniform box, so reluctance was protective; ADR-0066 (Plan 0057
# Phase 3) made it a bounded in-place jitter, and the reluctance then only
# costs accents. Onset means measured 0.033 (click:120) / 0.153 (dynamic:110) /
# 0.391 (chord), ~0.20 real music, all against a 1.000 peak. Rank preserved.
reseed = "onset > 0.40"

hue_center  = "0.30 + sin(time * 0.021) * 0.16 + clamp(bass * 0.235, 0, 0.20)"
# Held NARROW deliberately. Widening this to 0.62 was tried and reverted: the
# palette pale end floods in and the creature goes chalk-white, losing the
# saturated cyan that makes it read as lit from within rather than drawn.
hue_spread  = "0.34 + clamp(treb * 0.5, 0, 0.30)"
saturation  = "1.15 + clamp(mid * 0.282, 0, 0.24)"
palette_mix = "clamp(treb * 0.67, 0, 0.40) + sin(time * 0.0083) * 0.25"

# ZOOM IS A FOLD CONSTRAINT HERE, NOT A TASTE (2026-08-03). The fold's residual
# rays are the DISC EDGE smeared radially outward, so they are only as bright as
# whatever the figure puts at that edge. At zoom 1.12 the creature reached the
# edge and the frame grew a permanent starburst; pulled inside the disc it
# produces none, verified by rendering. Peak zoom here is 0.72+0.04+0.10 = 0.86,
# deliberately under the inscribed radius. Raising this back re-lights the rays.
# The general fix is a per-preset edge treatment - Plan 0055, approved, not built.
zoom  = "0.72 + bar * 0.04 + clamp(bass * 0.12, 0, 0.10)"
pan_x = "sin(time * 0.023) * 0.06"
pan_y = "cos(time * 0.031) * 0.05"

bg_hue        = "0.58 + sin(time * 0.013) * 0.06"
bg_bright     = "0.008 + clamp(mid * 0.0176, 0, 0.015)"
bg_vignette   = "0.82"
# THE FOLD IS PINNED AT SIX AND IS THIS PRESET'S ALONE (2026-08-03). It used to
# snap between 1 and 6 leaves on `bass + mid`, and so did De Jong on the same
# family and the same threshold - two problems in one binding. A leaf count that
# changes with the music reads as chaos rather than as response (the user's
# call), and `kaleido_order` is a STEPPED parameter, so easing it swept the
# value through fractional wedge counts that cannot divide the circle. Pinning
# it fixes both at once and lets the header's "cathedral of itself" be the
# resting state instead of a rare peak event. Motion now comes from
# `kaleido_angle` alone, which is continuous and safe to ease.
kaleido_order = "6"
kaleido_angle = "time * 0.055"
trails        = "0.32 + clamp(onset * 0.300, 0, 0.18)"

[smoothing]
a             = 0.55
b             = 0.55
c             = 0.55
d             = 0.55
fade          = 0.20
size          = { attack = 0.02, release = 0.26 }
zoom          = 0.16
hue_center    = 0.40
hue_spread    = 0.50
palette_mix   = 0.70
trails        = 0.45
bg_bright     = 0.40
