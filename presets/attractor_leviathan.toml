# Leviathan - the De Jong attractor as a living creature rather than a dust
# cloud. The four shape coefficients are the instrument: moving a, b, c, d
# continuously rebuilds the entire attractor, so the form itself breathes,
# folds and turns inside out with the music. Short exposure and a fine nib keep
# it filamentary instead of a blob, and the fold turns the creature into a
# cathedral of itself on the loud sections.
system = "attractor"
name = "Leviathan"

[particles]
family = "de_jong"

[palette]
stops = [
  { at = 0.00, color = "#00040f" },
  { at = 0.22, color = "#0b2f6b" },
  { at = 0.46, color = "#00c2b2" },
  { at = 0.70, color = "#9dff6a" },
  { at = 0.88, color = "#ffd166" },
  { at = 1.00, color = "#fff4e6" },
]

[palette_b]
name = "ember"

[params]
# GLOW - the figure is authored to sit UNDER the tonemap knee, so only the
# densest filaments cross 1.0 and bloom picks out exactly those.
#
# THE TIER HAZARD THAT ARGUMENT WAS WRITTEN AGAINST IS GONE, and the tuning is
# kept for its own sake rather than for that reason (Plan 0104 Phase 5 sweep).
# This line used to say that authoring at the ceiling is what made the preset a
# flat mass at `rich`, where 3x the particles deposit into the same texels
# (design-backlog 0047). ADR-0065 - Plan 0057 Phase 2 - normalizes the additive
# deposit by particle count, so `rich` now buys less shot noise in the same
# picture instead of three stops of brightness, and the two tiers match in
# luminance. Sitting under the knee is still the right place for this figure;
# it is no longer a tier workaround.
bloom_amount    = "1.4"
bloom_threshold = "0.9"
bloom_radius    = "1.4"
# THE COEFFICIENTS ARE THE INSTRUMENT. Each is a slow independent wander with a
# band term on top, so the attractor is always mid-transformation and never
# settles into the one shape a static preset shows.
# No rotation (see the fold note below) - the morph is the motion.
spin = "0"
a = "-2.10 + sin(time * 0.0170) * 0.38 + clamp(bass * 0.4, 0, 0.34)"
b = "-2.34 + cos(time * 0.0130) * 0.34 + clamp(mid * 0.353, 0, 0.30)"
c = "1.28 + sin(time * 0.0091) * 0.42 + clamp(treb * 0.433, 0, 0.26)"
d = "1.96 + cos(time * 0.0110) * 0.36 + clamp(bass * 0.282, 0, 0.24)"

# EXPOSURE - short, so the sheet stays filamentary. A long fade saturates the
# dense cores to flat white and erases the structure the coefficients just built.
# RE-RAISED HALFWAY, 2026-08-03 (Plan 0057 Phase 6), NOT reverted. These read
# 0.855 / 0.52 (and `trails` 0.46) until `00d99d0` cut them to 0.52 / 0.26 /
# 0.18 so the preset would survive the `rich` tier, where 3x the particles
# deposited 3x the light into the same texels. ADR-0065 (Phase 2) normalized
# the deposit by particle count, so the compensation is owed back - but the
# same commit added the bloom stage above, sized to the LOWERED figure.
# RENDERED, not reasoned: at 75% of the way back the centre star whites out;
# at 50% the cyan holds across the whole rosette. Verified at both tiers.
fade   = "0.69 - clamp(bass * 0.088, 0, 0.075) - beat * 0.020"
size   = "0.39 - clamp((bass + treb) * 0.080, 0, 0.118) + beat * 0.09"
# Re-derived for a disturbance. 0.69 was set while a reseed still REPLACED the
# cloud with a uniform box, so reluctance was protective; ADR-0066 (Plan 0057
# Phase 3) made it a bounded in-place jitter, and the reluctance then only
# costs accents. Onset means measured 0.033 (click:120) / 0.153 (dynamic:110) /
# 0.391 (chord), ~0.20 real music, all against a 1.000 peak. Rank preserved.
reseed = "onset > 0.40"

hue_center  = "0.30 + sin(time * 0.021) * 0.16 + clamp(bass * 0.235, 0, 0.20)"
# Held NARROW deliberately. Widening this to 0.62 was tried and reverted: the
# palette pale end floods in and the creature goes chalk-white, losing the
# saturated cyan that makes it read as lit from within rather than drawn.
hue_spread  = "0.34 + clamp(treb * 0.5, 0, 0.30)"
saturation  = "1.15 + clamp(mid * 0.282, 0, 0.24)"
palette_mix = "clamp(treb * 0.67, 0, 0.40) + sin(time * 0.0083) * 0.25"

# THE ZOOM PIN IS LIFTED (2026-08-04, Plan 0055). It used to read "ZOOM IS A FOLD
# CONSTRAINT HERE, NOT A TASTE": the fold's residual rays were the DISC EDGE
# smeared radially outward, so they were only as bright as whatever the figure put
# at that edge, and at zoom 1.12 the creature reached the edge and the frame grew a
# permanent starburst. The fix was to keep the whole figure INSIDE the inscribed
# disc - peak zoom 0.72+0.04+0.10 = 0.86 - and the comment ended by naming its own
# successor: "the general fix is a per-preset edge treatment - Plan 0055, approved,
# not built."
#
# It is built. `kaleido_edge` below picks what happens outside the disc, and under
# `tile` there is no disc edge to smear: the picture continues past `r_max` as a
# mirrored continuation of itself, so a figure that reaches the edge produces a
# filled frame rather than a starburst. The constraint that held this preset at
# 0.86 does not exist any more, so the zoom goes back up to where the figure was
# wanted - base 1.80, the value the Phase 2 A/B was judged at. That the creature
# now overruns the inscribed disc is the POINT: there has to be content out there
# for a fill treatment to act on, or the treatment is a no-op and this preset would
# look the same under all three.
zoom  = "1.80 + bar * 0.04 + clamp(bass * 0.12, 0, 0.10)"
pan_x = "sin(time * 0.023) * 0.06"
pan_y = "cos(time * 0.031) * 0.05"

bg_hue        = "0.58 + sin(time * 0.013) * 0.06"
bg_bright     = "0.008 + clamp(mid * 0.0176, 0, 0.015)"
bg_vignette   = "0.82"
# THE FOLD IS PINNED AT SIX AND IS THIS PRESET'S ALONE (2026-08-03). It used to
# snap between 1 and 6 leaves on `bass + mid`, and so did De Jong on the same
# family and the same threshold - two problems in one binding. A leaf count that
# changes with the music reads as chaos rather than as response (the user's
# call), and `kaleido_order` is a STEPPED parameter, so easing it swept the
# value through fractional wedge counts that cannot divide the circle. Pinning
# it fixes both at once and lets the header's "cathedral of itself" be the
# resting state instead of a rare peak event.
#
# THE ROTATION IS GONE TOO (user verdict, 2026-08-11 live, during the Plan
# 0075 cohort-6 round): the fold angle no longer turns, and `spin` below
# pins the cloud's own default revolution (1 = one turn per ~35 s, the
# family default a preset inherits unless it says otherwise). The creature's
# motion is now the coefficients alone - the four-axis morph that was always
# this preset's instrument.
kaleido_order = "6"
kaleido_angle = "0"
# THE EDGE TREATMENT, CHOSEN IN MOTION (2026-08-04, Plan 0055 Phase 2 / ADR-0061).
# `1` is `tile`: past the inscribed disc the frame continues as a mirrored
# continuation of itself instead of fading to backdrop. This preset is one of the
# two the live A/B was judged on - it is the CENTRED FIGURE case, and the one whose
# residual rays were the original complaint - and `tile` is what won on it, at the
# raised zoom above.
#
# Bound EXPLICITLY even though it is currently the engine default. A preset this
# specific about its fold should not inherit its edge from a default that a later
# A/B could move; the zoom above is tuned against `tile` in particular, so the two
# belong in the file together.
kaleido_edge  = "1"
trails        = "0.32 + clamp(onset * 0.300, 0, 0.18)"

[smoothing]
a             = 0.55
b             = 0.55
c             = 0.55
d             = 0.55
fade          = 0.20
size          = { attack = 0.02, release = 0.26 }
zoom          = 0.16
hue_center    = 0.40
hue_spread    = 0.50
palette_mix   = 0.70
trails        = 0.45
bg_bright     = 0.40
