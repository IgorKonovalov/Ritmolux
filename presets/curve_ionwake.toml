# Ion Wake - the neon line tunnel (Plan 0075, cohort 1). A small five-petal
# figure spins at the centre; TRANSFORMED FEEDBACK does the rest: every frame
# the accumulation is pushed outward (fb_zoom), turned (fb_rotate) and stirred
# (swirl warp), so the figure's past rushes away as a glowing helical tunnel.
# The deposit is blend = "add", so echoes crossing their own tails SUM and the
# tunnel walls light up where they braid.
#
# WHAT DRIVES WHAT. The kick is the throttle: fb_zoom rests at 1.35x/s and a
# bass peak more than doubles the rush, with a beat spike on top; onset stirs
# the swirl. Under "add" the resting picture must be DIM - the series
# converges near 1/(1-trails) ~ 14x here - so brightness sits low and the
# palette band is deliberately narrow (Plan 0046 Phase 5's finding: add plus a
# rich palette sums to a flat wash; a narrow cold band keeps the braid
# legible). Loud buys STRUCTURE - speed, twist, braid density - not white.
system = "parametric_curve"
name   = "Ion Wake"

[curve]
family = "maurer_rose"

# max, not add: this preset spent three rendered iterations under add, and
# however dim the source, the summed echoes desaturated to silver - repeated
# addition of even a pure hue raises all three channels through the rolloff.
# max keeps every echo at the colour it was deposited with, which is what a
# COLOURED tunnel needs; the braid-lights-where-it-crosses trade goes with it.
[feedback]
warp  = "swirl"
blend = "max"

[palette]
stops = [
  { at = 0.0, color = "#0a0b3d" },
  { at = 0.3, color = "#0077ff" },
  { at = 0.55, color = "#00e5e0" },
  { at = 0.78, color = "#e939c8" },
  { at = 1.0, color = "#fff3c4" },
]

[params]
n = "5"
d = "2"
samples = "240"
spin    = "0.25"
# The flower itself never rests: the petals twist continuously (phase) and
# the figure breathes (scale) - the idle motion lives in the source, where
# the pixels are brightest, not only in the slow water behind it.
phase   = "time * 0.5"
scale   = "0.46 + sin(time * 0.8) * 0.06"
zoom    = "1.0"
# The source orbits the centre a little, so the whole accumulation wobbles
# even between beats - the idle tunnel is water, never a photograph.
pan_x = "sin(time * 0.7) * 0.03"
pan_y = "cos(time * 0.6) * 0.025"

# The tunnel: outward rush, steady turn, a stirred core.
fb_zoom   = "1.35 + clamp(bass * 0.94, 0, 0.8) + beat * 0.5"
fb_rotate = "-0.22"
fb_warp   = "0.35 + clamp(onset * 0.5, 0, 0.3)"

trails = "0.93"

# Dim source - the accumulation does the lighting (see header). Brightness
# rides the KICK with a fast attack: the tunnel's rate levers (fb_zoom, warp)
# integrate over seconds, so the immediate pixel response a listener reads as
# "it heard that" comes from this level term.
# THE DEPOSIT IS PULSED, and that is the whole tunnel. A continuous deposit
# at 60 fps lays echoes 0.5% apart - they overlap into a smeared sheet, and
# overlapping hues union toward white under either blend (measured, three
# iterations). Flashing the figure on the BEAT instead leaves dark water
# between echoes: each beat stamps one crisp ring that rushes outward, and
# with the hue latched per beat below, every ring is its own colour. The
# small continuous term keeps a dim spiral breathing under the rings so
# silence is never a black frame.
thickness  = "2.6"
# THE STROKE IS SOLID, and on this world that is a statement about the tunnel
# rather than about the flower. Plan 0114's look gate named `0` here
# specifically, against a library default of 0.25. The reason is the feedback:
# every frame's figure becomes the next frame's echo, so a stroke whose light
# falls off across its whole half-width deposits a smear that the outward rush
# smears again, and the ring the beat is supposed to stamp arrives already soft.
# A solid core stamps a crisp ring and the echoes stay countable as they travel.
softness   = "0"
# TRIMMED FOR THAT STROKE, and this is the retune half of Plan 0114 Phase 6.
# A solid core carries more light at the same bindings because more of the
# footprint sits at full coverage - measured on this file, the same frame goes
# 10.8 to 16.8 per-mille of linear light between softness 1.0 and 0. Glow and
# the level term come down about a third between them, which lands it at 13.4:
# not the old number, because part of that light IS the crisper stroke and
# spending it all back would draw a thinner figure than the one that was judged.
# What the trim buys back is the header's dark water between echoes, which the
# untrimmed solid deposit had begun to fill in.
glow       = "0.95"
brightness = "0.32 + (noise(time * 0.6) - 0.5) * 0.14 + beat * 0.85"

# A two-tone band riding a cyan-to-magenta ramp - wider than the first draft
# but still a BAND, not the whole wheel (the add-blend wash trade): the braid
# reads electric blue against hot pink where echoes cross. Treb widens it.
# A new colour every beat, riding the full electric ramp - with a slow drift
# under it so the idle spiral's colour is never frozen between beats.
hue        = "hash(beat_index) * 0.85 + time * 0.02"
hue_spread = "0.25 + clamp(treb * 0.33, 0, 0.2)"
saturation = "1.0"

[smoothing]
fb_zoom    = { attack = 0.03, release = 0.5 }
fb_warp    = 0.3
# The flash must land inside one frame and linger briefly - a slow attack
# would smear the ring back into the sheet this design exists to avoid.
brightness = { attack = 0.015, release = 0.18 }
hue        = 0.06
trails     = 0.5
hue_spread = 0.4
