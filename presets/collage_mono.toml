# Collage Mono - the three inks as CUT PAPER. Black and red flat planes on a
# white ground: the constructivist poster, the one look in the cohort where a
# form is IN FRONT OF another instead of added to it.
system = "shape_collage"
name = "Collage Mono"
representative = true

[palette]
# Eight plateaus at the generator's own coordinates (k/8 + 1/16); the last is
# reserved for the paper so a generated element never draws the ground and
# vanishes. Five black slots to two red gives a canvas that is mostly black with
# the red arriving as an event, which is the poster's proportion.
stops = [
  { at = 0.0000, color = "#000000" },
  { at = 0.1249, color = "#000000" },
  { at = 0.1251, color = "#b00808" },
  { at = 0.2499, color = "#b00808" },
  { at = 0.2501, color = "#000000" },
  { at = 0.3749, color = "#000000" },
  { at = 0.3751, color = "#b00808" },
  { at = 0.4999, color = "#b00808" },
  { at = 0.5001, color = "#b00808" },
  { at = 0.6249, color = "#b00808" },
  { at = 0.6251, color = "#000000" },
  { at = 0.8749, color = "#000000" },
  { at = 0.8751, color = "#ffffff" },
  { at = 1.0000, color = "#ffffff" },
]

[latch]
# Armed for the last ten seconds of each 100 s cycle; spent by the first onset
# past 0.6 inside that window. See the note on `recompose` below for why the
# hold is zero and what a quiet window costs.
recut = { arm = "mod(time, 100) > 90", fire = "onset > 0.6", hold = 0 }

[params]
paper  = "0.9375"
layout = "2"
seed   = "7"
roster = "0"
size_hierarchy = "0.72"
angle_bias = "-18 + sin(time * 0.05) * 6"

count   = "17"
density = "0.78 + clamp(mid * 0.259, 0, 0.22)"
scale   = "1.00 + clamp(bass * 0.094, 0, 0.08)"
opacity = "1.0"
edge_softness = "0"

drift = "0.55 + clamp(bass * 0.706, 0, 0.60)"
spin  = "0.30 + clamp(mid * 0.353, 0, 0.30)"

# THE CANVAS RE-CUTS ON THE MUSIC, AT MOST ONCE PER 100 SECONDS. The `recut`
# latch above is the whole mechanism: its arming window is the last ten seconds
# of each 100 s cycle, and inside that window the FIRST onset past 0.6 spends the
# permission. So the ceiling is the clock's - one recomposition per cycle,
# guaranteed - and the moment inside it is the music's.
#
# `recompose` is edge-triggered, on the RISE past 0.5, and `hold = 0` makes the
# latch a one-frame pulse: rise, recompose, fall. That is the whole reason the
# hold is zero rather than a duration - a longer hold would read 1.0 for several
# frames and the parameter would ignore every one of them after the first.
#
# A SILENT WINDOW COSTS A CYCLE. If nothing crosses 0.6 in those ten seconds the
# permission is never spent, the window closes, and the canvas holds for another
# 100 s. Measured both ways on this file, through the real analyzer: over a clip
# with hits in the window it re-cuts once, at t=90; with digital silence across
# the same ten seconds it does not re-cut at all.
#
# BUT "QUIET" IS NOT "SILENT", AND THE DIFFERENCE IS SMALLER THAN IT SOUNDS.
# `onset` is a fraction of its own DECAYING recent peak, so once a loud passage
# is a few seconds behind, a pad and a hi-hat cross 0.6 as easily as a kick did.
# A breakdown with any articulation in it still fires. What gets skipped is
# near-silence, not an ambient passage - do not rely on this to hold a canvas
# through a quiet section.
#
# `time` is the renderer's shared clock (one per app run, never reset on a preset
# switch), so the cycle is genuine wall clock and NOT screen time - in a rotating
# set the canvas is often already recomposed when it comes back up. The latch
# itself does reset on the switch, so an arming window never crosses into this
# preset from the one before it.
#
# THE ONE ARRIVAL CASE: a load that lands inside an open window arms on its first
# frame, so roughly one arrival in ten can re-cut within seconds of appearing. It
# needs a strong onset to do it and `recompose_blend` dissolves it over 0.9 s, so
# it reads as the poster settling rather than as a glitch.
#
# Nothing here fixes the seed. Each recomposition advances the generator's own
# recomposition index, so successive canvases differ with `seed` left alone.
recompose       = "recut"
# At one cut per 100 s the change is an EVENT, and a near-cut reads as a glitch
# where a dissolve reads as a decision.
recompose_blend = "0.90"
pump_size  = "clamp(bass * 0.141, 0, 0.12)"
pump_alpha = "0"

# THE SWAY IS THE WHOLE OF THIS POSTER'S AUTONOMOUS MOTION, AND IT IS MEANT TO BE
# BELOW NOTICE. A 90 s horizontal breath against a 70 s vertical one, at 6 % and
# 4 % of the frame: incommensurate rates, so the pair traces a path that does not
# repeat for about ten minutes and the canvas never visibly returns to a pose it
# held before. A printed sheet is never quite square to the wall; this is that,
# not an animation.
#
# THE RATE IS THE LEVER, NOT THE AMPLITUDE. At these amplitudes the sway is a
# settle; take the rates up an order of magnitude and the same 6 %/4 % reads as a
# wobble, and a composition built on flat cut planes stops looking pinned down.
#
# `drift` and `spin` are NOT this and cannot substitute for it - they multiply
# each element's OWN seeded velocity, so they change how the pieces live against
# one another and move the canvas as a whole not at all. A scale breath does move
# it, but pulses the composition's size; this pan keeps the proportions.
pan_x = "0.06 * sin(time * 0.07)"
pan_y = "0.04 * sin(time * 0.09 + 1.1)"
saturation = "1.0"
bloom_amount = "0"
trails       = "0"

[smoothing]
density = 0.35
drift = 0.60
spin  = 0.60
scale = 0.50
pump_size = 0.12
