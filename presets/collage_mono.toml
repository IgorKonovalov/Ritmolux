# Collage Mono - the three inks as CUT PAPER. Black and red flat planes on a
# white ground: the constructivist poster, the one look in the cohort where a
# form is IN FRONT OF another instead of added to it.
system = "shape_collage"
name = "Collage Mono"

[palette]
# Eight plateaus at the generator's own coordinates (k/8 + 1/16); the last is
# reserved for the paper so a generated element never draws the ground and
# vanishes. Five black slots to two red gives a canvas that is mostly black with
# the red arriving as an event, which is the poster's proportion.
stops = [
  { at = 0.0000, color = "#000000" },
  { at = 0.1249, color = "#000000" },
  { at = 0.1251, color = "#b00808" },
  { at = 0.2499, color = "#b00808" },
  { at = 0.2501, color = "#000000" },
  { at = 0.3749, color = "#000000" },
  { at = 0.3751, color = "#b00808" },
  { at = 0.4999, color = "#b00808" },
  { at = 0.5001, color = "#b00808" },
  { at = 0.6249, color = "#b00808" },
  { at = 0.6251, color = "#000000" },
  { at = 0.8749, color = "#000000" },
  { at = 0.8751, color = "#ffffff" },
  { at = 1.0000, color = "#ffffff" },
]

[params]
paper  = "0.9375"
layout = "2"
seed   = "7"
roster = "0"
size_hierarchy = "0.72"
angle_bias = "-18 + sin(time * 0.05) * 6"

count   = "17"
density = "0.78 + clamp(mid * 0.259, 0, 0.22)"
scale   = "1.00 + clamp(bass * 0.094, 0, 0.08)"
opacity = "1.0"
edge_softness = "0"

drift = "0.55 + clamp(bass * 0.706, 0, 0.60)"
spin  = "0.30 + clamp(mid * 0.353, 0, 0.30)"

# ONE RECOMPOSITION EVERY 100 SECONDS, AND THE PERIOD IS WALL CLOCK ON PURPOSE.
# `recompose` is edge-triggered - it fires on the RISE past 0.5 - so a square
# wave with one rise per period fires exactly once per period, where the obvious
# `hash(beat_index) > 0.9` fired every 3-10 seconds: `beat_index` counts onset
# DETECTIONS at 1.2-2.3 per musical beat, so a 10 % gate on it is several times a
# phrase, not once a set.
#
# The `+ 50` offset is what keeps the load quiet. Without it `mod(time, 100)` is
# `0 < 50` on the very first frame, so the gate rises the instant the preset
# loads and re-cuts the canvas as it arrives; offset, the first rise is at t=50.
# The FALL at t=100 is not an edge the engine acts on, so it costs nothing.
#
# `time` is the renderer's shared clock (one per app run, never reset on a preset
# switch), so this is a genuine wall-clock 100 s and NOT 100 s of screen time -
# in a rotating set the canvas is often already recomposed when it comes back up.
# That is the "maximum once per 1-2 min" reading: the ceiling is guaranteed.
#
# Nothing here fixes the seed. Each recomposition advances the generator's own
# recomposition index, so successive canvases differ with `seed` left alone.
recompose       = "mod(time + 50, 100) < 50"
# Raised from 0.30 s: at one cut every 100 s the change is an EVENT, and a
# near-cut reads as a glitch where a dissolve reads as a decision.
recompose_blend = "0.90"
pump_size  = "clamp(bass * 0.141, 0, 0.12)"
pump_alpha = "0"

# THE SWAY IS WHAT MAKES THIS WORLD PASS `animation`, AND THE RATE IS THE WHOLE
# POINT OF IT. That gate captures frames 24 and 48 - 0.4 s apart - AT SILENCE, so
# it sees only a preset's autonomous motion. This canvas is a poster: it is meant
# to sit still, and nearly all its liveliness is audio-driven, which the gate
# cannot see.
#
# Measured, because the obvious lever is the wrong one: raising `drift` 0.55 ->
# 1.60 -> 2.50 and `spin` 0.30 -> 1.00 -> 1.60 leaves the statistic at 0.002,
# UNCHANGED - those multiply each element's own seeded velocity, and over 0.4 s
# that is nothing. A whole-canvas motion is the only thing that moves in 0.4 s.
# A scale breath reaches 0.009-0.011 but pulses the composition's size; this pan
# sway reaches 0.012 without touching it, so the picture keeps its proportions.
#
# Amplitude is unchanged from a still composition's - only the rates moved, from
# 0.07/0.09 to 0.70/0.78, an 11 s sway rather than a 90 s one.
pan_x = "0.06 * sin(time * 0.70)"
pan_y = "0.04 * sin(time * 0.78 + 1.1)"
saturation = "1.0"
bloom_amount = "0"
trails       = "0"

[smoothing]
density = 0.35
drift = 0.60
spin  = 0.60
scale = 0.50
pump_size = 0.12
