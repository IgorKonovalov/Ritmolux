# Tide Mono - a deposited field dragged through a warping mesh and printed black
# on white. The cohort's WEATHER: the only world here with no figure at all, just
# a full frame of moving ink that never resolves into an object.
#
# It exists because the set had none. Every other mono world is a figure, a
# field with a structure, or a readout - something a room can name. A set of
# fifteen wants one that is only motion, and it wants it on the family with zero
# mono coverage.
#
# -- IT IS NOT IN THE LIMITED-INK CLASS, AND IT DOES NOT USE THE INK PASS EITHER -
#
# `warp_mesh` COLOURS ITS LIGHT AT DEPOSIT TIME: the palette is sampled when a
# stroke is laid into the accumulation buffer, not when the accumulated field is
# read back out. So `palette_steps` cannot band the field - there is no per-pixel
# palette coordinate at the end of the chain to quantize (backlog 0146), and no
# amount of preset work changes that.
#
# THE OBVIOUS FALLBACK WAS THE TERMINAL INK REMAP, AND IT FAILED HERE. That stage
# is a two-pole luminance lerp, and this field is SMOOTH - a deposited pinwheel
# with long soft shoulders and no hard edges anywhere. Lerping a smooth field
# along a two-colour axis just produces a smooth grey gradient, so every setting
# of it landed in one of two bad places: at a low `ink_gamma` the frame inked to
# 92 % coverage and measured completely dead (bass 0.004, treb 0.000) because a
# saturated duotone has no contrast left to modulate, and at a high one it washed
# out to a pale smudge. Three rounds of tuning moved it between those two.
#
# So the ink pass is OFF and the world draws its own light on the engine's black
# clear. That is where the contrast was all along, and it is the same correction
# `spectrum_metermono.toml` needed for a related reason.
#
# THE RED SURVIVES, AND ONLY BECAUSE THE COLOUR IS APPLIED AT DEPOSIT. The
# palette below runs near-black to white and then to the cohort red at the very
# top, so the ramp reads as grey arms with white bodies and a red heat in the
# densest cores. It is not a limited-ink frame - the transitions are continuous
# and always will be - but it is the ink set, and it is the third colour this
# world was told it could not have.
#
# -- WHAT MAKES IT READ AS TIDE RATHER THAN AS SMOKE ------------------------------
#
# Two stages that fight each other, and the balance between them IS the look:
#
#   `deposit`  lays new light into the buffer each frame, as a ring of arms
#   `decay`    is the fraction of the past surviving per SECOND
#
# A high decay with a low deposit is smoke - everything blurs and nothing has an
# edge. A low decay with a high deposit is a strobe: each frame overwrites the
# last and the mesh's warping never gets to act on anything. The middle, which is
# where this file sits, is where a stroke survives long enough for the mesh to
# drag it into a current before it fades. `decay` is the sensitive one.
#
# THE MESH IS WHAT DRAGS IT. `[per_vertex]` is evaluated once per vertex with
# `x`/`y`/`rad`/`ang` bound, so `zoom` rising with `rad` pulls the rim harder than
# the centre and the field is stretched outward as it ages - which is what turns
# a static ring of arms into a current running off the edge of the frame.
#
# `wrap = "0"`. With wrap on, the field that leaves one edge re-enters at the
# other and the world becomes a closed loop that fills solid over a few minutes.
# Off, the tide runs out of frame and the page is continuously renewed. On a
# world with an accumulation axis and a two-pole remap that will ink anything
# bright, that is the difference between a picture and a black rectangle.
#
# NO `bg_*`. The ground is the engine's own black clear, and a lit backdrop would
# only raise the floor the arms have to stand out from.
system = "warp_mesh"
name   = "Tide Mono"

[mesh]
# Cells, not pixels. Coarser than the shipped warp worlds' 32x24 on purpose: a
# coarse mesh drags in wide sheets and a fine one shreds the field into filaments,
# and this world wants the sheet.
x = 20
y = 16

[per_vertex]
# Evaluated once per vertex with x/y/rad/ang bound. The rim is pulled harder than
# the centre, so the field stretches outward as it ages and runs off the edge.
zoom = "1.006 + rad * 0.028"
rot  = "0.035 + sin(ang * 2.0) * 0.020"

[palette]
# The remap discards hue, so this does NOT set the colour on screen - it sets
# which parts of the field are BRIGHT and therefore which become ink. Neutral so
# that luminance ramp stays honest.
stops = [
  { at = 0.00, color = "#0a0a0a" },
  { at = 0.42, color = "#8a8a8a" },
  { at = 0.80, color = "#ffffff" },
  { at = 1.00, color = "#b00808" },
]

[params]
# THE PRESS. Black ink, white page. `ink_amount` rests at a pole and never
# between - a partial amount is a dirty grey page, not a fainter print.
ink_amount   = "0"
paper_hue    = "0"
paper_sat    = "0"
paper_bright = "1"
ink_hue      = "0"
ink_sat      = "0"
ink_bright   = "0"
# 1.05, AND THIS NUMBER HAS BEEN WRONG IN BOTH DIRECTIONS. Above 1 thins the
# mid-tones TOWARD THE PAPER so only the strongest strokes keep full ink; below 1
# INKS the mids for a heavier, flatter print. Neither pole moves at any value.
#
# 3.2 and 1.30 both thinned too hard and the world printed pale grey smudges.
# 0.55 over-corrected: it inked nearly everything, `cover` measured 0.923, and a
# frame that is 92 % ink has NO CONTRAST LEFT TO MODULATE - which is the deeper
# reason this world measured dead (bass 0.004, treb 0.000, anim 0.040) rather
# than merely dim. A saturated duotone cannot show a change in how much light
# arrived, because every level above the knee is already the same black.
#
# THE LESSON IS NOT ABOUT THIS PARAM. On a two-pole remap, DO NOT SPEND THE MUSIC
# ON BRIGHTNESS - it is flattened by construction. Spend it on the deposit's
# SHAPE, which survives the remap intact. That is why `deposit_arms`,
# `deposit_twist` and `deposit_radius` below carry the audio now and `deposit`
# itself carries much less of it.
ink_gamma    = "1.05"

# THE FIELD. `warp` is the mesh distortion and `warp_speed` its rate - the rate
# INTEGRATES a phase (ADR-0132), so binding it to audio accelerates the flow
# rather than teleporting it.
warp       = "0.95 + clamp(bass * 1.059, 0, 0.90)"
warp_scale = "1.85"
warp_speed = "0.34 + clamp(treb * 0.500, 0, 0.30)"
wrap       = "0"

# THE BALANCE THAT IS THE LOOK. See the header. Both numbers came down hard from
# the first draft (decay 0.30, deposit 1.9) because that pair inked 92 % of the
# frame and left nothing for the music to change. `decay` still shortens under
# bass, which RENEWS the page on a heavy passage rather than letting it silt up.
decay   = "0.30 - clamp(bass * 0.094, 0, 0.08)"
deposit = "2.60 + clamp(mid * 0.706, 0, 0.60) + clamp(onset * 0.667, 0, 0.40)"

# THE SHAPE IS WHERE THE MUSIC GOES, because the remap flattens everything else.
# The ARM COUNT re-rolls on each onset detection - `hash` scatters, so 5 through
# 8 arrive in no order and the pinwheel genuinely re-cuts itself rather than
# counting up. `beat_index` counts detections and not musical beats (ADR-0109),
# which is right here: a re-cut on activity is the gesture.
#
# `deposit_width` CARRIES THE TOP END BECAUSE `warp_speed` COULD NOT. The obvious
# home for treble is the flow rate, and it was there and measured treb 0.000 -
# because a rate INTEGRATES a phase (ADR-0132), so changing it alters where the
# field will be in a second rather than what it looks like now. Anything measured
# over a short window sees nothing, and so does an ear. Arm width is a shape and
# reads immediately.
deposit_radius = "0.30 + clamp(bass * 0.176, 0, 0.15)"
deposit_width  = "0.055 + clamp(treb * 0.067, 0, 0.040)"
deposit_arms   = "5 + floor(hash(beat_index) * 3.999)"
deposit_twist  = "1.35 + clamp(mid * 1.412, 0, 1.20)"
# The pinwheel's own turn, and the only thing moving in a silence - at 0.14 this
# world measured anim 0.017, which is very nearly frozen. This is the DEPOSIT
# pattern rotating, not the camera; the frame does not move.
deposit_spin   = "0.42"

darken_center = "0.05"
brighten      = "1"
hue           = "0.02"
color_span    = "0.98"
saturation    = "1"

[smoothing]
# The two accumulation rates ease, because a step in either is visible as a
# flash: `decay` changes how much of the past is standing and `deposit` how much
# arrives, and both act on a buffer rather than on this frame.
decay        = 0.55
deposit      = 0.30
warp           = 0.18
deposit_twist  = 0.22
deposit_radius = 0.25
deposit_width  = 0.20
