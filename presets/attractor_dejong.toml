# De Jong - the flagship compute-particle attractor, rebuilt around one rule:
# PEAK BUYS STRUCTURE, NOT BRIGHTNESS. The old version raised `fade` and `size`
# on bass, so a loud passage saturated the (now surface-sized, Plan 0027)
# accumulation grid into a white blot. Here energy runs the other way - `fade`
# and `size` FALL as the track hits, so a drop sharpens the filigree into a fine
# wire mesh instead of blooming it out.
#
# Shape: the four De Jong coefficients drift on four incommensurate slow sines
# (periods ~170/217/275/331 s, so the figure never repeats) with a small
# SPECTRUM term on top - the map bends with the music rather than cutting
# between poses.
#
# WHY EACH COEFFICIENT ALSO READS A bin() (Plan 0034). There are four
# coefficients and only three band scalars, so the old version drove `a` and `d`
# from the SAME `bass` - two of the four axes moved in lockstep and the map
# effectively morphed in three dimensions instead of four. Each coefficient now
# adds its own narrow probe on the log spectrum, which is what de-correlates
# them:
#   a ~ 189 Hz (bass body)   d ~ 399 Hz (low-mid)
#   b ~ 899 Hz (midrange)    c ~ 5.2 kHz (presence)
#
# THE TWO LOW POSITIONS MOVED IN PLAN 0048, and this header used to warn against
# exactly the formula that is now correct. The old axis floored every band at one
# FFT bin (23.4 Hz at 48 kHz), which bound it linear up to ~750 Hz and made a
# log fit up to 2.9x wrong there; ADR-0049's long window feeds the bands below
# the ~246 Hz crossover, so the edges are `35 * 514.3^x` end to end. `a` was
# `bin(0.10)` for ~190 Hz and that position now reads 65 Hz - the very number
# this header once called the mistake - so it is `bin(0.27)`; `d` moved 0.24 ->
# 0.39 for the same reason. `b` and `c` sit above the crossover and did not move.
#
# THE BAND TERM STAYS UNDERNEATH, deliberately, and the split is about 40/60 of
# the original gain with the clamp ceilings unchanged. Two reasons. A bin is
# SELECTIVE - it falls to zero when its own region is empty, where the wideband
# scalar still reads something - so bin-only would let a coefficient go
# completely still on material that happens to miss its region. And `shot`'s
# `--set` / `--report` stimuli cannot populate the spectrum array at all, so a
# bin-only preset reads as dead in the very harness this lane verifies through
# (measured: dropping the band terms took this preset's treble column from 0.090
# to 0.010 while the real CI reactivity gate, which does light the bands, stayed
# green). Magnitudes are compatible: a single bin measures ~0.02-0.05 on
# broadband noise against ~0.022 for a band scalar.
# Colour: a deep indigo -> violet -> magenta -> gold gradient crossfading to
# `ice` on treble, so the shimmer cools as the top end opens up.
# Composite: a tinted vignette backdrop underneath, and the screen-space
# kaleidoscope folds in only when the mix is genuinely loud (a comparison gate).
system = "attractor"
name = "De Jong"

[particles]
family = "de_jong"

[palette]
stops = [
  { at = 0.00, color = "#07021c" },
  { at = 0.28, color = "#3b1178" },
  { at = 0.55, color = "#a81fa0" },
  { at = 0.80, color = "#ff5c3a" },
  { at = 1.00, color = "#ffe9a8" },
]

[palette_b]
name = "ice"

[params]
# GLOW - the figure is authored to sit UNDER the tonemap knee, so only the
# densest filaments cross 1.0 and bloom picks out exactly those. Authoring
# at the ceiling instead is what made this preset a flat mass at `rich`,
# where 3x the particles deposit into the same texels (design-backlog 0047).
bloom_amount    = "1.4"
bloom_threshold = "0.9"
bloom_radius    = "1.3"
# SHAPE - slow incommensurate drift plus a gentle spectral bend. Chaotic maps
# punish big jumps, so every audio term is small and clamped. Four coefficients,
# four separate frequency regions - see the header.
a = "1.641 + sin(time * 0.0370) * 0.070 + clamp(bass * 0.115 + bin(0.10) * 0.070, 0, 0.135)"
b = "1.902 - sin(time * 0.0289) * 0.055 - clamp(mid * 0.0505 + bin(0.52) * 0.09, 0, 0.070)"
c = "0.316 + sin(time * 0.0228) * 0.090 + clamp(treb * 0.030 + bin(0.80) * 0.045, 0, 0.034)"
d = "1.525 + cos(time * 0.0190) * 0.075 - clamp(bass * 0.036 + bin(0.39) * 0.065, 0, 0.050)"

# DENSITY - the inversion fix. Loud = shorter trails and finer points. The base
# values are deliberately low: at the Plan 0027 surface-sized grid, `fade` much
# above ~0.92 with `size` near 1 saturates the accumulation into a white blot.
# RE-RAISED HALFWAY, 2026-08-03 (Plan 0057 Phase 6), NOT reverted. These read
# 0.905 / 0.58 until `00d99d0` cut them to 0.55 / 0.28 so the preset would
# survive the `rich` tier, where 3x the particles deposited 3x the light into
# the same texels. ADR-0065 (Phase 2) normalized the deposit by particle count,
# so the compensation is owed back - but the same commit added the bloom stage
# above, sized to the LOWERED figure, so restoring the old numbers stacks bloom
# on a figure already at the knee. RENDERED, not reasoned: at 75% of the way
# back the top crossing starts whitening out; at 50% the filaments stay
# separated and the magenta holds. Verified at both tiers.
fade   = "0.73 - clamp(bass * 0.065, 0, 0.055) - beat * 0.020"
size   = "0.43 - clamp((bass + mid) * 0.074, 0, 0.125) + beat * 0.06"
# MEASURED. Read 0.42 and never fired, because `onset` was then raw spectral
# flux peaking at 0.016 rather than the 0..1 envelope that number assumed.
# ADR-0049 made it one, so the threshold is a real fraction again. Then 0.50 -
# but that was still calibrated against a reseed that WIPED the cloud, where
# reluctance protected the drawing. Plan 0057 Phase 3 / ADR-0066 made it a
# bounded in-place jitter, so a high gate now only withholds the accent.
# Onset means measured 0.033 (click:120) / 0.153 (dynamic:110) / 0.391 (chord),
# ~0.20 real music, all peaking at 1.000. Still the most eager of the six.
reseed = "onset > 0.28"

# COLOUR - a narrow window that slides, not a rainbow. palette_mix finally earns
# its keep: the gradient cools toward `ice` as treble opens.
hue_spread  = "0.20 + clamp(mid * 0.353, 0, 0.30)"
hue_center  = "0.34 + sin(time * 0.043) * 0.12 + clamp(bass * 0.306, 0, 0.26)"
saturation  = "1.30 + clamp(treb * 0.583, 0, 0.35)"
palette_mix = "0.14 + sin(time * 0.021) * 0.14 + clamp(mid * 0.212, 0, 0.18)"

# VIEW - a slow breathing push-in with a lazy drift, so the cloud never sits still.
zoom  = "1.06 + bar * 0.10 + clamp(bass * 0.26, 0, 0.22)"
pan_x = "sin(time * 0.051) * 0.06"
pan_y = "cos(time * 0.037) * 0.05"

# COMPOSITE - an atmosphere under the sparse cloud, and symmetry that arrives
# only on the loud sections rather than sitting on all the time. NOTE: `bg_hue`
# indexes the shared COSINE palette, not the [palette] table above - ~0.25 is
# the deep indigo that sits under this gradient; 0.6 would read green.
bg_hue        = "0.25 + sin(time * 0.017) * 0.05"
bg_bright     = "0.012 + clamp(mid * 0.0294, 0, 0.025)"
bg_vignette   = "0.80"
# NO FOLD HERE, DELIBERATELY (2026-08-03). This preset and Leviathan are both
# the `de_jong` family and both used to snap a kaleidoscope open on
# `bass + mid`, which made them read as siblings AND made the leaf count jump
# with the music - the user's verdict was that a changing number of leaves is
# too chaotic to watch. The fold is now Leviathan's alone and is pinned there.
# What separates the two is structure, not stage: this one is the attractor
# itself, a fine wire mesh sharpening on the drop; Leviathan is that same map
# folded into a symmetry. Adding a fold back here would collapse the pair.

[smoothing]
# Ease everything that would otherwise snap; leave `reseed` and the beat sharp.
a             = 0.6
b             = 0.6
c             = 0.6
d             = 0.6
fade          = 0.18
size          = { attack = 0.02, release = 0.22 }
zoom          = 0.14
hue_center    = 0.35
palette_mix   = 0.5
bg_bright     = 0.4
