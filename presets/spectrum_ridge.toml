# Spectrum Ridge - the same data as Spectrum Comb, drawn as a CONTOUR instead of
# a comb. One continuous line through one point per element, mirrored about the
# centre so the frequency axis reads as a landscape and its own reflection.
#
# THAT SENTENCE WAS ASPIRATIONAL UNTIL PLAN 0038. The mirror reflects across the
# x-axis, and the elements used to stand on a hardcoded baseline of -0.85, so a
# reflected copy hung from +0.85 - two contours pinned against opposite edges,
# not a landscape and its reflection. `baseline` is a parameter now, and moving
# the feet onto the axis is what makes the mirror mean what this header always
# said. Three of the four Plan 0038 levers are here: `baseline`, `span`, `curve`.
#
# WHY THE LAYOUT IS THE WHOLE POINT. A comb shows each band as an independent
# quantity; a polyline shows the SHAPE of the spectrum - where the slope is, how
# broad a peak is, whether the top end is a shelf or a cliff. That is a different
# thing to look at even though nothing about the analysis changed, which is why
# `layout` is structure rather than a param.
system = "spectrum"
name   = "Spectrum Ridge"

[spectrum]
# More elements than the comb: a contour can carry finer detail without turning
# into mush, because the eye reads the line rather than counting the parts.
elements = 40
layout   = "polyline"
# Longer release than the comb. A contour that jitters looks like noise in the
# measurement rather than movement in the music; a comb can get away with more
# because each element is read separately.
smoothing = { attack = 0.04, release = 0.34 }

[palette]
name = "aurora"

[params]
# THE RESTING CONTOUR, and it is much lower than it used to be (was 0.55 +/-
# 0.20). With the pair now mirrored about the axis, `base` is the HALF-GAP
# between the two contours: at 0.55 they sat 1.1 world units apart with a dead
# void between them. At 0.12 they share a foot line and read as one figure
# opening and closing, which is the whole point of the mirror.
base  = "0.12 + sin(time * 1.3) * 0.12"

# THE LEVEL CURVE, and the `scale` retune it forces. `curve` compresses the
# element level before the easing, so quiet elements stop being stubs - on a
# CONTOUR that matters more than on the comb, because a flat run of stubs is a
# straight line and carries no shape at all.
#
# The retune, with the arithmetic (Plan 0038 asks for the factor). Measured
# against `shot --signal dynamic:110` on the pre-ADR-0049 raw scale, where mid
# and treb meant 0.006 and bass 0.040 with a 0.106 peak: at curve 0.85 a quiet 0.006 became 0.0129, a
# 2.2x boost, while a loud 0.106 becomes 0.148, only 1.4x. That gap IS the
# compression.
#
# `scale` moves the OPPOSITE way from the docs' worked example - 2.2 -> 4.50, a
# 2.05x rise rather than a cut - and the reason is `base`, not the curve. Putting
# the feet on the axis dropped the floor from 0.55 to 0.12, so the audio term now
# has to carry the height that constant used to. The curve on its own would have
# asked for a cut; the floor asked for more than the curve gave back.
#
# Timing is untouched either way: the easing runs on the curved value, so the
# `release` above means the same duration at any curve (ADR-0040).
#
# 0.85 -> 0.55, matching the comb's retune and for the same measured reason: a
# treble mean of 0.006 lifted to 0.0129 is not a shape, it is a flat run. On a
# CONTOUR that costs more than on a comb, because a flat run of equal-height
# points is a straight line and carries no information at all - and this preset
# measured the lowest reactivity in the whole library. At 0.55 the same mean
# reaches 0.060 and the top half of the ridge has relief.
#
# AND THEN 3.20 -> 0.60, WHICH IS A DIFFERENT AND MUCH LARGER CORRECTION. Every
# number in the history above was tuned on the PRE-ADR-0049 raw band scale, where
# a loud element read about 0.1. ADR-0049 normalized the bands to 0..1, so the
# same `scale` was suddenly multiplying a value roughly five times larger and the
# contour left the frame.
#
# Measured rather than reasoned: at 3.20 a fully-driven element sits at
# `base + 3.20` = about 3.3 world units against a visible half-height of 1.0, so
# the ridge was drawn more than three frame-heights off the top. Rendered under
# `--signal noise:7` the frame came back EMPTY except the vignette; under
# `--signal dynamic:110` only the near-vertical connecting segments crossed the
# frame edges and the peaks were never visible at all. This preset has been
# drawing itself off-screen since the analysis change.
#
# 0.60 puts a fully-driven contour at `base + 0.60` = about 0.84, just inside the
# frame, so the figure stays whole at any level the music can reach - and a
# typical passage (curved to ~0.5) lands near 0.42, which is the mirrored pair
# filling the middle of the frame with real relief in the tail. Picked from a
# rendered sweep of 0.55 / 0.80 / 1.10: 1.10 clipped the tallest peaks off the
# top edge, 0.55 flattened the top end, and 0.80 looked best on music but still
# overshot when every band is driven at once.
#
# The lesson is the one design-backlog 0046 records: a preset written against
# one meaning of a variable is not valid content after that meaning changes, and
# nothing in the harness measured this because `sanity` renders at a size and a
# stimulus where an off-frame figure still leaves a lit vignette behind.
scale = "0.60"
curve = "0.55"

# WIDTH, AND THE SILENT-AUDIO MOTION. `span` is a world half-width, and 1.72
# fills a 16:9 frame very nearly edge to edge (1.78 is exact). It is deliberately
# NOT a "fit" switch - on an ultrawide this same number leaves the contour short,
# which is correct for a world quantity and is why no auto mode exists
# (ADR-0037).
#
# Breathing it is a kind of motion this preset could not have before, and it
# earns its place rather than being decoration. Putting the feet on the axis cost
# the old resting breath most of its travel - `base` had to fall from 0.55 to
# 0.14 so the mirrored pair would share a foot line - and a spectrum readout has
# no rotation of its own to fall back on. Widening and narrowing the whole figure
# on a slow cycle restores that, and it reads differently from a vertical breath:
# the contour stretches along the frequency axis, so the shape stays put while
# the frame it is drawn in opens and closes.
span  = "1.72 + sin(time * 0.31) * 0.16"

# THE FOLD - a true reflection now, not a rotation. Order 1 means no rotational
# copy; `mirror_reflect` adds the mirrored one. The difference matters and is not
# cosmetic: a half-turn (the old order 2) flips x as well as y, so the reflected
# copy ran its frequency axis BACKWARDS - bass met treble in the middle. A
# reflection across the x-axis keeps the axis pointing the same way in both
# halves, so low is left in the copy too and the figure reads as one spectrum
# seen twice.
#
# `baseline = 0` is the line the pair share. This is the parameter that did not
# exist before Plan 0038, and without it the reflection lands against the top
# edge instead of on the axis. `pan_y` cannot substitute - the mirror runs on
# world coordinates in update() while the view transform is applied later in the
# shader, so panning moves the mirrored pair together.
mirror_order   = "1"
mirror_reflect = "1"
baseline       = "0"

# A SLOW TILT - the contour turning a few degrees either way. This is the motion
# that carries the preset through a silence, and it works here precisely because
# the figure is off-centre: rotating it sweeps the line across its own width.
rotation = "sin(time * 0.9) * 0.40 + clamp(bass * 0.118, 0, 0.10)"

# COLOUR ALONG THE AXIS. `hue_spread` walks the palette from the lowest element
# to the highest, so the low end and the top end are different colours and you
# can see WHERE in the spectrum a peak is without counting positions. This is the
# lever the comb deliberately leaves at zero.
#
# 0.75 -> 1.00 at the same pass as `scale`. With the contour finally IN frame the
# spread is worth spending in full: the whole aurora ramp now runs across the
# axis, so the low end is deep green and the top end violet, and a peak's
# position is readable at a glance. It also buys the frame real tonal structure
# under a flat spectrum, which is the case `core/tests/sanity.rs` renders - a
# straight contour of one colour is a blot, the same line under a full ramp is
# not.
hue        = "mod(0.10 + time * 0.02, 1)"
hue_spread = "1.00"
saturation = "0.95"

# STROKE - and the constraint that set it is GONE. This param used to be pinned
# at 4.2 as a compromise with a renderer artifact: each segment was drawn as an
# independent quad, so wherever the contour turned, the two rectangles' outer
# corners diverged and left a wedge-shaped notch that scaled with stroke width.
# A polyline suffers that worse than any other line scene, because consecutive
# points are adjacent frequency bands and genuinely uncorrelated, so every
# vertex is a sharp turn.
#
# Plan 0039 and Plan 0040 (ADR-0041) put real joins in the renderer: a connected
# run of segments now overlaps at its interior vertices instead of gapping, and
# `presets/README.md` states outright that `thickness` no longer trades against
# a joint artifact. So the contour can finally be drawn with the weight the look
# wants - 7.4 rather than 4.2 - and it is a continuous ridge line instead of a
# dotted one. A near-reversal now reads slightly BRIGHT where the quads overlap
# rather than broken, which on a spectrum peak is a highlight, not a defect.
thickness  = "7.40 + clamp(mid * 3.06, 0, 2.6)"

# THE HALO, and what it is not. There is no bloom stage anywhere in the engine,
# so "glow" on a line scene means one specific thing: a multiplier on the
# shader's per-segment core-to-edge falloff. Above 1.0 it saturates the core and
# widens the visible skirt, which on a single bright contour against a near-dark
# field is exactly the soft halo this preset was missing. It is bound rather
# than constant so the ridge blooms on the low end and settles back.
#
# Kept modest at 1.30: the README measures far more usable range below 1.0 than
# above it, and this stacks with `brightness`, `thickness` and the long `trails`
# below on an additive renderer. The halo is meant to be the last thing added,
# not the thing that clips the contour to white.
# TRIMMED after rendering it. 1.30 with a 0.30 swing clipped to flat white in
# one specific place, and the place is the tell: where the spectrum falls away
# at the top end, the two mirrored contours converge toward the foot line and
# their halos overlap. Two haloed strokes at the same spot add on an additive
# renderer, so the quietest part of the readout was rendering as its brightest -
# a bead of white exactly where there is least to show. This is the additive
# ceiling arriving through the mirror rather than through a band term.
glow       = "1.12 + clamp(bass * 0.235, 0, 0.20)"
brightness = "0.80 + clamp(bass * 0.212, 0, 0.18)"

zoom  = "1.00 + sin(time * 0.23) * 0.05"
pan_y = "0.02"

bg_hue      = "0.44 + sin(time * 0.008) * 0.05"
bg_bright   = "0.020 + clamp(treb * 0.0233, 0, 0.014)"
bg_vignette = "0.80"

# THE AFTER-PATH. 0.30 -> 0.66, and this is the other half of what "needs glow
# or an after path" was asking for. Feedback persistence is the only mechanism
# in the engine that draws where the figure HAS BEEN, and on a contour that is
# worth more than on any other spectrum layout: the ridge line sweeps vertically
# as the spectrum moves, so a long tail paints the recent envelope as a soft
# ghost body underneath the live line. The shape it exists to show stays legible
# because the live stroke is far brighter than its own tail.
#
# This is also why the tail is bound to `bass` rather than `mid`: it should
# lengthen when the low end drives the contour hardest and the sweep is widest.
trails = "0.66 + clamp(bass * 0.118, 0, 0.10)"

[smoothing]
rotation   = 0.20
thickness  = { attack = 0.03, release = 0.30 }
brightness = { attack = 0.04, release = 0.26 }
# The halo swells fast and lingers - a slow attack would put the bloom behind
# the peak that caused it, which reads as unrelated rather than as a response.
glow       = { attack = 0.05, release = 0.55 }
hue        = 0.40
zoom       = 0.25
bg_bright  = 0.40
trails     = 0.50
