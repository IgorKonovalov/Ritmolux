# Spectrum Ridge - the same data as Spectrum Comb, drawn as a CONTOUR instead of
# a comb. One continuous line through one point per element, mirrored about the
# centre so the frequency axis reads as a landscape and its own reflection.
#
# THAT SENTENCE WAS ASPIRATIONAL UNTIL PLAN 0038. The mirror reflects across the
# x-axis, and the elements used to stand on a hardcoded baseline of -0.85, so a
# reflected copy hung from +0.85 - two contours pinned against opposite edges,
# not a landscape and its reflection. `baseline` is a parameter now, and moving
# the feet onto the axis is what makes the mirror mean what this header always
# said. Three of the four Plan 0038 levers are here: `baseline`, `span`, `curve`.
#
# WHY THE LAYOUT IS THE WHOLE POINT. A comb shows each band as an independent
# quantity; a polyline shows the SHAPE of the spectrum - where the slope is, how
# broad a peak is, whether the top end is a shelf or a cliff. That is a different
# thing to look at even though nothing about the analysis changed, which is why
# `layout` is structure rather than a param.
system = "spectrum"
name   = "Spectrum Ridge"

[spectrum]
# More elements than the comb: a contour can carry finer detail without turning
# into mush, because the eye reads the line rather than counting the parts.
elements = 40
layout   = "polyline"
# Longer release than the comb. A contour that jitters looks like noise in the
# measurement rather than movement in the music; a comb can get away with more
# because each element is read separately.
smoothing = { attack = 0.04, release = 0.34 }

[palette]
name = "aurora"

[params]
# THE RESTING CONTOUR, and it is much lower than it used to be (was 0.55 +/-
# 0.20). With the pair now mirrored about the axis, `base` is the HALF-GAP
# between the two contours: at 0.55 they sat 1.1 world units apart with a dead
# void between them. At 0.14 they share a foot line and read as one figure
# opening and closing, which is the whole point of the mirror.
base  = "0.14 + sin(time * 1.3) * 0.07"

# THE LEVEL CURVE, and the `scale` retune it forces. `curve` compresses the
# element level before the easing, so quiet elements stop being stubs - on a
# CONTOUR that matters more than on the comb, because a flat run of stubs is a
# straight line and carries no shape at all.
#
# The retune, with the arithmetic (Plan 0038 asks for the factor). At curve 0.55
# a typical quiet level of 0.03 becomes 0.03^0.55 = 0.145, a 4.9x boost, while a
# loud element at 0.30 becomes 0.516, only 1.7x. That gap IS the compression.
# `scale` drops 2.2 -> 0.80, a 2.75x cut, which nets the quiet elements about
# 1.8x taller and the peak about 0.6x - legible low end, peak still inside the
# frame. Timing is untouched: the easing runs on the curved value, so the
# `release` above means the same duration at any curve (ADR-0040).
scale = "0.80"
curve = "0.55"

# WIDTH, AND THE SILENT-AUDIO MOTION. `span` is a world half-width, and 1.72
# fills a 16:9 frame very nearly edge to edge (1.78 is exact). It is deliberately
# NOT a "fit" switch - on an ultrawide this same number leaves the contour short,
# which is correct for a world quantity and is why no auto mode exists
# (ADR-0037).
#
# Breathing it is a kind of motion this preset could not have before, and it
# earns its place rather than being decoration. Putting the feet on the axis cost
# the old resting breath most of its travel - `base` had to fall from 0.55 to
# 0.14 so the mirrored pair would share a foot line - and a spectrum readout has
# no rotation of its own to fall back on. Widening and narrowing the whole figure
# on a slow cycle restores that, and it reads differently from a vertical breath:
# the contour stretches along the frequency axis, so the shape stays put while
# the frame it is drawn in opens and closes.
span  = "1.72 + sin(time * 0.31) * 0.16"

# THE FOLD - a true reflection now, not a rotation. Order 1 means no rotational
# copy; `mirror_reflect` adds the mirrored one. The difference matters and is not
# cosmetic: a half-turn (the old order 2) flips x as well as y, so the reflected
# copy ran its frequency axis BACKWARDS - bass met treble in the middle. A
# reflection across the x-axis keeps the axis pointing the same way in both
# halves, so low is left in the copy too and the figure reads as one spectrum
# seen twice.
#
# `baseline = 0` is the line the pair share. This is the parameter that did not
# exist before Plan 0038, and without it the reflection lands against the top
# edge instead of on the axis. `pan_y` cannot substitute - the mirror runs on
# world coordinates in update() while the view transform is applied later in the
# shader, so panning moves the mirrored pair together.
mirror_order   = "1"
mirror_reflect = "1"
baseline       = "0"

# A SLOW TILT - the contour turning a few degrees either way. This is the motion
# that carries the preset through a silence, and it works here precisely because
# the figure is off-centre: rotating it sweeps the line across its own width.
rotation = "sin(time * 0.4) * 0.30 + clamp(bass * 0.5, 0, 0.10)"

# COLOUR ALONG THE AXIS. `hue_spread` walks the palette from the lowest element
# to the highest, so the low end and the top end are different colours and you
# can see WHERE in the spectrum a peak is without counting positions. This is the
# lever the comb deliberately leaves at zero.
hue        = "mod(0.10 + time * 0.02, 1)"
hue_spread = "0.75"
saturation = "0.95"

thickness  = "5.0 + clamp(mid * 8.0, 0, 3.0)"
brightness = "0.80 + clamp(bass * 1.2, 0, 0.30)"

zoom  = "1.00 + sin(time * 0.23) * 0.05"
pan_y = "0.02"

bg_hue      = "0.44 + sin(time * 0.008) * 0.05"
bg_bright   = "0.020 + clamp(treb * 0.12, 0, 0.014)"
bg_vignette = "0.80"

# A short tail. The contour is a thin stroke, so a little persistence gives it
# body without smearing the shape it exists to show.
trails = "0.30 + clamp(mid * 0.12, 0, 0.06)"

[smoothing]
rotation   = 0.20
thickness  = { attack = 0.03, release = 0.30 }
brightness = { attack = 0.04, release = 0.26 }
hue        = 0.40
zoom       = 0.25
bg_bright  = 0.40
trails     = 0.50
