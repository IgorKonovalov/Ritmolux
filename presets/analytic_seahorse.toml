# Seahorse - the Mandelbrot map, zoomed ~150-330x into Seahorse Valley (the
# cleft between the main cardioid and the period-2 bulb), centred on the
# well-known spiral at c ~ -0.743644 + 0.131826i, where the boundary curls into
# chains of seahorse tails. The only preset in the pass showing the Mandelbrot
# set rather than a Julia set, and far outside the reference's zoom range of
# 0.25-4 (the scene does not clamp zoom; f32 holds cleanly at this depth).
#
# What drives it: the BASS drives the iteration budget, 40..160. That is the
# structural lever on this map - more iterations resolve the filaments and
# carve the black set back, fewer let the black bloat over them - so the kick
# visibly sharpens the spirals and the quiet swallows them. Checked with a
# --set pair: at bass 0.1 the upper-right quarter is black; at bass 1 it is
# lace. The zoom breathes on a slow noise; color_center creeps with time so
# the palette flows down the spiral arms.
#
# COST: every pixel pays the iteration count, so the budget IS the frame rate.
# The first cut ran 40..400 and the running app fell to ~15 fps on a loud
# passage; 160 is the ceiling that keeps the carve-back visible.
#
# TIER NOTE: this preset asks for more than the Floor cap of 64 iterations, so
# on Floor it is clamped (and the frontend announces it) - Floor draws a
# softer, blobbier valley. Judge it at --tier rich.
#
# Judge: does the loud frame show MORE filament than the quiet one? That is
# the whole point. And at this zoom, is f32 precision still clean (no blocky
# pixels at the spiral centres)?
system = "analytic_field"
name = "Seahorse"

[field]
family = "escape_time"
map    = "mandelbrot"

[palette]
stops = [
  { at = 0.0,  color = "#01030a" },
  { at = 0.18, color = "#0a2a4a" },
  { at = 0.42, color = "#1f8fa8" },
  { at = 0.60, color = "#e8f4e0" },
  { at = 0.74, color = "#f0a040" },
  { at = 0.88, color = "#5a1830" },
  { at = 1.0,  color = "#01030a" },
]

[params]
iterations    = "40 + clamp(bass * 141, 0, 120)"
escape_radius = "64"
zoom          = "220 * pow(2.2, noise(time * 0.05) - 0.5)"
pan_x         = "-0.743644"
pan_y         = "0.131826"
interior      = "0"
color_span    = "0.9"
color_center  = "time * 0.02"
brightness    = "1.2"

[smoothing]
iterations = 0.12
