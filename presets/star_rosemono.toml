# Rose Window Mono - a Hankin interlace cut as a woodcut: black strapwork on
# white, with the red held to the mandala's interior rings. The cohort's
# ORNAMENT, and the one world in it whose figure is a construction rather than a
# field, a growth or a readout.
#
# `stroke_blend = "1"` IS WHAT MAKES A ROSETTE PRINTABLE. At the default `0` this
# scene draws additive light, and an interlace is nothing BUT self-crossing - the
# whole figure is straps passing over straps. Additively every crossing sums, so
# a black-and-red rosette turns pink at exactly the places the eye is drawn to.
# Under OVER a strap replaces the interior of what it covers and the crossings
# stay two flat inks.
#
# THE COST IS PAID HERE MORE THAN ANYWHERE ELSE IN THE COHORT. Additive light
# builds up where a figure crosses itself and a dense rosette LEANS on that for
# its apparent weight; under OVER it does not, so the same `brightness` reads
# flatter and often darker. This file is black ink, where a multiplier on
# `#000000` is `#000000`, so it costs nothing visible - but a luminous star
# preset flipping this switch would need retuning, not just recolouring.
#
# THE SECOND CONSEQUENCE IS THE USEFUL ONE: OVER IS ORDER-DEPENDENT. Additive
# light is order-independent, so which strap wins a crossing is now the order the
# scene emits geometry in, and the interlace acquires a consistent over-under
# that it simply did not have before. That is why this reads as strapwork rather
# than as a flat lattice, and it is not something a palette could have bought.
#
# -- WHY THERE ARE RINGS, AND WHY THE RED LIVES ON THEM ---------------------------
#
# `hue_spread` on `star_pattern` walks RADIUS from the figure's centre - and it
# is documented INERT on a bare interlace, which has no radial structure for the
# ramp to walk. So a rings-free version of this preset can only ever be one flat
# ink, and the red would have nowhere to go.
#
# `[generator] rings` (ADR-0079) is what gives the axis something to say. The
# three rings below are the mandala interior; they sit at increasing radius, so
# the ramp runs outward from them to the interlace at the rim, and the red lands
# on the interior while the strapwork stays black. Motifs draw through the same
# line renderer as the interlace, so they take the same stroke, the same seam and
# the same palette - there is no second set of numbers to keep in step.
#
# `hue = 0` puts the innermost ring at palette 0 and `hue_spread` puts the rim
# wherever it is set, so the ramp is a RADIAL SWEEP of the palette - and driving
# it moves the red run outward through the figure. At 0.44 the red sits on the
# interior rings; at 0.72 it has travelled out into the strapwork. Nothing at
# either end reaches band 7, so the paper is never drawn.
#
# THIS IS THE WORLD'S MAIN REACTIVITY AND IT WAS A CONSTANT. At a pinned 0.62 the
# preset read 0.0124 on its best band against the reactivity gate's 0.02 floor,
# because the gate measures a WHOLE-FRAME differential and a thin black figure on
# a white sheet moves almost no pixels when its stroke merely thickens. An ink
# flip repaints every segment of a radius at once, which is the only lever on a
# white-ground line world with real AREA behind it. Gain 0.28 / 0.85 for `bass`.
#
# -- THE PAPER --------------------------------------------------------------------
#
# `bg_hue` is a coordinate in this preset's own `[palette]` (ADR-0086), so band 7
# exists as a white stop for the background to sample and the figure is kept off
# it by `hue_spread`. One flat sample, no span, `bg_shade` equal to
# `bg_shade_end` so the vertical tilt is flat, no vignette. The backdrop is a
# mixer, and the exemption is the one `lsystem_sumimono.toml` records: an opaque
# stroke interior mixes only at its anti-aliased edge.
#
# -- MOTION -----------------------------------------------------------------------
#
# `variant` is a CONTINUOUS contact angle in 0..2, not an index (ADR-0060): `0`
# is 24 degrees below the generator's base angle, `1` is the base, `2` is 24
# above. Since Plan 0054 easing it MORPHS the construction rather than
# stuttering, so the advice in the older star presets - `floor` it, never smooth
# it - is exactly backwards now and this file does neither. It is driven by a
# triangle wave, which is continuous AND closed: a sawtooth would snap 2 -> 0 at
# every wrap, which is the cut that `floor` was hiding.
#
# `rotation` is a slow constant and is NOT bound to audio. A rosette that turns
# on the beat reads as a turntable, and camera-adjacent motion is not this
# project's reactivity.
system = "star_pattern"
name = "Rose Window Mono"

[generator]
tiling            = "12"
contact_angle_deg = 32

# The mandala interior - three rings at increasing radius, which is what gives
# `hue_spread` an axis to walk. The world spans +/- 0.9, so 0.9 is the rim.
rings = [
  { motif = "trefoil", count = 1,  radius = 0.00, scale = 0.34 },
  { motif = "petal",   count = 12, radius = 0.34, scale = 0.20, phase = 0.26 },
  { motif = "circle",  count = 24, radius = 0.58, scale = 0.11 },
  # The rim. Without it the whole radius past 0.58 carries only the bare
  # interlace outline, which is what left the shape gate reading 2/10 radial
  # shells. `scallop` reads three of its keys differently from every other
  # motif - it is a BOUNDARY, not a bead repeated around a ring, so `count` is
  # its lobe count, `radius` the base circle its lobes bulge from, and `scale`
  # the depth of the bulge.
  { motif = "scallop", count = 36, radius = 0.86, scale = 0.045 },
]

[palette]
# Eight bands in three runs: black 2 / RED 2 / black 3 / white 1. Band k's centre
# is (2k+1)/16, so the boundaries at 0.25, 0.50 and 0.875 each fall midway
# between two centres.
stops = [
  { at = 0.000, color = "#000000" },   # bands 0-1   the centre boss
  { at = 0.245, color = "#000000" },
  { at = 0.255, color = "#b00808" },   # bands 2-3   the interior rings
  { at = 0.495, color = "#b00808" },
  { at = 0.505, color = "#000000" },   # bands 4-6   the strapwork out to the rim
  { at = 0.870, color = "#000000" },
  { at = 0.880, color = "#ffffff" },   # band  7     the PAPER - see the header
  { at = 1.000, color = "#ffffff" },
]

[params]
stroke_blend  = "1"
palette_steps = "8"
palette_mix   = "0"
saturation    = "1"
hue           = "0"
hue_spread    = "0.44 + clamp(bass * 0.329, 0, 0.28)"

# The contact angle, morphing on a triangle wave. See the header for why this is
# neither floored nor left alone. The mid term walks it a little further open on
# a busy passage - a blunter star - without ever leaving the closed sweep.
variant = "1.0 + sin(time * 0.115) * 0.55 + clamp(mid * 0.353, 0, 0.30) - 0.15"

# THE STRAPWORK. Weight is where the low end goes, which on a black ink is the
# only place it COULD go - a brightness term on black is a no-op.
#
# 6.2 TO 7.8, WHICH IS FAR ABOVE WHAT THE GENERAL ADVICE SUGGESTS, and the first
# draft of this file got it badly wrong by trusting that advice. `presets/README`
# quotes 1.5 to 3.2 as the shipped line-preset range; that figure comes from the
# stroke dead-zone discussion and it does NOT describe this scene. `star_zellij`,
# the only other rosette drawn through the OVER seam, runs 4.2 to 5.2 at
# `softness = 0.02` - and it needs to, because an interlace is a long thin figure
# whose ink is nearly all edge.
#
# At 2.0 with `softness = 0.12` this world rendered as HAIRLINE OUTLINES on a
# white sheet: coverage 0.0100 against the shape gate's 0.34 floor, and only 2 of
# 10 radial shells occupied. It was not a blank frame and it was not far off one.
# Swept at 3 / 8 / 20 the figure goes outline / strapwork / blot. The hard edge
# matters as much as the weight: at 0.12 an already-thin stroke spends most of
# its width on a coverage ramp, which on a white ground is grey rather than ink.
thickness = "6.20 + clamp(bass * 1.882, 0, 1.60)"
softness  = "0.02"

brightness = "1.0"
glow       = "1.0"
scale      = "0.92"

# The interior answers separately from the strapwork: `ring_scale` swells the
# motifs on the treble, so detail opens the mandala while the interlace holds
# still. Gain 0.18 / 0.60 for a `treb` term.
ring_scale = "1.00 + clamp(treb * 0.300, 0, 0.18)"
ring_phase = "0.10 + noise(time * 0.024) * 0.22"

# A slow constant. About one revolution in seven minutes - enough that the figure
# is never twice in the same place across a set, far too little to read as spin.
rotation = "time * 0.015"

# THE PAPER. Band 7, sampled flat.
bg_hue        = "0.94"
bg_hue_span   = "0"
bg_bright     = "1"
bg_shade      = "1"
bg_shade_end  = "1"
bg_vignette   = "0"
bg_ramp_gamma = "1"
bg_angle      = "0"

[smoothing]
variant    = 0.45
thickness  = 0.16
ring_scale = 0.28
