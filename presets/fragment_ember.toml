# Ember - warm and cohesive: the shared "ember" palette (deep red -> orange -> gold,
# Plan 0020) held in a NARROW color_span so the whole field smoulders in one molten
# band instead of smearing the rainbow (the old preset faked warmth with a crushed
# zoom + a hue offset; now the palette carries the colour). color_center rides bass
# toward the brighter orange on hits and breathes on a slow sin; big slow blobs, low
# warp so it smoulders.
#
# Variables available to expressions: bass mid treb onset beat bar time.
system = "fragment_field"
name = "Ember"

[palette]
name = "ember"

[params]
warp         = "0.22 + clamp(bass * 6, 0, 0.5)"
zoom         = "0.62 + clamp(mid * 2, 0, 0.15)"
glow         = "0.55 + clamp((mid + bass) * 6, 0, 0.85)"
flash        = "clamp(onset * 3, 0, 0.9)"
color_center = "0.30 + clamp(bass * 3, 0, 0.12) + sin(time * 0.05) * 0.03"
color_span   = "0.26 + clamp(mid * 2.5, 0, 0.10)"
saturation   = "1.05 + clamp(onset * 2, 0, 0.3)"
