# Ember - molten rock seen close up: slow, heavy, layered convection cells that
# crack open gold on the beat and cool back to near-black coals between hits.
#
# The old version ran `zoom = 0.62`, which on this scene (where zoom is
# INVERTED - lower shows LESS of the field) meant almost no cells were visible
# at all and the preset rendered as a soft two-colour gradient. The zoom here is
# roughly three times that, which is what turns it back into layered rock.
#
# The beat mechanism is the one worth reading: `color_center` slides the palette
# window UP on a hit, so bright gold flares into a field that is normally
# sitting in the coals, and a short smoothing constant lets that flare swell and
# fall rather than strobe. It is a colour accent, not a brightness accent - see
# the glow ceiling note in `fragment_warp.toml`.
system = "fragment_field"
name = "Ember"

[palette]
name = "ember"

[palette_b]
stops = [
  { at = 0.00, color = "#0d0000" },
  { at = 0.26, color = "#5c0a00" },
  { at = 0.52, color = "#c93a06" },
  { at = 0.74, color = "#ff9b1f" },
  { at = 0.90, color = "#ffe27a" },
  { at = 1.00, color = "#fffbe8" },
]

[params]
# STRUCTURE - big slow cells. Low warp keeps them smouldering and coherent;
# the zoom is what supplies the layering.
# Treble rides the WARP, not a luminance term: the top end shows up as the
# folds shimmering rather than the lava getting brighter (Plan 0045 review -
# this preset read treb 0.000, having bound the band nowhere at all).
warp  = "0.34 + sin(time * 0.0330) * 0.09 + clamp(bass * 1.1, 0, 0.45) + clamp(treb * 2.2, 0, 0.22) + sin(bar * pi) * 0.10"
zoom  = "2.70 + sin(time * 0.0190) * 0.22 + clamp(bass * 1.2, 0, 0.50)"
pan_x = "sin(time * 0.0117) * 0.20 + time * 0.005"
pan_y = "cos(time * 0.0163) * 0.16"

# LUMINANCE - low and flat. Coals are dark; the gold comes from the palette.
glow  = "0.60 + clamp((mid + bass) * 0.45, 0, 0.18)"
flash = "clamp(onset * 0.8, 0, 0.24)"

# COLOUR - the beat slides the window up into the gold. This is the accent.
#
# `sin(bar * pi)` RATHER THAN `beat`, and that swap is the whole reason this
# preset stopped feeling frantic. `beat` is a 0/1 GATE - it slams to 1 for one
# frame and drops - so a 0.26 palette-window jump on it is a step function, and
# no smoothing constant short enough to still read as a beat can round that off.
# `bar` is the 0..1 phase THROUGH the beat, so `sin(bar * pi)` is a half-sine
# hump: it rises from the hit, peaks mid-beat, and falls back to zero by the
# next one. Same tempo, same accent, but it is a swell instead of a strobe -
# which is what "molten" wanted in the first place.
color_center = "0.02 + sin(time * 0.0410) * 0.04 + sin(bar * pi) * 0.15 + clamp(onset * 0.9, 0, 0.12)"
color_span   = "0.80 + clamp(mid * 0.6, 0, 0.16) + clamp(treb * 1.4, 0, 0.14)"
saturation   = "1.08 + clamp(onset * 0.9, 0, 0.26)"
palette_mix  = "clamp(bass * 1.2, 0, 0.50)"

# COMPOSITE - a long feedback so the molten flow smears like slow lava.
trails = "0.58 + clamp(mid * 0.30, 0, 0.14)"

[smoothing]
# The gold flare swells and falls; everything structural drifts.
#
# `flash` USED TO HAVE NO ENTRY HERE AT ALL. It is driven straight off `onset`,
# the rawest signal in the engine, so unsmoothed it was a per-hop luminance
# strobe sitting on top of the colour accent - the single biggest contributor to
# this preset reading as too rapid. It now has the longest release in the file.
flash        = { attack = 0.12, release = 0.80 }
color_center = 0.45
# Attack lengthened 0.03 -> 0.20. Warp is CONTINUOUS structure on this preset -
# convection cells, not a percussive accent - and a 30 ms attack made the
# per-beat term snap the whole field.
warp         = { attack = 0.20, release = 0.62 }
zoom         = 0.35
glow         = 0.35
color_span   = 0.40
palette_mix  = 0.70
trails       = 0.45
saturation   = 0.45
