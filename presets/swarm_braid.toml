# Braid - the swarm resolved into a few sinuous ribbons with real dark between
# them (Plan 0104 Phase 3). Authored fresh-slate (ADR-0089), and authored at one
# end of a lever the family had never left the middle of.
#
# THIS WORLD IS AN ANSWER TO "THE SWARM READS AS CONFETTI". `field_freq` is the
# spatial lever - the size of a current relative to the frame - and the shipped
# pair both sit near its default: Drift breathes 1.9 to 2.5, Shatter takes the
# 2.3 default. presets/README.md measures the range and records the thing that
# is counter-intuitive about it: the LOW end is what reads as busy, because
# every particle is then inside one enormous current and the frame packs edge to
# edge. The high end does the opposite - it separates the population into
# distinct streams and hands back negative space. At 6.4 there are a handful of
# sharply resolved ribbons and genuinely empty dark between them, which is a
# flock rather than a scatter.
#
# THE OTHER HALF IS `spin`, AND IT HAS TO BE NEARLY FROZEN. The family's
# apparent flocking is not a per-particle rule - it emerges from neighbours
# falling onto the SAME streamline and travelling together. `spin` is how fast
# the field is rewritten, so raising it dissolves the flock toward shimmer
# however fine the field is. 0.03 is slow enough that a ribbon holds its shape
# for seconds; the mid band moves it barely at all, on purpose.
#
# WHAT DRIVES WHAT. Bass drives the current's speed, mid divides the field a
# little finer, treble rides the shimmer, and onset SHAKES the population -
# `reseed` is the family's percussive accent (ADR-0066) and neither shipped
# world uses it. It is edge-triggered, so it takes a gate and not a level: a
# held high fires once, not every frame.
#
# HORIZON VERDICT, ten simulated minutes at 96x96, bass 0.6 / mid 0.45, after
# the breathing field below was added:
#
#   coverage    0.5649 ->  0.2336   delta  -0.3313   monotone 0.50
#   peak/mean   6.7690 -> 12.7697   delta  +6.0007   monotone 0.50
#   footprint   0.1651 ->  0.2654   delta  +0.1003   monotone 0.63
#
# READ THE ROWS, NOT THE FIRST-TO-LAST DELTA, because the first row here is the
# WARM-UP. This world starts as a uniform population and takes about half a
# minute to gather into ribbons - that gathering is the look arriving, and it is
# what the coverage drop from 0.5649 to the 0.30 of the 30 s row measures. From
# there every one of the remaining nineteen rows sits between 0.23 and 0.40 and
# wanders, with monotone at 0.50 on both of the statistics that moved. That is
# breathing, against the 1.00 that grinding into a corner reads.
#
# `reseed` IS NOT WHAT MAKES THAT TRUE, and the instrument cannot show that it
# is: the horizon holds a fixed stimulus, so `onset` stays at 0 for the whole
# run and the gate below never fires once. The stability above is the field's,
# unaided - which is the right way round, since a world that needed a transient
# to stay alive would die in a quiet passage.
system = "swarm"
name   = "Braid"

[palette]
stops = [
  { at = 0.00, color = "#04121f" },  # deep water
  { at = 0.32, color = "#0d5a72" },  # petrol
  { at = 0.58, color = "#2ba8a0" },  # verdigris
  { at = 0.80, color = "#8fe0c0" },  # pale jade
  { at = 1.00, color = "#e8fff4" },  # the crest
]

[params]
# THE TWO STRUCTURAL NUMBERS (see header). The mid term is small deliberately:
# `field_freq` re-routes every particle, so a wide swing does not read as the
# music moving the flock, it reads as the flock being replaced.
#
# BOTH BREATHE, AND THAT IS A LONG-RUN FIX RATHER THAN A FLOURISH. Drafted with
# a fixed 6.4 and a one-signed 0.03, this world COLLAPSED: `shot --horizon 10`
# at bass 0.6 / mid 0.45 took coverage from 0.5647 to 0.0002 and peak/mean from
# 6.7 to 4608 - the whole population converged onto the field's attracting
# streamlines, then onto points on them, and the frame went empty. The shipped
# `swarm_drift`, run identically as a control, held coverage 0.910 to 0.948, so
# the collapse was this world's and not the family's. What separates them is
# that Drift's two structural params both TRAVEL: its field breathes and its
# `spin` crosses zero and reverses. A high `field_freq` converges faster than a
# low one - thin streamlines are exactly what it is for - so at this end of the
# range the field has to keep being rewritten or the ribbons become beads.
#
# `spin` reversing is the load-bearing half. It integrates a phase (ADR-0132),
# so a one-signed value advances the field forever in one direction and the
# attracting sets drift but persist; swinging it through zero rewinds them, and
# a particle that had settled is left off the streamline it settled on.
field_freq = "6.4 + sin(time * 0.019) * 0.85 + cos(time * 0.011) * 0.45 + clamp(mid * 0.71, 0, 0.6)"
spin       = "0.02 + sin(time * 0.023) * 0.09 + clamp(mid * 0.024, 0, 0.02)"

# The current's speed. This is where the low end goes, because it moves the
# ribbons along themselves rather than reshaping them.
force = "1.05 + clamp(bass * 0.94, 0, 0.8)"

# THE PERCUSSIVE ACCENT, AND IT IS A GATE RATHER THAN A LEVEL. A rising edge
# past 0.5 kicks every particle a seeded 6% of the domain and the flow re-gathers
# it over the next few seconds - the ribbons fray on a hit and re-form. The
# threshold sits well above a real-music onset mean of ~0.20 so this is a
# genuine transient and not a per-frame tremble.
reseed = "onset > 0.7"
# Held low: `burst` is a sustained scatter and this world's whole point is that
# the streams stay legible. The accent above is the event; this is the floor
# under it.
burst = "clamp(onset * 0.25, 0, 0.15)"

# A small mark, because the ribbons are what the eye is meant to follow and a
# fat one welds neighbouring streamlines together. The spread is wide so the
# depth layers separate.
size        = "1.9 + clamp(bass * 0.35, 0, 0.3)"
size_spread = "0.7"
shape       = "0"
# Per-mark shimmer, whose rate AND phase both come off the seed - so the field
# glitters while the whole-frame light sits still. Binding `brightness` to an
# oscillator instead would flash the frame as one sheet.
twinkle = "0.3 + clamp(treb * 0.5, 0, 0.3)"

brightness = "0.9 + clamp(mid * 0.235, 0, 0.2)"

# Colour walks along the palette per mark, so a dense crest reads paler than the
# thin water between ribbons.
hue_center = "0.5 + sin(time * 0.011) * 0.08"
hue_spread = "0.55 + clamp(treb * 0.25, 0, 0.15)"
saturation = "1.0"

# THE WHOLE TORUS, NOT A SUB-WINDOW. The domain follows the render target and
# extends a quarter past the frame so the wrap seam is off-screen; a zoom below
# about 0.84 exposes the near depth layer's edge. 1.0 also keeps the density
# waves reading as waves rather than as clumps and voids, which is the note
# `swarm_shatter` records.
zoom  = "1.0"
pan_x = "sin(time * 0.013) * 0.06"
pan_y = "cos(time * 0.009) * 0.04"

# Short. Enough to give a ribbon body along its own direction; long enough to
# fill the dark between them would undo the world.
trails = "0.5"

bg_hue      = "0.06"
bg_bright   = "0.02 + clamp(bass * 0.035, 0, 0.03)"
bg_vignette = "0.6"

exposure     = "0.95 + clamp(bass * 0.294, 0, 0.25)"
bloom_amount = "0.25 + clamp(onset * 0.5, 0, 0.3)"
bloom_threshold = "0.9"
bloom_radius = "1.3"

[smoothing]
# Long on the two structural params: a fast ease on `field_freq` re-routes the
# population inside a beat, which reads as a glitch rather than as a response.
field_freq   = 1.4
spin         = 1.1
force        = 0.5
size         = { attack = 0.06, release = 0.45 }
brightness   = 0.3
twinkle      = 0.5
hue_spread   = 0.6
exposure     = { attack = 0.05, release = 0.4 }
bloom_amount = 0.18
bg_bright    = 0.5
