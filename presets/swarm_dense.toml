# Dense - a tight, shimmering shoal: a fast-churning field with a NARROW hue
# window, so the whole mass reads as one glittering body that turns together
# rather than as a scatter of coloured dots. Folded through the screen-space
# kaleidoscope, which turns the shoal into a slowly-rotating mandala of itself.
#
# The shimmer comes from CHURN SPEED (`spin`), not from small particles - tiny
# points simply vanish on this scene. See `swarm_drift.toml` for the force
# ceiling and the grain/exposure split that govern the family (that file absorbed
# both when Plan 0043 cut the set from five presets to three).
system = "swarm"
name = "Dense"

[palette]
name = "ice"

[palette_b]
name = "spectrum"

[params]
# MOTION - the fastest churn in the set, but the steering still sits inside the
# ceiling. Treble runs the shimmer; mid runs the body.
#
# THE CORNER ARTIFACT WAS OVER-DRIVEN MOTION, not a renderer bug. `burst` pushes
# particles radially outward from the centre, and at a cap of 2.2 on top of a
# `force` of nearly 2.0 a loud passage flung the entire swarm to the frame edge
# inside a beat. What that produced was a bright ring hugging the border, long
# streaks piling into the corners (the corners are the furthest travel, so they
# collect the longest trails), and a dead void where the shoal should be. It is
# the exact mirror of the additive ceiling: instead of clipping to white, the
# picture leaves the frame, so a loud frame reads as LESS than a quiet one.
#
# `burst` is the lever, so it takes the cut - roughly halved, and its `onset`
# term is now clamped before it is summed rather than only after, so a single
# hard transient cannot carry the total to the cap on its own. `force` keeps its
# churn but loses the peak that stacked on top of the burst.
#
# FLOCKING GEOMETRY - mechanism documented in `swarm_drift.toml`. `spin` is the
# flow field's rate of CHANGE rather than vorticity, and at 0.85-1.8 this field
# was being rewritten faster than any particle could cross it, so the densest
# swarm in the set rendered as the most featureless. Held low, the streamlines
# stand still long enough to be followed and ten thousand particles become a
# murmuration instead of a texture.
#
# DENSE IS THE FINE-GRAINED ONE, and that is now a MEASURED separation rather
# than a described one. Dense, Drift and Flow used to sit within 20 % of each
# other on every lever (force 1.30/1.20/1.32, spin 0.105/0.085/0.115, size
# 0.95/1.05/1.15, zoom 1.04/1.05/1.02) - three presets separated by less than
# the audio modulation range of each param, which is why they read as one
# preset with three palettes however different their band drivers were. Band
# assignment is nearly invisible in a still; GRAIN SIZE and EXPOSURE LENGTH are
# what the eye actually separates, so the family now splits on those:
#
#   Dense   size 0.58   trails 0.76   spin 0.130   fine dashes, busy weave
#   Drift   size 2.20   trails 0.86   spin 0.040   large soft blobs, nebula
#   Flow    size 0.75   trails 0.92   spin 0.050   long combed silk filaments
#
# Two constraints found by bracketing, both worth not rediscovering:
#   - `zoom` BELOW 1.0 exposes the particle domain boundary as a hard rectangle
#     inset from the frame edge. The whole family stays at or above 1.0, which
#     kills the obvious "pull the camera back for empty space" move.
#   - `force` is visually inert across 1.30..1.62 at these settings. It is not
#     the differentiator it reads as; the collapse warning in swarm_drift.toml
#     is about much larger values.
force = "1.30 + clamp(mid * 0.353, 0, 0.30) + sin(time * 0.061) * 0.10"
spin  = "0.130 + clamp(treb * 0.133, 0, 0.08) + clamp(mid * 0.053, 0, 0.045)"
burst = "clamp(beat * 0.25 + clamp(onset * 0.5, 0, 0.30), 0, 0.50)"

# STRUCTURE - `field_freq` (Plan 0043), and DENSE TAKES THE FINE END of it, which
# is the lever that finally makes this preset's name a geometry rather than just
# a particle count. Around 5.2, against Drift's 1.9 and Storm's 3.0.
#
# At that scale the frame holds several tight, sinuous ribbons with genuinely
# empty dark space between them, and the shoal becomes a THING WITH EDGES that
# turns and doubles back - which is what "one glittering body" was always after
# and could not reach while the field was a broad wash under every preset in the
# set. Note which direction reads as busier: it is NOT this one. A high
# `field_freq` separates the swarm and gives back negative space; the low end is
# what packs the frame edge to edge, because every particle is then inside the
# same enormous current.
#
# It pairs with this preset's fine sprite the way the coarse end pairs with
# Drift's: fine grain resolves the ribbon's internal weave, where a large sprite
# at this frequency would just fill the gaps back in and undo it.
#
# Treble drives it, matching the shimmer - an open top end tightens the weave a
# further notch, so hats and cymbals read as the shoal contracting rather than
# merely brightening.
field_freq = "5.20 + sin(time * 0.043) * 0.65 + clamp(treb * 1.5, 0, 0.90)"

# APPEARANCE - the finest sprite in the family, and the brightest to compensate.
# Size FALLS slightly under treble: a loud top end should read as finer, faster
# glitter, not as a brighter smear.
#
# Brightness went 0.76 -> 0.92 because the two moved together: at 0.58 each
# particle covers roughly a third of the pixels it did at 0.95, so the same
# brightness rendered the densest preset in the set as the DIMMEST. Fine grain
# needs the per-particle intensity back or it reads as an empty frame - which
# is exactly what a 0.58/0.76 pairing produced when bracketed.
#
# Plan 0043 pushed both up again for the same reason it did on Drift, and this
# preset is the one that needed it most: the domain margin puts a quarter of the
# particles off-frame and the depth fade halves the far half's brightness, which
# lands hardest on the file that was already trading per-particle size for count.
# Fine grain has the least light to give away.
brightness = "1.24 + clamp(bass * 0.282, 0, 0.24)"
# 0.62 drew dust - this preset was the least legible tile in the whole
# library at full excitation (Plan 0045 review), against `swarm_drift`'s 2.55
# which reads clearly. The treble term still THINS the particles, which is
# the look; it just no longer thins them out of existence.
size       = "1.55 - clamp(treb * 0.267, 0, 0.16) + beat * 0.20"

# COLOUR - the tightest hue window in the set. This is the cohesion knob: low
# spread is what separates "one shimmering body" from "novelty confetti".
hue_spread  = "0.11 + clamp(treb * 0.25, 0, 0.15)"
hue_center  = "0.70 + sin(time * 0.037) * 0.08 + clamp(treb * 0.217, 0, 0.13)"
saturation  = "1.05 + clamp(mid * 0.33, 0, 0.28)"
palette_mix = "clamp((bass + treb) * 0.241, 0, 0.35)"

# VIEW - and this was the second half of the corner problem. Pushing the camera
# in magnifies the outward travel: the same burst that moved a particle to 80 %
# of the frame at zoom 1.0 puts it past the edge at 1.22, so the zoom was
# actively helping throw the shoal out of view. It also PUMPED on the bar, which
# meant the frame emptied hardest exactly when the music was loudest.
#
# Backed off to just over 1.0. "Fills its wedge before the fold repeats it" is
# still true - the shoal fills it by being dense, which is the preset's name,
# not by being magnified until it overflows.
zoom  = "1.02 + bar * 0.05 + clamp(bass * 0.118, 0, 0.10)"
pan_x = "sin(time * 0.033) * 0.07"
pan_y = "cos(time * 0.025) * 0.05"

# COMPOSITE - a short exposure to bind the glitter into strokes, then a
# six-fold screen fold that turns slowly.
#
# The fold order is FIXED and modest on purpose. A high-order fold (this preset
# ran 8->10) leaves visible wedge seams and mirrored debris in the frame
# CORNERS: the fold maps corner pixels from source coordinates outside the
# wedge it is replicating, and the further the order is pushed the more corner
# area comes from out-of-range samples. Six is the highest that stays clean at
# 16:9.
# EXPOSURE IS THE OTHER HALF OF THE GRAIN, and it was bracketed at 0.40 / 0.62
# / 0.76 against Flow as a reference. The short end is the trap: at 0.40 each
# fine sprite draws a dot rather than a dash, and "Dense" rendered as the
# SPARSEST preset of the three - the frame nearly empty, the name contradicted.
# Persistence is what turns ten thousand points into continuous coverage. 0.76
# is the value that fills the frame while still reading as separate strokes;
# past ~0.85 the dashes fuse and it becomes Flow's silk.
trails        = "0.76 + clamp(mid * 0.118, 0, 0.10)"
# THE SCREEN FOLD IS OFF, AND THE ENGINE ARTIFACT IT DODGED IS GONE (2026-08-04).
#
# The original note - kept in substance because it is the record of a real defect
# - said this: at `kaleido_order = 6` the preset grew hard, bright, straight bars
# along the left and right frame edges and bright wedges in the corners, in every
# frame; an A/B at order 1 was clean, so it was the fold and not the swarm. The
# mechanism was that the fold sampled its source beyond the frame edge and clamped
# to the edge texel, so any bright pixel sitting ON the border was replicated along
# the entire fold seam. A sparse particle field over a near-black background is the
# worst case for that, which is why only this preset showed it.
#
# THAT WAS design-backlog 0010, and it was fixed engine-side by ADR-0047 (Plan
# 0045): the fold no longer reconstructs a coordinate outside its source at all.
# Plan 0055 / ADR-0061 then made the out-of-disc region a per-preset choice
# (`kaleido_edge`), so there are now two fill treatments as well as the fade. The
# claim "no preset-side lever fixes it" has been false since ADR-0047 landed and
# doubly so now.
#
# THE FOLD IS BACK ON (2026-08-04, design-backlog 0058), and the decision the note
# above routed to `preset-author` has been made by looking. The header of this file
# has always described "a slowly-rotating mandala of itself"; `kaleido_order = "1"`
# had been quietly defeating that claim ever since the dodge went in, so this is the
# preset catching up with its own stated intent rather than a new direction.
#
# ORDER 3, NOT 6. The original defect was found at 6, and at that order the shoal's
# churn is subordinated to the symmetry - it stops reading as a moving body. Three
# wedges keep the flow legible while still closing the figure into a mandala.
#
# EDGE: tile (1). The prediction above was exactly right - a sparse figure over a
# dark field IS where the treatments differ most, and all four were rendered to
# check it. `falloff` reproduces the cropped disc the dodge existed to avoid, which
# is the direct evidence the pin is obsolete rather than merely old. `squash` pulls
# the shoal into a radial starburst and loses the drift. `tile` mirrors the streams
# outward, so the corners carry real particles and the shoal reads as one larger
# turning body.
kaleido_order = "3"
kaleido_edge  = "1"
kaleido_angle = "time * 0.055"
bg_hue        = "0.40 + sin(time * 0.013) * 0.05"
bg_bright     = "0.011 + clamp(mid * 0.013, 0, 0.011)"
bg_vignette   = "0.74"

[smoothing]
force         = 0.30
spin          = 0.22
# Shorter than Drift's 1.60: the weave is allowed to breathe with the top end
# here, since contracting on a cymbal IS this preset's gesture. Still well past
# the band constants, so it reads as the shoal tightening rather than flickering.
field_freq    = 0.85
brightness    = 0.18
size          = 0.14
trails        = 0.40
zoom          = 0.15
hue_center    = 0.35
palette_mix   = 0.7
kaleido_order = 1.0
bg_bright     = 0.4
