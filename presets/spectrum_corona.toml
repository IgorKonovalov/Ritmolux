# Spectrum Corona - the frequency axis wrapped around a circle: one spoke per
# element, radiating outward from a ring, with the low end at three o'clock and
# the rest running counter-clockwise.
#
# WHY THIS LAYOUT IS DIFFERENT IN KIND. Bars and the contour both have a left and
# a right, so they read as a chart. Wrapped, the axis has no ends - the readout
# becomes an object with a centre, which is the difference between a meter and a
# figure. The trade is real and worth stating: a ring makes it much harder to
# tell WHERE in the spectrum a peak is, so this is the least legible of the three
# layouts and the most watchable.
system = "spectrum"
name   = "Spectrum Corona"

[spectrum]
# WHY THIS WENT UP 32 -> 44, and it is the main fix for the corona reading as
# UPSCALED - as though a low-resolution image had been blown up. Nothing about
# the render was low-resolution; the SPOKES were. Each one was a short, wide,
# soft-edged rectangle, and a ring of 32 of those is a ring of blocks. Three
# things made them blocky and all three are fixed below: they were too few, too
# fat (`thickness` 4.5 on a stroke only ~0.2 long), and drawn at the default
# `glow = 1.0`, whose soft skirt runs the whole length of a short stroke so the
# edges never resolve. More spokes, thinner, sharper, and longer.
elements = 44
layout   = "radial_ring"
# Slower than the comb on both sides. A spoke sweeping past the eye already
# carries the transient through the rotation, so the envelope does not have to
# be fast as well - and a ring of jittering spokes reads as static.
smoothing = { attack = 0.05, release = 0.40 }

# CYCLIC PALETTES, and this is the one preset in the set where that is a
# requirement rather than a preference. `hue_spread = 1` below walks the whole
# gradient once around the ring, so the last spoke lands next to the first - and
# the gradient repeating past its ends is NOT the same as it being continuous
# there. Every built-in stop-list palette (`ember`, `ice`, `mono`, `aurora`) runs
# dark to light, so a full walk would put a hard dark/light seam somewhere on the
# circle. These are `ember` and `ice` re-cut to return to their starting colour
# at 1.0: the same two colour identities, with the bright end in the middle of
# the walk instead of at its edge.
[palette]
stops = [
  { at = 0.00, color = [0.05, 0.01, 0.00] },  # deep ember - and the wrap point
  { at = 0.25, color = [0.60, 0.12, 0.02] },
  { at = 0.45, color = [1.00, 0.42, 0.06] },
  { at = 0.55, color = [1.00, 0.86, 0.52] },  # pale gold, opposite the wrap
  { at = 0.78, color = [0.70, 0.20, 0.03] },
  { at = 1.00, color = [0.05, 0.01, 0.00] },  # back to the start, no seam
]

[palette_b]
stops = [
  { at = 0.00, color = [0.00, 0.05, 0.18] },  # deep ice - and the wrap point
  { at = 0.28, color = [0.09, 0.42, 0.72] },
  { at = 0.50, color = [0.40, 0.75, 0.92] },
  { at = 0.60, color = [0.85, 0.95, 1.00] },  # near-white, opposite the wrap
  { at = 0.82, color = [0.12, 0.45, 0.78] },
  { at = 1.00, color = [0.00, 0.05, 0.18] },  # back to the start, no seam
]

[params]
# ROTATION - the preset's spine. A steady turn, which on a ring is the one motion
# that is always visible: every spoke crosses the position its neighbour just
# left. The audio term is a small nudge to the PHASE rather than a speed change,
# because a band term on an angle reads as the figure lurching.
rotation = "time * 0.42 + sin(time * 0.05) * 0.30 + clamp(bass * 0.212, 0, 0.18)"

# THE RING. `radius` is the one layout-specific parameter on this system - it is
# the inner circle the spokes stand on, and it does nothing at all on bars or the
# polyline. Bound here to a slow breath plus the low end, so the whole corona
# expands on a heavy bar.
radius = "0.34 + sin(time * 0.27) * 0.05 + clamp(bass * 0.165, 0, 0.14)"

# SPOKE LENGTH, and the one PER-ELEMENT binding in the shipped set. `index` is
# the element's own position along the frequency axis, normalized 0..1, and a
# binding that names it is evaluated once PER SPOKE instead of once per frame -
# so this is a different resting length at every point around the ring, which no
# single number can express.
#
# It is here for a reason rather than as a demonstration. Music has far less
# energy at the top of the spectrum than at the bottom, so on a plain readout the
# high spokes sit stubbed while the low ones swing; lengthening them at rest tilts
# the figure back toward a circle and lets the top end actually read. The
# resting length is generous overall because the ring IS the figure: at a short
# base the spokes are tick marks on a circle rather than a corona.
#
# Note there is deliberately no `base` entry in [smoothing] below - a per-element
# binding is delivered as a series and cannot be eased as one value. The engine
# says so at load rather than ignoring the entry, and the easing that DOES apply
# to a spectrum readout is [spectrum] smoothing above.
base  = "0.09 + index * 0.04 + sin(time * 1.1) * 0.07"

# 5.20 -> 0.45, THE SAME CORRECTION `spectrum_ridge` TOOK in 81190ac
# (3.20 -> 0.60) and `spectrum_comb` alongside this one. Every number in the
# history below was chosen on the PRE-ADR-0049 raw band scale, where a loud
# element read about 0.1. ADR-0049 normalized the bands to 0..1, so the same
# `scale` multiplied a value roughly five times larger and the spokes left the
# frame entirely: rendered under `--signal noise:7` at 5.20 the corona is a
# starburst running off all four edges with no tip visible anywhere, so the
# ring - the whole figure - is gone.
#
# WHY THIS PRESET'S BUDGET IS THE TIGHTEST IN THE SET, which is worth stating
# because the number looks alarmingly small next to the comb's 1.20. A spoke
# starts at the ring, so its tip is `radius + base + curve(level) * scale`,
# and the first two are already large here: `radius` breathes to 0.53 under
# bass and `base` reaches 0.20 at index 1. That is ~0.73 of the budget spent
# before the audio term gets any. A spoke pointing 60 degrees above horizontal
# has vertical extent 0.866 * tip, and `zoom` reaches 1.10, so the effective
# half-height is 0.91 and the tip must stay under ~1.05 - which leaves about
# 0.32 to 0.50 for `scale`.
#
# THE SWEEP, and the stimulus that decided it. Under `noise:7` every value from
# 0.25 to 0.85 sits in frame, because white noise spreads energy across all 44
# spokes evenly - that stimulus cannot fail this preset. Under `chord`, which
# drives a FEW bands to 1.0, the three long spokes at 10-11 o'clock exit the
# TOP edge at 0.85, 0.70 AND 0.55; only at 0.45 are their tips clearly inside.
# `dynamic:110` agrees. A broadband stimulus is the wrong instrument for a
# radial layout and that is the transferable lesson here.
#
# The dynamic range survives the cut: against a resting `base` of ~0.15 a
# fully-driven spoke is still about 3x its rest length, and at this value the
# ring reads as rays rather than the studs the header above fought.
scale = "0.45"

# THE LEVEL CURVE now does most of what that `index` tilt was hand-rolling.
# Lengthening the high spokes at rest tilted the figure back toward a circle, but
# it did it with a CONSTANT - so the top of the spectrum looked present while
# barely moving. Measured, at index = 1 the audio term was about 5 % of the
# spoke and the other 95 % was that static bias; the top of the corona was
# decoration, not a readout.
#
# `curve` lifts the same spokes by shaping the LEVEL instead, so they gain
# length when their band is actually loud. The static tilt drops from 0.12 to
# 0.05 - still a little, because the ring wants to read as a ring at rest - and
# `scale` rises 2.4 -> 4.0 to spend the room that frees.
#
# 0.85 -> 0.58, and on this layout the curve is a SHAPE lever as much as a
# reactivity one. A spoke's blockiness is its width against its length, so the
# same stroke reads as a stud when short and as a ray when long. At 0.85 a
# treble mean of 0.006 lengthened a spoke by 0.013 - invisible - so most of the
# ring was permanently at its stubby resting length. At 0.58 the same mean gives
# 0.051, and with `scale` up 4.0 -> 5.2 that is a spoke that actually extends.
# Fixing the reactivity and fixing the upscaled look are the same edit here.
#
# READ THE TWO PARAGRAPHS ABOVE AS HISTORY, not as current values. Every
# `scale` figure in them (2.4, 4.0, 5.2) and both band means (0.006, 0.040) are
# on the PRE-ADR-0049 raw scale, and `scale` is now 0.45 for the reasons given
# beside it. The CURVE reasoning survives the rescale unchanged - it is about
# the ratio between a quiet element and a loud one, which normalization did not
# alter - which is why 0.58 stands while the magnitudes around it did not.
curve = "0.58"

# COLOUR AROUND THE RING. A full `hue_spread` walks the palette once round the
# circle in even steps (the walk is normalized over the element COUNT, so the
# last spoke sits one step short of the first rather than on top of it). With the
# cyclic stops above the wrap is genuinely invisible, which is the whole reason
# to spend the spread on this layout rather than on the comb - and `hue` can then
# rotate the colour independently of the geometry without a seam sweeping past.
hue         = "mod(time * 0.03, 1)"
hue_spread  = "1.0"
saturation  = "1.0"
# The A/B crossfade, driven slowly: ember through ice and back on a ~35 s cycle.
palette_mix = "0.5 + sin(time * 0.18) * 0.5"

# STROKE - nearly halved, and paired with a falloff below 1.0 for the first
# time. `glow` scales the renderer's core-to-edge term, and a value under 1
# tightens the stroke toward its core; the comb already runs 0.75 for exactly
# this reason and a radial spoke is an even shorter stroke than a bar, so its
# soft skirt covers proportionally more of it. Between the thinner stroke, the
# extra elements and this, the spokes have edges again.
thickness  = "2.4 + clamp(treb * 3, 0, 1.8)"
glow       = "0.68"
brightness = "0.78 + clamp(mid * 0.282, 0, 0.24)"

# NO GEOMETRY MIRROR, and it is worth recording why rather than leaving it as an
# omission. The mirror replicates the segment set by rotating it about the frame
# centre - which is exactly where this figure already sits, and it is already
# rotationally symmetric to 32 folds. Every copy would land on top of the
# original. This is the same near-no-op the Hankin star has, for the same reason.
# The screen fold below is a different mechanism and does show.

zoom  = "1.05 + bar * 0.05"
pan_y = "0.0"

bg_hue      = "0.06 + sin(time * 0.009) * 0.05"
bg_bright   = "0.024 + clamp(bass * 0.0165, 0, 0.014)"
bg_vignette = "0.86"

# A long tail: the spokes sweep, so persistence draws the sweep itself as a
# glowing annulus behind them.
trails = "0.52 + clamp(mid * 0.094, 0, 0.08)"

[smoothing]
rotation    = 0.15
radius      = 0.35
thickness   = { attack = 0.02, release = 0.32 }
brightness  = { attack = 0.04, release = 0.28 }
hue         = 0.40
palette_mix = 0.60
zoom        = 0.25
bg_bright   = 0.40
trails      = 0.55
