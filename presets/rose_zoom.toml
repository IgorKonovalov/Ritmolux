# Rose Zoom - the shared view transform as the whole subject: a five-petal rose
# that rides the camera hard. `zoom` multiplies endpoint positions about the
# frame centre, so a kick throws the flower toward the lens and it falls back
# between hits. Layered on top: a per-bar breath, a slow orbital pan, and a
# tempo-gated push-in depth so fast material sits closer to the camera.
#
# This is the preset to read for how the three view params interact. Note the
# sense: on the LINE, swarm and attractor scenes `zoom > 1` moves the camera IN
# (geometry bigger). On `fragment_field` and `reaction_diffusion` it is the
# opposite - a higher zoom shows MORE of the field. Check which family you are
# in before copying a zoom expression between presets.
system = "parametric_curve"
name   = "Rose Zoom"

[curve]
family = "maurer_rose"

# The geometry mirror below costs nothing in resolution because it replicates
# real geometry BEFORE rasterisation, while `kaleido_*` folds finished pixels -
# so on the line scenes, prefer `mirror_*` when both would do. Since Plan 0033
# the feedback and kaleidoscope stages follow the RENDER TARGET rather than a
# fixed 1280x720, so `trails` no longer costs this preset its sharpness.

[params]
# SHAPE
n             = "5"
d             = "97"
samples       = "420"
phase         = "sin(time * 0.02) * 0.24 + clamp(bass * 0.447, 0, 0.38)"
radial_offset = "sin(time * 0.0123) * 0.10 + clamp(mid * 0.212, 0, 0.18)"

# NO SPIN. The camera is this preset's whole subject - it pumps and pushes
# through the figure - and a rotating subject underneath a moving camera reads
# as two unrelated motions competing. With the turn gone the zoom is the only
# thing moving the frame, which is what a zoom preset wants. `pan_x`/`pan_y`
# still drift the viewpoint across the figure, so it is not a static shot.
spin          = "0"
scale         = "0.72 + clamp(bass * 0.282, 0, 0.24)"
draw_progress = "1"

# Caps trimmed as well as gained. At this zoom the mirror is filling the frame
# with replicated chords, so the figure is denser on screen than its segment
# count suggests and luminance headroom is tighter than it looks.
thickness  = "0.95 + clamp(bass * 0.47, 0, 0.40) + beat * 0.155"
brightness = "0.62 + clamp(bass * 0.153, 0, 0.13)"
hue        = "mod(0.72 + time * 0.028 + clamp(treb * 0.467, 0, 0.28), 1)"

mirror_order   = "4"
mirror_reflect = "0"

# THE CAMERA - the subject of the preset, and now pushed MUCH further in. The
# base roughly doubles (1.10/1.45 -> 2.15/2.75) and the kick grows with it, so
# the rose no longer sits whole in frame: the figure runs off every edge and the
# picture becomes a moving detail of it, which is the point of a zoom preset.
# The four-fold mirror is what keeps it legible that close - the replicated
# chords keep filling frame as the original geometry leaves it.
#
# The tempo gate is the one comparison in the library that was ALREADY correct,
# because `tempo` is BPM and 130 is a real BPM - it is the band-magnitude gates
# that were written against `--set` values and never fired. Left exactly as is;
# `standalone/tests/shot_cli.rs` uses this preset as its tempo-gated fixture.
# The bass term beside it is gained to the measured mean like everything else.
zoom  = "select(tempo > 130, 2.75, 2.15) + clamp(bass * 1, 0, 0.85) + bar * 0.18"
pan_x = "sin(time * 0.083) * 0.14"
pan_y = "cos(time * 0.06) * 0.11"

# COMPOSITE - a feedback long enough that the pump leaves a visible tunnel.
bg_hue      = "0.18 + sin(time * 0.013) * 0.05"
bg_bright   = "0.018 + clamp(mid * 0.0153, 0, 0.013)"
bg_vignette = "0.80"

# FEEDBACK - restored at native resolution (Plan 0033).
trails = "0.62 + clamp(bass * 0.118, 0, 0.10)"

[smoothing]
# A punchy pump that still eases - the canonical use of a short constant. This
# 0.31 is load-bearing beyond taste: `shot_cli.rs` times its two tempo captures
# against it, so it stays put while the rest come down.
zoom          = 0.31
phase         = 0.40
radial_offset = 0.45
scale         = 0.34
spin          = 0.42
thickness     = { attack = 0.03, release = 0.50 }
hue           = 0.55
bg_bright     = 0.60
trails       = 0.50
