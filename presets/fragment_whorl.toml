# Whorl — a warped field source echoed into a log-spiral by fb_rotate + fb_zoom
# (cohort 2, Plan 0075). Fresh slate (ADR-0089).
# Each frame the accumulation is shrunk toward centre and turned, so the field's
# sparse bright ribbons become self-similar spiral arms — the fractal is the echo.
# The palette is rich in HUE but sparse in COVERAGE: four saturated ribbons on a
# near-black floor, which is what lets a feedback world keep a wide palette at all.
#
# RESOLVED (what Plan 0046 Phase 5 owed R6): [feedback] blend = "add" vs a rich
# palette. A/B at identical params, 240 warmed frames, loud stimulus: under "add"
# the arms whiten wherever they overlap — channel summation drains hue toward
# pastel even on this sparse source (and on a full-coverage source it flattens the
# whole frame; both captures 2026-08-10). Under "max" every ribbon keeps its own
# hue and the echo striations stay crisp. So: a rich palette wants blend = "max";
# "add" pairs with NARROW palettes that want incandescence (Plan 0046's scratch
# fixture had it right). The explicit binding below records the choice.
# Drives: bass folds the source, mid is spiral speed, onset blooms the crossings.
system = "fragment_field"
name = "Whorl"

[palette]
stops = [
  { at = 0.00, color = "#020208" },
  { at = 0.16, color = "#020208" },
  { at = 0.20, color = "#0e8f86" },  # teal ribbon
  { at = 0.24, color = "#020208" },
  { at = 0.44, color = "#e8a83c" },  # gold ribbon
  { at = 0.48, color = "#030310" },
  { at = 0.68, color = "#c04a6e" },  # rose ribbon
  { at = 0.72, color = "#030310" },
  { at = 0.90, color = "#5a35a0" },  # violet ribbon
  { at = 1.00, color = "#020208" },
]

[feedback]
blend = "max"   # deliberate — see the RESOLVED note above

[params]
warp = "0.9 + noise(time * 0.06) * 0.4 + clamp(bass * 0.71, 0, 0.6)"
zoom = "1.25"
hue = "time * 0.012"
glow = "0.55 + clamp(bass * 0.82, 0, 0.7)"  # ~1.1 at a realistic bass, so bloom always has fuel
flash = "clamp(onset * 0.42, 0, 0.25)"   # a hit flares the arms; bloom rides the same moment
color_span = "1.0"
saturation = "1.1 + clamp(treb * 0.5, 0, 0.3)"   # treble sharpens the ribbon chroma
trails = "0.97"
fb_zoom = "0.62"                             # per-second: the past drains toward centre
fb_rotate = "1.6 + clamp(mid * 1.41, 0, 1.2)"
bloom_amount = "0.35 + clamp(onset * 1.0, 0, 0.6)"
bloom_threshold = "0.8"   # the ribbons' peak channel caps glow x colour near 1.0 — bloom the hot mid-tones
bloom_radius = "1.1"

[smoothing]
fb_rotate = 0.4
glow = 0.3
