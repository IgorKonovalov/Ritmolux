# Dragon - the Heighway dragon curve as a two-metal sigil. The figure is an
# IFS of exactly TWO maps, and that fact is the whole look: `map_tint` splits
# the palette coordinate across the sub-copies, so the curve's two interlocking
# halves render as two solid colour fields - electric violet against cyan -
# meeting along a fractal seam. Nothing else in the library is a solid emblem
# with a fractal boundary; the register is stained-glass, not filigree.
#
# STRUCTURE-REACTIVE BY CONSTRUCTION. `curl` adds radians to both maps'
# rotations, which walks the dragon through its whole family of variants
# (toward Levy-curve froth one way, spiky lightning the other) while staying
# contractive - rotation does not touch the singular values, so there is no
# divergence direction. Probed at +/-0.31 rad: the solid emblem opens into
# moving filigree, and overlap regions double the deposit and climb the ramp,
# so the interior grows glowing veins exactly where the halves collide. The
# music spends its energy here, not on luminance:
#   - a LATCHED POSE re-cuts the curve every four ONSET DETECTIONS (`hash(floor(
#     beat_index * 0.25))` holds constant between cuts), eased through
#     [smoothing] so it reads as a fast re-forging rather than a cut - the
#     same latched structural move Shatter ships on the swarm. NOT a phrase and
#     not a bar: `beat_index` counts detections, not musical beats (ADR-0109),
#     at 1.2x to 2.3x per beat depending on the material and unstable inside one
#     track, so four of them is roughly two to three musical beats - under a bar.
#     The look wants an irregular re-cut and gets one; the arithmetic below is
#     just no longer to be read as musical. Re-tuning is a preset-author
#     followup (Plan 0095);
#   - bass curls the figure open on top of the pose;
#   - `noise(time)` keeps a slow wander underneath so the sigil is alive in
#     silence (the animation gate judges frames 24 v 48 with no audio).
#
# NO ROTATION (standing verdict). `spin` defaults to a full revolution per
# ~35 s on this family, so it is bound down to a slow +/-~14 deg rock - the
# figure has an "up" and inverting it reads as a crooked frame, the same trap
# attractor_dissolve documented on the Sierpinski.
#
# `bias` is INERT on this figure (both maps sit in the branch slots -
# presets/README.md), so density redistribution is not a lever here; vigor
# swells and the re-cut carry the accents instead.
#
# FRAMING: the base zoom sits under 1, and that is the DOCUMENTED RECOURSE
# rather than a probe-driven workaround (ADR-0103). The engine's fit measures
# an axis-aligned box and the projection then rotates it, so the fit's
# guarantee is "inside the frame at zero rotation"; this figure is 1.49x wider
# than tall and overruns the frame corner by 58 % at its worst spin angle.
# On this family zoom < 1 is the camera moving OUT. Do not raise it back to
# 1.0 - the view otherwise stays nearly still, because camera moves are a
# last-resort lever in this library.
system = "attractor"
name = "Dragon"

[particles]
family = "dragon"

# The ramp is a path both halves sample at offset positions (map_tint shifts
# the coordinate +/- tint/2 per half): the low half lands violet, the high
# half cyan, and the overlap veins climb toward white-gold. Loud passages
# slide the window up-ramp (hue_center below), heating violet toward magenta
# and cyan toward gold.
[palette]
stops = [
  { at = 0.00, color = "#0a0220" },
  { at = 0.28, color = "#5a17c9" },
  { at = 0.52, color = "#00b4d8" },
  { at = 0.78, color = "#ff3d9e" },
  { at = 1.00, color = "#ffd166" },
]

[params]
# GLOW - authored under the tonemap knee; bloom picks out the collision veins
# and the seam, which are the only regions that cross it.
bloom_amount    = "1.3"
bloom_threshold = "0.9"
bloom_radius    = "1.3"

# THE INSTRUMENT - see the header. Pose (latched, per four detections) + bass push
# + a silent wander. All three are small: the dragon changes character fast
# per radian.
# The wander rates are ~0.2, not the ~0.03 the strange-attractor presets use,
# and that is the dissolve preset's measured lesson re-learned here: an IFS
# figure is STILL, so every visible motion is a lever moving, and at the
# inherited rates this preset read 0.0079 against the 0.01 animation floor
# (frames 24 v 48 in silence).
# The silent swing is a full +/-0.28 - the emblem slowly walks its own family
# of variants even with no music. That amplitude is measured against the gate:
# attractor_dissolve cleared the silence floor at 0.016 with +/-0.30 swings,
# and every half-amplitude draft of this file sat under it.
curl  = "sin(time * 0.23) * 0.28 + (hash(floor(beat_index * 0.25)) - 0.5) * 0.36 + clamp(bass * 0.24, 0, 0.20)"
# Sway - rotates the translations, so the halves shear against each other and
# the seam pattern shifts. Decorrelated from curl's noise by the +50 offset.
lean  = "sin(time * 0.19) * 0.20 + clamp(treb * 0.14, 0, 0.10)"
# Contraction multiplier - and on THIS figure the sign is inverted from
# intuition, measured on the loud frame: the dragon is already space-filling
# (two maps at exactly 0.7071), so vigor ABOVE 1 overfills the region and the
# crisp sigil dissolves into a shapeless dust cloud. Loud thins it toward
# lace instead; the beat alone gets a momentary swell.
# The small wander keeps the emblem breathing in silence; its ceiling stays
# well under the +0.11 that measured as dust.
vigor = "1.0 + (noise(time * 0.21 + 150) - 0.5) * 0.06 - clamp(bass * 0.047, 0, 0.040) + beat * 0.030"

# THE TWO-TONE - the split is the identity, so it rests wide and only widens
# a touch on a transient. hue_spread stays narrow: a wide per-particle spread
# smears the halves into each other until the split reads as a wash
# (measured on the fern, presets/README.md).
map_tint   = "0.48 + clamp(onset * 0.23, 0, 0.14)"
hue_spread = "0.08 + clamp(treb * 0.067, 0, 0.04)"
# The window nudges up-ramp with the mix. Probed at a 0.24 travel first: both
# halves land in salmon/olive and the duotone identity is gone - the split
# only reads when the window stays near its rest. Loud heat comes from
# saturation and the collision veins instead.
hue_center = "0.44 + clamp(bass * 0.10, 0, 0.085)"
saturation = "1.30 + clamp(mid * 0.24, 0, 0.20)"
# Depth banding outward from the maps' fixed points - a faint hue drift that
# keeps the solid fields from reading flat. The hue route, not root_tint:
# the coordinate is already spent on map_tint (the fern's budget rule).
root_hue   = "0.06 + clamp(mid * 0.094, 0, 0.080)"

# DENSITY - peak buys structure. The emblem is a solid region, so fade is the
# smoothing against chaos-game shot noise (about 1/(1-fade) frames deep) and
# falls under bass so a drop sharpens the boundary instead of blooming it.
# 0.875, down from a first-draft 0.90: the accumulation low-passes every
# lever, so at ~10 frames of history the silence gate saw blur instead of
# motion. ~8 frames keeps the fields solid and lets the breathing register.
fade   = "0.875 - clamp(bass * 0.053, 0, 0.045) - beat * 0.020"
size   = "0.42 - clamp((bass + treb) * 0.076, 0, 0.110) + beat * 0.060"
reseed = "onset > 0.40"

# VIEW - framed out (see header), breathing gently; a slow rock, no rotation.
spin  = "sin(time * 0.24) * 0.26"
zoom  = "0.92 + bar * 0.04 + clamp(bass * 0.094, 0, 0.080)"
pan_x = "0.0"
pan_y = "0.0"

# COMPOSITE - near-black violet vault, vignetted; the emblem is the light.
bg_hue      = "0.75 + sin(time * 0.015) * 0.04"
bg_bright   = "0.008 + clamp(mid * 0.021, 0, 0.018)"
bg_vignette = "0.85"

[smoothing]
# The pose latch eases over ~a third of a second - a re-forging, not a cut.
curl       = 0.30
lean       = 0.45
vigor      = { attack = 0.03, release = 0.30 }
map_tint   = 0.30
hue_center = 0.40
hue_spread = 0.45
root_hue   = 0.50
fade       = 0.20
size       = { attack = 0.02, release = 0.26 }
zoom       = 0.16
bg_bright  = 0.40
