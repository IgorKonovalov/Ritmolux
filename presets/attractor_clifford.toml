# Clifford - the broad ribbony sibling of De Jong, rebuilt as a light-painting.
# Where Leviathan folds the same map into a pinned six-fold symmetry, this
# one runs the ENGINE-WIDE FEEDBACK TRAILS stage: the composited frame is fed back with a
# decay, so the slowly-turning ribbons smear into long luminous strokes and the
# whole frame reads as a long exposure rather than a point cloud.
#
# Same inversion rule as the rest of the family - PEAK BUYS STRUCTURE. `fade`
# and `size` fall as the track hits, and it is `trails` that rises instead, so a
# drop stretches the exposure rather than blowing the accumulation to white.
#
# THAT LAST CLAUSE WAS NOT TRUE, AND THE FIX IS THE 2026-08-03 PASS. The
# densities below were authored so the accumulation sat AT the tonemap knee, not
# under it, which meant every bit of the attractor's density structure
# compressed into one output tone: a flat salmon disc with the filigree gone.
# At the `rich` tier it is three times worse, because 3x the particles deposit
# into the same texels and nothing normalizes for count. `fade` 0.885 -> 0.50,
# `size` 0.62 -> 0.28 and `trails` 0.62 -> 0.20 put the bulk of the figure back
# UNDER 1.0, so only the densest filaments cross it - and `bloom_threshold`
# 0.9 picks out exactly those. Do not raise these back without re-rendering at
# BOTH tiers: `shot` is floor-only, so multiply `exposure` by 3 to see `rich`.
#
# Shape: the Clifford coefficients drift on four slow incommensurate sines with
# a small clamped SPECTRUM term - a chaotic map cuts rather than morphs if you
# shove it, so every term here is deliberately tiny. As on De Jong, each
# coefficient adds its own narrow log-spectrum probe through `bin()` on top of a
# reduced band term, so the four axes de-correlate instead of two of them
# sharing `bass`:
#   a ~ 122 Hz    d ~ 453 Hz    b ~ 1.2 kHz    c ~ 5.2 kHz
# The two low positions moved in Plan 0048: ADR-0049's long window made the axis
# genuinely logarithmic below the ~246 Hz crossover, so `a` (0.06) and `d` (0.28)
# would have dropped to 51 Hz and 201 Hz and are now 0.20 and 0.41. `b` and `c`
# are above the crossover and did not move. See attractor_dejong.toml.
# See attractor_dejong.toml for why the band term stays underneath rather than
# being replaced outright.
#
# Colour: a crimson -> ember -> white-hot custom gradient crossfading toward the
# built-in `mono` on sustained mids, so busy sections desaturate into smoke.
# The hue centre rides the CONTRAST between two narrow probes - `bin(0.84)`
# (~6.6 kHz air) minus `bin(0.31)` (~242 Hz low-mid). That is a TIMBRE signal, not a
# loudness one: it goes positive when the mix is bright and negative when it is
# dark, and it stays put through a crescendo that raises both ends together. It
# is signed, so the clamp is signed too. `bin()` is a NARROW probe (~2 of the 64
# bands), not a region average - fragment_aurora.toml carries the measurement
# and the rule that follows from it.
system = "attractor"
name = "Clifford"

[particles]
family = "clifford"

[palette]
stops = [
  { at = 0.00, color = "#12000a" },
  { at = 0.30, color = "#7a0b2e" },
  { at = 0.60, color = "#e03a12" },
  { at = 0.85, color = "#ffab33" },
  { at = 1.00, color = "#fff4d6" },
]

[palette_b]
name = "mono"

[params]
# GLOW - the figure is authored to sit UNDER the tonemap knee, so only the
# densest filaments cross 1.0 and bloom picks out exactly those. Authoring
# at the ceiling instead is what made this preset a flat mass at `rich`,
# where 3x the particles deposit into the same texels (design-backlog 0047).
bloom_amount    = "1.5"
bloom_threshold = "0.9"
bloom_radius    = "1.4"
# SHAPE - canonical Clifford (-1.4, 1.6, 1.0, 0.7) plus small slow drift, each
# coefficient bent by its own frequency region rather than by a shared band.
a = "-1.40 + sin(time * 0.0331) * 0.085 - clamp(bass * 0.051 + bin(0.20) * 0.089, 0, 0.070)"
b = "1.60 + cos(time * 0.0257) * 0.080 + clamp(mid * 0.043 + bin(0.56) * 0.078, 0, 0.060)"
c = "1.00 + sin(time * 0.0194) * 0.095 + clamp(treb * 0.044 + bin(0.80) * 0.079, 0, 0.050)"
d = "0.70 + cos(time * 0.0151) * 0.090 - clamp(bass * 0.0327 + bin(0.41) * 0.057, 0, 0.045)"

# DENSITY - moderate base, falling at peak. The exposure comes from `trails`
# below, not from letting the accumulation grid saturate.
#
# RE-RAISED HALFWAY, 2026-08-03 (Plan 0057 Phase 6), NOT reverted. These read
# 0.885 / 0.62 / trails 0.62 until `00d99d0` cut them to 0.50 / 0.28 / 0.20 so
# the preset would survive the `rich` tier, where 3x the particles deposited 3x
# the light into the same texels. ADR-0065 (Phase 2) normalized the deposit by
# particle count, so that 3x is gone and the compensation is owed back.
#
# A FULL REVERT IS WRONG AND THIS WAS RENDERED, NOT REASONED. The same commit
# also added the bloom stage above, sized to the LOWERED figure. Restoring the
# old numbers puts the figure back over the tonemap knee with that bloom now
# stacked on it: the bracket at 0.885 / 0.62 / 0.62 renders the dense interior
# as a flat salmon mass with the filigree gone - the exact failure `00d99d0`
# fixed, arriving by a different route. Halfway keeps the filaments separated
# and still reads as present. Verified at BOTH tiers: floor and rich are the
# same brightness here, rich only smoother, which is what ADR-0065 buys.
fade   = "0.68 - clamp(bass * 0.0706, 0, 0.060) - beat * 0.020"
size   = "0.44 - clamp((bass + treb) * 0.090, 0, 0.13) + beat * 0.075"
# RESEED IS A MEASURED THRESHOLD, RE-DERIVED FOR A DISTURBANCE. This read 0.55
# and therefore never fired once: `onset` WAS raw spectral flux, not a
# normalized envelope, and it peaked at 0.016 on music-like material (mean
# 0.002) - so every attractor in this family shipped with its reseed
# permanently off. Note the checker cannot catch this shape: a bare comparison
# is not a `select` condition, so `--report` reachability is blind to it.
# ADR-0049 then made `onset` the normalized 0..1 envelope the original 0.55
# assumed, and this was set to 0.75 - the most reluctant in the family.
#
# 0.75 WAS CALIBRATED AGAINST A WIPE. Until Plan 0057 Phase 3 a reseed REPLACED
# the cloud with a uniform box, so a high gate was protective: firing often
# meant erasing the drawing often. ADR-0066 made it a bounded in-place jitter,
# so the event is no longer destructive and rarity buys nothing - it just means
# the accent is absent. Reported live: "half the kicks are not accenting".
# MEASURED onset means: 0.033 (click:120), 0.153 (dynamic:110), 0.391 (chord),
# ~0.20 real music, against a 1.000 peak on all three. 0.45 still sits well
# above the typical level - so a quiet passage keeps one continuous drawing,
# which is what the gate was always for - while every real transient crosses it.
# Rank preserved: still the most reluctant of the six.
reseed = "onset > 0.45"

# COLOUR - a hot but narrow window; treble slides the centre toward white-hot.
hue_spread  = "0.16 + clamp(treb * 0.367, 0, 0.22)"
hue_center  = "0.42 + sin(time * 0.037) * 0.10 + clamp(bass * 0.33, 0, 0.28) + clamp((bin(0.84) - bin(0.31)) * 0.8, -0.12, 0.12)"
saturation  = "1.35 + clamp(bass * 0.353, 0, 0.30)"
palette_mix = "clamp(mid * 0.47, 0, 0.40)"

# VIEW - a slow counter-rotating drift so the smear never runs in one direction.
zoom  = "1.10 + bar * 0.12 + clamp(bass * 0.235, 0, 0.20)"
pan_x = "cos(time * 0.043) * 0.09"
pan_y = "sin(time * 0.061) * 0.07"

# COMPOSITE - the long exposure, over a near-black vignetted backdrop. `trails`
# is the one thing here that RISES with energy: loud stretches the stroke. The
# backdrop came down with the figure: at `bg_bright` 0.07 the dark half of the
# frame was a visible warm haze competing with the filaments.
trails      = "0.40 + clamp((bass + mid) * 0.135, 0, 0.23)"
bg_hue      = "0.02 + sin(time * 0.013) * 0.04"
bg_bright   = "0.010 + clamp(mid * 0.0294, 0, 0.025)"
bg_vignette = "0.85"

[smoothing]
a           = 0.7
b           = 0.7
c           = 0.7
d           = 0.7
fade        = 0.20
size        = { attack = 0.02, release = 0.26 }
trails      = 0.45
zoom        = 0.16
hue_center  = 0.40
palette_mix = 0.6
bg_bright   = 0.4
