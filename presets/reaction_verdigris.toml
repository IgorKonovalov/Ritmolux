# Verdigris — crawling Gray-Scott worms under an eight-fold screen fold
# (cohort 3, Plan 0075). Fresh slate (ADR-0089): the fold mechanism Gilt carried
# is re-earned here on a regime no coral occupied — F 0.0540 / K 0.0635, the worm
# band, where filaments crawl and never settle. Folded eight ways the worms read
# as an aging bronze rosette growing patina from its centre. The fold does not
# turn (user verdict 2026-08-10 on cohort 2: rotation reads as noise) — all the
# motion is the simulation's own crawl.
# Drives: bass feeds the worms, mid tilts the regime, treble races the sim,
# a strong onset stamps a new growth into the fold.
system = "reaction_diffusion"
name = "Verdigris"

[palette]
stops = [
  { at = 0.00, color = "#4b3b26" },  # near-black copper ground
  { at = 0.30, color = "#ad834f" },  # burnished copper
  { at = 0.55, color = "#e5be71" },  # bright bronze
  { at = 0.80, color = "#4fddc6" },  # vivid verdigris teal
  { at = 1.00, color = "#f6fff8" },  # pale mint highlight
]

[params]
feed = "0.0505 + noise(time * 0.12) * 0.0025 + clamp(bass * 1.18, 0, 1) * 0.0018"   # sparse-worm edge: strips with real void between them
kill = "0.0635 + noise(time * 0.09 + 80) * 0.0008 + clamp(mid * 1.18, 0, 1) * 0.0006"
flow = "2.6 + max(0, 1.0 - time * 0.2) + clamp(treb * 1.0, 0, 0.6)"   # a hot start, then a fast crawl — the worms keep reorganizing
inject = "max(beat * (bar < 0.25), noise(time * 1.4 + 9) > 0.62)"   # every beat bites a growth into the fold; a sparser clock keeps the patina alive in silence
glow = "0.95 + clamp(bass * 0.41, 0, 0.35)"
contour = "5 + clamp(bass * 3.5, 0, 3)"   # the kick packs the strip work denser — from a hollow base
hatch = "3"
kaleido_order = "8"
kaleido_angle = "0"
zoom = "1.0 + noise(time * 0.25) * 0.06"   # passive breathe only — zoom is not a reactive lever here (user verdict 2026-08-11)
color_span = "2.2"
color_center = "0.05"
saturation = "1.15 + clamp(bass * 0.41, 0, 0.35)"   # colour heats with the bass
trails = "0.45"                    # lighter aura — the voids stay dark
fb_zoom = "1.06"                   # the patina's aura creeps outward — no rotation, just growth
bg_hue = "0.09"                     # dim bronze under the voids — the rosette reads against it
bg_bright = "0.08 + noise(time * 1.0) * 0.025 + clamp(bass * 0.14, 0, 0.12) + beat * 0.02"   # halved vs the accumulation; the ground answers the kick too
bg_vignette = "0.55"

[feedback]
blend = "add"   # dim monochrome aura — the narrow case the Whorl A/B cleared for add

[smoothing]
flow = 0.3
glow = 0.25
contour = { attack = 0.03, release = 0.4 }   # snap dense on the kick, relax back
saturation = { attack = 0.05, release = 0.5 }
bg_bright = { attack = 0.02, release = 0.3 }
