# Thomas - the cyclically-symmetric 3D flow, drawn as a PEN DRAWING and still
# the set's COLOURED DUOTONE. `attractor_ink` uses the final tone remap for
# black-on-white line art; this one uses the same stage (ADR-0028) with both
# poles moved off neutral - deep indigo ink on a pale sea-green page - which is
# a visual register nothing else in the library occupies.
#
# Two consequences of the remap worth knowing before tuning this file:
#   - it keys on LUMINANCE only, so the [palette] below does not set the colour
#     you see; it sets which parts of the frame are bright, and therefore which
#     parts become ink. Saturation is held low so that ramp stays honest.
#   - `ink_amount` rests at a pole, never between. A partial amount blends
#     toward the near-black source and greys the page. An earlier draft here
#     dipped the amount on a hard onset to "punch through" to the glowing
#     source; at onset 0.8 that landed on 0.25 and turned the page a dirty
#     grey - the exact trap this comment warns about. It rests at 1.
#
# RE-AUTHORED AT PLAN 0059 PHASE 4, AND THE PREVIOUS BALANCE IS GONE FOR TWO
# MEASURED REASONS. Phase 3 gave the two continuous families a SEGMENT instead
# of a point, which raised this preset's mean frame luminance 1.98x; Phase 1b
# stopped the trail mirroring itself, so the figure it draws is one copy rather
# than two. Against a luminance-keyed remap that combination is not a small
# shift - the old densities put nearly the whole figure over the ink pole and
# the drawing rendered as a solid indigo blot with the lattice inside it lost.
#
# THE ANSWER IS `density`, NOT A DIMMER (ADR-0069). At the full 50 000
# particles the lattice is a fog whatever the exposure - the ink remap just
# turns a bright fog into a dark one. At 0.02 - 1 000 particles at the floor
# tier, 3 000 at rich - each trajectory is a separate stroke, the segment joins
# its steps end to end, and ~25 frames of trail draw the loops as pen lines on
# the page. RENDERED, not reasoned: 1.0 / 0.02 / 0.005 / 0.002 goes blot,
# drawing, sketch, scribble.
#
# The blot trap still governs everything: `fade` sets how many frames pile up
# (~1/(1-fade)), and on a sparse trace those frames are the LINE rather than
# the density - so it runs long here and falls under bass.
system = "attractor"
name = "Thomas"

[particles]
family = "thomas"
# The structural half of the drawing - see the header. Not an exposure control:
# the deposit is normalized by count (ADR-0065), so total light is invariant
# and only its distribution changes. That is also why `exposure` below is set
# where it is - the same light on 1/50th of the pixels.
density = 0.02

[palette]
name = "mono"

[params]
# EXPOSURE - the level the ink ramp reads. `density = 0.02` multiplies each
# particle's deposit by 50 and the long `fade` accumulates ~25 frames of it, so
# left at 1.0 every stroke is far over the tonemap knee, the whole luminance
# ramp flattens to one value, and the remap paints a flat blot. 0.10 is where
# the loops separate into lines with the page still white between them.
# MEASURED on the ladder 1.0 / 0.2 / 0.05: blot, dark drawing, faint wash.
# `exposure` is engine-wide and crossfades across a preset dissolve, so the
# blend into this preset passes through a briefly darker page - a transition,
# not a resting state.
exposure = "0.10"
# SHAPE - Thomas uses `a` alone (canonical 0.19). Small numbers matter here: the
# lattice opens out below ~0.17 and knots up above ~0.21.
# THE TREBLE BINDING MOVED HERE, and the reason is worth keeping. This preset
# read treb 0.000 while visibly binding `clamp(treb * 0.6, 0, 0.15)` on
# `saturation` - because `ink_amount = "1"` collapses the frame to two tones,
# so saturation is exactly the one parameter an ink preset cannot show. `a` is
# the Thomas attractor's own constant: the top end now bends the trajectory.
a = "0.190 + sin(time * 0.0233) * 0.014 - clamp(bass * 0.0235, 0, 0.020) + clamp(treb * 0.0267, 0, 0.016)"

# LINE LENGTH AND NIB. On a sparse trace `fade` is how much of each trajectory
# is drawn, so it runs far longer than it did on the cloud - where the same
# value would have been a blot, here it is the stroke. Bass shortens the line
# and thins the nib: peak buys structure, not ink.
fade   = "0.955 - clamp(bass * 0.035, 0, 0.030) - beat * 0.010"
size   = "0.60 - clamp((bass + mid) * 0.070, 0, 0.120) + clamp(treb * 0.117, 0, 0.070) + beat * 0.060"
# MEASURED. Read 0.50 and never fired - `onset` was then raw spectral flux peaking at
# 0.016, not a 0..1 envelope. Rank preserved within the family.
#
# THE FLOOR UNDER IT IS NEW (Plan 0048, ADR-0050 Layer 1). An onset gate is the
# right trigger on percussive material and no trigger at all on the sparse,
# transient-free material this is the slowest attractor for - normalization
# raises a quiet mix's onset but cannot invent a transient that is not there, so
# the cloud could hold one pose indefinitely. The second term guarantees a
# re-scatter every 24 beats whatever the material does; `max` is or, so the
# onset trigger is untouched on anything that hits.
#
# IT IS GATED ON `beat`, AND THAT IS NOT DECORATION. `mod(beat_index, 24) == 0`
# alone is true for the WHOLE of every 24th beat - a full beat of continuous
# re-scattering, which wipes the accumulation rather than nudging it - and
# worse, `beat_index` is 0 before the tracker has seen a beat at all, so on
# quiet material it would hold the reseed on from startup and the cloud would
# never accumulate. `beat` is 1 only on the hop a beat fires, so the pair is a
# single-frame pulse.
# The onset half re-derived for a disturbance: 0.69 was calibrated while a
# reseed REPLACED the cloud, so reluctance protected the accumulation. ADR-0066
# (Plan 0057 Phase 3) made it a bounded in-place jitter. Onset means measured
# 0.033 (click:120) / 0.153 (dynamic:110) / 0.391 (chord), ~0.20 real music,
# all against a 1.000 peak. The every-24th-beat pulse is unchanged.
reseed = "max(onset > 0.40, min(beat, mod(beat_index, 24) == 0))"

# COLOUR - near-neutral by design; the remap discards hue and a desaturated
# source keeps the luminance ramp (and so the ink density) even.
saturation = "0.30 + clamp(treb * 0.25, 0, 0.15)"
hue_spread = "0.08"
hue_center = "0.50"

# VIEW - a slow turn so the lattice reads in depth; the page stays still.
# THE BASE DROPPED 0.18 TO PAY FOR `perspective` BELOW, and the reactive travel
# is halved with it, because the two used to compound: `zoom` and `perspective`
# both rise on bass and both enlarge the figure.
#
# What actually forces the cut is not the enlargement - see the depth block for
# the measurement - it is that perspective makes the figure's screen centroid
# ORBIT as it turns, so the frame must hold it at every phase rather than at its
# widest pose. Rendered at the old 1.14 with perspective 0.55, the near loop ran
# off the top-right and the left edge at once. MEASURED at the loud frame over
# five phases at 800 px square, the lit span now runs 508..657 px of 800 - the
# spread between phases is the orbit, and the knot is inside the frame at all of
# them. As on the butterfly, the faintest strokes still reach the edge at the
# synthetic maximum; the base is fitted to frame the drawing, not its lightest
# hairline.
zoom  = "1.02 + bar * 0.06 + clamp(bass * 0.118, 0, 0.10)"
pan_x = "sin(time * 0.027) * 0.05"
pan_y = "cos(time * 0.021) * 0.04"

# DEPTH (Plan 0063 / ADR-0076) - the lattice becomes a knot you can read.
#
# `perspective` gives the loops a near and a far side, which is what a
# cyclically-symmetric flow most needs: every strand of this figure crosses
# every other one, and until now nothing said which crossing was in front.
# Held to 0.18..0.24 - a shade under the butterfly's - for the framing reason
# above, not because the cue is weaker here. The bound on both is the centroid
# orbit rather than the 0.80 clamp: the swing runs about 0.9 x perspective in
# NDC while the figure's own size grows only ~6% across the whole legal range,
# so past ~0.3 a figure slides around the frame instead of turning in place.
# Thomas is the tighter of the two because its knot already fills more of the
# frame than the butterfly's silhouette does.
perspective = "0.18 + clamp(bass * 0.071, 0, 0.06)"
# THE HAZE IS THE ONE THAT PAYS OFF UNUSUALLY WELL ON THIS PRESET, and it is
# worth saying why. The ink remap keys on LUMINANCE, so a far stroke that the
# haze holds down does not merely dim - it falls further up the ink ramp and is
# drawn in LIGHTER ink. That is aerial perspective as a pen-and-ink draughtsman
# would do it: near strokes dark and firm, far ones faint. Nothing else in this
# file turns a scene parameter into a drawing technique.
depth_fade  = "0.50 + clamp(mid * 0.235, 0, 0.20)"
#
# `depth_hue` IS DELIBERATELY UNBOUND, AND IT IS THE SAME TRAP `saturation` FELL
# INTO ON THIS FILE (see the `a` binding's comment). `ink_amount = "1"` collapses
# the frame to two tones and the remap discards hue outright, so a depth TINT is
# exactly the cue an ink preset cannot show. It is not quite inert - this palette
# is `mono`, so shifting the coordinate moves lightness and the remap does see
# that - but MEASURED at depth_hue = 0.4 it moves 42% of pixels by a mean of
# 2/255 and a max of 42, which is a rounding error against what `depth_fade`
# above does deliberately. Binding it would be a knob that looks live in the
# roster and does nothing you can see. Left off; the finding is in the backlog.
#
# SPIN IS BOUNDED BY THE TRAIL and this preset has the longest one in the family.
# `fade = 0.955` holds ~22 frames, so the figure smears into concentric arcs at a
# LOWER rate than the butterfly does - the ceiling here is about 1.3 against its
# 1.9. The push is correspondingly small; this is the slow attractor and it
# should read as turning, not as being spun.
spin        = "1.00 + clamp(bass * 0.35, 0, 0.30)"

# THE DUOTONE - pale sea-green page, deep indigo ink. `ink_amount` rests at the
# pole and never travels: a partial amount greys the page (see the header).
ink_amount   = "1"
paper_hue    = "0.44"
paper_sat    = "0.10"
paper_bright = "0.99"
ink_hue      = "0.66"
ink_sat      = "0.92"
ink_bright   = "0.13"

[smoothing]
# Was 1.0 - the slowest shape ease in the family, and this preset's transient
# pair (rise 19+ / fall 38+) was the slowest fall in the whole library. Same
# re-derivation as attractor_ink: a ~100 ms hit moves a 1.0 s ease by about
# 10% of its step, so the coefficient term never arrived. 0.55 keeps the
# cyclic drift smooth without swallowing the transient.
a          = 0.55
fade       = 0.22
size       = { attack = 0.03, release = 0.30 }
zoom       = 0.18
saturation = 0.30
# Slower than the butterfly's on both counts. The ink ramp turns a small
# luminance change into a visible change of ink density, so an unsmoothed
# `depth_fade` reads as the far half of the drawing flickering between two
# weights - the same reason `a` here eases slower than the rest of the family.
perspective = 0.9
depth_fade  = 1.4
spin        = 1.0
