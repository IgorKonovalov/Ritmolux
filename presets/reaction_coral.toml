# Coral - a Gray-Scott reaction-diffusion field in the MITOSIS regime: spots
# that perpetually divide. The engine's stateful feedback scene, so the pattern
# genuinely grows and reorganises frame to frame rather than being redrawn.
#
# THE REACTIVITY PROBLEM this version solves. `feed` and `kill` are the physical
# levers, but the field takes SECONDS to propagate a change to them - measured
# band response across the old coral set was 0.02-0.06, near the bottom of the
# whole library, and it felt static against a beat even though the chemistry was
# being driven correctly. The fix is not to shove feed/kill harder (that just
# kills the pattern); it is to layer levers that respond INSTANTLY on top:
#   - `contour` / `hatch` - the iso-line rendering, immediate
#   - `zoom` / `pan_*`    - the view transform, immediate
#   - `glow` / colour     - immediate
#   - `kaleido_*`         - immediate
# The chemistry now carries the slow evolution and everything else carries the
# beat. Note `zoom` is INVERTED on this scene: higher shows MORE of the field.
#
# Regime separation is also deliberate. The four RD presets used to sit close
# enough in feed/kill space that the report flagged three of them as
# near-duplicates; each now owns a distinct, named regime.
#
# ONE OF FOUR REGIMES. The RD family used to be four presets sampling the same
# corner of Gray-Scott space, so they all converged on the same maze once
# developed. They are now spread deliberately:
#
#   Coral       F 0.0220 / k 0.0570  sparse spots on an open substrate
#   Coral Bloom F 0.0260 / k 0.0510  chaotic waves - never settles at all
#   Coral Head  F 0.0340 / k 0.0575  worms - open branching strands
#   Reef        F 0.0290 / k 0.0560  maze, folded into an explicit figure
#
# THE SPREAD IS ALONG `feed`, NOT `kill`, and that is measured rather than
# chosen. Textbook Gray-Scott zoo coordinates (the mitosis pair at 0.0367 /
# 0.0649, worms up at 0.0580) do NOT transfer to this engine - its diffusion
# rates and timestep are its own, and at those values the field decays to
# uniform. A dead field is not visibly "a different regime": `contour` has no
# iso-lines left to draw, so the preset renders as a flat wash and measures at
# `anim 0.000`. That is exactly what the first attempt at this spread produced.
#
# What is known to work here is the band the original four occupied - k roughly
# 0.050 to 0.058 - so the four are spread across `feed` from 0.018 to 0.034
# inside it, with `kill` moved only as far as it must to track. Verify any
# change to these with `--report`: `anim` near zero on an RD preset means the
# chemistry died, and it is not visible in a single still.
system = "reaction_diffusion"
name = "Coral"

[palette]
stops = [
  { at = 0.00, color = "#02141a" },
  { at = 0.50, color = "#0e7d7a" },
  { at = 0.82, color = "#3fd6c4" },
  { at = 1.00, color = "#d8fff4" },
]

[palette_b]
stops = [
  { at = 0.00, color = "#120024" },
  { at = 0.48, color = "#5c1e8a" },
  { at = 0.80, color = "#d054c8" },
  { at = 1.00, color = "#ffe6ff" },
]

[params]
# CHEMISTRY - mitosis, with a slow time sweep on `feed`/`kill` so the field
# never settles (a fixed Gray-Scott point genuinely stops moving once it
# converges, which is what made this preset fail the animation gate at 0.0001).
#
# THE GRID, and what Plan 0033 changed about it: the simulation is still a fixed
# 256x256, but the present pass now reconstructs it with Catmull-Rom instead of a
# bilinear tap, so an 8x upscale no longer facets into angular blocks. The old
# workaround - holding `flow` low so bigger, rounder features hid the stepping -
# is retired, and `flow` sits at its 1.00 default.
# THE REGIME, and this is the edit that makes Coral stop looking like Reef and
# Coral Head. All four presets sat within 0.012 of each other in `feed` and
# 0.006 in `kill` - four samples of one neighbourhood of Gray-Scott parameter
# space - so however differently they started, they converged on the same dense
# maze texture once developed. The four are now spread across genuinely
# different regimes, and this one takes MITOSIS proper: F 0.0367 / k 0.0649.
#
# That regime is the answer to "more empty space" as well as to sameness. Spots
# in mitosis are ISOLATED - they grow, split in two, and drift apart across an
# empty substrate, rather than joining into the connected labyrinth the old
# 0.0320 / 0.0565 settles into. The negative space is a property of the
# chemistry, which is why it holds up over minutes instead of being a framing
# trick that the field grows out of.
feed   = "0.0220 + sin(time * 0.041) * 0.0014 + clamp(bass * 9.0, 0, 1) * 0.0020"

# `kill` TAKES THE BEAT, and this is the "more dynamics" half. Gray-Scott has an
# attractor: left at fixed parameters it develops for twenty seconds and then
# essentially stops, which is exactly the "very similar after fully developed"
# complaint. Nudging `kill` on the beat keeps knocking the field off that
# attractor, so spots divide and dissolve continuously instead of settling.
#
# THE SWING MUST BE SMALL AND CENTRED, and getting that wrong killed this
# preset outright on the first attempt. Gray-Scott only produces patterns inside
# a narrow band of (F, k); step outside it and the field does not get livelier,
# it decays to uniform and stops. The first version summed three POSITIVE terms
# onto an already-high base and drifted k up out of the band, which measured as
# `anim 0.000` - a completely frozen field.
#
# Two rules came out of that, and they apply to all four RD presets:
#   - centre the modulation. `cos` and `sin(bar * pi) - 0.5` swing both ways
#     about the base rather than only upward.
#   - keep the TOTAL excursion under about 0.0020. That is already a large move
#     in these units; the band is roughly that wide.
# k SETS THE SPARSITY at a given feed - higher kill starves the reaction, so the
# spots stay separate instead of merging into a labyrinth. 0.0500 was alive but
# measured `cover 0.949`, a full-frame maze with no negative space at all, which
# missed the point of the regime even though the chemistry was healthy. Raising
# k with a modest feed is what actually opens the substrate.
kill   = "0.0570 + cos(time * 0.029) * 0.0006 + (sin(bar * pi) - 0.5) * 0.0010 + clamp(mid * 12.0, 0, 1) * 0.0007"
flow   = "1.00 + clamp(treb * 18.0, 0, 1) * 0.35"
inject = "beat"

# THE FAST LEVERS - this is where the beat actually reads.
# CONTOUR AND HATCH come down hard, and that is negative space too. These draw
# the iso-lines through the field: at contour 5.0 with hatch 4.5, even a sparse
# chemistry gets covered in banding - so the empty substrate between the spots
# was being filled back in by the RENDERING after the regime had gone to the
# trouble of clearing it. Fewer, cleaner lines let the mitosis actually read.
# AND THE SINE HAS TO STAY BIG. Trimming these for negative space cost this
# preset all of its measured animation, which is the trap the header warns
# about: `feed`/`kill` take seconds to propagate, so `contour` and `hatch` are
# where the frame-to-frame motion actually comes from. The BASE comes down (that
# is what opens the gaps between the spots) but the swing around it does not -
# 1.8 on a base of 3.0 is a larger proportional breath than the 2.2 on 5.0 it
# replaces.
contour = "3.0 + sin(time * 0.55) * 1.8 + clamp(treb * 60.0, 0, 3.0) + beat * 1.2"
hatch   = "2.6 + sin(time * 0.31) * 0.8 + clamp(mid * 40.0, 0, 1.6)"
glow    = "0.62 + clamp((bass + mid) * 6.0, 0, 0.55)"

# VIEW - UNPINNED (Plan 0033), and this is the lever the family used to lack.
# The Gray-Scott field is finite but TOROIDAL, and the present sampler now
# WRAPS, so `pan_*` is a seamless infinite scroll rather than a walk off the
# edge. `zoom` is usable in both directions too: below 1.0 magnifies (the
# Catmull-Rom reconstruction landed in the same plan, so it no longer reads as
# angular pixel blobs), above 1.0 tiles. Keep zoom under ~1.3 - past that the
# repeat becomes legible as wallpaper rather than as more field.
#
# PULLED BELOW 1. Zoom is inverted on this scene - a higher value shows MORE of
# the field - so going under 1 makes the cells larger and fewer in frame, which
# is the framing half of the negative-space work. The chemistry supplies the
# gaps; this decides how big they read.
zoom  = "0.78 + sin(time * 0.021) * 0.08 + clamp(bass * 3.5, 0, 0.16)"
pan_x = "time * 0.016 + sin(time * 0.013) * 0.06"
pan_y = "cos(time * 0.0091) * 0.05"

# COLOUR - teal body, crossfading toward a violet variant over minutes.
color_span   = "0.90 + clamp(mid * 20.0, 0, 0.20)"
color_center = "sin(time * 0.47) * 0.11"
saturation   = "0.95 + clamp(treb * 40.0, 0, 0.50)"
palette_mix  = "0.35 + sin(time * 0.0077) * 0.32"

# COMPOSITE - the backdrop shows through the field's voids (Plan 0025).
bg_hue      = "0.36 + sin(time * 0.0110) * 0.05"
bg_bright   = "0.022 + clamp(mid * 2.5, 0, 0.014)"
bg_vignette = "0.72"

[smoothing]
contour     = { attack = 0.02, release = 0.34 }
hatch       = 0.25
glow        = 0.30
zoom        = 0.18
color_span  = 0.40
palette_mix = 1.1
bg_bright   = 0.40
