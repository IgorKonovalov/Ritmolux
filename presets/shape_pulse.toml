# Pulse - nested heart contours that travel outward and breathe with the low end.
# The first shipped world on `shape_field` (ADR-0105, Plan 0091), authored from
# the user's reference images at that plan's Phase 6 look gate.
#
# THE MECHANISM: this scene hands the palette a DISTANCE rather than a level, so
# a band of the palette coordinate is a band of constant distance - which is the
# definition of an offset curve. `palette_steps` turns that into flat graphic
# bands and `palette_contour` draws the hairline between them. Nothing here is
# geometry; it is one signed distance evaluated per pixel, so it does not facet
# and it costs the same at any resolution.
#
# WHAT DRIVES WHAT
#   color_center  a slow outward drift, plus a shove on each onset
#   scale         a slow breath, plus the low end
#   saturation    the top end, gently
#
# -- THE TWO TUNING FACTS THIS FILE EXISTS TO RECORD ------------------------------
#
# 1. THE CENTRAL HEART'S COLOUR *IS* `color_center`, WHICH IS WHY IT IS PINNED.
#    At the figure's deepest point d = 0, so the palette coordinate there is
#    `0^gamma * color_span + color_center` - it collapses to `color_center` and
#    nothing else. A drifting `color_center` therefore cannot travel the rings
#    without also cycling the core: they are the same number. The first shipped
#    draft drifted it at 0.05/s and the middle of the figure churned; slowing it
#    five-fold only made the churn slower (checked, 23 s window - the core still
#    walks from maroon to brown). So it is a constant 0, which reproduces the
#    look the reference frame was judged on exactly, and the motion comes from
#    the breath instead - as `scale` moves, every contour slides across the frame
#    with it while the core stays the colour it is.
#
#    IF YOU EVER WANT CONTINUOUS TRAVEL BACK, the price is the fixed core, and
#    the palette must then be cyclic (first stop == last) or the wrap is a hard
#    seam crossing the figure once per cycle - this palette already satisfies
#    that, so the change is one line. And do NOT put `color_center` in
#    [smoothing]: it is a sawtooth, and a one-pole on a sawtooth ramps
#    *backwards* through the whole range at each wrap.
#
# 2. `gamma` AND `scale` ARE COUPLED, and picking them independently is how this
#    look breaks. A gamma above 1 crowds the bands toward the outline - that is
#    the poster character and it is the reason this file is at 2.0 - but it also
#    compresses the EXTERIOR, and the exterior is most of a 16:9 frame. The first
#    draft (scale 0.50, gamma 2.5) reached a palette coordinate of ~37 at the
#    corner: 37 wraps x 9 steps is ~330 bands across the half-diagonal, about one
#    pixel each, which is a moire field rather than a figure. It passed as texture
#    while static and shimmered the moment `color_center` started moving.
#
#    The fix is not a lower gamma alone - it is a LARGER FIGURE, so less exterior
#    is on screen. At scale 0.78 / gamma 2.0 the corner reaches ~5.3, i.e. ~48
#    bands and ~23 px each at 1080p, and the character is intact. Keep the corner
#    coordinate under about 6 if you retune: d_corner = 1 + (2.04/scale - 1)/0.637
#    for this shape, and the coordinate is d_corner^gamma * color_span.

system = "shape_field"
name   = "Pulse"

[palette]
stops = [
  { at = 0.00000, color = "#000000" },
  { at = 0.11101, color = "#000000" },
  { at = 0.11111, color = "#7a0016" },
  { at = 0.22212, color = "#7a0016" },
  { at = 0.22222, color = "#000000" },
  { at = 0.33323, color = "#000000" },
  { at = 0.33333, color = "#c8102e" },
  { at = 0.44434, color = "#c8102e" },
  { at = 0.44444, color = "#000000" },
  { at = 0.55546, color = "#000000" },
  { at = 0.55556, color = "#ff2e3a" },
  { at = 0.66657, color = "#ff2e3a" },
  { at = 0.66667, color = "#000000" },
  { at = 0.77768, color = "#000000" },
  { at = 0.77778, color = "#ff7a5a" },
  { at = 0.88879, color = "#ff7a5a" },
  { at = 0.88889, color = "#000000" },
  { at = 0.99990, color = "#000000" },
  { at = 1.00000, color = "#000000" },
]

[params]
shape = "4"

# PINNED. See note 1 - this is the core's colour, so it is the one number that
# must not move.
color_center = "0"

# THE FIGURE BREATHES, AND THIS IS NOW THE WHOLE OF THE MOTION. A very slow sine
# so it is alive in silence, plus the low end. Gain from the cap by the house
# rule (C / 0.85 for bass), so a typical passage sits near half of it and a peak
# reaches it.
#
# The sine was 0.5 rad/s in the first shipped draft - about a 13 s period, which
# read as fast next to a figure this large. At 0.16 it is a ~39 s swell, and the
# smoothing constant below is lengthened to match so the bass term arrives as a
# tide rather than as a pump.
scale = "0.76 + 0.06 * sin(time * 0.16) + clamp(bass * 0.0941, 0, 0.08)"

# Structure, not luminance: the bands are already at the palette's own levels, so
# peak energy goes on the coordinate and the size rather than on brightness.
# There is no brightness param here to blow out, which is why this scene is
# forgiving - but `saturation` still reads, so the top end gets that.
saturation = "0.92 + clamp(treb * 0.20, 0, 0.12)"

color_span      = "0.45"
palette_steps   = "9"

# THE LINE WEIGHT WANDERS ON THE BEAT, AND IT IS DELIBERATELY NOT A PATTERN.
# Two different things read as "line thickness" in this construction and both
# move, decorrelated so the picture never pulses as one:
#
#   `palette_contour` is the dark hairline drawn at each band boundary. Its WIDTH
#   is fixed - the shader draws it within one pixel of the edge, via `fwidth`, so
#   it stays even where the field is steep - but the amount sets how hard it
#   bites, which is what reads as weight.
#
#   `gamma` moves where the boundaries themselves sit, so the BANDS change width.
#   It only ever wanders DOWNWARD from 2.0, and that is the constraint from note 2
#   rather than taste: upward is toward the moire wall, and 2.0 is the corner
#   budget this framing was tuned to.
#
# `hash` is seeded and pure, so this is reproducible rather than random - the same
# preset draws the same sequence every run. The two calls are offset by 50 to
# decorrelate them; without that they would step together and read as one event.
# `beat_index` counts ONSETS, 1.2x to 2.3x per musical beat depending on the
# material (ADR-0109, widened from the 1.7-2.1x this comment used to state by
# Plan 0095's own captures) and unstable inside one track, so the wander is
# already irregular against the pulse, which is the "no pattern" part.
# Both are eased below, so a step arrives as a settling rather than a switch.
palette_contour = "0.50 + hash(beat_index) * 0.35"
gamma           = "1.86 + 0.07 * sin(time * 0.23) + hash(beat_index + 50) * 0.07"

[smoothing]
# Lengthened with the breath: at 0.15 the bass term punched, which is the pace
# the look was rejected for. Half a second reads as the figure leaning into the
# low end rather than answering each hit.
scale      = 0.5
saturation = 0.25
# Short enough that the beat still lands, long enough that it is a settle rather
# than a snap. Different constants on the two so they do not resolve together.
palette_contour = 0.25
gamma           = 0.38
