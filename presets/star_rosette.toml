# Star Rosette - a twelve-fold Hankin star: the most rigidly geometric figure
# in the set, and the one that most rewards being stacked with both symmetry
# engines. The star is already twelve-fold; folding it again at a DIFFERENT,
# non-dividing order produces a quasi-periodic interference pattern that neither
# tool reaches alone.
#
# `variant` is a CONTINUOUS contact angle (0..2, clamped) since Plan 0054 /
# ADR-0060 - a genuine STRUCTURAL morph rather than a transform, because the
# star's interior lacing changes shape with the angle. 0, 1 and 2 still name the
# same three rosettes they did when it was an index, so this file is unchanged;
# what is new is that everything between them is a real figure too. The old
# preset drove it with `floor(2.99 * beat)`, which only ever produced 0 or 2
# because `beat` is a 0/1 gate; here it cycles off the bar phase and the low end,
# so every variant actually gets shown.
#
# The old `brightness = 0.5 + 0.5 * sin(time * 4)` strobe is gone.
system = "star_pattern"
name = "Star Rosette"

[generator]
tiling            = "12"
contact_angle_deg = 20

# The geometry mirror below costs nothing in resolution because it replicates
# real geometry BEFORE rasterisation, while `kaleido_*` folds finished pixels -
# so on the line scenes, prefer `mirror_*` when both would do. Since Plan 0033
# the feedback and kaleidoscope stages follow the RENDER TARGET rather than a
# fixed 1280x720, so `trails` no longer costs this preset its sharpness.

[params]
# THE STRUCTURAL SWAP - cycles 0 -> 1 -> 2 on a slow ~50 s clock.
#
# THE ENGINE LIMIT THIS WAS BUILT AROUND IS GONE (Plan 0054 / ADR-0060). What
# used to be here: "`variant` selects one of three PRECOMPUTED geometries by
# index, so there is nothing to interpolate between - smoothing it only spends
# time on fractional indices that `floor` collapses back to the same three
# shapes. Blending two variants would be engine work, not preset content. What
# IS available is making the cut RARE and hiding it under `draw_progress`."
#
# That is no longer true: `variant` is a continuous contact angle, fractional
# values are real rosettes, and `[smoothing]` on it now morphs. THIS FILE STILL
# `floor`s IT, deliberately: Plan 0054 explicitly does not re-tune shipped
# presets, and a bare `floor` removal would be worse than the cut it replaces -
# `mod(..., 3)` is a sawtooth, so dropping the floor turns one slow morph into a
# hard 2 -> 0 snap at every wrap. Composing a continuous sweep (a triangle wave
# over 0..2, eased) is a `preset-author` pass, and it is the obvious next one for
# this file.
#
# The cycle stays ~50 s, and `draw_progress` below still re-draws the figure
# continuously so the swap lands mid-redraw.
# SLOWED, and the audio term deliberately declawed. Two separate changes:
#   - the clock went 0.06 -> 0.021, so a variant holds for ~48 s instead of ~17.
#   - the bass term was `clamp(bass * 3.0, 0, 1.0)` - a full 1.0, i.e. enough to
#     push the index a WHOLE variant forward and let it fall back as the level
#     moved. That is not a morph, it is a flicker between two geometries driven
#     by the low end, and it is most of what read as restless. Capped at 0.35 it
#     can nudge the phase of the cycle without ever crossing a boundary alone.
variant = "floor(mod(time * 0.021 + clamp(bass * 0.41, 0, 0.35), 3))"

# MOTION - a brisk, steady, AUDIO-INDEPENDENT turn in radians. `rotation` is an
# angle, so a band term on it is a positional jump rather than a speed change,
# which reads as the figure lurching. The rate is brisk because a twelve-fold
# rosette is near-symmetric under small rotations, so a slow turn moves almost
# no pixels and reads as frozen. (The old preset faked liveness with a
# `sin(time * 4)` brightness strobe; this is motion that is actually the figure
# moving.)
rotation = "0.80 * time + sin(time * 0.031) * 0.26"

# THE SWEEP - the preset's main motion, and the reason it is on `time` and not
# only on `bar`: this figure is a rotationally symmetric ring, so turning it
# barely moves a pixel. Radial and draw-order change is the only motion that
# actually reads, in silence or otherwise.
draw_progress = "clamp(0.52 + sin(time * 0.20) * 0.42 + bar * 0.20 + clamp(onset * 0.333, 0, 0.20), 0, 1)"

# STROKE - moderate. Thin strokes looked elegant at 2048 but the figure is a
# thin ring, so at small render sizes it nearly vanishes; this weight holds up
# across both.
thickness  = "1.70 + clamp(bass * 3.06, 0, 2.6) + beat * 0.40"
brightness = "0.66 + clamp(mid * 0.53, 0, 0.45)"
# The 0.85 rad/s scale pulse was a ~7 s throb reading as a second, faster morph
# on top of the variant cycle - slowed to 0.14 (~45 s) so it breathes with the
# variant clock rather than against it, and eased properly below (was 0.06 s).
scale      = "0.58 + sin(time * 0.14) * 0.13 + bar * 0.05 + clamp(bass * 0.47, 0, 0.40)"
hue        = "0.50 + time * 0.023 + clamp(treb * 0.75, 0, 0.45)"

# GEOMETRY MIRROR - kept low, because on THIS scene it barely does anything and
# it is worth recording why. The mirror replicates the segment set by rotating
# it about the frame centre; a Hankin rosette is already rotationally symmetric
# about that same centre, so the copies land almost exactly on the original. On
# the parametric-curve presets the mirror is transformative (their figures are
# not centred rosettes); here it is close to a no-op. Combined with the fact
# that the star's segments all sit near the rim at every contact angle, this
# preset is intrinsically a ring - the sparse, minimal member of the set rather
# than a dense one. Making it dense would need engine work (more tilings, or an
# off-centre mirror), not a preset change.
# THE THRESHOLD IS MEASURED, NOT GUESSED. This read 0.18 until Plan 0041's
# reachability check proved the branch dead: `mid` peaks at 0.019 on music-like
# material, an order of magnitude short, so the order never left 5. 0.011 sits
# above the band's ~0.006 mean; the 2.5 s ease below wants a gate that holds
# rather than one that spikes. Band table: `LOW_LEVELS` in shot.rs.
mirror_order   = "select(mid > 0.58, 7, 5)"
mirror_reflect = "0"

# SCREEN FOLD at SEVEN, turning against the star's own rotation. Seven does not
# divide twelve, and that mismatch is the point: a matching or dividing order
# would collapse back onto the star's own symmetry and show nothing.

zoom        = "1.06 + bar * 0.06 + clamp(bass * 0.176, 0, 0.15)"
pan_x       = "sin(time * 0.0170) * 0.05"
bg_hue      = "0.10 + sin(time * 0.0091) * 0.06"
bg_bright   = "0.018 + clamp(mid * 0.0153, 0, 0.013)"
bg_vignette = "0.82"

# FEEDBACK - restored (Plan 0033), short. The stroke is already the thickest in the set, so a long tail closes the rosette into a solid annulus.
trails = "0.34 + clamp(mid * 0.082, 0, 0.07)"

[smoothing]
mirror_order  = 2.5
# `variant` is not smoothed HERE, but it now can be: since ADR-0060 easing it
# walks a continuous contact angle and morphs the figure. It stays unsmoothed
# only because the `floor` above still quantizes it - drop that first (see the
# note beside it), then a smoothing constant is what makes the morph read.
rotation      = 0.18
thickness     = { attack = 0.02, release = 0.34 }
scale         = 0.55
hue           = 0.42
zoom          = 0.18
bg_bright     = 0.40
trails       = 0.55
