# Gyre - a hot-cored galaxy whose arm count changes on the bar.
#
# The near-unison pendulums set 0.08 of a turn apart (not a quarter), so each
# damped loop is an ELLIPSE, not a circle, and the mirror fans them into petals.
# The musical EVENT: `mirror_order` is re-rolled per bar between 3, 4 and 5,
# so the galaxy re-forms with a different number of arms. Magenta arms into a
# gold-white core; bass lowers `decay` so the arms unwind, and the onset lifts
# the bloom.
#
# Chosen by the owner from three second-look directions (over a 2:3 brass
# rosette and an inward-draining whirlpool).
#
# Horizon (10 simulated min, 96x96, --set bass=0.6,mid=0.45, against a flat
# static control): coverage 0.103 -> 0.104 (monotone 0.45), footprint
# 0.178 -> 0.173 (0.47). Breathes; nothing accumulates.
system = "parametric_curve"
name = "Gyre"

[curve]
family = "harmonograph"

[palette]
stops = [
  { at = 0.0, color = "#05020c" },
  { at = 0.3, color = "#4a1060" },
  { at = 0.6, color = "#d83a8a" },
  { at = 0.85, color = "#ffb050" },
  { at = 1.0, color = "#fff6e0" },
]

[params]
n          = "1"
d          = "1.01 + noise(time * 0.08) * 0.03"
phase      = "0.08"
decay      = "0.22 - clamp(bass * 0.2, 0, 0.17)"
samples    = "2048"
scale      = "0.95"
spin       = "0.06 + clamp(mid * 0.08, 0, 0.07)"
mirror_order = "select(hash(bar_index) < 0.33, 3, select(hash(bar_index) < 0.66, 4, 5))"
thickness  = "1.7"
softness   = "0.35"
glow       = "1.1"
brightness = "1.4"
hue        = "0.3"
hue_spread = "0.7"
trails     = "0.4"
bloom_amount    = "0.3 + clamp(onset * 0.35, 0, 0.3)"
bloom_threshold = "0.6"
bg_bright  = "0.1"
bg_hue     = "0.1"
bg_vignette = "0.9"

[smoothing]
decay = { attack = 0.06, release = 0.6 }
spin = 0.8
bloom_amount = { attack = 0.02, release = 0.3 }
