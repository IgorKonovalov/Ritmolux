# Rose Beat Bloom - the shape ITSELF is the audio-reactive element. Petal count
# steps between integers with the low end via `floor()`, and `[smoothing]` eases
# each jump so the rose visibly morphs THROUGH the intermediate webs rather than
# snapping between them - the interpolated frames are non-integer `n` values,
# which is where the strangest lattices in the whole set live.
#
# All four shape levers move together here, which is what separates this from a
# preset that merely resizes on the beat:
#   n              - petal count, stepped by bass, eased into a morph
#   d              - angular step, nudged per beat, re-lattices the web
#   phase          - rotates the petals INSIDE the sine, reshaping them
#   radial_offset  - opens the figure off-origin into a rosette
system = "parametric_curve"
name   = "Rose Beat Bloom"

[curve]
family = "maurer_rose"

# The geometry mirror below costs nothing in resolution because it replicates
# real geometry BEFORE rasterisation, while `kaleido_*` folds finished pixels -
# so on the line scenes, prefer `mirror_*` when both would do. Since Plan 0033
# the feedback and kaleidoscope stages follow the RENDER TARGET rather than a
# fixed 1280x720, so `trails` no longer costs this preset its sharpness.

[params]
# 3..8 petals, quantized to integers, stepped by bass energy.
n             = "floor(3 + clamp(bass * 6, 0, 3.1))"
d             = "71 + beat * 2.79 + sin(time * 0.028) * 6"
samples       = "560"
phase         = "sin(time * 0.019) * 0.40 + clamp(bass * 0.7, 0, 0.2) + beat * 0.1"
radial_offset = "sin(time * 0.0123) * 0.18 + clamp(mid * 0.5, 0, 0.1)"

spin          = "0.15 + sin(time * 0.021) * 0.03"
scale         = "0.74 + clamp(bass * 0.40, 0, 0.124)"
draw_progress = "1"

thickness  = "0.70 + clamp(mid * 0.55, 0, 0.31) + beat * 0.087"
brightness = "0.46 + clamp(bass * 0.22, 0, 0.11)"
hue        = "0.58 + time * 0.017 + clamp(mid * 0.5, 0, 0.20) + bar * 0.04"

# 560 x 3 folds = 1680 segments, doubling to 3360 on the beat reflection.
mirror_order   = "3"
mirror_reflect = "beat"

zoom        = "1.05 + bar * 0.07 + clamp(bass * 0.35, 0, 0.15)"
pan_x       = "sin(time * 0.021) * 0.05"
pan_y       = "cos(time * 0.017) * 0.04"
bg_hue      = "0.36 + sin(time * 0.011) * 0.06"
bg_bright   = "0.017 + clamp(mid * 0.09, 0, 0.012)"
bg_vignette = "0.82"

# FEEDBACK - restored at native resolution (Plan 0033). Sparse and dim, so it takes a long tail.
trails = "0.70 + clamp(mid * 0.25, 0, 0.12)"

[smoothing]
# The petal morph is the preset. ~0.28 s is long enough to see the intermediate
# webs and short enough that the change still lands on the beat.
n             = 0.73
d             = 0.3
scale         = 0.31
phase         = 0.52
radial_offset = 1.04
thickness     = { attack = 0.03, release = 0.60 }
hue           = 1.04
zoom          = 0.42
bg_bright     = 1.04
trails       = 0.50
