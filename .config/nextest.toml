# nextest configuration. Two jobs: keep the reporting tests audible, and define
# the narrowed test set as a profile (ADR-0156) so one file says what the
# pre-push hook, CI's `check` job and the `dev` lane's per-phase gate all run.
#
# --- job 1: the reporting tests ---
#
# nextest hides a passing test's output, which is right for 456 of them and wrong
# for the few that exist partly to *report*. Per ADR-0071 a numeric assertion
# states a property or names the machine it was measured on, and both of these
# print what they observed on the machine they ran on: the DSP test prints the
# four raw band levels off x86_64 (where it declines to assert their bits), and
# the dual-live test prints its signal/control series and their ratio, which is
# the reading Plan 0060 Phase 3 calibrates the magnitude claim from.
#
# Those readings only exist on the CI runners - there is no arm64 box on this
# side, and the CI WARP build is not the developer's - so if they are not in the
# log of a green run they cannot be had at all. Scoped to named tests rather than
# set profile-wide: the point is these observations, not 458 tests' worth of
# noise.
#
# Plan 0068 adds the downbeat probe on the same grounds and more strongly: its
# whole deliverable IS the printed decomposition (the assertions are a floor
# under it), so a run that hides the output has run the instrument and thrown
# away the reading.

[[profile.default.overrides]]
filter = 'test(dual_live_keeps_the_outgoing_side_animating) + test(raw_levels_are_bit_identical_to_the_pre_normalization_build) + test(the_estimator_decomposes_into_its_terms) + test(the_degradation_ladder_says_which_axis_is_steep)'
success-output = "immediate"

# --- job 2: the narrowed set ---
#
# Everything except the nine GPU-heavy suites, which iterate the shipped preset
# library or every scene through a real adapter. This is the ONE definition of
# that set: `.githooks/pre-push`, `.github/workflows/ci.yml` and the `dev` lane
# all cite `-P fast` rather than restating the expression, so adding or removing
# a suite is a one-file edit that all three inherit.
#
# WHICH nine, and why those, is argued from measurement in `.githooks/pre-push`'s
# own header. That reasoning stays there and is deliberately not copied here — a
# second prose copy is the thing this profile exists to prevent.
#
# One line on purpose: a backslash is NOT a line continuation inside a TOML
# literal string, so this either stays on one line or becomes a multi-line
# literal ('''...''').
#
# A custom profile inherits `profile.default`'s overrides, so the four reporting
# tests above stay audible under `-P fast` and their block is NOT restated here.
# Checked rather than assumed, on cargo-nextest 0.9.140: the same test run under
# `-P fast` and under the default profile emits the same decomposition. It
# arrives on stderr, which is where nextest writes captured test output — a
# stdout-only check reads as silence under both profiles and proves nothing.
# --- job 3: the representative sample ---
#
# The nine binaries stay excluded, and then the **representatives** are unioned
# back in: `presets/*.toml` may declare `representative = true`, and `build.rs`
# names that preset's generated tests `<sweep>_rep_<stem>` (ADR-0157). A nextest
# predicate matches binaries and test names and cannot read a `.toml`, so the
# marker in the name is the only thing a static profile can select on — and the
# per-preset split is what makes any filter possible here at all, which is what
# `.githooks/pre-push`'s ancestor claim that "sampling cannot be a nextest
# filter" was true of when the sweeps were roster loops.
#
# So a phase renders two presets per family and the close renders all 81. This
# ADDS coverage to the per-phase tier rather than saving time there: ADR-0156
# had excluded these binaries outright, so the tier rendered none of the library.
#
# Anchored to the three sweep prefixes rather than a bare `_rep_`, so an
# unrelated test whose name happens to contain the marker cannot join the tier.
# `sanity_shape_*` and `distinctness_*` are per FAMILY, carry no marker, and stay
# excluded: `distinctness` must never be sampled (two presets leave one pair,
# which retires the check), and the shape sweep's floor-slack gate is a claim
# about a family's whole distribution.
[profile.fast]
default-filter = 'not (binary(golden) + binary(attractor) + binary(reaction_diffusion) + binary(background_composite) + binary(ink) + binary(reactivity) + binary(animation) + binary(sanity) + binary(distinctness)) + test(/^(animation|reactivity|sanity_loudness)_rep_/)'
